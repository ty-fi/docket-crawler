lopment of these assets to meet the reliability needs of its retail electric service customers. As such, the costs of developing these projects should be borne by the customers benefitting from these projects. Had the customer demand not existed, the Company would not have initiated these development activities.\nIn previous Integrated Resource Plans (“IRPs”) in Docket Nos. 34218 (2011 IRP Update),  36498 (2013 IRP), 40161 (2016 IRP), 42310 (2019 IRP), and 44160 (2022 IRP), the Commission approved deferral of unusable inventory of decertified plants to a regulatory asset. In addition, pursuant to the Commission’s Orders in Docket Nos. 31958 (2010 base rate case) and 36989 (2013 base rate case), certain environmental construction work in progress no longer useful at Plants Branch, Yates, Bowen, and Mitchell were deferred to a regulatory asset as discussed in Docket Nos. 34218 (2011 IRP Update) and 36498 (2013 IRP). As such, the Company requests similar treatment of any not useful or transferable development costs in this case.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-9", "is_protective_disclosure": "yes", "question": "Combined Turbine (“CT”) Resources.  Refer to the Company’s Direct Testimony that was filed on December 4, 2023.  On page 40 (lines 12-17) of the Company’s panel testimony, it states: “To support the timely development of these units, the Company has advanced a reservation fee to the consortium to provide for the procurement of long lead time equipment and required services.  These steps help ensure the proposed CT units can be developed in the timeframe needed to support the Company’s capacity needs identified in the 2023 IRP Update.”\nPlease quantify and explain fully and in detail the reservation fee for the procurement of long lead time equipment and required services, including how it was developed.  Show detailed calculations for the estimated reservation fees for each year, 2024 through 2031.\nWhat amounts of reservation fees does the Company expect would be advanced to the consortium for the procurement of long lead time equipment and required services to help ensure the proposed CT units can be developed in the timeframe needed to support the Company’s capacity needs?  Explain fully and identify the amounts of reservation fees expected for each year, 2024 through 2031.\nThrough December 31, 2023, has the Company incurred any reservation fees?  If so, identify the amounts by account, and explain to whom those amounts were paid.\nReferring to page 40 (lines 21-24) of the Company’s testimony.  Explain fully and in detail how CT-related development costs that the Company proposes to incur could become not useful or transferable to other projects?\nIdentify by year, the amounts of CT-related development costs that the Company proposes to incur that the Company believes could become not useful or transferable to other projects.\nExplain fully and in detail why Company management and investors (as opposed to ratepayers) should not be held responsible for CT-related development costs that end up not being useful.\nIdentify, quantify and explain all projected amounts of regulatory assets that could occur for CT-related development costs that end up not being useful. Show the Company’s estimated regulatory asset amounts for each year, 2023 through 2031.", "response": "Please refer to the Company’s response in TS STF-JKA-2-19 Attachment A. REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED\nPlease refer to the Company’s response in TS STF-JKA-2-19 Attachment A. REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED\nPlease refer to the Company’s response in TS STF-JKA-2-19 Attachment A.\nProjected amounts of regulatory assets that could occur for CT-related development costs including those associated with the reservation fee that end up not being useful cannot be determined at this time. The Company will take all reasonable steps to recover expenditures and/or maintain the usefulness of equipment and services received. Please note this is only applicable if the resources are not approved by the Commission.\nPlease see the response to part (d).\nThe Company initiated the development of these assets to meet the reliability needs of its retail electric service customers. As such, the costs of developing these projects should be borne by the customers benefitting from these projects. Had the customer demand not existed, the Company would not have initiated these development activities.\nProjected amounts of regulatory assets that could occur for CT-related development costs including those associated with the reservation fee that end up not being useful cannot be determined at this time. The reservation fee constitutes only part of the overall plant cost, and the Company continues to negotiate for most favorable terms on behalf of customers. The Company will take all reasonable steps to recover expenditures and/or maintain the usefulness of equipment and services received. Please note this is only applicable if the resources are not approved by the Commission.", "attachment_filenames": "STF-LA-1-9", "confidentiality_files": ""}, {"filing_api_id": 217487, "filing_description": "DKT 55378 STF-LA-1-23 Supplemental Data Request Response", "filing_date": "2/14/2024", "staff": "LA", "doc_id": "STF-LA-1-23", "is_protective_disclosure": "yes", "question": "New regulatory assets requested by the Company.  Refer to pages 54-56 of the Company’s direct testimony.   To the extent not already provided, please identify, quantify and explain the amounts of regulatory asset build-up in each year, 2024 and 2025, that the Company projects for each of the following requested regulatory asset permission items:\nRegulatory asset to defer capacity and non-fuel energy payments under the Mississippi Power PPA (page 54, lines 24-29)\nRegulatory asset to defer capacity and non-fuel energy payments under the Santa Rosa Mississippi Power PPA (page 55, lines 4-8)\nRegulatory asset for development costs not useful or transferrable for 1000 MW of BESS (page 55, lines 11-13)\nRegulatory asset for development costs not useful or transferrable for 1400 MW from three CTs (page 55, lines 17-19)\nRegulatory asset for development costs for Flex Capacity (page 55, lines 28-30)\nAre there any other regulatory assets (besides those listed in parts a through e above,) or cost deferrals that would result from the Company’s proposals contained in the 2023 IRP Update?  If so, explain fully and provide amounts of expected regulatory asset build-up in each year 2024 and 2025 related to each such additional regulatory asset.", "response": "Please see the Company’s response to STF-LA-1-5 parts (d) and (e).\nPlease see the Company’s response to STF-LA-1-6 part (b). The capacity and non-fuel expenses for 2024 and 2025 identified in that response are the costs requested to be deferred to the regulatory asset.\nPlease see the Company’s response to STF-LA-1-8 parts (a) and (b). In the event the Commission denies approval of the project, the development costs for 2023 and any costs to be spent through March 2024 identified in that response are the costs requested to be deferred to the regulatory asset.\nPlease see the Company’s response to STF-LA-1-9 part (a). In the event the Commission denies approval of the project, the development costs for 2023 and any costs to be spent through March 2024 identified in that response are the costs requested to be deferred to the regulatory asset.\nThe Company currently cannot estimate any development costs for Flex Capacity as it has not met the proposed criteria which would trigger development of the Flex Capacity.\nNo, there are no other regulatory assets or cost deferrals that would result from the Company’s proposals contained in the 2023 IRP Update.\nFebruary 14, 2024 Supplemental Filing Update:\nThe Company is requesting regulatory asset treatment for development costs not useful or transferable to other projects in the event the Company’s request to develop three simple cycle combustion turbines (“CTs”) at Plant Yates is denied. Based on the 2023 IRP Update Procedural and Scheduling Order, the Commission will render a decision on the 2023 IRP Update on April 16, 2024. Therefore, the estimated maximum regulatory asset amount, if the project is denied, would equal the total development costs incurred through April 2024, plus cancellation costs to be incurred following the April 16, 2024 decision. This value is estimated to be REDACTED, which consists of REDACTED of projected development costs and a REDACTED cancellation cost.\nShould the project not receive approval, the Company will assess whether these costs are transferable or applicable to future projects. Any costs that can be reallocated to other projects will be excluded from the regulatory asset to be recovered from customers in the Company’s next base rate case. If the project is denied on April 16, 2024, no development costs will be incurred beyond the date of the Commission decision. Furthermore, the Company is not requesting regulatory asset treatment for any development costs in the event the project is approved.\nNote that the development cost above reflects projected cash flows for the project and is found in cell Y49 in the “Yates Proj Master Estimate” worksheet within the “TS Yates Expansion - Master Estimate - Estimate for Project Scopes.xlsx” workpaper that was provided to Commission Staff on January 31, 2024. The cancellation cost above is calculated by subtracting the EPC payments in the final column of Exhibit L in “TS Attachment A - Plant Yates Units 8-10 EPC Agreement.zip” of the Plant Yates Units 8-10 Certification Application from the cancellation amounts in the final column of Exhibit J in “TS Attachment A - Plant Yates Units 8-10 EPC Agreement.zip” of the Plant Yates Units 8-10 Certification Application, which was filed on January 31, 2024.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "PIA", "doc_id": "STF-PIA-4-8", "is_protective_disclosure": "no", "question": "Please reference the following statement on (or about) page 10 of the testimony: “All else being equal, we expect that the projected revenues associated with incremental load from these new customer projects will offset the costs of the resources requested in this filing…”  For each new customer please provide an analysis showing how long these new customers must stay on the Georgia Power Company system in order for the revenues to offset the costs of the new resources (in other words, the payback period).", "response": "Please see the Company’s responses to STF-DEA-3-6 and STF-DEA-1-2.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217124, "filing_description": "DKT 55378 STF-PIA-3-5 Supplemental Data Request Response", "filing_date": "1/19/2024", "staff": "PIA", "doc_id": "STF-PIA-3-5", "is_protective_disclosure": "no", "question": "The Company states that the Thermostat DR program shows a positive TRC value, which is reflected in the updated filing.\nPlease provide an electronic copy of the benefit/cost model used to calculate the TRC test for the expanded program, including all inputs for the TRC calculation and all outputs.\nPlease describe the changes to the program or otherwise that resulted in the change of TRC results.\nDoes the TRC test results include any kWh savings or only kW savings?", "response": "Please refer to TS STF-PIA-3-5 Supplemental Attachment.\nThe following changes resulted in the new TRC results:\nAvoided costs were updated to reflect a more recent capacity price forecast.\nParticipation was updated to assume 50,000 participants.\nParticipation turnover was updated to assume a 15% annual turnover rate.\nDelivery costs, administration costs, marketing costs, and evaluation costs were updated to reflect an updated contract with the implementor to provide 50,000 participants.\nThe TRC test results do not include any kWh savings, only kW demand savings.", "attachment_filenames": "PD STF-PIA-3-5 Supplemental Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217137, "filing_description": "DKT 55378 STF-PIA-9 Data Request Responses", "filing_date": "1/22/2024", "staff": "PIA", "doc_id": "STF-PIA-9-1", "is_protective_disclosure": "yes", "question": "Please refer to the Company’s response to STF-PIA-4-16 (d).\nProvide additional information regarding solar sites with potential for adding BESS that the Company is currently in negotiations with. Include project size, potential battery size, and stage of the negotiation for each site. When does the Company anticipate bringing identified sites of solar co-located with storage to the Commission for approval?\nDescribe what studies the Company is currently conducting, or had conducted on its behalf, for stand-alone BESS. When does the Company anticipate bringing these identified projects to the Commission for approval?", "response": "The Company is in discussions with parties that have solar Power Purchase Agreements (“PPAs”) with the Company. Specifically, the Company is in discussions for adding Company-owned BESS at REDACTED REDACTED REDACTED REDACTED.    The projects under contemplation are REDACTED REDACTED REDACTED REDACTED REDACTED that would be co-located at the solar facility of the same size. The facilities would operate similar to the proposed Moody and Robins projects. If the negotiations are successful, the Company anticipates bringing these projects to the Commission for approval in 2024. The Company is also investigating options to site BESS near existing solar interconnecting substations, as well as the option to add an incremental 30 MW to an existing Company-owned solar site.\nThe Company is exploring multiple stand-alone BESS sites, particularly many active and retired generation sites as well as substations. A project at any of these sites deemed viable for the timeframes proposed will be brought to the Commission for approval.", "attachment_filenames": "STF-PIA-9-13; PD STF-PIA-9-13 Attachments A and B.docx", "confidentiality_files": ""}, {"filing_api_id": 217137, "filing_description": "DKT 55378 STF-PIA-9 Data Request Responses", "filing_date": "1/22/2024", "staff": "PIA", "doc_id": "STF-PIA-9-10", "is_protective_disclosure": "no", "question": "Has the Company evaluated the feasibility and economics of energy storage sites located in “energy communities” in Georgia? If so, please provide the results of any analysis, including workpapers if applicable.", "response": "Yes. Siting energy storage in “energy communities,” or Georgia facilities that have had a coal-fired electric generation unit retired after 2009, has been studied. This would lower the cost of Battery Energy Storage System (“BESS”) projects by roughly 10%. This is due to the incremental bonus Investment Tax Credits (“ITC”) that apply to sites such as these that meet the Inflation Reduction Act (“IRA”) definition of being located in an energy community. Many retired coal sites are suitable for the footprint of BESS, but transmission deliverability timing and costs must also be considered. If the Company can identify an economical site with transmission deliverability by November 2027, it will bring the project to the Commission for approval.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217137, "filing_description": "DKT 55378 STF-PIA-9 Data Request Responses", "filing_date": "1/22/2024", "staff": "PIA", "doc_id": "STF-PIA-9-11", "is_protective_disclosure": "yes", "question": "Please refer to the Company’s responses to STF-PIA-4-15.\nWhat cost threshold would the proposed 200 MW of BESS co-located with 200 MW of new solar facility be held to?  Would avoided cost be an appropriate threshold?  If so, what avoided scenario (MGO, etc.)?  If not, please explain why.  Would bids from a recent or future renewable with BESS RFP be an appropriate threshold?  If not, please explain why.\nWhat company did the developer of the proposed 200 MW of BESS co-located with 200 MW of new solar facility intend to be the offtaker of the facility?  Was it originally designed to be bid into a Georgia Power RFP?  If so, was the facility proposed to be bid as a PPA/APA/or BTA?\nHas the proposed 200 MW of BESS co-located with 200 MW of new solar facility, or a modified version of this project or design at the same site, been submitted into a previous Georgia Power RFP?", "response": "A traditional avoided cost threshold is inappropriate for meeting an identified capacity need. The objective is to meet the identified need at the lowest incremental cost to customers given the capacity options available to the Company at the time. Bids from past or future Requests for Proposals (“RFPs”) do not represent capacity options that are currently available to meet the identified capacity need addressed in the 2023 IRP Update and would therefore be an inappropriate cost threshold as well.\nThe Company is not fully aware of the developers’ original intentions for the facility. The Company does not know if the project was exclusively developed for a Georgia Power RFP or another opportunity. The Company is also not aware of what the deal structure of the business case was as originally conceived. REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217137, "filing_description": "DKT 55378 STF-PIA-9 Data Request Responses", "filing_date": "1/22/2024", "staff": "PIA", "doc_id": "STF-PIA-9-12", "is_protective_disclosure": "yes", "question": "Please refer to the Company’s Trade Secret response to STF-PIA-4-15(i).\nIn the Company’s response, Georgia Power mentions the Company REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED", "response": "REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED. REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED. REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217137, "filing_description": "DKT 55378 STF-PIA-9 Data Request Responses", "filing_date": "1/22/2024", "staff": "PIA", "doc_id": "STF-PIA-9-13", "is_protective_disclosure": "no", "question": "Please refer to the Company’s “2023 Request for Information for Capacity Resources – Summary of Results” and provide the following information:\nSubmitted individual responses.\nPricing summaries.\nAnalysis comparing pricing to costs of the Company’s projects.\nInternal presentations (Georgia Power, Southern Company) discussing RFI responses.", "response": "Please refer to the file “TS_Zip_AllResponses_(XML+PDFs).zip,” which was provided to Commission Staff as part of the Company’s Supplemental filing to the 2023 IRP Update made on December 4, 2023.\nPricing information from respondents was optional. The Company did not perform any additional pricing summaries on the responses. Please refer to the following files, which were provided to Commission Staff as part of the Company’s Supplemental filing to the 2023 IRP Update made on December 4, 2023:\n“TS_Zip_AllResponses (XML+PDFs).zip,” “TS_AllResponses_RawDataTranslatedToExcel.xlsx,” “TS_ResponseDataScrubbed_ForRFISummary.xlsx”\nPlease see the Company’s response to STF-PIA-9-13(b).\nPlease refer to files TS STF-PIA-9-13 Attachment A and TS STF-PIA-9-13 Attachment B. Please note that the information included in TS STF-PIA-9-13 Attachment B was provided as a preliminary internal glance on October 26, 2023 – two days after the RFI closed – and was subject to change after a more detailed review of responses had been conducted.", "attachment_filenames": "STF-PIA-9-13; PD STF-PIA-9-13 Attachments A and B.docx", "confidentiality_files": ""}, {"filing_api_id": 217137, "filing_description": "DKT 55378 STF-PIA-9 Data Request Responses", "filing_date": "1/22/2024", "staff": "PIA", "doc_id": "STF-PIA-9-14", "is_protective_disclosure": "no", "question": "Please refer to the Company’s response to STF-PIA-4-8.   If any bids with BESS are selected in the Company’s 2023 CARES RFP, what capacity equivalence would such projects receive per MW of solar, assuming the batteries are sized to meet the minimum size requirements compared to the solar facility size?", "response": "For batteries sized exactly at the minimum requirement of 50% of the nominal output of the attached solar, the site capacity equivalence will be 0.5 MW per 1 MW of solar.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217137, "filing_description": "DKT 55378 STF-PIA-9 Data Request Responses", "filing_date": "1/22/2024", "staff": "PIA", "doc_id": "STF-PIA-9-2", "is_protective_disclosure": "no", "question": "Please refer to the Company’s response to STF-PIA-4-2 (e)\nPlease describe how the net present value of the system asset will be calculated and how much each variable that could impact the system value will be weighted.\nPlease describe how the location of the resource will be considered in this program. Does the Company intend to target marketing towards potential customers in locations optimal for siting DER resources?", "response": "The net present system value of the asset will be based on the capacity equivalence of the asset and the Company’s capacity price forecast, plus any associated energy benefits or costs relative to a generic capacity resource. The variables described in STF-PIA-4-2 (e) may affect the calculation of capacity equivalence.\nThe Company will market the program to all customers with a resiliency need . Customers in locations optimal for siting DER resources may face lower interconnection costs.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217137, "filing_description": "DKT 55378 STF-PIA-9 Data Request Responses", "filing_date": "1/22/2024", "staff": "PIA", "doc_id": "STF-PIA-9-3", "is_protective_disclosure": "no", "question": "Please explain why there is a difference in customer size requirements between the DER Colocation Program and the DER Customer Owned Program. Provide any analysis conducted by the Company or on its behalf, to justify the 10 MW minimum size for the DER Colocation Program and the 1 MW minimum and 10 MW maximum for the DER Customer Owned Program.", "response": "There is a difference in the applicable resource sizes between the DER Colocation Program and DER Customer Owned Program due to the operational risk that third party ownership would present to reliability. Company ownership provides assurance that the DER will respond when needed by mitigating risks such as vendor selection, vendor oversight, weatherization, commissioning, maintenance oversight, etc. While this risk exists with DER in the DER Customer Owned Program, the smaller size of the DER mitigate it by reducing the size of a single point of failure. Should one or several of the resources in the DER Customer Owned Program fail to operate as needed, it would have less of an impact on the overall reliability for Georgia Power than larger engines 10 MW or greater would have.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217137, "filing_description": "DKT 55378 STF-PIA-9 Data Request Responses", "filing_date": "1/22/2024", "staff": "PIA", "doc_id": "STF-PIA-9-4", "is_protective_disclosure": "no", "question": "Please refer to the IRP Update Main document p. 22 regarding the DER Colocation Program.\nDescribe the Company’s definition of firm fuel supply and what specific technologies are eligible for this program. Specifically, are batteries considered an eligible technology for this program?\nWhat types of fuel will be acceptable for this program?", "response": "Many technologies are eligible for the program provided they meet the requirements (e.g. reciprocating engines, battery energy storage, combustion turbines, fuel cell). The Company is not limiting what current or future technologies are eligible beyond these requirements. A firm fuel supply indicates that the resource is dispatchable, and the energy source for the resource is available on demand. Batteries will be considered an eligible technology provided they can be charged from the grid coincident to the co-located load.\nThe Company is fuel source agnostic, provided that a resource can meet the certification and permitting requirements and the firm availability. Additionally, the DER must be interconnected allowing the Company to transmit the energy they produce to the electric grid. Acceptable fuel sources in addition to the battery requirements described in part (a) include natural gas with firm transportation rights, diesel with firm fuel contracts in place, or other fuels that can be contractually guaranteed.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217137, "filing_description": "DKT 55378 STF-PIA-9 Data Request Responses", "filing_date": "1/22/2024", "staff": "PIA", "doc_id": "STF-PIA-9-5", "is_protective_disclosure": "no", "question": "Please refer to the Company’s response to STF-PIA-4-3 (d).  Describe all lessons learned from the DER Customer Program Pilot.", "response": "Several lessons have emerged from the DER Customer Program Pilot:\nSegments of customers increasingly have a resiliency need and are interested in ways to better utilize those investments.\nMany of the customers with interest in resiliency assets take service on marginal rates and are thus ineligible to receive credits for assets covering the marginal portion of their load through a demand response program structure.\nResiliency as a service requires an additional investment, which increases on a $/kW basis for smaller customers.\nMost existing backup generation is not certified and permitted for non-emergency operation.\nPrograms and credits can help incentivize customers seeking new DER to select cleaner, more efficient forms of back-up generation.\nThose programs need to reach customers before they make asset decisions, which often occurs during initial site engineering plans.\nMany customers have easier access to funds for upfront expenditures rather than an ongoing service fee under a tariff.\nSee TS STF-PIA-4-1 Attachment A for a full list of customer feedback.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217137, "filing_description": "DKT 55378 STF-PIA-9 Data Request Responses", "filing_date": "1/22/2024", "staff": "PIA", "doc_id": "STF-PIA-9-6", "is_protective_disclosure": "no", "question": "Please refer to the Company’s response to STF-PIA-4-3 (c)\nProvide any documentation applicable to the referenced DER Customer Owned Program’s certification, permitting, interconnection and maintenance requirements noted.\nHas the Company considered allowing existing resources to be included in a DER program?  If not, why?", "response": "Regarding certification and permitting, federal regulations, such as 40 CFR Part 60 Subparts IIII and JJJJ and Part 63 Subpart ZZZZ, severely restrict or prohibit the ability of customers to enter into agreements with the Company to use existing Distributed Energy Resources (“DER”) in non-emergency situations, such as to supply power to an electric grid. In contrast, new DER, certified pursuant to 40 CFR Parts 1039 or Part 1048 and permitted for non-emergency use, provide the operational flexibility needed to economically dispatch these resources and provide energy and capacity benefits to all customers. The “Operation of Distributed Energy Resources (DER) in Parallel with the Distribution System Policy” applies if the DER Customer Owned Program participating customer is served via the Company’s distribution system. Due to the complexity of the Company’s transmission system, interconnection requirements for participating transmission customers will be determined as part of the interconnection studies conducted for participating customers. Minimum maintenance requirements are based on Original Equipment Manufacturer (“OEM”) recommendations and requirements, industry codes and standards, Southern Company generation standards, and best practices. These apply to routine preventative maintenance, operational checks, startup/commissioning and functional performance testing, sequence of operations, environmental compliance, control system compatibility, and cyber security.\nNo. Most existing backup generation is not certified and permitted for non-emergency operation and would not qualify for the program. Additionally, to assess and ensure the reliability of a DER system, the Company must be engaged from the beginning of the project. Allowing existing systems in the program without such engagement could  create risk to Geogia Power’s customers. Critical activities Georgia Power would not have been engaged in during the development of an existing asset include:\nEngineering of the system and related equipment including interconnection to the electric grid.\nWeatherization of the DER\nEquipment selection and procurement to ensure equipment is reliable and readily available from a spare part perspective.\nStartup and commissioning to ensure the system was tested under all scenarios giving the Company confidence the system will operate as designed.\nPlanned and unplanned maintenance activities and our understanding of how the system has been both proactively maintained and reactively maintained to any issues.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217137, "filing_description": "DKT 55378 STF-PIA-9 Data Request Responses", "filing_date": "1/22/2024", "staff": "PIA", "doc_id": "STF-PIA-9-7", "is_protective_disclosure": "no", "question": "Please refer to the IRP Update Main document p. 22 regarding the DER Customer Owned Program.   Describe if there are any limitations to what technology will be eligible for this program. Describe the reasoning behind any limitations to technology type.", "response": "Technology requirements are outlined in the DCO-1 tariff filed.  Eligible DER must be dispatchable, have a firm fuel supply, be certified and permitted for non-emergency use, and be interconnected allowing the Company to transmit the energy they produce to the electric grid. These are the same requirements for the DCL-1 tariff.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217137, "filing_description": "DKT 55378 STF-PIA-9 Data Request Responses", "filing_date": "1/22/2024", "staff": "PIA", "doc_id": "STF-PIA-9-8", "is_protective_disclosure": "no", "question": "Please refer to the Company’s Direct Testimony of Jefferey R. Grubb, Francisco Valle, Lee Evans, and Michael A. Bush, p. 47, lines 17-18.  Explain in more detail the referenced capacity value difference for winter and summer months between the Curtailable Load Program and Demand Response Plus Energy Credit Demand Response Program.", "response": "The existing Demand Response Plus Energy Credit (“DPEC”) program pays demand credits in each of the four summer billing months of June through September. The demand credit is based on the product of the demand credit rate and the potential demand reduction during the defined DPEC Peak Period of June through September, non-holiday weekdays, from 12:00 noon to 8:00 p.m. The proposed Curtailable Load Program will pay monthly demand credits based on an annual capacity equivalence of the potential demand reduction during projected periods of extreme supply and demand conditions.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217137, "filing_description": "DKT 55378 STF-PIA-9 Data Request Responses", "filing_date": "1/22/2024", "staff": "PIA", "doc_id": "STF-PIA-9-9", "is_protective_disclosure": "no", "question": "Please provide the historical performance of DPEC for the period of 2020-2023 including the total number of events, the dates of the events, the total summer maximum peak reduction, the total winter maximum peak reduction, the average summer peak reduction, the average winter peak reduction, and the maximum and average level of Georgia Power customer participation for Summer and Winter.", "response": "No DPEC interruption events occurred in 2020, 2021, and 2023. One winter DPEC interruption event occurred on December 24, 2022. Please refer to the Company’s response to STF-PIA-4-4(f) for the maximum peak reduction, average peak reduction, and level of customer participation during the December 24, 2022 event.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217240, "filing_description": "DKT 55378 STF-PIA-10 Data Request Responses", "filing_date": "1/29/2024", "staff": "PIA", "doc_id": "STF-PIA-10-1", "is_protective_disclosure": "yes", "question": "Please refer to Table 2 on page 14 of the “Southern Company 2023 Integrated Resource Plan Update Resource Mix Study.” For each resource listed in the table, please provide the Company’s construction timeline (i.e., the length of time required to bring a new resource online).", "response": "The table below includes the construction timeline for each resource option that was included in the Resource Mix Study. It should be noted that while generic indicative project schedules are provided, actual project schedules vary based on the unique requirements of the project. Because of differences in technology deployments, site selection, and regulatory requirements, project schedules do not include Requests for Proposals (“RFPs”), post-Commercial Operation Date (“COD”) environmental monitoring, or jurisdictional-specific regulatory requirements.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217240, "filing_description": "DKT 55378 STF-PIA-10 Data Request Responses", "filing_date": "1/29/2024", "staff": "PIA", "doc_id": "STF-PIA-10-2", "is_protective_disclosure": "no", "question": "Please refer to the 2023 IRP Update at page 17, which describes the PPA with Mississippi Power: “The Company has already contracted for the sale of 500 MW to a regional electrical service provider for January 1, 2024, though September 30, 2025.”\nAt what price has the Company contracted to re-sell the 500 MW of capacity?\nDoes the Company anticipate being able to re-sell the remaining 250 MW of capacity from the PPA? If so, to whom does it expect to sell the capacity, and what price does it expect to receive? If not, please explain why not.", "response": "See page 2 of TS STF-JKA-4-19 Attachment for the requested Contract Capacity Price.\nYes, the Company anticipates that it will be able to remarket the remaining 250 MW of capacity to a regional electrical service provider at a comparable price to the 500 MW.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217240, "filing_description": "DKT 55378 STF-PIA-10 Data Request Responses", "filing_date": "1/29/2024", "staff": "PIA", "doc_id": "STF-PIA-10-3", "is_protective_disclosure": "yes", "question": "Please refer to the 2023 IRP Update at page 17, which describes the PPA with the Santa Rosa Energy Center: “For the benefit of customers, SWE, on behalf of Georgia Power, will attempt to remarket capacity for years prior to the winter of 2025/2026.”\nDoes the Company anticipate that SWE will be successful in re-selling this capacity?\nIf so, to whom does it expect to sell the capacity, and what price does it expect to receive? If not, please explain why not.", "response": "Yes, the Company anticipates that Southern Wholesale Energy (“SWE”) will be successful in remarketing this capacity.\nThe Company expects to remarket the capacity to a regional electrical service provider at a capacity price REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217240, "filing_description": "DKT 55378 STF-PIA-10 Data Request Responses", "filing_date": "1/29/2024", "staff": "PIA", "doc_id": "STF-PIA-10-4", "is_protective_disclosure": "no", "question": "Please refer to the discussion of the Flex Capacity framework on pages 23–24 of the 2023 IRP Update.\nPlease clarify which activities the Company would be authorized to undertake if this framework were approved.\nPlease explain how the Flex Capacity framework would change the Company’s process for developing new capacity resources, relative to the process it uses currently.", "response": "Please see the Company’s response to STF-LA-1-17(c)-(f).", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217240, "filing_description": "DKT 55378 STF-PIA-10 Data Request Responses", "filing_date": "1/29/2024", "staff": "PIA", "doc_id": "STF-PIA-10-5", "is_protective_disclosure": "no", "question": "Has the Company studied the revenue and rate impacts of the resources it proposes in its 2023 IRP Update? If so, please provide all studies, including workpapers with formulas intact and sources and assumptions clearly identified. If not, explain why not.", "response": "Yes. Please see the Company’s response to STF-DEA-3-6, filed on December 21, 2023, and the Company’s supplemental response to STF-DEA-3-6, filed on January 12, 2024, following execution of the Engineering, Procurement, and Construction Agreement for the proposed Plant Yates combustion turbines.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217240, "filing_description": "DKT 55378 STF-PIA-10 Data Request Responses", "filing_date": "1/29/2024", "staff": "PIA", "doc_id": "STF-PIA-10-6", "is_protective_disclosure": "no", "question": "Please refer to the proposed Supplemental Effluent Limitations Guidelines and Standards for the Steam Electric Power Generating Point Source Category, 88 Fed. Reg. 18824 (Mar. 29, 2023) (the “Proposed 2023 ELG Rule”).\nDoes the Company anticipate incurring costs for retrofits at the Bowen and Scherer coal units between now and 2029 to comply with the zero-discharge limitation for all pollutants in flue gas desulfurization (FGD) wastewater under the Proposed 2023 ELG Rule? If yes, please describe the capital projects that are required, and the estimated costs associated with them. If not, please explain why not.\nDoes the Company anticipate incurring costs for retrofits at the Bowen and Scherer coal units between now and 2029 to comply with the zero-discharge limitation for all pollutants in bottom ash transport water (BATW) under the Proposed 2023 ELG Rule? If yes, please describe the capital projects that are required, and the estimated costs associated with them. If not, please explain why not.\nWill the Proposed 2023 ELG rule require any capital expenditures at the Bowen and Scherer coal units between now and 2029 to comply with the numeric discharge limitations for combustion residual leachate (CRL)? If yes, please describe the capital projects that are required, and the estimated costs associated with them. If no, please explain why not.", "response": "If the U.S. Environmental Protection Agency (“EPA”) finalizes the Proposed 2023 ELG Rule, the Company anticipates incurring additional capital costs if Plant Bowen is required to install membrane-based wastewater treatment and meet a zero-liquid discharge (“ZLD”) requirement for flue gas desulfurization (“FGD”) wastewater. See STF-PIA-10-6 Attachment for Southern Company’s comments on the Proposed 2023 ELG Rule submitted to EPA on May 30, 2023, which includes a screening level estimate of approximately $580M for membrane-based FGD wastewater treatment at Plant Bowen. This does not include costs for a ZLD system, which would likely include additional storage tanks, pumps, and piping to reuse the permeate/distillate as make-up water to the boiler or FGD.\nThe Company does not anticipate incurring additional costs at Plant Scherer beyond the membrane-based FGD wastewater treatment project that is currently underway, because the proposed rule did not indicate changing the requirements for the Voluntary Incentives Program that is applicable to Plant Scherer.\nThe Company does not anticipate incurring additional capital costs for retrofits at Plants Bowen and Scherer for bottom ash transport water under the Proposed 2023 ELG Rule. Both facilities already meet the requirements of the proposed ELG requirements for bottom ash transport water with systems that were installed by 2019 to facilitate ash pond closure and meet existing ELG requirements.\nIf EPA finalizes the Proposed 2023 ELG Rule, the Company anticipates incurring additional capital costs for retrofits if physical-chemical wastewater treatment systems are required for combustion residual leachate at coal combustion residual landfills. The Company does not yet have capital cost estimates for these treatment systems, and site-specific studies for the landfills at Plants Bowen and Scherer are currently underway to prepare for cost estimating activities once the final rule is released.", "attachment_filenames": "STF-PIA-10-6; STF-PIA-10-6 Attachment.pdf", "confidentiality_files": ""}, {"filing_api_id": 217240, "filing_description": "DKT 55378 STF-PIA-10 Data Request Responses", "filing_date": "1/29/2024", "staff": "PIA", "doc_id": "STF-PIA-10-7", "is_protective_disclosure": "no", "question": "Please refer to the proposed New Source Performance Standards for Greenhouse Gas Emissions from New, Modified, and Reconstructed Fossil Fuel-Fired Electric Generating Units; Emission Guidelines for Greenhouse Gas Emissions from Existing Fossil Fuel-Fired Electric Generating Units; and Repeal of the Affordable Clean Energy Rule, 88 Fed. Reg. 33240 (May 23, 2023) (the “Proposed 2023 GHG Rule”).\nHas the Company evaluated the four different compliance options for compliance with the Proposed 2023 GHG Rule at the Bowen and Scherer coal units? If yes, please provide all documents supporting this evaluation. If not, please explain why not.\nDoes the Company anticipate retiring the Bowen and/or Scherer coal units prior to 2032 to avoid compliance with the Proposed 2023 GHG Rule?\nDoes the Company anticipate retiring the Bowen and/or Scherer coal units prior to 2035 and accepting an operational limit of 20% of full capacity starting in 2030 as one of the compliance options under the Proposed 2023 GHG Rule?\nHas the Company analyzed the cost of installing carbon capture and storage with a 90% capture rate to comply with the Proposed 2023 GHG Rule? If yes, please provide all such analysis. If not, state whether the Company plans to issue any updates to the IRP that evaluate the impact that the Proposed 2023 GHG Rule on the cost to operate the system.", "response": "The Company has not evaluated the existing coal unit compliance options for the United States Environmental Protection Agency’s (“EPA”) Proposed 2023 GHG Rule for Plants Bowen and Scherer, such as the early retirement by 2032 or 2035 and carbon capture and sequestration options. Even if the rule is finalized as proposed, a compliance evaluation cannot be completed at this time, because uncertainty remains in the compliance options and requirements for existing facilities until the development of the Georgia state plan required by the rule. EPA has indicated that it plans to finalize the Proposed 2023 GHG Rule in 2024 and proposed that the state plan would be due two years later. The Company will work with the Georgia Environmental Protection Division to evaluate the final 2023 GHG Rule and compliance options for affected existing facilities in the development of the Georgia state plan, which then must also be reviewed and approved by EPA.\nAs stated generally in comments submitted by Southern Company to EPA on August 8, 2023 (see STF-JKA-2-14 Attachment C), more time and compliance flexibility are required in the case of all four existing coal unit options presented in the proposal. The Company will update the Commission through a future Environmental Compliance Strategy and IRP process when sufficient information becomes available to complete the compliance evaluation.\nSee response to subpart (a).\nSee response to subpart (a).\nSee response to subpart (a).", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217240, "filing_description": "DKT 55378 STF-PIA-10 Data Request Responses", "filing_date": "1/29/2024", "staff": "PIA", "doc_id": "STF-PIA-10-8", "is_protective_disclosure": "no", "question": "Has the Company evaluated the cost of installing carbon sequestration and storage, hydrogen conversion, or gas dual firing or conversion at any of its existing fossil plants (coal or gas-fired)? If so, please provide the Company’s cost estimates. If not, please explain.", "response": "Georgia Power has not evaluated the cost of installing carbon sequestration and storage, hydrogen conversion, or gas fuel firing or conversion at any of the Company’s existing fossil plants (coal or gas-fired). However, at the direction of counsel, in 2021, Southern Company Services conducted a system level pre-screening analysis related to the installation of carbon sequestration and storage at fossil plants across the system. This is a confidential technical and legal analysis that is protected under the attorney client privilege and attorney work product doctrines and has been withheld from this response.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217240, "filing_description": "DKT 55378 STF-PIA-10 Data Request Responses", "filing_date": "1/29/2024", "staff": "PIA", "doc_id": "STF-PIA-10-9", "is_protective_disclosure": "no", "question": "Has the Company evaluated the cost of installing carbon sequestration and storage, hydrogen conversion, or gas dual firing or conversion at any of its newly proposed fossil plants? If so, please provide the Company’s cost estimates. If not, please explain.", "response": "The Company has proposed to construct Plant Yates Units 8-10 as a new fossil generation resource and submitted the air permit application to the Georgia Environmental Protection Division on December 8, 2023. As a part of the control technology evaluation required in the air permit application, the Company evaluated the feasibility of installing carbon capture and sequestration (“CCS”) or low-greenhouse gas (“GHG”) hydrogen co-firing for Plant Yates Units 8-10. Although these technologies are not demonstrated nor technically feasible for implementation on simple cycle combustion turbines, the Company nonetheless included an assessment of possible costs using generic and publicly available information. In this evaluation, there were still certain costs that could not be quantified, and no site-specific engineering was completed. The control technology evaluation concluded that even the partial costs for CCS or low-GHG hydrogen co-firing are unreasonable for Plant Yates Units 8-10. Please see STF-PIA-10-9 Attachment for details.", "attachment_filenames": "STF-PIA-10-9; STF-PIA-10-9 Attachment.pdf", "confidentiality_files": ""}, {"filing_api_id": 216981, "filing_description": "DKT 55378 STF-PIA-7 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-7-1", "is_protective_disclosure": "yes", "question": "Please identify all assumptions, costs and benefits in the 2023 IRP Update related to federal, state and local tax incentives, grants, loan subsidies or other benefits.\nPlease explain and quantify the impact of each on load forecast.\nPlease explain and quantify the impact of each on transmission needs and investments.\nPlease explain and quantify the impact on the generation resources (Company owned and PPAs) the Company has identified to meet new load growth.", "response": "The Company does not explicitly include any assumptions, costs, and benefits related to federal, state and local tax incentives, grants, loan subsidies, or other benefits in the load forecast.\nTransmission planning does not consider any assumptions, costs and benefits related to federal, state, and local tax incentives, grants, loan subsidies or other benefits in its analyses on transmission needs and investments. The Company analyzes the impact of firm and future firm generation and load in compliance with NERC Transmission Planning Reliability standards, which is consistent with the planning processes outlined in Technical Appendix Volume 3 of the 2022 Georgia Power Integrated Resource Plan (“IRP”) (Docket No. 44160).\nFor the generation resources contemplated, the Company has assumed and modeled tax obligations from federal, state, and local taxing authorities in the form of property and income taxes among others. The Company also assumed and modeled applicable tax incentives for qualifying Battery Energy Storage Systems (“BESS”) and solar facilities.   The Company modeled both production tax credits (“PTC”) and investment tax credits (“ITC”) for eligible facilities in its 2023 IRP Update. Please see STF-JKA-2-19 subpart (f) for more information on these assumptions.\nAdditionally, for the REDACTED REDACTED, a local county property tax abatement has been negotiated by the developer. Please see the Company’s response to STF-JKA-2-28 for additional information.\nThe Company will continue pursuing opportunities to enhance benefits related to federal, state, and local tax incentives, grants, loan subsidies or other benefits as those opportunities are identified and vetted.", "attachment_filenames": "STF-PIA-7-10; PD STF-PIA-7-10 Attachment A.xlsx; PD STF-PIA-7-10 Attachment B.docx; STF-PIA-7-11; PD STF-PIA-7-11 Attachments A-P.docx; STF-PIA-7-15; PD STF-PIA-7-15 Attachments A-P.docx", "confidentiality_files": ""}, {"filing_api_id": 216981, "filing_description": "DKT 55378 STF-PIA-7 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-7-10", "is_protective_disclosure": "no", "question": "Provide a list of all new large load customers, with initial connected load of at least 900 kw, by month from 2018 through November 2023. For each, include the following:\nName of the customer\nAddress of the customer\nDate the customer first contacted Georgia Power for service\nDate of first temporary service connection prior to permanent service\nDate the customer was first connected to Georgia Power’s system with permanent service\nExpected initial connected load, in kilowatts\nActual connected load as of the first month of service, in kilowatts\nIf the customers load was anticipated to increase after initial connection, provide the load ramp by month, if available, or by year.\nFor new large load customers with a load greater than 50 MW provide copy of service agreement and contract with pricing terms.", "response": "Please refer to TS STF-PIA-7-10 Attachment A for the requested data from 2018 through November 2023for new large load customers with permanent service and an expected connected load of at least 900 kW.\nData is provided where available for new large load customers where permanent service has been established with Georgia Power. The date the customer first contacted Georgia Power for service and the date of first temporary service connection prior to permanent service are not tracked internally. Actual initial metered load data as of the first month of service is only retained for 3 years in the Company’s database, therefore this data is available from 2020 through present. Actual metered load is provided since connected load, as defined in the Georgia Territorial Electric Service Act, is not tracked in the Company’s billing system. Consistent internal tracking of load ramps began in mid-2023, therefore none of the projects in TS STF-PIA-7-10 Attachment A have available load ramp information.\nOnly one contract has been signed for a new large load customer with a load greater than 50 MW that has established permanent service. This is included in the TS STF-PIA-7-10 Attachment B.", "attachment_filenames": "STF-PIA-7-10; PD STF-PIA-7-10 Attachment A.xlsx; PD STF-PIA-7-10 Attachment B.docx", "confidentiality_files": ""}, {"filing_api_id": 216981, "filing_description": "DKT 55378 STF-PIA-7 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-7-11", "is_protective_disclosure": "no", "question": "Provide a copy of each large load customer choice contract, agreement or terms sheet for each new customer added to Georgia Power’s system starting in January 2022.", "response": "The following trade secret attachments contain the contracts and requests for service (“RFS”) for each new large load customer that has committed to take service from Georgia Power from January 2022 through present. The same 50 MW threshold mentioned in part (i) of STF-PIA-7-10 was used to define “large loads” in this response.\nTS STF-PIA-7-11 Attachment A.pdf\nTS STF-PIA-7-11 Attachment B.pdf\nTS STF-PIA-7-11 Attachment C.pdf\nTS STF-PIA-7-11 Attachment D.pdf\nTS STF-PIA-7-11 Attachment E.pdf\nTS STF-PIA-7-11 Attachment F.pdf\nTS STF-PIA-7-11 Attachment G.pdf\nTS STF-PIA-7-11 Attachment H.pdf\nTS STF-PIA-7-11 Attachment I.pdf\nTS STF-PIA-7-11 Attachment J.pdf\nTS STF-PIA-7-11 Attachment K.pdf\nTS STF-PIA-7-11 Attachment L.pdf\nTS STF-PIA-7-11 Attachment M.pdf\nTS STF-PIA-7-11 Attachment N.pdf\nTS STF-PIA-7-11 Attachment O.pdf\nTS STF-PIA-7-11 Attachment P.pdf", "attachment_filenames": "STF-PIA-7-11; PD STF-PIA-7-11 Attachments A-P.docx", "confidentiality_files": ""}, {"filing_api_id": 216981, "filing_description": "DKT 55378 STF-PIA-7 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-7-12", "is_protective_disclosure": "no", "question": "When did GPC begin negotiating the Power Purchase Agreement (PPA) with Mississippi Power Company (MPC)? If the MPC PPA was negotiated with a different party, such as Southern Company Services or another affiliated company, please identify the party.", "response": "Please see the Company’s response to STF-JKA-2-19 subparts (h) and (i) related to the power purchase agreement (“PPA”) with Mississippi Power Company (“MPC”).", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216981, "filing_description": "DKT 55378 STF-PIA-7 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-7-13", "is_protective_disclosure": "no", "question": "Please describe the process by which Georgia Power initiated discussions with Mississippi Power Company (or Southern Company affiliate) about capacity needs and the availability of resources in Mississippi to serve Georgia Power Company load.", "response": "The Company’s coordinated planning process regularly provides for the identification of capacity shortfalls and surpluses at each individual Operating Company. This process also involves regular communication between planning personnel at Southern Company Services (“SCS”) and each Operating Company. Through this process, a capacity solution was identified that benefited customers of both Georgia Power and Mississippi Power.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216981, "filing_description": "DKT 55378 STF-PIA-7 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-7-14", "is_protective_disclosure": "no", "question": "Please identify the counterparties at MPC with whom Georgia Power Company negotiated the Power Purchase Agreement", "response": "The following is a list of counterparties at MPC with whom the Company had discussions about the Power Purchase Agreement:\nMississippi Power Company (“MPC”) VP, Treasurer & Chief Financial Officer (“CFO”)\nMPC VP, General Counsel and Corporate Secretary\nMPC Generation Planning & Performance Manager\nMPC Wholesale Market Manager", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216981, "filing_description": "DKT 55378 STF-PIA-7 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-7-15", "is_protective_disclosure": "no", "question": "Provide a copy of all correspondence with MPC (or the relevant Southern Company affiliate) that discuss the PPA or potential PPA between Georgia Power Company and Mississippi Power Company.", "response": "Please see TS STF-PIA-7-15 Attachments A-R for correspondence related to the development and negotiation of the Mississippi Power Company power purchase agreement. The names of Southern Company employees, which is protected personally identifiable information, have been redacted from the attachments for privacy.", "attachment_filenames": "STF-PIA-7-15; PD STF-PIA-7-15 Attachments A-P.docx", "confidentiality_files": ""}, {"filing_api_id": 216981, "filing_description": "DKT 55378 STF-PIA-7 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-7-16", "is_protective_disclosure": "no", "question": "Please identify the dates of all meetings between the Company and MPC (or the relevant Southern Company affiliate) that included discussion of a power purchase agreement or power supply agreement between the two operating companies. For each meeting, provide a list with the names of all attendees.", "response": "7/21/23 – Capacity discussion among Southern Company Services (“SCS”) System Planning Vice President (“VP”); SCS Environmental, System Planning, and Sustainability VP; SCS Commercial Operations SVP; SCS VP of Southern Wholesale Energy (“SWE”); Mississippi Power Company (“MPC”) VP, Treasurer & Chief Financial Officer (“CFO”); MPC VP, General Counsel, and Corporate Secretary; MPC Generation Planning & Performance Manager\n7/24/23 – Capacity Strategy – Risk identification discussion among SCS Manager of Energy Policy; SCS Transmission Policy & Services General Manager; SCS Power/Environmental Trading & Contract Optimization Manager; Associate General Counsel, SCS; SCS Special Counsel; SCS Commercial Operations Senior VP (“SVP”); SCS System Planning VP; SCS Environmental, System Planning, and Sustainability VP; SCS VP of SWE\n7/26/23 – MPC/Georgia Power Company (“GPC”) follow-up discussion among SCS Manager of Energy Policy; SCS Special Counsel; Associate General Counsel, SCS; SCS Transmission Policy & Services General Manager; SCS Environmental, System Planning, and Sustainability VP; SCS VP of SWE\n7/31/23 – MPC to GPC Proposal – quick discussion between SCS VP of SWE and SCS System Planning VP; SCS Environmental, System Planning, and Sustainability VP\n8/3/23 – MPC/GPC Affiliate Transaction review team discussion among SCS IRP Manager; SCS VP of SWE; SCS Wholesale Market Manager; MPC Wholesale Market Manager; SCS Structuring Manager; SCS Manager of Energy Policy; SCS Transmission Policy & Services General Manager; SCS Special Counsel; Associate General Counsel, SCS; MPC VP, Treasurer, & CFO; MPC VP, General Counsel, and Corporate Secretary; MPC Generation Planning & Performance Manager; GPC Pricing & Planning VP; SCS System Planning VP; SCS Environmental, System Planning, and Sustainability VP; SCS Director, Gas Supply & Energy Trading; GPC Grid Transformation VP; SCS Transmission Planning Generation & Strategic Manager\n8/9/23 – Coordinated Planning meeting including SCS Environmental, System Planning, and Sustainability VP; SCS Energy Policy Manager; SCS System Planning VP; GPC Grid Transformation VP; MPC Generation Planning & Performance Manager; SCS Transmission Planning GM; SCS VP & Senior Production Officer (“SPO”); SCS Fleet Operations Director; SCS Resource Planning Director; SCS Power Delivery SVP; SCS SVP & SPO West; SCS SVP & SPO East; GPC Pricing & Planning VP; GPC Resource Policy & Planning Director; GPC Resource Policy & Planning Project Manager; SCS Transmission Policy & Services GM; SCS Transmission Planning Generation & Strategic Manager; SCS Transmission Planning East Manager; GPC Plant Bowen Manager.\n8/31/23 - Discussion of PPA between Associate General Counsel, GPC and General Counsel, MPC.\n9/1/23 - Discussion of PPA including Associate General Counsel, GPC; Deputy General Counsel GPC; General Counsel, MPC; Legal Counsel from Troutman Pepper.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216981, "filing_description": "DKT 55378 STF-PIA-7 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-7-17", "is_protective_disclosure": "no", "question": "When did GPC begin negotiating the PPA with Santa Rosa Energy Center LLC (Santa Rosa)? If the Santa Rosa PPA was negotiated with a different party or by a different party, such as Southern Company Services or another affiliated company, please identify the party.", "response": "Southern Company Services (“SCS”), after consultation with Georgia Power, initiated conversations with LS Power, the current owner of the Santa Rosa Energy Center, concerning a potential purchase of capacity and energy from Santa Rosa Energy Center, LLC in late July 2023. Please see the Company’s response to STF-JKA-2-19 subparts (h) and (i).", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216981, "filing_description": "DKT 55378 STF-PIA-7 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-7-18", "is_protective_disclosure": "no", "question": "Please describe the process by which Georgia Power initiated discussions with Santa Rosa about capacity needs and Santa Rosa’s ability to serve Georgia Power Company load.", "response": "Please see the Company’s response to STF-PIA-7-17. Southern Company Services (“SCS”) initiated conversations with LS Power to inquire of any potential capacity available from the Santa Rosa Energy Center to serve the needs of a Southern Company operating company. The request was for a non-binding term sheet of available capacity prior to 2029 for the Company’s consideration with the understanding that a to-be-determined regulatory approval process would be necessary. LS Power agreed to provide a term sheet pending an executed non-disclosure agreement (“NDA”). The NDA was executed on July 28, 2023, and the initial term sheet was provided to SCS on July 31, 2023.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216981, "filing_description": "DKT 55378 STF-PIA-7 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-7-19", "is_protective_disclosure": "no", "question": "Please identify the counterparties at Santa Rosa with whom Georgia Power Company negotiated the Power Purchase Agreement.", "response": "Southern Company Services (“SCS”) and Georgia Power primarily negotiated the PPA with the Energy Marketing and Trading organization of LS Power.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216981, "filing_description": "DKT 55378 STF-PIA-7 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-7-2", "is_protective_disclosure": "no", "question": "Please identify all assumptions and benefits in the 2023 IRP Updated related to financing, funding, grants or other benefit programs included in the Infrastructure Investment and Jobs Act (IIJA) and Inflation Reduction Act (IRA).", "response": "The Company included assumptions for both production tax credits (“PTC”) and investment tax credits (“ITC”) for eligible facilities in its 2023 IRP Update. Please see the Company’s response to STF-JKA-2-19 subpart (f) for more information on these assumptions.\nThe Company did not directly incorporate IIJA benefit assumptions into its economic analysis of capacity resources or the Resource Mix Study.\nThe Company will continue to pursue opportunities to provide IRA and IIJA benefits to customers as those opportunities are identified.", "attachment_filenames": "STF-PIA-7-20; PD STF-PIA-7-20 Attachment Z.docx; PD STF-PIA-7-20 Attachments A-Y.docx", "confidentiality_files": ""}, {"filing_api_id": 216981, "filing_description": "DKT 55378 STF-PIA-7 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-7-20", "is_protective_disclosure": "no", "question": "Provide a copy of all correspondence that discuss the PPA or potential PPA between Georgia Power Company and Santa Rosa.", "response": "Please see TS STF-PIA-7-20 Attachments A-Z for correspondence related to the development and negotiation of the Santa Rosa power purchase agreement. The names of LS Power and Southern Company employees, which is protected personally identifiable information, have been redacted from the attachments for privacy.", "attachment_filenames": "STF-PIA-7-20; PD STF-PIA-7-20 Attachment Z.docx; PD STF-PIA-7-20 Attachments A-Y.docx", "confidentiality_files": ""}, {"filing_api_id": 216981, "filing_description": "DKT 55378 STF-PIA-7 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-7-21", "is_protective_disclosure": "no", "question": "Please identify the dates of all meetings between the Company or its representatives and Santa Rosa that included discussion of a power purchase agreement or power supply agreement between the two parties. For each meeting, provide a list with the names of all attendees.", "response": "7/26/23 – Southern Company Services (“SCS”) Commercial Operations including Structuring Manager and Asset Manager along with representatives of the Energy Marketing and Trading organization of LS Power.\n8/1/23 – SCS Commercial Operations including Structuring Manager and Asset Manager along with representatives of the Energy Marketing and Trading organization of LS Power.\n8/15/23 – SCS Commercial Operations including Structuring Manager and Asset Manager along with representatives of the Energy Marketing and Trading organization of LS Power.\n9/6/23 – SCS Commercial Operations including Structuring Manager and Asset Manager along with representatives of the Energy Marketing and Trading organization of LS Power.\n9/28/23 – SCS Commercial Operations including Structuring Manager and Asset Manager along with representatives of the Energy Marketing and Trading organization of LS Power.\n10/3/23 – SCS Commercial Operations including Structuring Manager and Asset Manager. along with representatives of the Energy Marketing and Trading organization of LS Power\n10/5/23 – SCS Commercial Operations including Structuring Manager and Asset Manager. along with representatives of the Energy Marketing and Trading organization of LS Power\n10/11/23\nSCS Commercial Operations including Structuring Manager, Asset Manager, Natural Gas Procurement Manager; SCS Resource Planning – Resiliency & Reliability Manager; GPC Resource Planning Project Manager and Troutman  Pepper.\nRepresentatives of the Energy Marketing and Trading organization of LS Power along with internal counsel and Milbank.\n10/12/23 A – SCS Commercial Operations including Structuring Manager and Asset Manager along with representatives of the Energy Marketing and Trading and Asset Management organizations of LS Power.\n10/12/23 B\nSCS Commercial Operations including Structuring Manager, Asset Manager, Natural Gas Procurement Manager; SCS Resource Planning – Resiliency & Reliability Manager; GPC Resource Planning Project Manager and Troutman Pepper.\nRepresentatives of the Energy Marketing and Trading organization of LS Power along with internal counsel and Milbank.\n10/13/23 – SCS Commercial Operations including Structuring Manager and Asset Manager along with representatives of the Energy Marketing and Trading organization of LS Power.\n10/16/23 – SCS Commercial Operations including Structuring Manager and Asset Manager along with representatives of the Energy Marketing and Trading organization of LS Power.\n10/18/23 – SCS Commercial Operations including Asset Managers along with representatives of the Energy Marketing and Trading and Asset Management organizations of LS Power.\n10/19/23\nSCS Commercial Operations including Structuring Manager, Asset Manager, Natural Gas Procurement Manager; SCS Resource Planning – Resiliency & Reliability Manager; GPC Resource Planning Project Manager and Troutman Pepper.\nRepresentatives of the Energy Marketing and Trading organization of LS Power along with internal counsel and Milbank.\n10/20/23 A\nSCS Commercial Operations including Structuring Manager, Asset Manager, Natural Gas Procurement Manager; SCS Resource Planning – Resiliency & Reliability Manager; GPC Resource Planning Project Manager and Troutman Pepper.\nRepresentatives of the Energy Marketing and Trading organization of LS Power along with internal counsel and Milbank.\n10/20/23 B – SCS Commercial Operations including Structuring Manager and Asset Manager along with representatives of the Energy Marketing and Trading organization of LS Power.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216981, "filing_description": "DKT 55378 STF-PIA-7 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-7-22", "is_protective_disclosure": "yes", "question": "Georgia Power asked the Commission to approve expansion of the transmission system to accommodate its various resource requests and the Company’s Load and Energy Forecast.\nPlease identify the specific transmission expansion projects, and costs for each new transmission project, associated with each resource request included in the Company’s filing. Identify the project name, location, and estimated capital investment per month through each project’s in-service date.\nPlease identify the specific transmission expansion projects, and costs for each new transmission project, associated with the Company’s Load and Energy Forecast. Identify the project name, location, and estimated capital investment per month through each project’s in-service date.\nPlease provide an update of the spreadsheet, “2022 GA ITS Ten Year Plan Projects_Final_PSC_04242023.xlsx” [Docket No. 44160, Transmission Update] to identify all new projects the Company is asking the Commission to approve in the 2023 IRP Update.", "response": "Only the proposed Yates CTs require transmission improvements to facilitate the delivery of the 1,350 MW of generation. The required transmission improvements are listed in the table below:\nThis information will be provided in the Transmission Supplemental filing that will be filed in January 2024.\nThe Company is only asking for approval of projects necessary to implement the identified generation resources as noted on lines 22-27 on page 52 of the Company’s Direct Testimony filed on December 4, 2023, which were identified in the preliminary transmission screening analyses filed in the Technical Appendix to the 2023 IRP Update.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216981, "filing_description": "DKT 55378 STF-PIA-7 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-7-3", "is_protective_disclosure": "no", "question": "Describe Geogia Power’s efforts to maximize benefits to customers from the opportunities in the IIJA and IRA. How would these benefits be reflected in the Company’s ASR filings?", "response": "The Company incorporates the assessment of potential benefits to customers from opportunities provided through federal incentives including both the recently created IIJA and IRA statutes. Note, that as federal agencies continue to update guidance related to these statutes, the Company will continue to assess the impact to any applicable projects and provide customers with these benefits.\nThe Company included assumptions for both production tax credits (“PTC”) and investment tax credits (“ITC”) for eligible facilities in its 2023 IRP Update. Please see STF-JKA-2-19 subpart (f) for more information on these assumptions. The Company did not directly incorporate IIJA benefit assumptions into its economic analysis of capacity resources or the Resource Mix Study. The Company will continue pursue opportunities to provide IRA and IIJA benefits to customers as those opportunities are identified and vetted. Any realized PTCs will be reflected as credit to federal income taxes payable and ITCs will be reflected as credit to amortization of ITCs in Sections 2 and 3 in the Company’s Annual Surveillance Review (“ASR”) filings.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216981, "filing_description": "DKT 55378 STF-PIA-7 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-7-4", "is_protective_disclosure": "no", "question": "Please identify all assumptions and constraints included in the Company’s 2023 IRP Update and modelling associated with, or in consideration of, the U.S. Environmental Protection Agency’s (US EPA) proposed New Source Performance Standards for Greenhouse Gas Emissions From New, Modified, and Reconstructed Fossil Fuel Fired Electric Generating Units; Emission Guidelines for Greenhouse Gas Emissions From Existing Fossil Fuel-Fired Electric Generating Units; and Repeal of the Affordable Clean Energy Rule. [U.S. EPA Docket No. EPA–HQ–OAR–2023–0072]\nPlease describe each assumption or constraint.\nExplain the rationale for including the assumption or constrain.\nPlease provide all documentation, memos, industry reports, and workpapers describing these limitations, modeled or operational, and modeling choices to support these assumptions and constraints.\nIf no assumptions or constraints were included in the Company’s 2023 IRP Update, please explain why this is the case.", "response": "The Company did not include any assumptions or constraints as proposed in EPA 111 in the 2023 IRP Update.\nThe Company did not include any assumptions or constraints as proposed in EPA 111 in the 2023 IRP Update.\nThe Company did not include any assumptions or constraints as proposed in EPA 111 in the 2023 IRP Update.\nSince the proposed EPA 111 rule has yet to be finalized, state plans have not yet been developed, and potential legal challenges have not yet taken place, the Company believes that detailed analysis of the implications of the proposed EPA 111 rule for the 2023 IRP Update would be premature and speculative. The Company believes that the implications of a final EPA 111 rule are captured within the range of carbon pressure scenarios included in the 2023 IRP Update.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216981, "filing_description": "DKT 55378 STF-PIA-7 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-7-5", "is_protective_disclosure": "no", "question": "If the Company’s 2023 IRP Update is approved by the Commission, is it the Company’s expectation that the proposed resources would comply with U.S. EPA’s proposed rule in the above-identified docket? If not, please identify the resources (units, PPAs, etc.) that would not be compliant.", "response": "Georgia Power is committed to meeting all environmental compliance requirements applicable to the Company. An applicable final rule for EPA’s 111 Greenhouse Gas Rule (“111 Rule”) is projected to be released by mid-2024 with specific requirements for existing units to be developed and approved through state implementation plans within the following two to three years. Therefore, Georgia Power will continue to evaluate this rulemaking as the final rule is released, as well as actively engage in the state implementation plan development process, to determine the specific compliance strategy for each applicable generating unit. However, based on the proposed rule, the Company expects its proposed resources to comply with the final rule.\nSpecifically for the requests in this 2023 IRP Update, the contract periods for the proposed power purchase agreements (“PPAs”) with Mississippi Power and Santa Rosa Energy Center LLC end prior to the compliance dates for existing units in the proposed 111 Rule; therefore, these PPAs are not expected to be impacted by this rule.\nFor the proposed combustion turbines (“CTs”) at Plant Yates, Georgia Power expects to comply with the 111 Rule and does not anticipate any changes impacting the decision to request these additional resources.\nBattery energy storage systems (“BESS”) are not subject to the 111 Rule.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216981, "filing_description": "DKT 55378 STF-PIA-7 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-7-6", "is_protective_disclosure": "no", "question": "If the resources proposed by Georgia Power Company in the 2023 IRP Update would not comply with U.S. EPA’s proposed rule, did Georgia Power consider or quantify the costs associated with bringing them into compliance?", "response": "See the Company’s response to STF-PIA-7-5 for discussion of compliance with EPA’s 111 Greenhouse Gas Rule.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216981, "filing_description": "DKT 55378 STF-PIA-7 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-7-7", "is_protective_disclosure": "no", "question": "If the resources proposed by Georgia Power Company in the 2023 IRP Update would not comply with U.S. EPA’s proposed rule, did Georgia Power consider or quantify the potential stranded costs associated with the proposed resources?", "response": "See the Company’s response to STF-PIA-7-5 for discussion of compliance with EPA’s 111 Greenhouse Gas Rule. Georgia Power does not expect any stranded investments associated with these proposed resources.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216981, "filing_description": "DKT 55378 STF-PIA-7 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-7-8", "is_protective_disclosure": "no", "question": "Did the Company consider the health or environmental impacts of its proposed resource mix, or seek to minimize negative externalities associated with its proposed capacity plan?", "response": "Georgia Power continues to be committed to meeting all environmental compliance requirements applicable to the Company, including any environmental permitting and compliance processes associated with the proposed capacity plan in the 2023 IRP Update. All required environmental analyses, permit applications, and notifications are submitted to the Georgia Environmental Protection Division (“EPD”) or other environmental agencies, as applicable, for review and approval related to the relevant environmental and health-based standards.\nThe Company’s proposed capacity plan does consider many impacts of the requested resources and balances many factors along with reliably serving customer loads. The inclusion of battery energy storage systems (“BESS”) charged by solar resources, power purchase agreements (“PPAs”) from existing resources, and the advanced combustion turbines (“CTs”) at the existing location of Plant Yates results in a plan t
