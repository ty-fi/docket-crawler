ting for purchase of additional resources located within the Southern footprint.  Please indicate what resource was being negotiated, and how this changes the initial filing and documents subsequently filed in this proceeding.  Please update as developments change.", "response": "For a description of the potential resource for which the parties were unable to reach agreement at this time, please see the “TS Technical Information Supporting the Potential Acquisition of Additional Ownership in an Asset.docx” file in the “TS Technical Appendix” folder of the “TS 2023 IRP Update,” which was previously provided to Commission Staff on October 27, 2023. As described in the Company’s Direct Testimony, the Company will continue to explore other potential resource solutions and opportunities to meet its projected capacity needs and will return to the Commission if additional resource options become available.\nPlease see STF-JKA-2-2 Attachment B for an update to the Company’s projected capacity needs, including the proposed portfolio of resources in the 2023 IRP Update and excluding this potential acquisition resource. The Resource Mix Study in the 2023 IRP Update filing on October 27, 2023, and the Supplemental Filing on December 4, 2023, are not impacted by the ceased negotiations for the potential acquisition resource. The only impact to the economic analysis of the proposed resources in the 2023 IRP Update is that the potential acquisition resource option is no longer available. This impacts the relative economic ranking of the remaining proposed resources.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-23", "is_protective_disclosure": "no", "question": "On page 42 of the testimony, the Company discusses the DER Colocation program.\nPlease provide an economic analysis in which the Company quantifies the benefit to the participating customers and non-participating customers separately.\nPlease provide an example showing how a typical participating customer’s bill would be derived for one month.", "response": "Participating customers benefit from continued electric service during local outages. The value of this resiliency is customer, asset, and site specific.\nThe benefit of the program to non-participating customers is based on the structure of the tariff designs. Specifically, these programs provide assets for system use at a cost 25% less than the associated system value. This establishes the economic merit of the program without the need for a detailed economic analysis.\nA participating customer’s bill would be unaffected by participation in the program.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-24", "is_protective_disclosure": "no", "question": "Regarding the resources identified in the 2022 IRP and 2023 IRP Update:\nPlease provide a side-by-side comparison of the resources proposed in 2022 IRP, approved in the 2022 IRP, and proposed in the 2023 IRP.  Include MW and resource type in this comparison.\nExplain which resources as identified in part a were modeled in the 2022 IRP Resource Mix Study.  (2022 IRP Solar A, B, C, etc.)\nExplain which resources identified in part a were modeled in the Original 2023 IRP Update Mix Study (October 27, 2023)\nExplain which resources identified in part a were modeled in the Supplemental 2023 IRP Update Mix Study (December 4, 2023)\nExplicitly identify any resources modeled in the Aurora Mix Study that reflect future procurements of resources via will occur via an RFP.", "response": "Please see STF-JKA-4-24 Attachment.\nThe six 2022-2028 Capacity Request for Proposals (“RFP”) power purchase agreements (“PPAs”), the proposed 2,100 MW of utility scale (“US”) renewable resources, and the proposed 200 MW of distributed generation (“DG”) renewable resources, included in column A of STF-JKA-4-24 Attachment, were modeled in the 2022 Integrated Resource Plan (“IRP”) Resource Mix Study. The proposed 2,300 MW of renewable resources were included as part of the Company’s long-term renewable expansion plan of adding 6,000 MW by 2035. These resources were modeled as 2022 IRP Solar A-H.\nAll of the resources approved in the 2022 IRP, included in column D of STF-JKA-4-24 Attachment, were modeled in the 2023 IRP Update Mix Study filed on October 27, 2023, as well as the Supplemental 2023 IRP Update Mix Study filed on December 4, 2023. The Mississippi Power Company (“MPC”) PPA was the only resource proposed in the 2023 IRP explicitly modeled in the 2023 IRP Update Mix Study filed on October 27, 2023, as well as the Supplemental 2023 IRP Update Mix Study filed on December 4, 2023. Please see STF-JKA-2-2 part (g) for additional information on the 2023 IRP Update proposed resources modeled in the Mix Study.\nPlease see part (c).\nThe following resources were modeled in the Aurora Mix Study that reflect future procurements of resources that will occur via an RFP:\n500 MW Energy Storage Systems (“ESS”) (modeled as O3_2022_IRP_ESS)\n2,100 MW US renewable resources (modeled as O1_2022_IRP_US_RFP_1 and O1_2022_IRP_US_RFP_2)\nIncludes an additional 1,250 MW of rollover from the unfulfilled 2023/2024 Utility Scale Renewable RFP.\n200 MW DG renewable resources (modeled as O1_2022_IRP_DG_RFP_1 and O1_2022_IRP_DG_RFP_2)\nIncludes an additional 93 MW of rollover from the unfulfilled 2020 DG RFP.\n140 MW Biomass RFP (modeled as GPC_2022_IRP_BIOMASS)\nIn addition, the Company is including the remaining balance (3,700 MW modeled as 2022 IRP Solar D-H in Aurora) of the 6,000 MW of new renewable resources from the 2022 IRP.  This 3,700 MW of new renewables may change in the future as the Company will continue to propose to add renewable resources through its steady, measured, and regular RFPs and will evaluate and update the long-term procurement strategy for the economically optimal amount of renewable resource additions in future IRPs, including the 2025 IRP.", "attachment_filenames": "STF-JKA-4-24; STF-JKA-4-24 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-25", "is_protective_disclosure": "yes", "question": "Regarding the MPC Contract.\nPlease provide a narrative explanation regarding the energy transactions associated with the contract explaining how the transactions will be priced and costs calculated to GPC.\nCompare and contrast the energy treatment of the contract with energy available via the regular method of interchange accounting of energy purchased through the Southern Company pool.", "response": "The PPA Service Schedule specifies that Energy Utilization under the contract is determined in accordance with Southern Dispatch. Since both Georgia Power and Mississippi Power are members of the Southern Company Pool, neither Georgia Power nor fleet operations, as agent for, need to schedule energy to facilitate Southern Dispatch.\nThe MPC PPA specifies energy is priced at REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-26", "is_protective_disclosure": "yes", "question": "For the Company’s modeling of the MPC contract short-term capacity in the Aurora Mix Study of the year 2027, the Company appears to be utilizing an average monthly energy rate to represent the contract energy available as an input to the resource VOM.\nPlease provide a narrative explanation regarding the interpretation of this energy price.\nDoes the Company expect the energy associated with this contract to be above or below the hourly PIR of the system?\nDoes this contract price impact the marginal price derived by Aurora?  If so, explain why that is reasonable.\nPlease explain how this price was derived and provide the workpapers and computations for these inputs.", "response": "a.  Based on the Power Purchase Agreement (“PPA”) between Mississippi Power and the Company, as provided at the time of filing on October 27, 2023, the hourly energy price for the PPA will be REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED. For modeling purposes, the Company assumed REDACTED REDACTED for 2027 and 2028, based on forecasted REDACTED REDACTED for the associated years, which serves as a proxy for REDACTED REDACTED REDACTED REDACTED.\nb.   See the response to part (a).\nc.   The energy price of the contract is not expected to have any impact on the marginal price derived by Aurora. The energy purchased from the Company associated with this PPA will be priced REDACTED REDACTED REDACTED REDACTED, and therefore would not impact forecasted marginal pricing out of Aurora, nor would it impact actual marginal pricing for the System.\nd.   Calculations of the REDACTED REDACTED REDACTED costs and a narrative on how these costs were derived can be found in the Company’s responses to TS STF JKA-2-7 Attachment and STF-JKA-3-11, respectively.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-27", "is_protective_disclosure": "yes", "question": "Regarding the Company’s financing assumptions.  Please provide a side by side comparison of the WACC and inflation assumptions utilized in:\nThere derivation of the revenue requirements of generic resources (SAM model).\nThe ECC utilized for resource inputs to Aurora (TAS to AURORA file).\nThe WACC and discount rate used in the economic evaluations performed of the resources being acquired.\nIf the assumptions in a, b, and c are not consistent, please explain why not.", "response": "Please see the table below for the weighted average cost of capital (“WACC”) and inflation assumptions for generic resource revenue requirements.\nThe economic carrying cost (“ECC”) utilized for inputs to Aurora use the same financing assumptions as shown in the table below.\nPlease see the table below for the discount rate (or WACC) used in the economic evaluation. For more information and detailed calculations, please see the annual inputs tab in each SAM workpaper.\nThe discount rate, or WACC, is slightly different due to alternative state specific tax rate assumptions. The generic resources assume a system weighted tax rate while the economic analysis reflects state taxes consistent with the state of Georgia.\n*Values reflect rounding", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-28", "is_protective_disclosure": "no", "question": "What assumptions has the Company made regarding bonus tax credits available for renewable resources (location where resources sited, domestic production of resources, etc.) in modeling of generic resources in the 2023 IRP. Please explain and provide workpapers, electronically with all formulae intact deriving input assumptions.", "response": "Generic renewable resource additions are assumed to receive the 10-year Clean Electricity Production Tax Credit (“PTC”), which includes the bonus tax credits of meeting the workforce requirement and one of the additional bonus tax credits of domestic production of resources or energy community location. Additionally, the Company assumes that storage resources would receive the Storage Investment Tax Credit (“ITC”), which also includes the bonus tax credits of meeting the workforce requirement and one of the additional bonus tax credits of domestic production or energy community location. Based on this assumption, the Company assumes a 40% ITC on top of build and maintenance capital cost as shown in the “SAM Files for Generic Resources” folder located in the “8 TS Resource Mix Study” folder within the “TS Technical Appendix” folder of the “TS 2023 IRP Update Models and Workpapers,” which were previously provided to Commission Staff on October 27, 2023, with the 2023 IRP Update filing. Calculations to derive the PTCs used for generic renewable resources are shown in TS STF-JKA-4-28 Attachment.", "attachment_filenames": "STF-JKA-4-28; PD STF-JKA-4-28 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-29", "is_protective_disclosure": "yes", "question": "Regarding the price of solar:\nWhat is the average $/MWh assumed for generic solar resources in the mix study for each year available? Please provide this data series in an excel data format.\nHow does the generic pricing in Aurora for 2027 compare to the Company’s latest renewable procurements?  Please provide copies of the five latest solar procurement data/IE report/bid summary data.", "response": "Annual generic solar pricing is included in TS STF-JKA-4-29 Attachment A.\nBid pricing information (in $/MWh) from Georgia Power Company’s five most recent utility-scale renewable solicitations is included in TS STF-JKA-4-29 Attachment B. The Company’s latest renewable procurements (CRSP US, REDI US, and ASI and ASI-Prime US RFPs) reflect an average levelized bid price in the REDACTED REDACTED range, as compared to the Company’s generic pricing which reflects a REDACTED levelized price for 2027. Additionally, the Company, through its participation in coordinated planning with the other Southern Company retail electric operating companies, has knowledge of even more current bid price information for solar procurements in the 2027 timeframe. The Company’s 2027 price assumption is similar to the prices received in these more recent solicitations where bidders are accounting for supply chain issues, inflationary pressures, and interest rate increases.  The Company expects prices to continue to decline over time as these pressures are alleviated, and this decline is reflected in the price forecasts provided in TS STF-JKA-4-29 Attachment A.", "attachment_filenames": "STF-JKA-4-29; PD STF-JKA-4-29 Attachment A.xlsx; PD STF-JKA-4-29 Attachment B.docx", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-3", "is_protective_disclosure": "no", "question": "Please refer to the answer on (or about) page 24 starting with the statement “Time is of the essence…”  The answer goes on to explain that load is now expected to arrive sooner than the time the capacity from the RFP’s resulting from approval of the 2022 IRP.  Has the Company determined whether any of the current RFP’s will be rendered moot or no longer needed due to Commission approval of the resources being requested in this proceeding?  If so, please identify and discuss the implications of this situation as to whether it compromises the effectiveness of current or future RFP processes.", "response": "None of the Company’s current Requests for Proposals (“RFPs”) approved in the 2022 Integrated Resource Plan (“IRP”) in Docket No. 44160 will be rendered moot or no longer needed due to Commission approval of the resources proposed in the 2023 IRP Update and are even more valuable than when approved in the 2022 IRP. Each of the approved RFPs and the proposed resources in the 2023 IRP Update are all required to meet customers’ energy needs through 2031. The Company provided a status update on all 2022 IRP-approved RFPs on pages 14-15 of the Main Document of the 2023 IRP Update. The Company continues to fully support the Commission’s RFP processes, and its request in this 2023 IRP Update does not and will not compromise the effectiveness of current or future RFP processes.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-30", "is_protective_disclosure": "no", "question": "Has the Company performed a reserve margin study, ELCC study, or integration study as part of this IRP.  If so, please provide the workpapers and the studies, electronically, with all formulae intact.", "response": "The Company has not performed a reserve margin study or integration study as part of this 2023 IRP Update. The results of recent ELCC reliability simulations were provided as Attachment F in the Company’s response to STF-JKA-2-11.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-4", "is_protective_disclosure": "no", "question": "How much of the load that the Company expects to materialize is outside its service territory and explain why given the time constraints discussed in the testimony referenced above, the Company chose to acquire those loads?  Please provide a breakdown by year and by (summer/winter) season.", "response": "Georgia Power models expected loads using a portfolio approach. As a result, the Company does not have expected loads by year and season for customers outside its service territory.\nAs described in the Company’s October 27, 2023 filing and December 4, 2023 testimony, the load growth forecasted by the Company results from the extraordinary economic growth in the state of Georgia over the last several years. The increased customer load included in the 2023 IRP Update Load Forecast includes customers located inside and outside of Georgia Power’s service territory, which appropriately reflects the Company’s service across the state and its role in the continued economic development of the state. The time constraints identified in the Company’s testimony primarily refer to the acceleration of the Company’s capacity needs and the corresponding need to move quickly on procuring additional dispatchable, capacity resources to meet the needs beginning in the winter of 2025/2026.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-5", "is_protective_disclosure": "no", "question": "Are any of the new loads discusses in the testimony referenced above non-firm, or interruptible?  Did the Company discuss lower service quality options with these the new customers?", "response": "The new loads discussed in testimony are firm loads. The Company has existing, and newly proposed, curtailable load programs in which eligible customers may elect to participate but has not otherwise considered lower service quality offerings.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-6", "is_protective_disclosure": "no", "question": "For each new large load (>100 MW) now expected to be served by the Company, indicate when the Company first became aware that the load might come onto their system, and when the Company became certain enough that the load would materialize to include it in the current load forecast.  Provide the expected load for each such customer.", "response": "The Company does not track when it first became aware that each new large load customer might come onto its system.\nAlthough exact dates are not tracked by the Company, in general a large customer is added to the forecast when they have (i) pinpointed a site within Georgia, (ii) actively engaged with Georgia Power regarding electric service, and (iii) provided the Company with a projected load ramp-up schedule. New potential large load customers are initially assigned a low probability of realization, reflecting their early stage of development.\nSince Georgia Power models expected loads using a portfolio approach, the expected load for each customer is not available.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-7", "is_protective_disclosure": "no", "question": "Does the Company have any signed contracts with any of the new loads it expects to now serve that it did not have at the time of the 2022 IRP. If so, please provide a list of such contracts and when they were signed and copy of contract.", "response": "Yes. None of the new large loads included in the 2023 IRP Update were included in the forecast supporting the 2022 IRP. Please refer to TS STF-DEA-4-7 Attachment A through N.  In addition to these contracts, please see TS STF-JKA-4-7 Attachment A and TS STF-JKA-4-7 Attachment B.", "attachment_filenames": "STF-JKA-4-7; PD STF-JKA-4-7 Attachments A-B.docx", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-9", "is_protective_disclosure": "no", "question": "Please refer to Figure 1 on page 17 of the testimony.  For the years 2022 and 2023 please provide a breakdown by month of the figures shown.", "response": "Please refer to TS STF-JKA-4-9 Attachment, which shows a breakdown by month of Figure 1 on page 17 of the direct testimony for the years 2022 and Jan-Aug 2023.", "attachment_filenames": "STF-JKA-4-9; PD STF-JKA-4-9 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217029, "filing_description": "DKT 55378 STF-JKA-5 Data Request Responses", "filing_date": "1/11/2024", "staff": "JKA", "doc_id": "STF-JKA-5-1", "is_protective_disclosure": "no", "question": "Refer to the Company’s responses to JKA 2-8 and 2-30 and regarding the possible extension of the Gaston Units 1-4, and Gaston A.\nPlease provide the Company’s projected annual recurring capital costs and associated revenue requirements in the case of an extension of each unit through the end of the study period.\nPlease provide the Company’s projected annual maintenance capital costs and associated revenue requirements in the case of an extension of each unit through the end of the study period.\nPlease provide the Company’s projected annual Fixed O&M revenue requirement in the case of an extension of each unit through the end of the study period.\nPlease provide any other annual forward, unavoidable costs/investments and revenue requirement derivation associated with the possible extension of the Gaston Units through the end of the study period.", "response": "The Company has not made a final decision on a recommendation for possible extension of Plant Gaston Units 1-4 or Gaston A. The Company plans to address the retirement decisions for these units in the 2025 Integrated Resource Plan (“IRP”). However, the Company did compile this information on a preliminary indicative basis for Plant Gaston Units 1-4.\nPlease see TS STF-JKA-5-1 Attachment.\nPlease see TS STF-JKA-5-1 Attachment.\nPlease see TS STF-JKA-5-1 Attachment.\nAsset retirement obligations (“ARO”), net book value, and similar costs are considered unavoidable in a retirement scenario. The costs included in TS STF-JKA-5-1 Attachment are all considered avoidable in retirement.", "attachment_filenames": "STF-JKA-5-1; PD STF-JKA-5-1 Attachment.docx", "confidentiality_files": ""}, {"filing_api_id": 217029, "filing_description": "DKT 55378 STF-JKA-5 Data Request Responses", "filing_date": "1/11/2024", "staff": "JKA", "doc_id": "STF-JKA-5-10", "is_protective_disclosure": "yes", "question": "Regarding real-time operations BESS charging and discharging:\nDoes the Company have the logic completed to compute optimal dispatch for BESS projects.  What is the timeline for developing this logic? Please explain.\nPlease discuss the various use cases the Company believes the BESS projects are capable of providing (e.g. economic arbitrage, grid services, load following, frequency control, etc.)\nPlease explain the expected “State Of Charge” management practices the Company expects to utilize for the BESS projects and how they will determine the optimal usage case for the BESS.\nPlease discuss the constraints of the various use cases with respect to “State of Charge” management.\nPlease explain how the Company’s Aurora model for generic BESS resources in the Resource Mix Study aligns with the various use cases.  Please explain the Company’s utilization of a demand shaping model in Aurora.\nPlease explain how the Company’s Aurora modeling for Moody, Robins, and REDACTED in the economic analysis aligns with the various use cases.  Please explain if the modeling assumes an economic arbitrage model dispatched against avoided cost, and if these resources would be operate in a demand shaping model in actual operations.", "response": "Yes. The Automated Generation Control (“AGC”) algorithm has been configured and is ready for operational testing. This algorithm uses data from the unit commitment and real-time processes to provide an optimal operational schedule for the Battery Energy Storage System (“BESS”) facility.\nGeneric BESS resources may be able to provide multiple use cases subject to the availability of transmission and general system conditions. The proposed BESS facilities can provide energy arbitrage benefits and capacity value benefits. During real time operations, the BESS may also be able to provide operating reserve benefits and similar benefits during periods when the adjacent solar resources are not utilizing the interconnection capacity. The Company’s economic analysis for BESS resources conservatively assumed only energy arbitrage and capacity value benefits. During real-time operations, system operators will evaluate system conditions and make the best decision on BESS operation based on system needs that occur during real-time or near real-time periods.\nGeorgia Power does not expect that there will be a vendor specific state of charge (“SOC”) requirement for degradation warranty purposes, but one of the most important ways to ensure battery longevity is to maintain a SOC < 80% (recommendations by vendor can vary slightly). AGC operation can maintain an average SOC within any desired range. This metric can be tracked and, if necessary, manual adjustments can be made to the operational schedule. Additionally, if desired, the AGC algorithm can be placed in regulation mode whereby the SOC is maintained within a certain range and the BESS provides regulation services only. Regarding optimal use case determination, when on AGC, the BESS will automatically deviate from the day-ahead operational schedule in real-time for reliability or system needs based on economic evaluations.  When peak load hits a high threshold, the BESS will be held back and prioritized for system reliability concerns. In that case, the BESS will be maintained near full SOC until the reliability event is over.\nIf manual adjustments are made to the operational schedule for the sole purpose of SOC management or if the AGC system is placed in a mode where only regulation is utilized, there is the potential that some use cases may not be utilized for a period of time to ensure the desired SOC range is maintained. For example, the BESS may be temporarily limited in the ability for energy arbitrage if it is not desirable to have the BESS at low or high states of charge. However, at this time, it is not expected that this will be a routine occurrence.\nGeneric BESS resources, as modeled in the Resource Mix Study, dispatch to mainly provide capacity value benefits. The Aurora model dispatches BESS to minimize the variance of the demand net storage and reduce overall volatility of the demand shape. Additionally, the generic BESS resource is modeled as a quick start resource to provide operating reserve benefits and frequency regulation benefits.\nPlease see the response to part (b). System operators will monitor system conditions and dispatch the battery to minimize costs and preserve system reliability during real time operations.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217029, "filing_description": "DKT 55378 STF-JKA-5 Data Request Responses", "filing_date": "1/11/2024", "staff": "JKA", "doc_id": "STF-JKA-5-11", "is_protective_disclosure": "yes", "question": "It appears that the Company’s RFI responses included REDACTED REDACTED REDACTED. Table 2-3-2 of the RFI report appears to REDACTED REDACTED REDACTED REDACTED. Did the Company approach any of these possible counterparties for contract and/or acquisition?  Please explain.  If not, why not.", "response": "No, the Company did not approach any of these possible counterparties. In addition, please see the Company’s response to JKA-4-10(e).", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217029, "filing_description": "DKT 55378 STF-JKA-5 Data Request Responses", "filing_date": "1/11/2024", "staff": "JKA", "doc_id": "STF-JKA-5-12", "is_protective_disclosure": "yes", "question": "Regarding the Company’s Aurora modeling for Moody, Robins, and REDACTED BESS projects which are all expected to be co-located with solar. For each project, please explain the following:\nPlease provide the interconnection MW limit at these locations and confirm that they are sized for the solar projects. Please explain what operational impacts the Company expects when adding BESS to these locations.\nPlease explain what generation limitations are modeled in Aurora to reflect the interconnection constraints at these locations.\nPlease confirm that the Company’s combined modeling and output of these resources never generate beyond the interconnection limit.  Please explain how the Company is ensuring this constraint is met.\nPlease confirm that the Company’s modeling of an assigned “charging resource” in the Aurora set up sufficiently captures the impacts of the co-located solar.  Does this setting preclude the use of grid charging?  Please explain.\nPlease confirm that the Company utilized a “price” shaping method for the BESS projects in the Economic evaluation, but utilizes a “demand” shaping method for new BESS when performing Aurora production cost studies for the system.  Please explain what impact these shaping methods have on the assumed dispatch of the BESS projects.", "response": "The interconnection MW limits for the BESS locations are as follows. The limits are sized for the solar projects. Please see TS Technical Appendix Robins and Moody BESS as well as TS Technical Appendix BESS Co-located Solar for more information on operational and interconnection impacts. Please also see STF-JKA-5-10 for operational impacts.\nMoody BESS – 49.5 MW\nRobins BESS – 128 MW\nREDACTED Solar/BESS – 200 MW\nThe interconnection MW limits referenced in part (a) were modeled in Aurora. In the storage table the “Charging Resource Generation Limit” variable establishes an upper limit on the total hourly generation from the storage and charging resource.\nThe Company did confirm that the output of these resources did not exceed the interconnection limit in any hour of the Aurora simulations. The “Charging Resource Generation Limit” variable referenced in part (b) ensures the interconnection constraint is met in Aurora simulations.\nThe “charging resource” in the Aurora set up specifies that the BESS resource can only be charged by the co-located solar. For the economic analysis, the Company did not assume that the BESS projects could be charged from the grid.\nThe Company utilized the price shaping method for BESS dispatch in the economic evaluation and utilized a demand shaping method for BESS dispatch in the Resource Mix Study. The Company’s economic analysis for BESS resources conservatively assumed only energy arbitrage and capacity value benefits. This enables BESS to dispatch against avoided costs and maximize the energy arbitrage value of the storage resources. In the Resource Mix Study, BESS utilizes the demand shaping method for BESS dispatch to ensure that BESS is used optimally to minimize the variance of the demand net storage and reduce overall volatility of the demand shape, thereby providing capacity, operating reserves, and energy arbitrage value when available.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217029, "filing_description": "DKT 55378 STF-JKA-5 Data Request Responses", "filing_date": "1/11/2024", "staff": "JKA", "doc_id": "STF-JKA-5-2", "is_protective_disclosure": "yes", "question": "Refer to the Company’s responses to JKA 2-8 and 2-30 and regarding the possible extension of the GPC share of the Scherer 3 unit.\nPlease provide the Company’s projected annal recurring capital costs and associated revenue requirements in the case of an extension through the end of the study period.\nPlease provide the Company’s projected annual maintenance capital costs and associated revenue requirements in the case of an extension through the end of the study period.\nPlease provide the Company’s projected annual Fixed O&M revenue requirement in the case of an extension through the end of the study period.\nPlease provide any other annual forward, unavoidable costs/investments and revenue requirement derivation associated with the possible extension of the Scherer 3 Unit through the end of the study period.\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.", "response": "The Company has not made a final decision on a recommendation for possible extension of Plant Scherer Unit 3. The Company plans to address the retirement decision in the 2025 Integrated Resource Plan (“IRP”). Therefore, the Company did not explicitly produce this information for the Company’s ownership share of Plant Scherer Unit 3. However, the information requested is expected to be largely consistent with a previously provided workpaper. The Company updated that workpaper to approximate the requested values. Please see TS STF-JKA-5-2 Attachment for an approximation of the requested values.\nPlease see TS STF-JKA-5-2 Attachment.\nPlease see TS STF-JKA-5-2 Attachment.\nPlease see TS STF-JKA-5-2 Attachment.\nPlease see TS STF-JKA-5-2 Attachment. Common costs are not considered avoidable unless Plant Scherer Units 1-4 retire. This includes effluent limitation guidelines (“ELG”) and landfill costs. Fixed Operations and Maintenance (“FOM”) is not readily available on a common and unit specific basis in the workpaper. Therefore, total FOM is represented as a conservative assumption. Additionally, asset retirement obligations (“ARO”), net book value, and similar costs are considered unavoidable in a retirement scenario.\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.", "attachment_filenames": "STF-JKA-5-2; PD STF-JKA-5-2 Attachment.docx", "confidentiality_files": ""}, {"filing_api_id": 217029, "filing_description": "DKT 55378 STF-JKA-5 Data Request Responses", "filing_date": "1/11/2024", "staff": "JKA", "doc_id": "STF-JKA-5-3", "is_protective_disclosure": "no", "question": "Refer to the Company’s resource mix Aurora analysis; specifically, Unit “Battery Storage-GPC-O3_2022_IRP_ESS.”\nPlease confirm the Company has an actual plan to have this resource online in January 2029.\nPlease confirm the expected winter firm capacity of 475 MW, equivalent to what would be used in the winter load and resource table.\nPlease provide the nameplate capacity for this unit.\nPlease explain if any degradation is assumed in the economic evaluation or the Aurora modeling.\nPlease explain what the Company’s expected build cost is.  Please provide on both a $, and $/kW basis.\nPlease provide a narrative explanation as to the status of the build or procurement of this resource.\nPlease explain if this Aurora resource is modeled in the Company’s load and resource balance.  Why or why not?", "response": "The Company plans to issue the Energy Storage System (“ESS”) Request for Proposals (“RFP”) in 2024 and certify the selected resources in early 2026. Georgia Power expects that the full 500 MW will be online by the end of 2028.\nYes, the winter load and resource table showed 475 MW for the resource, as labeled “2022 IRP ESS RFP.”\nThis is not a specific unit. It is a placeholder for the 500 MW ESS RFP approved in Georgia Power’s 2022 Integrated Resource Plan (“IRP”). The specific resources will be modeled once the RFP is completed and resources are approved by the Commission.\nThere is no degradation assumed in the Aurora modeling. This unit reflects a placeholder for the 500 MW ESS RFP.\nPlease see the response for part (c).\nPlease see the response for part (c).\nThe 500 MW ESS RFP resource is modeled in the “Purchased Generating Capacity (MW)” category and is labeled “2022 IRP ESS RFP” in all “B2023…” and “2023 IRP Update…” worksheets within the “Figures 4, 5, 6, & 9 – Capacity Needs Data for B22, B23, and 2023 IRP Update” workpaper provided to Commission Staff on October 27, 2023. However, as indicated in Note (C) on each of these worksheets, the total capacity does not include the 500 MW ESS RFP in order to show total procurement and development capacity needs in those tables.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217029, "filing_description": "DKT 55378 STF-JKA-5 Data Request Responses", "filing_date": "1/11/2024", "staff": "JKA", "doc_id": "STF-JKA-5-4", "is_protective_disclosure": "no", "question": "Refer to the Company’s resource mix Aurora analysis; specifically, Unit “Battery Storage-GPC-O3_2022_IRP_MCGRAU_FORD”\nPlease confirm the latest estimate is that this resource will be online by January 2027.\nPlease confirm the expected winter firm capacity of 251.75 MW, equivalent to what would be used in the winter load and resource table.\nPlease provide the nameplate capacity for this unit.\nPlease explain if any degradation is assumed in the economic evaluation or the Aurora modeling.\nPlease explain what the Company’s expected build cost is.  Please provide on both a $, and $/kW basis.\nPlease provide a narrative explanation as to the status of the build or procurement of this resource.\nPlease explain if this Aurora resource is modeled in the Company’s load and resource balance.  Why or why not?", "response": "Yes, the latest estimate is that this resource will be online by January 2027.\nYes, the winter load and resource table showed 251.75 MW for the resource, as labeled “2022 IRP McGrau Ford 2 HR Battery.”\nThe nameplate capacity for this resource is expected to be 265 MW.\nThere is no degradation assumed in the Aurora modeling.\nAn initial cost estimate for the McGrau Ford Battery Facility was provided in the 2022 Integrated Resource Plan (“IRP”). Following completion of Georgia Power’s Request for Proposals (“RFP”) evaluations and final bidder selection, the Company will bring the McGrau Ford Battery Energy Storage System (“BESS”) Supply and EPC Agreements to the Commission for approval and a deemed certified amount for the project will be determined in accordance with the 2022 IRP Order.\nThe design and vendor selection for the Main Power Transformers (“MPT”) is complete, and it is anticipated that the transformer will be able to arrive to site in time for site construction and operation of the BESS. The Company issued RFPs for battery supply and EPC in November of 2023. The Company is reviewing the responses to the battery supply RFP and is awaiting responses from the EPC RFP. By the end of 2024, following completion of RFP evaluations and final bidder selection, the Company will bring the McGrau Ford BESS Supply and EPC Agreements to the Commission for approval and a deemed certified amount for the project will be determined in accordance with the 2022 IRP Order.\nYes, the winter load and resource balance includes the 251.75 MW resource, as labeled “2022 IRP McGrau Ford 2 HR Battery.” This is included in the balance to reflect a placeholder for the McGrau Ford Battery Facility that was approved in the 2022 IRP.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217029, "filing_description": "DKT 55378 STF-JKA-5 Data Request Responses", "filing_date": "1/11/2024", "staff": "JKA", "doc_id": "STF-JKA-5-5", "is_protective_disclosure": "yes", "question": "Refer to the Company’s resource mix Aurora analysis; specifically, Unit “Battery Storage-GPC-O3_MOSSY_BRANCH_DEMO”\nPlease confirm the latest estimate is that this resource will be online by January 2027.\nPlease confirm the expected firm capacity of 61.75 MW, equivalent to what would be used in the winter load and resource table.\nPlease provide the nameplate capacity for this unit.\nPlease explain if any degradation is assumed in the economic evaluation or the Aurora modeling.\nPlease explain what the Company’s expected build cost is.  Please provide on both a $, and $/kW basis.\nPlease provide a narrative explanation as to the status of the build or procurement of this resource.\nPlease explain if this Aurora resource is modeled in the Company’s load and resource balance.  Why or why not?", "response": "The latest estimate is that this resource will be online by June 2024. However, the Company does not include Mossy Branch as expected firm capacity until the conclusion of testing, which is estimated to be January 2027.\nYes, the winter load and resource table showed 61.75 MW for the resource, as labeled Mossy Branch.\nThe nameplate capacity for this resource is expected to be 65 MW.\nThere is no degradation assumed in the Aurora modeling.\nThe expected build cost is estimated at approximately REDACTED, which is as filed, and that is REDACTED for this four-hour battery system.\nThe Mossy Branch project is 70% completed with all battery containers, transformers and inverters installed. The project level substation is 100% constructed and energized. A commissioning kick off meeting is scheduled for early January 2024 and the project is expected to achieve COD in June 2024.\nYes, the winter load and resource balance includes the 61.75 MW resource, as labeled “Mossy Branch.” This is included in the balance to reflect a placeholder for the Mossy Branch storage project that is part of the storage demonstration projects approved in the 2019 Georgia Power Integrated Resource Plan.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217029, "filing_description": "DKT 55378 STF-JKA-5 Data Request Responses", "filing_date": "1/11/2024", "staff": "JKA", "doc_id": "STF-JKA-5-6", "is_protective_disclosure": "no", "question": "Refer to the Company’s resource mix Aurora analysis.  Please provide a narrative explanation as to the latest status of the construction or procurement of the following resources and include a description of the nameplate and firm capacity assumptions:\nSolar-GPC-O1_2022_IRP_US_RFP_1, online 2027\nSolar-GPC-O1_2022_IRP_US_RFP_2, online 2028\nSolar-GPC-O1_2022_IRP_SOLAR_D, online 2031\nSolar-GPC-O1_2022_IRP_SOLAR_E, online 2032\nSolar-GPC-O1_2022_IRP_SOLAR_F, online 2033\nSolar-GPC-O1_2022_IRP_SOLAR_G, online 2034\nSolar-GPC-O1_2022_IRP_SOLAR_H, online 2035", "response": "The Company issued the CARES US 1 RFP, associated with the Solar- GPC-O1_2022_IRP_US_RFP_1 site listed in part a, on December 22, 2023 with the expectation that once the sites are certified, they would achieve COD in the 2026 – 2028 timeframe.\nThe Company plans to issue the CARES US 2 RFP, associated with the Solar-GPC-O1_2022_IRP_US_RFP_2 in late 2024 or early 2025 with the expectation that once the sites are certified, they would achieve COD in the 2027-2029 timeframe. As part of both CARES US 1 and 2 RFPs, the Company is seeking 3,350 MW of solar (2,100 MW from the 2022 IRP and 1,250 MW rollover from previous RFPs), representing 167.5 MW of firm winter capacity and 1,507.5 MW of firm summer capacity.\n– g. For the solar sites listed in parts (c) through (g), the Company includes the remaining balance (3,700 MW modeled as 2022 IRP Solar D-H in Aurora) of the 6,000 MW of new renewable resources from the 2022 IRP.  This 3,700 MW of new renewables may change in the future as the Company will continue to propose to add renewable resources through its steady and regular procurements and will evaluate and update the long-term procurement strategy for the economically optimal amount of renewable resource additions in future IRPs, including the 2025 IRP.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217029, "filing_description": "DKT 55378 STF-JKA-5 Data Request Responses", "filing_date": "1/11/2024", "staff": "JKA", "doc_id": "STF-JKA-5-7", "is_protective_disclosure": "no", "question": "Please provide an excel spreadsheet mapping between the GPC resources provided in the load and resource balance spreadsheet and the GPC resources modeled in Aurora.  For any GPC specific resources modeled in Aurora that are not modeled in the GPC load and resource balance spreadsheet, please explain why they are not included.", "response": "The mapping information can be found in the attached spreadsheet, labeled STF-JKA-5-7 Attachment. Some Georgia Power-specific resources modeled in Aurora do not appear in the Georgia Power load and resource balance spreadsheet. These facilities have been labeled accordingly. The primary reason for this exclusion is due to the fact that these Qualifying Facilities (“QFs”) contribute solely to energy production and do not influence the overall resource balance. Consequently, they are not represented within the balance spreadsheet.", "attachment_filenames": "STF-JKA-5-7; STF-JKA-5-7 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217029, "filing_description": "DKT 55378 STF-JKA-5 Data Request Responses", "filing_date": "1/11/2024", "staff": "JKA", "doc_id": "STF-JKA-5-8", "is_protective_disclosure": "yes", "question": "Regarding Fixed and Variable O&M Costs for proposed BESS resources.\nPlease explain what the VOM costs for BESS resources in the mix studies includes.\nPlease explain what VOM costs are assumed for the BESS resources in the economic analysis for REDACTED REDACTED.\nPlease reconcile parts a and b to explain if VOM assumptions are consistent between generic BESS in the mix study and VOM modeling for the economic analysis of REDACTED REDACTED REDACTED.\nPlease explain what the Fixed O&M costs for BESS resources in the mix studies includes.\nPlease explain what Fixed O&M costs are assumed for the BESS resources in the economic analysis for REDACTED REDACTED.\nPlease reconcile parts d and e to explain if Fixed O&M assumptions are consistent between generic BESS in the mix study and Fixed O&M modeling for the economic analysis of REDACTED REDACTED.", "response": "The Variable Operations and Maintenance (“VOM”) costs represent the difference in augmentation costs needed to maintain beginning of life capacity between a system with only calendar year degradation (the passive degradation incurred in the battery cells over time) and the additional degradation incurred by a 365 cycle per year operation schedule.\nNo VOM costs were assumed for the BESS resources in the economic analysis for Moody, Robins, or REDACTED. Rather, augmentation costs were modeled as maintenance capital costs in the economic analysis.\nBoth the economic analysis and the Resource Mix Study take BESS augmentation into account to maintain the capacity of the BESS through the end of the resource life.  \n\nThe Resource Mix Study, or generic BESS, accounts for augmentation as a combination of annual capital maintenance outlays with an additional VOM component to account for BESS usage as mentioned in part (a) above.\nThe economic analysis accounts for all augmentation spending as periodic maintenance capital investments in the SAM model. The augmentation outlays for the economic analysis align with project specific expectations that can cause them to differ from the generic resources.\nFixed O&M costs in the mix studies include remote troubleshooting expense, degradation guarantees, 24/7 monitoring, insurance premiums, and labor required to manage the BESS system.\nFixed O&M costs in the economic analysis for the BESS resources mentioned include monitoring expenses, insurance, labor required to manage the BESS system, and service costs associated with maintaining the project substation and other power delivery equipment.\nThe categorization of Fixed O&M costs assumed for the BESS resources in the various analysis are largely consistent. Differences in estimates for the specific resources mentioned and generic resources are primarily due to cost estimates being updated specifically for the proposed resources.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217029, "filing_description": "DKT 55378 STF-JKA-5 Data Request Responses", "filing_date": "1/11/2024", "staff": "JKA", "doc_id": "STF-JKA-5-9", "is_protective_disclosure": "no", "question": "Regarding Automatic Generation Control (“AGC”) for BESS.\nDoes the Company expect all new BESS projects to be controlled by AGC.\nIf the answer to part a is yes, would that be expected at COD or another time. Please explain.", "response": "Yes, the plan is for all transmission connected Battery Energy Storage System (“BESS”) projects to be controlled by AGC.\nAfter the BESS facilities achieve commercial operation, the facilities will be operated on AGC.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217054, "filing_description": "DKT 55378 Supplemental Data Request Responses for STF-JKA-2-2, STF-JKA-2-19, STF-JKA-2-22", "filing_date": "1/12/2024", "staff": "JKA", "doc_id": "STF-JKA-2-19", "is_protective_disclosure": "yes", "question": "For each of the following, unit acquisitions, BESS resources, Mississippi PPA, Santa Rosa PPA, Yates CTs, REDACTED BESS + Solar,\nIf not already provided, provide copies of all PPAs or other agreements/commitments/corporate board approvals for the resources the Company plans to acquire.\nHas the Mississippi Power PPA been approved by the Mississippi Public Service Commission?\nSeparately for each resource above, provide justification for the $3/kW additional sum charge that the Company included.  Why does the Company consider $3/kW the appropriate charge for each resource?\nIdentify which resources received the accounting lease cost and provide an explanation and provide workpapers for how the lease cost was derived, electronically and with all formulae intact.\nIdentify which resources received sales revenues and explain how the sales revenues were derived and provide workpapers for how the sales revenues were derived, electronically and with all formulae intact.\nIdentify where the PTC and ITC calculations for resources may be found, and explain any differences in the PTC and ITC calculations for the Economic Analysis of Resources versus what was used in the Generation Resource Mix study.  Also, explain why PTC was selected instead of ITC, or why the ITC was selected instead of PTC.\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED\nFor each resource, provide a timeline when the Company first began consideration of the resource acquisitions, counterparty negotiations, discussions with site owners, important activities, etc.\nFor each resource, provide documentation supporting the timeline activities, including agreements, PowerPoint presentations, memos, letters, term sheets, analyses, electronically with all formulae intact.", "response": "Please see TS Technical Appendix Mississippi Power PPA and TS Technical Appendix Santa Rosa PPA for a copy of the power purchase agreements (“PPAs”). This information was included in the 2023 IRP Update filing and provided to Commission Staff on October 27, 2023. Please see TS STF-JKA-2-19 Attachment A for an executed agreement for preliminary engineering and development services and option to purchase equipment (“PES”) for Plant Yates Units 8-10. Please see the Company’s response to STF-JKA-2-19 part (i) for additional information for the remaining resources.\nJanuary 12, 2024 Supplemental Filing Update: Please see TS STF-JKA-2-19 Supplemental Attachment P for the Agreement for Engineering, Procurement, and Construction between Georgia Power Company and a consortium of Mitsubishi Power Americas, Inc. and Black & Veatch Construction, Inc., with an effective date of January 12, 2024.\nMississippi Public Service Commission (“MS Commission”) approval is not required for Mississippi Power to execute a PPA for the sale of capacity and energy with Georgia Power or any other off-taker; however, because Georgia Power is an affiliate of Mississippi Power, Mississippi Code § 77-3-10, requires filing the executed PPA with the MS Commission. Further, Mississippi Code § 77-3-42 requires a filing with the MS Commission as part of the MS Commission’s general oversight of capacity resources of public utilities in Mississippi. No formal review or approval procedure is prompted by this filing. The filing is for informational purposes. Mississippi Power Company has completed the required notice filing with the MS Commission with respect to the Georgia Power PPA recently executed.\nThe Company included $3/kW-year of additional sum consistent with the 2022 IRP Stipulated Agreement and the 2022 IRP Final Order. The Company considers this an appropriate amount given it was approved in the last IRP for capacity resources.\nThe Company’s Economic Analysis of Capacity resources includes accounting lease costs for the Santa Rosa PPA. The Company did not impute these costs on the other options in the economic analysis. The Company’s derivation of lease costs was included in “TS SAM (’23) – 7.0.1 – Santa Rosa Final.xlsm” provided to Commission Staff on October 27th, 2023. Please see row 34 on the Santa Rosa tab in this workpaper for the accounting lease costs.\nPlease see the 2023 IRP Update Main Document for more information. The Company intends to remarket the capacity associated with the MPC PPA in the years prior to the winter of 2025/2026. The Company did not include wholesale sales revenues for other resources. The derivation of the revenue is based on the agreement the Company has for the remarketed capacity. Please see TS STF-JKA-2-19 Attachment B for a copy of this agreement. The revenues from remarketing that capacity in 2024-2025 were quantified in the Technical Appendix “TS Economic Analysis of Capacity Resources.xlsx” file. On the Annual Economics tab, cells H64 and I64 show the capacity payment revenue derived by multiplying the capacity of the sale, the number of months, and the monthly capacity payment revenue received.\nThe Production Tax Credits (“PTC”) and Investment Tax Credits (“ITC”) calculations can be identified in the SAM workpapers provided to Commission Staff on October 27, 2023 and in the Aurora model files provided to Commission Staff on October 30, 2023.\nBoth the Company’s economic analysis and Resource Mix Study assume BESS resources would utilize the ITC. Likewise, both evaluations assume solar resources would utilize the PTC. The economic analysis does not assume domestic content or energy community benefits at commercial operation for the proposed projects given the chosen locations and likely source of materials for construction. However, the BESS augmentations are expected to receive bonus credits for domestic content. The Resource Mix Study assumes either energy community or domestic content benefits will be available for generic renewable or BESS additions. Therefore, the Resource Mix Study assumes those Inflation Reduction Act (“IRA”) benefits.\nBESS facilities only qualify for ITC. Solar facilities qualify for either the PTC or ITC benefits. In general, PTC are typically more economic than ITCs for solar resources for the Company. However, the decision is likely to be situation specific. The Company will continue to evaluate the selection of ITC or PTC for solar resources. As additional information becomes available, the Company will seek to select the most economic option available.\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED. As stated in direct testimony filed on December 4, 2023, the parties were unable to reach an agreement at this time. Therefore, the compliance obligations remain unchanged.\nBelow is a general timeline from when the Company first began consideration of the proposed resources and the important activities for each.\nREDACTED REDACTED\nInitial exploratory conversations between the parties began in early August 2023 regarding Georgia Power’s potential acquisition of additional ownership interests in an existing generation asset within the Southern Company footprint. Following initial discussions and through September 2023, the Company began its due diligence on the assets, scope, risks, and applicable regulatory requirements for the potential acquisition. Between early October 2023 and end of November 2023, the parties engaged in active negotiations regarding the terms and conditions for the proposed asset purchase agreement. However, on November 30, 2023, the parties agreed to suspend negotiations and not move forward with the transaction at this time. As stated in the direct testimony filed on December 4, 2023, the Company is no longer pursuing the potential acquisition of additional ownership interests in an existing generation asset within the Southern Company footprint.\nSanta Rosa PPA:\nInitial conversations with Santa Rosa began in late July 2023. After working through confidentiality items, the Company and Santa Rosa worked together to draft a non-binding term sheet before discussing a more detailed and actionable PPA. This non-binding term sheet was finalized in early September 2023. A PPA was then negotiated and executed on October 23, 2023. A copy of the PPA was included in the 2023 IRP Update filing on October 27, 2023.\nMississippi Power PPA:\nInitial conversations occurred in late July 2023. A non-binding term sheet was agreed upon before discussing more a detailed and actionable PPA. PPA negotiations began in late August. The PPA was subsequently executed on October 11, 2023. A copy of the PPA was included in the 2023 IRP Update filing on October 27, 2023.\nBESS Resources\nIn July 2023, the Company began an initial screening to aid in selection of potential BESS resources that could achieve commercial operation by November 2026. The initial screen contained a constraint analysis, survey analysis, environmental analysis, and substation analysis. By August, a preliminary screening for Robins and Moody identified these were suitable sites for BESS development.\nIn addition to the site screening, a request for information (“RFI”) was sent out to battery vendors in June to develop an updated understanding of BESS pricing and equipment lead times. By August, the Company had evaluated the existing land leases at Moody and Robins Solar and made notifications to the landowner at Moody Solar. In late August, the Company held a call with the Central Georgia Joint Development Authority (“CGJDA”) regarding the planned addition of a BESS at Robins Solar. The Company is working with CGJDA to modify any existing agreements. In late September and early October, the Company received preliminary layouts and single-line diagrams for both BESS projects. The incremental interconnection application requests were submitted for Robins BESS and Moody BESS on October 26 and November 3, respectively. In November, the Company sent out a request for proposal (“RFP”) to battery suppliers to determine a vendor for the Robins BESS and Moody BESS and an Engineering, Procurement, and Construction (“EPC”) RFP to determine a contractor for the Robins BESS and Moody BESS.\nREDACTED BESS + Solar\nIn April 2023, the Company executed a Non-Disclosure Agreement with the developer to pursue a renewable focused project to submit into an upcoming RFP. In July 2023, the Company began a due diligence exercise to evaluate the BESS + Solar opportunity. The Company is currently negotiating an Asset Purchase Agreement with the developer. In August 2023, a project team was pulled together consisting of subject matter experts from departments such as land, environmental, engineering, legal, tax, generation development, and finance. In early October, transmission completed the screening analysis described in the Technical Appendix to the 2023 IRP Update. Also, in early October, the developer provided indicative pricing, which was included in the SAM files and economic analysis. A site visit with the developer occurred on November 8 in support of developing an EPC agreement. On October 13, the developer executed an amendment with SCS Transmission to extend the commercial operation date into 2027, and on November 20, the developer executed a subsequent amendment to identify specific phases including this 200 MW BESS / 200 MW solar opportunity achieving commercial operation on November 1, 2026.\nYates Resources\nIn July 2023, the Company began the process of developing simple cycle combustion turbine (“CT”) plans for Plant Yates. The Company previously developed a Company-owned combined cycle (“CC”) proposal at Plant Yates, and this served as the basis for simple cycle due diligence.\nIn August 2023, the Company formally established a project team to begin development and negotiation of the project. Negotiations with the Consortium of Mitsubishi Power Americas and Black & Veatch also began in August and will continue until the anticipated fully negotiated turnkey EPC and companion long-term service agreement (“LTSA”) are complete (anticipated in mid-January 2024). In addition, the Company submitted interconnection applications for each of the units. On October 2, 2023, the Company executed an agreement for preliminary engineering and development services and option to purchase equipment.\nJanuary 12, 2024 Supplemental Filing Update: Please see TS STF-JKA-2-19 Supplemental Attachment P for the Agreement for Engineering, Procurement, and Construction between Georgia Power Company and a consortium of Mitsubishi Power Americas, Inc. and Black & Veatch Construction, Inc., with an effective date of January 12, 2024.\nBelow is a list of additional documents that support the timeline of activities.", "attachment_filenames": "STF-JKA-2-19 Supplemental PD; PD STF-JKA-2-19 Supplemental Attachment P.docx", "confidentiality_files": ""}, {"filing_api_id": 217054, "filing_description": "DKT 55378 Supplemental Data Request Responses for STF-JKA-2-2, STF-JKA-2-19, STF-JKA-2-22", "filing_date": "1/12/2024", "staff": "JKA", "doc_id": "STF-JKA-2-2", "is_protective_disclosure": "no", "question": "Refer to the Load and Resource Balance presented in “TS 2023 IRP Update Models and Workpapers.zip\\Main Document\\Figures 4, 5, 6, & 9 - Capacity Needs Data for B22, B23, and 2023 IRP Update.xlsx”\nExplain the change in capacity values for Bowen 1-2, 3-4, and Scherer 3, as the capacity values of those units appear to be different than what was assumed in the 2022 IRP.\nExplain the decrease in assumed DSO capacity, as the capacity value for DSO resources appears to be different than what was assumed in the 2022 IRP.  Also, please explain any change in assumptions such as customer participation since the 2022 IRP.\nWhat capacity equivalence (ICE, ELCC, etc.) factors are assumed for new and existing resources in the Company’s load and resource balance as presented?  Also, importantly, provide a view of the “2023 IRP Update w Extensions” tab but with nameplate capacity ratings for winter for each resource.\nWhat capacity equivalence (ICE, ELCC, etc.) factors are assumed for the proposed capacity resources evaluated in “TS Economic Analysis of Capacity Resources?” Provide such capacity equivalence factors for every unit.\nWhat capacity equivalence (ICE, ELCC, etc) factors are assumed for the proposed resources in the GenMix Study? Provide such capacity equivalence factors for every unit.\nHas the Company generated a load and resource balance view with the proposed capacity resources included associated with “TS Economic Analysis of Capacity Resources”?  If not, why not? Please provide such a view if it is available.\nHas the Company generated a load and resource balance view with the proposed capacity resources included associated with each GenMix case? If not, why not? Please provide such a view if it is available.\nPlease provide the Company’s assumptions for capacity additions (technology, collocated with or without BESS, baseload/intermediate/peaking, MW target factors to adjust the solicitation target amounts by the expected procurement amounts, etc.) that are planned to be procured through RFPs that were approved in the Company’s 2022 IRP.", "response": "The winter capacity values for Plant Bowen Units 1-4 and Plant Scherer Unit 3 increased due to additional demonstrated winter peaking capacity.\nThe Demand Side Option (“DSO”) capacity resources are updated annually to reflect the best available information on program participation and Economic Load Carrying Capability (“ELCC”). The decrease in planning capacity between the 2022 IRP and the 2023 IRP Update is primarily driven by a change in the ELCC for the Demand Plus Energy Credit (“DPEC”) program. Updated ELCC values reflect modeling of program parameters (resource availability, call limits, call conditions, required notice) and recently observed response rates.\nPlease see STF-JKA-2-2 Attachment A.\nPlease see TS STF-JKA-1-4 Attachment columns H and I for the annual capacity contribution for each resource in the economic analysis.\nThe MPC PPA was the only proposed resource explicitly modeled in the Resource Mix Study, and it was assumed to have an ELCC of 100%.\nPlease see STF-JKA-2-2 Attachment B. The Company did not include the potential option to acquire an additional ownership interest in an existing generating asset within the Southern Company footprint because the parties were unable to reach agreement at this time, as described in the Company’s Direct Testimony filed on December 4, 2023.\nJanuary 12, 2024 Supplemental Filing Update: Please see STF-JKA-2-2 Supplemental Attachment B for the Company’s latest projected capacity needs including the 2023 IRP Update proposed resources. In accordance with the Agreement for Engineering, Procurement, and Construction between Georgia Power Company and a consortium of Mitsubishi Power Americas, Inc. and Black & Veatch Construction, Inc., with an effective date of January 12, 2024, and provided as TS STF-JKA-2-19 Supplemental Attachment P, Georgia Power reflects the latest construction schedule for the proposed Plant Yates combustion turbines (“CTs”). Due to one of the proposed CTs expecting to achieve commercial operation in 2027, rather than 2026, approximately 200 MW of Other BESS were advanced to 2026 to fulfill the resulting projected capacity need for the winter of 2026/2027. Furthermore, the Company updated the Santa Rosa PPA firm capacity based on the results of a Southern Company Native Load Reservation interface study report for the Santa Rosa PPA resource. While annual firm transmission cannot be confirmed for 2024 through May 2026, Georgia Power is pursuing and may obtain short-term firm transmission for the resource during this period. Consistent with the transmission screening analyses in the 2023 IRP Update, no transmission project costs are attributable to the Santa Rosa PPA.\nPlease see STF-JKA-2-2 Attachment C for the load and resource balance views that include the generic expansion resources for each planning scenario from the Resource Mix Study associated with the Errata to the 2023 IRP Update Supplemental Filing that was filed on December 7, 2023. The Mississippi Power Company (“MPC”) power purchase agreement (“PPA”) was the only proposed resource explicitly modeled in the Resource Mix Study. The MPC PPA is immediately available, without construction delay or transmission restrictions, and represents a supply-side resource of extraordinary advantage. Additionally, the MPC PPA negotiations were near finalized at the time modeling began for the 2023 IRP Update, and the MPC resources are already included in the model, which simplified capturing the MPC PPA. Therefore, the MPC PPA was represented in the Resource Mix Study analysis.\nPlease see STF-JKA-2-2 Attachment D for the Company’s assumptions for capacity values for additions that are planned to be procured through requests for proposals (“RFPs”) that were approved in the Company’s 2022 IRP. The target procurement amounts can be found in Column E. The Company does not model or assume the results of future RFPs to be conducted to meet the Company’s capacity needs for certain periods, such as the 2029-2031 All-Source RFP.", "attachment_filenames": "STF-JKA-2-2 Supplemental; STF-JKA-2-2 Supplemental Attachment B.xlsx; STF-JKA-2-22 Supplemental", "confidentiality_files": ""}, {"filing_api_id": 217054, "filing_description": "DKT 55378 Supplemental Data Request Responses for STF-JKA-2-2, STF-JKA-2-19, STF-JKA-2-22", "filing_date": "1/12/2024", "staff": "JKA", "doc_id": "STF-JKA-2-22", "is_protective_disclosure": "no", "question": "Please provide all documents that serve as the basis for the cost assumptions for the Yates CTs.\nWhat is the primary fuel for Yates CTs? If gas, has the Company made arrangements to obtain firm gas transportation?\nExplain why Yates can be modeled to use natural gas while the generic CTs are modeled using oil?\nPlease provide all assumptions regarding gas deliverability to Yates, including firm transportation costs, the need to construct natural gas pipeline capacity, etc.\nWhy does page 21 state that the CTs will add between 1,000 MW and 1,400 MWs of capacity.  Why isn’t this statement more definitive and when will the decision about that be made?  If the Company had wanted, would the Yates site support the addition of a 4th CT addition?\nIf the CTs are approved in this case, how long after that would be required for the Company to construct the CTs.", "response": "Please see STF-JKA-2-19 for costs the Company has already incurred. The Company remains in active negotiations on the project. These negotiations and Southern Company’s recent experience building new natural gas plants informed the cost estimates for the Yates CTs. As mentioned in the “Technical Information Supporting the Proposal to Develop up to 1,400 MW from Three Simple Cycle Combustion Turbines at Plant Yates,” found in the Technical Appendix to the 2023 IRP Update filing, these costs estimates are subject to change prior to the execution of an Engineering, Procurement, and Construction (“EPC”) agreement. As mentioned in the Technical Appendix, the Company will update the Commission upon execution of a final EPC contract and request certification of Plant Yates Units 8-10 at that time.\nJanuary 12, 2024 Supplemental Filing Update: Please see TS STF-JKA-2-19 Supplemental Attachment P for the Agreement for Engineering, Procurement, and Construction between Georgia Power Company and a consortium of Mitsubishi Power Americas, Inc. and Black & Veatch Construction, Inc., with an effective date of January 12, 2024.\nPlant Yates Units 8-10 are dual-fuel units. They can operate on natural gas as available, but they are unlikely to have reliable supply of natural gas during peak winter periods without firm transportation (“FT”). No FT has been procured for these units. Therefore, these units will be supplied with oil to support continued operation during peak conditions. These units will be able to utilize gas when FT is available from other units such as the Plant Yates steam units or when interruptible pipeline transportation is available.\nThe Company modeled Plant Yates Units 8-10 assuming oil dispatch costs for the winter months. For the non-winter months, the Company assumed availability of natural gas in its economic analysis production cost modeling, which is weather normalized. Plant Yates Units 6-7 have firm gas transportation that can be utilized for Plant Yates Units 8-10 if economic. Additionally, natural gas pipelines are generally less constrained during non-winter months. This may differ from generic repeatable combustion turbines (“CT”) as the available of natural gas is highly location dependent, and generic CTs do not have a specific location. Please see the Company’s response to STF-JKA-2-14 subpart (e) for more information on the generic CT assumption.\nPlant Yates Units 8-10 will primarily run on fuel oil during peak winter and summer periods when the pipeline is constrained. No FT or additional gas capacity is being proposed to support these units, since these units can burn oil year around. It is being proposed to build a new pipeline lateral from Transco’s mainline to the plant. The new lateral would be adjacent to the existing pipeline lateral to Plant Yates from Transco.\nThe range of output capacity was used to illustrate the variance between oil- and gas-fired operations. Active negotiations over Mitsubishi’s guaranteed capacity have informed this range. The guaranteed capacity will be finalized upon execution of the final EPC contract. A fourth combustion turbine has not been evaluated for the 2023 IRP Update but could be considered in the future.\nJanuary 12, 2024 Supplemental Filing Update: In accordance with the Agreement for Engineering, Procurement, and Construction between Georgia Power Company and a consortium of Mitsubishi Power Americas, Inc. and Black & Veatch Construction, Inc., with an effective date of January 12, 2024, and provided as TS STF-JKA-2-19 Supplemental Attachment P, the winter capacity of each proposed CT is approximately 442 MW on natural gas and approximately 357 MW on fuel oil.\nUnder the preliminary schedule as shown in Figure 2 of the Technical Appendix for the Yates CTs, construction of the first two units will be substantially completed in 32 months with the third unit under construction for 36 months assuming a final decision for the 2023 IRP Update is obtained in April 2024. The Company has already begun activities in advance of a final decision to preserve the current timeline. Information on these activities is further described in STF-JKA-2-19, which are necessary to support engineering and procurement of critical equipment in a timely manner.\nJanuary 12, 2024 Supplemental Filing Update: In accordance with the Agreement for Engineering, Procurement, and Construction between Georgia Power Company and a consortium of Mitsubishi Power Americas, Inc. and Black & Veatch Construction, Inc., with an effective date of January 12, 2024, and provided as TS STF-JKA-2-19 Supplemental Attachment P, construction of the three units will be substantially completed in 32, 37, and 40 months, respectively, assuming a final decision for the 2023 IRP Update is obtained in April 2024.", "attachment_filenames": "STF-JKA-2-22 Supplemental", "confidentiality_files": ""}, {"filing_api_id": 217231, "filing_description": "DKT 55378 STF-JKA-6 Data Request Responses", "filing_date": "1/26/2024", "staff": "JKA", "doc_id": "STF-JKA-6-1", "is_protective_disclosure": "yes", "question": "Refer to the Company’s Load and Resource table, “Georgia Power Territorial Base Case Load vs. Existing Capability Table.xlsx”, and the footnote - “(E) Does not consider planning reserve sharing. Reflects GPC's Target Reserve Margin resulting from a System Target Reserve Margin of 25.50% (2024-2026) and 26% (2027 and beyond).”\nPlease explain the terms and conditions of the “planning reserve sharing” feature of the Southern Company ICC agreement and explain how it would change the table if planning reserve sharing had been considered.\nPlease provide a revised table that accounts for planning reserve sharing.\nPlease explain what year the Southern Company need date now is, and whether or not GPC could rely on reserve sharing during any part of the near-term period. Please explain.\nPlease provide a comparison of the Company’s current Target Reserve Margin to the Target Reserve Margin from the 2022 IRP as it appears to have changed since the 2022 IRP.\nPlease confirm the Company’s Southern Company Target Reserve margin has not changed since the 2022 IRP, and is based on the same SERVM analysis that was performed in the 2022 IRP.  If a new study has been performed, please provide the new study.\nPlease provide all workpapers used to derive the Georgia Reserve Margin target based on diversity from the Southern Company reserve margin target.  Provide this for both the 2022 IRP and the current IRP and provide it on a short-term and long-term basis.", "response": "The Intercompany Interchange Contract (“IIC”) provides for coordinated planning between the Operating Companies and for the sharing of temporary surpluses and deficits of capacity.  While the Southern Pool affords the participants the ability to rely on temporary surplus capacity on the System, each Operating Company is expected to have adequate resources, including an appropriate level of reserves, to reliably serve its own load obligations.\nAny retail Operating Company that has excess reserves may decide at any point to retire some of the capacity or make wholesale sales predicated on some or all of that capacity provided that such Operating Company is maintaining adequate resources to reliably serve its own obligations. In either case (resource retirement or wholesale sale), the effect would be a reduction in the level of available capacity reserves on the System. Additionally, the other retail Operating Companies may experience increased economic development activity similar to what the Company is experiencing and may decide to not make their surpluses available to the Company while the economic development activity is being assessed.\nShould Georgia Power rely on the reserve sharing provision of the IIC, Georgia Power would utilize the other Operating Companies’ temporary capacity surplus in Winter of 2026 to eliminate its capacity deficit. The MPC PPA, which is based on MPC’s surplus capacity, is addressing the Winter 2026 capacity deficit. Beginning in Winter of 2027, Georgia Power’s need with planning reserve sharing would be slightly less due to another Operating Company having a small amount of capacity surplus for Winter of 2027 through Winter of 2040. While this capacity is available to Georgia Power customers in times of need due to participation in the Southern Company pool through reserve sharing, it is only intended as a temporary provision and each
