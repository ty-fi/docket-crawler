name: Refresh docket data and deploy site

on:
  schedule:
    - cron: '0 10 * * 1'   # Every Monday at 10:00 UTC
  workflow_dispatch:
    inputs:
      refresh_pages:
        description: 'Re-read every filing page (not just new filings)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'docket_crawler/**'
      - 'dockets.json'
      - 'output/**'
      - 'requirements.txt'
      - '.github/workflows/refresh.yml'

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    # Pushes only rebuild the site from the committed CSVs; crawling runs on schedule/manual.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit updated CSV + manifest
      actions: write    # keepalive: re-enable this workflow so GitHub doesn't disable it
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: output/docket_*/cache
          key: filings-v3-${{ github.run_id }}
          restore-keys: filings-v3-

      - name: Fetch new filings
        id: fetch
        # Exit code 3 = the site refused requests. Still parse and commit what finished,
        # then fail the job at the end so it shows up.
        continue-on-error: true
        run: python -m docket_crawler fetch ${{ inputs.refresh_pages && '--refresh-pages' || '' }}

      - name: Parse
        run: python -m docket_crawler parse

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/docket_*/qa.csv output/docket_*/manifest.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh docket data $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Keepalive
        # Scheduled workflows are disabled after 60 days without repo activity.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable refresh.yml --repo "${GITHUB_REPOSITORY}"

      - name: Fail if fetch failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Fetch step failed (see its log). Data that was fetched has been committed."
          exit 1

  build:
    needs: refresh
    # Deploy even if fetching failed part-way: the committed data is still consistent.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # pick up the commit the refresh job just pushed

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m docket_crawler site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # Explicit condition: without it, a skipped refresh job (push runs) makes GitHub
    # skip this job too, even though the build succeeded.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
