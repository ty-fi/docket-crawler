erated construction/spend schedule for the Yates CTs is required to meet the needed CODs. It is not expected that future new CTs in the Resource Mix Study would be required to meet this accelerated schedule.\nA full interconnection affected systems study for a given resource must be performed in order to understand the cost and need for transmission upgrades a specific generator would also have to accommodate. Given the timeline of affected systems studies and their site-specific nature, it is impossible to predict which generic resources in the Resource Mix Study would need to have transmission upgrades indicated by an affected systems study. In general, transmission upgrades for a given generator are installed in parallel with the construction of the generator and may take longer than the construction of the generator depending on the required transmission upgrades.", "attachment_filenames": "STF-PIA-13-11", "confidentiality_files": ""}, {"filing_api_id": 217720, "filing_description": "DKT 55378 STF-PIA-13 Data Request Responses", "filing_date": "2/26/2024", "staff": "PIA", "doc_id": "STF-PIA-13-12", "is_protective_disclosure": "no", "question": "Does the company have previous examples of the Georgia PSC approving additional sums on PPAs with affiliates who earn a regulated rate of return on the underlying generation assets?", "response": "No. The Company does not have previous examples of the Georgia Public Service Commission approving additional sums on power purchase agreements (“PPAs”) with affiliate companies who earn a regulated rate of return on the underlying generation asset because the Company has never had such a PPA before.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217720, "filing_description": "DKT 55378 STF-PIA-13 Data Request Responses", "filing_date": "2/26/2024", "staff": "PIA", "doc_id": "STF-PIA-13-13", "is_protective_disclosure": "no", "question": "Does the company earn an additional sum when it draws power from the “reserve sharing with the Southern Company pool” referenced on page 32 of the company's direct testimony?", "response": "No. The Company does not earn an additional sum on capacity reserve sharing transactions within the Southern Company pool. The Southern Company Intercompany Interchange Contract (“IIC”), which governs transactions within the Southern Company pool, provides for reserve sharing among the operating companies related to temporary surpluses or deficits of capacity. Reserve sharing does not provide for firm, long-term capacity. In contrast, power purchase agreements (“PPAs”) provide for firm, long-term capacity and energy. An additional sum is associated with certificated long-term power purchases and is intended to encourage long-term power purchases.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217720, "filing_description": "DKT 55378 STF-PIA-13 Data Request Responses", "filing_date": "2/26/2024", "staff": "PIA", "doc_id": "STF-PIA-13-14", "is_protective_disclosure": "no", "question": "Please provide load and resources tables for the Georgia Power system, one in installed capacity terms (for existing and proposed resources) and one in accredited capacity terms.", "response": "Please see STF-PIA-13-14 Attachment for the load and resources table for existing and proposed resources in installed capacity terms. All formulas are left intact; however, reserve margin and capacity needs calculations are not accurate unless using capacity equivalence terms. Please see STF-JKA-2-2 Supplemental Attachment B for the load and resources table for existing and proposed resources in capacity equivalence terms.", "attachment_filenames": "STF-PIA-13-14; STF-PIA-13-14 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217720, "filing_description": "DKT 55378 STF-PIA-13 Data Request Responses", "filing_date": "2/26/2024", "staff": "PIA", "doc_id": "STF-PIA-13-15", "is_protective_disclosure": "no", "question": "Has the company assessed whether the MPC and Santa Rosa PPAs are needed to meet spring and fall capacity and energy requirements?\nIf not, does the company anticipate the plants serving those PPAs will still operate in these seasons?\nWill any excess capacity and energy be remarketed in those seasons, and if so, what share of the seasonal cost does the company anticipate it could recover through remarketing?", "response": "No. The Company assesses capacity and energy needs for summer and winter seasons in accordance with the reliability needs of the system, not spring and fall seasons. Therefore, the Company did not assess whether the Mississippi Power Company (“MPC”) power purchase agreement (“PPA”) and Santa Rosa PPA are needed to meet spring and fall capacity and energy requirements.\nYes, the Company anticipates that the plants serving these PPAs will still operate in spring and fall seasons in accordance with economic dispatch. See TS STF-PIA-12-1 Attachment for projected capacity factors by month for the Santa Rosa PPA. Because the MPC PPA can be served from any resource available to MPC, projected capacity factors are not provided for the MPC PPA in TS STF-PIA-12-1 Attachment.\nThe Company is attempting to remarket capacity associated with the MPC PPA and the Santa Rosa PPA for the entire period prior to the winter of 2025/2026. The Company has already sold 500 MW to a regional electric service provider for January 1, 2024, through September 30, 2025, thereby recovering costs from a third party in a period before the capacity is needed to serve Georgia Power retail customers. For all future seasons, Southern Wholesale Energy, on behalf of Georgia Power and the other operating companies, continually assesses the wholesale market for opportunities to resale any capacity that the Company may have above its target reserve margin.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217720, "filing_description": "DKT 55378 STF-PIA-13 Data Request Responses", "filing_date": "2/26/2024", "staff": "PIA", "doc_id": "STF-PIA-13-16", "is_protective_disclosure": "no", "question": "Does the company anticipate the resources serving the MPC PPA will be operated on a must-run basis?", "response": "The MPC PPA obligation can be met by any resource available to Mississippi Power and is not associated with a specific set of resources. The Company anticipates that Mississippi Power’s resources will continue to be operated in normal economic dispatch of the Southern Company system. There are no must-run requirements associated with the MPC PPA.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217720, "filing_description": "DKT 55378 STF-PIA-13 Data Request Responses", "filing_date": "2/26/2024", "staff": "PIA", "doc_id": "STF-PIA-13-17", "is_protective_disclosure": "no", "question": "Provide all information that the company has regarding the renewable or carbon-free power goals of its existing and anticipated commercial and industrial customers.", "response": "Refer to STF-PIA-13-17 Attachment A for a business intelligence report of sustainability profiles for commercial and industrial customers.\nRefer to STF-PIA-13-17 Attachment B for a list of energy efficiency, renewable energy, and air goals for commercial and industrial customers.\nRefer to STF-PIA-13-17 Attachment C for a list of emission reduction and renewable energy goals for national accounts customers.", "attachment_filenames": "STF-PIA-13-17; STF-PIA-13-17 Attachment A.pptx; STF-PIA-13-17 Attachment B.xlsx; STF-PIA-13-17 Attachment C.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217720, "filing_description": "DKT 55378 STF-PIA-13 Data Request Responses", "filing_date": "2/26/2024", "staff": "PIA", "doc_id": "STF-PIA-13-2", "is_protective_disclosure": "no", "question": "Please describe whether the company’s capacity expansion modeling utilizes a load duration curve approach, hourly chronological, or other? Please explain.", "response": "The Company uses hourly chronological dispatch in the model. The Company has provided Aurora project files with the “Project Setup” tab set to “Hourly Dispatch” and the “Dispatch Representation” (seen in the Simulation Options of the LTCE study setting) set to “Chronological.” The hourly chronological methodology uses the dispatch of units in the simulation as the basis for the valuation of the build and retirement decisions. This methodology seeks to select the resources that provide the most value to the system given the constraints in place.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217720, "filing_description": "DKT 55378 STF-PIA-13 Data Request Responses", "filing_date": "2/26/2024", "staff": "PIA", "doc_id": "STF-PIA-13-3", "is_protective_disclosure": "no", "question": "Has the company modeled anticipated energy generation mix (in MWh terms) and carbon emissions estimates from the existing and proposed resources in this IRP, in its Georgia service area and in the broader Southern Company system? If so, please provide annual total estimated generation mix by year for each modeled scenario. If not, please explain why.", "response": "The Company modeled the existing retail operating company mix in the IRP and provided that information in the Aurora files provided to Staff in the TS 2023 IRP Update Supplemental Filing on December 4, 2023. The existing mix did not include the proposed resources except for the MPC PPA. However, the expansion plan does have CTs and BESS projects that would generally align with the expected operation of the proposed resources. The Aurora model includes emissions related information, and the results of those simulations were included in the Resource Emissions Year table included in the Aurora files. The broader Southern Company system energy generation mix will be included in the 2025 IRP and will include any approved proposed resources.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217720, "filing_description": "DKT 55378 STF-PIA-13 Data Request Responses", "filing_date": "2/26/2024", "staff": "PIA", "doc_id": "STF-PIA-13-4", "is_protective_disclosure": "no", "question": "Does the company’s net present value estimates for each modeling scenario include resource dispatch costs (i.e. fuel expenses)? If not, please provide NPV analysis with these dispatch costs included for all scenarios modeled.", "response": "Yes, the Company’s net present value estimates for each modeling scenario include resource dispatch costs. The Pool Year table output, located within the Aurora output database, includes the annual total production costs, which include resource dispatch costs.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217720, "filing_description": "DKT 55378 STF-PIA-13 Data Request Responses", "filing_date": "2/26/2024", "staff": "PIA", "doc_id": "STF-PIA-13-5", "is_protective_disclosure": "no", "question": "Is the company’s calculation of RIM for new customers in any way affected by assumptions around carbon costs utilized in capacity expansion modeling scenarios? Are lambda values remodeled to take into account the incremental resources proposed in this IRP?", "response": "The calculation of RIM for new customers is not affected by assumptions around carbon costs in other expansion modeling scenarios. The marginal energy costs in the model are updated annually with the release of the energy budget as part of the system planning process and will capture the resources resulting from this 2023 IRP Update.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217720, "filing_description": "DKT 55378 STF-PIA-13 Data Request Responses", "filing_date": "2/26/2024", "staff": "PIA", "doc_id": "STF-PIA-13-6", "is_protective_disclosure": "no", "question": "Page 49 of the 2023 IRP update main document states: “each new large customer must pass financial and economic screening requirements, including the Ratepayer Impact Measure (“RIM”) test.  These screening requirements compare the projected new revenues that will result from the customer projects with the estimated new costs to serve those projects, resulting in projected net benefits to customers.”\nPlease provide all rules, policies, or requirements upon which the referenced financial and economic screening requirements are described, based on, or otherwise based.\nPlease provide all rules, policies, or requirements upon which the referenced Ratepayer Impact Measure (“RIM”) test are described, based on, or otherwise based.\nPlease describe how the projected net benefits to customers are measured.\nPlease describe how the projected net benefits to customers are determined.\nHow are transmission and distribution upgrades and interconnection costs addressed in the referenced financial and economic screening requirements?\nHow are transmission and distribution upgrades and interconnection costs addressed in the Ratepayer Impact Measure (“RIM”) test?", "response": "Customers who receive new business offers must meet the eligibility requirements of the tariff under which electric service is being offered. Each offer considers the customer’s credit rating as related to the payment of direct and local costs. Many customers are now required to pay 100% of local costs, regardless of credit rating. For customers on a Real Time Pricing tariff, a Customer Baseline Load (CBL) is determined based on the size of the project, the costs to serve the customer, and other customer specifics to ensure the project  passes the Rate Impact Measure (“RIM”) test and puts downward pressure on rates.\nThe RIM test used by the Company for large load customer offers is conducted using the PRICEM model. This is the same analysis and model the Company uses to calculate RIM for load expansions, other new customers who are not eligible for a choice of electric service provider, and demand-side management (“DSM”) programs. The RIM test is a net present value (“NPV”) calculation of the total benefits and total costs over the life of the project. These economic evaluations align the customer’s load shape with the marginal costs they place on the system, including with respect to their method of service and the  costs to serve them. As with DSM and other analyses, a RIM calculation result above zero is considered passing. However, simply passing RIM is not the final threshold for an offer to be extended. The additional criteria are described above in STF-PIA-13-6 part (a).\nProjected net benefits are measured by a positive RIM result. Projected net benefits are measured by comparing the NPV of projected revenues to the NPV of projected costs for each new business offer. The NPV of projected revenues must exceed the NPV of projected costs in order for the offer to pass the RIM test and provide a positive RIM result. A positive RIM result indicates net benefits for customers.\nProjected net benefits for new business offers are determined by subtracting the NPV of projected costs from the NPV of projected revenues. Revenue projections are developed based on the monthly peak load (kW), monthly energy consumption (kWh), the customer load shape, and the respective tariff under which the customer being evaluated will take service. Projected costs to serve new business loads are assigned to each project and included in the new business offer. There are two types of costs that may be included in offers: local and upstream. Local costs are assigned directly to the project and may include both transmission and distribution investments where the project receives the sole benefit. Upstream costs include investments that provide system benefit to other customers in addition to the project. Upstream costs are allocated to each project based upon that project’s marginal use of the system over the life of the project. The Company prepares each offer to fully recover both local and allocated upstream costs required to serve the customer load over the life of the project.\nTransmission and distribution upgrades and interconnection costs are captured in the local costs assigned directly to each project. Even if there are no upstream investments incurred by Georgia Power at the time of initial service, upstream costs are allocated to each new business project based on that project’s marginal impact on the system, as described above in STF-PIA-13-6 part (d).\nBoth local (direct assigned) and upstream (allocated) transmission and distribution upgrades are included as projected costs in the RIM test.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217720, "filing_description": "DKT 55378 STF-PIA-13 Data Request Responses", "filing_date": "2/26/2024", "staff": "PIA", "doc_id": "STF-PIA-13-7", "is_protective_disclosure": "no", "question": "Does Georgia Power or its parent company have carbon reduction goals? If so, please describe them and discuss how they have been taken into account when developing the proposed expansion plan presented in this IRP?", "response": "Southern Company has a long-term greenhouse gas (“GHG”) reduction goal of net zero emissions by 2050 and an interim goal of 50% reduction in GHG emissions from 2007 levels by 2030. Southern Company’s climate approach includes the three pillars set forth in the 2050 net-zero goal: (1) of pursuing a diverse energy resource portfolio, (2) developing new technologies to lower GHG emissions, and (3) constructively engaging with stakeholders.\nWhen developing the expansion plans presented in the 2023 IRP Update, the Resource Mix Study Supplemental, which was filed with the Commission on December 4, 2023, includes various carbon pressure scenarios to capture impacts and allow for long-term planning to mitigate risks to customers from the range of potential outcomes from legislative or regulatory action aimed at reducing carbon emissions.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217720, "filing_description": "DKT 55378 STF-PIA-13 Data Request Responses", "filing_date": "2/26/2024", "staff": "PIA", "doc_id": "STF-PIA-13-8", "is_protective_disclosure": "no", "question": "What assumed ELCC values do the company assign to new standalone solar and wind resources made available to the capacity expansion model? If the generic ELCC does not align with the ELCC levels proposed in the last IRP, please explain why.", "response": "The expansion model ELCC values for new standalone solar and wind resources were provided in the Company’s response to STF-JKA-2-11, Attachment F. The solar ELCC values did not change from the 2022 IRP. The wind values did change, reflecting new and diverse southeast wind profiles that were incorporated into the reliability model in 2023. Previous wind ELCC values were based on the profiles of existing wind resources in the System but located outside of the retail service territory.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217720, "filing_description": "DKT 55378 STF-PIA-13 Data Request Responses", "filing_date": "2/26/2024", "staff": "PIA", "doc_id": "STF-PIA-13-9", "is_protective_disclosure": "no", "question": "Does the company use publicly available sources to develop its generic unit cost estimates for new resources? If yes, please identify the sources utilized. If not, why not?", "response": "Yes, the Company uses publicly available resources ranging from the National Renewable Energy Laboratory (“NREL”) Annual Technology Baseline (“ATB”) to Lazard to benchmark the Company’s internal cost estimates for new resources. However, the cost estimates utilized for all generic resources included in the Resource Mix Study are the result of internal studies and models developed specifically for use in generic cost estimates. These studies frequently leverage outside contracted work with Engineering Procurement and Construction (“EPC”) firms, but also utilize the Company’s internal engineering services. The intended result is to create a generic new resource cost and performance indicative of a technology deployment in the Company’s regulated service territory versus solely using public sources, which are frequently broader in scope. The Company also uses certain non-public sources used from Bloomberg New Energy Finance that inform future cost assumptions for certain technologies.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 226453, "filing_description": "DKT 55378_STF-PIA-20 PUBLIC DISCLOSURE", "filing_date": "5/1/2026", "staff": "PIA", "doc_id": "STF-PIA-20-1", "is_protective_disclosure": "no", "question": "Referring to the Company’s Load Realization Model, please provide a list of projects that have begun commercial operation with associated peak demand (observed maximum load) and expected annual energy requirements. Please provide this response on a monthly basis. If data is not available on a monthly basis, please provide this information on a quarterly basis.", "response": "For a list of projects that have begun commercial operations and their associated peak demands, please refer to the Company’s response to STF-PIA-20-8. For expected annual energy requirements please refer to STF-PIA-20-1 Attachment.\nSubsequent updates will be filed on a quarterly basis as a reoccurring data request response in a similar fashion to STF-PIA-20-9.", "attachment_filenames": "STF-PIA-20-1 Attachment PUBLIC DISCLOSURE.xlsx", "confidentiality_files": "STF-PIA-20-2 Trade Secret Assertion.docx; STF-PIA-20-6 Trade Secret Assertion.docx; STF-PIA-20-1 Trade Secret Assertion.docx; STF-PIA-20-8 Trade Secret Assertion.docx"}, {"filing_api_id": 226453, "filing_description": "DKT 55378_STF-PIA-20 PUBLIC DISCLOSURE", "filing_date": "5/1/2026", "staff": "PIA", "doc_id": "STF-PIA-20-10", "is_protective_disclosure": "no", "question": "Please provide by customer a summary of any discussions between the Company and any large load customers at any stage of the pipeline regarding demand side management.", "response": "The Company discusses potential Demand Side Management opportunities with all applicable customers. Because these discussions are often conducted by phone or during informal meetings, the Company is unable to produce a comprehensive summary of all discussions with customers related to this information. The Company can further elaborate on the nature of these discussions during the upcoming meetings with Staff related to load flexibility.", "attachment_filenames": "", "confidentiality_files": "STF-PIA-20-2 Trade Secret Assertion.docx; STF-PIA-20-6 Trade Secret Assertion.docx; STF-PIA-20-1 Trade Secret Assertion.docx; STF-PIA-20-8 Trade Secret Assertion.docx"}, {"filing_api_id": 226453, "filing_description": "DKT 55378_STF-PIA-20 PUBLIC DISCLOSURE", "filing_date": "5/1/2026", "staff": "PIA", "doc_id": "STF-PIA-20-2", "is_protective_disclosure": "no", "question": "Referring to the Company’s Load Realization Model, please provide the latest Large Load forecast outputs, including the final energy requirements and associated peak load adjustments associated with these outputs. Please provide this response on a recurring basis as the Company generates new vintages of the Load Realization Model.", "response": "Please refer to STF-PIA-20-2 Attachment.", "attachment_filenames": "STF-PIA-20-2 Attachment PUBLIC DISCLOSURE.xlsx", "confidentiality_files": "STF-PIA-20-2 Trade Secret Assertion.docx; STF-PIA-20-6 Trade Secret Assertion.docx; STF-PIA-20-1 Trade Secret Assertion.docx; STF-PIA-20-8 Trade Secret Assertion.docx"}, {"filing_api_id": 226453, "filing_description": "DKT 55378_STF-PIA-20 PUBLIC DISCLOSURE", "filing_date": "5/1/2026", "staff": "PIA", "doc_id": "STF-PIA-20-3", "is_protective_disclosure": "no", "question": "The large load report states that one committed customer was added with 800 MW of load. However, the excel spreadsheet shows an announced load of 1400 MW for this customer. Please explain the difference.", "response": "In Q4 2025, the Company saw one additional commitment with announced load of 1,400 MW. However, two previously committed customers reduced their requested load by a net 585 MW, bringing the total commitments up by a net 815 MW.", "attachment_filenames": "", "confidentiality_files": "STF-PIA-20-2 Trade Secret Assertion.docx; STF-PIA-20-6 Trade Secret Assertion.docx; STF-PIA-20-1 Trade Secret Assertion.docx; STF-PIA-20-8 Trade Secret Assertion.docx"}, {"filing_api_id": 226453, "filing_description": "DKT 55378_STF-PIA-20 PUBLIC DISCLOSURE", "filing_date": "5/1/2026", "staff": "PIA", "doc_id": "STF-PIA-20-4", "is_protective_disclosure": "no", "question": "Is the new committed customer a hyperscaler, developer, or colocator?", "response": "The new committed customer included in the Q4 2025 Large Load Economic Development Report is a hyperscaler.", "attachment_filenames": "", "confidentiality_files": "STF-PIA-20-2 Trade Secret Assertion.docx; STF-PIA-20-6 Trade Secret Assertion.docx; STF-PIA-20-1 Trade Secret Assertion.docx; STF-PIA-20-8 Trade Secret Assertion.docx"}, {"filing_api_id": 226453, "filing_description": "DKT 55378_STF-PIA-20 PUBLIC DISCLOSURE", "filing_date": "5/1/2026", "staff": "PIA", "doc_id": "STF-PIA-20-5", "is_protective_disclosure": "no", "question": "In the “removed projects” tab under reason for removal column, please explain “contract expiration” and “customer’s budget” reasons for removal.", "response": "Contract Expiration: The customer was presented with a Contract for Electric Service for execution within 90 days. The customer did not execute the contract and was subsequently withdrawn from the pipeline.\nCustomer Budget: The customer was unable to meet the financial requirements based on the Company’s updated Rules and Regulations and was subsequently withdrawn from the pipeline.", "attachment_filenames": "", "confidentiality_files": "STF-PIA-20-2 Trade Secret Assertion.docx; STF-PIA-20-6 Trade Secret Assertion.docx; STF-PIA-20-1 Trade Secret Assertion.docx; STF-PIA-20-8 Trade Secret Assertion.docx"}, {"filing_api_id": 226453, "filing_description": "DKT 55378_STF-PIA-20 PUBLIC DISCLOSURE", "filing_date": "5/1/2026", "staff": "PIA", "doc_id": "STF-PIA-20-6", "is_protective_disclosure": "no", "question": "Of the projects listed with no activity, at which stage of the technical review process did customers fail to respond? For example, did the lack of response occur before or after the transmission study or timeline review?", "response": "Please refer to STF-PIA-20-6 Attachment.", "attachment_filenames": "STF-PIA-20-6 Attachment PUBLIC DISCLOSURE.xlsx", "confidentiality_files": "STF-PIA-20-2 Trade Secret Assertion.docx; STF-PIA-20-6 Trade Secret Assertion.docx; STF-PIA-20-1 Trade Secret Assertion.docx; STF-PIA-20-8 Trade Secret Assertion.docx"}, {"filing_api_id": 226453, "filing_description": "DKT 55378_STF-PIA-20 PUBLIC DISCLOSURE", "filing_date": "5/1/2026", "staff": "PIA", "doc_id": "STF-PIA-20-7", "is_protective_disclosure": "no", "question": "Please explain why the project under the “load change tab” in the excel spreadsheet decreased its load by 525 MW?", "response": "The customer requested an additional 525 MW in Q2 2025. Since that time, the Company concluded through its operational review that the additional request could not be served.", "attachment_filenames": "", "confidentiality_files": "STF-PIA-20-2 Trade Secret Assertion.docx; STF-PIA-20-6 Trade Secret Assertion.docx; STF-PIA-20-1 Trade Secret Assertion.docx; STF-PIA-20-8 Trade Secret Assertion.docx"}, {"filing_api_id": 226453, "filing_description": "DKT 55378_STF-PIA-20 PUBLIC DISCLOSURE", "filing_date": "5/1/2026", "staff": "PIA", "doc_id": "STF-PIA-20-8", "is_protective_disclosure": "no", "question": "For each large load customer with a Contract for Electric Service that is currently in operation, please provide the following monthly data beginning with January 2023 through December 2025:\nThe customer’s peak load (MW) during the month\nTotal MWhs consumed by the customer\nTotal revenues billed to the customer\nTotal revenues attributable to base rates (Base Revenue)\nMonthly Access Charge\nTotal revenues attributable to fuel rates", "response": "Please refer to STF-PIA-20-8 Attachment.\nDue to the highly confidential and commercially sensitive nature of the information, similar to the workpapers submitted in Docket No. 44280, this information will only be provided to Staff.", "attachment_filenames": "STF-PIA-20-8 Attachment PUBLIC DISCLOSURE.docx", "confidentiality_files": "STF-PIA-20-2 Trade Secret Assertion.docx; STF-PIA-20-6 Trade Secret Assertion.docx; STF-PIA-20-1 Trade Secret Assertion.docx; STF-PIA-20-8 Trade Secret Assertion.docx"}, {"filing_api_id": 226453, "filing_description": "DKT 55378_STF-PIA-20 PUBLIC DISCLOSURE", "filing_date": "5/1/2026", "staff": "PIA", "doc_id": "STF-PIA-20-9", "is_protective_disclosure": "no", "question": "Going forward with the quarterly large load report, please provide monthly data requested in the previous question. Beginning with the large load report for the first quarter of 2026 and subsequent quarterly reports, provide the following monthly data:\nThe customer’s peak load (MW) during the month\nTotal MWhs consumed by the customer\nTotal revenues billed to the customer\nMonthly Access Charge\nTotal revenues attributable to base rates (Base Revenue)\nTotal revenues attributable to fuel rates", "response": "The Company will provide the requested monthly data as a recurring data request on a quarterly basis. Due to the lag associated with the final calculation of the RTP revenues attributable to fuel, first quarter 2026 data will be provided in July 2026. All subsequent data for a given quarter will be provided four months following the end of the given quarter.", "attachment_filenames": "", "confidentiality_files": "STF-PIA-20-2 Trade Secret Assertion.docx; STF-PIA-20-6 Trade Secret Assertion.docx; STF-PIA-20-1 Trade Secret Assertion.docx; STF-PIA-20-8 Trade Secret Assertion.docx"}, {"filing_api_id": 219091, "filing_description": "DKT 55378 STF-PIA-14 Data Request Responses", "filing_date": "6/17/2024", "staff": "PIA", "doc_id": "STF-PIA-14-1", "is_protective_disclosure": "no", "question": "Provide a copy of “Contract for Electric Service” for each customer that has signed the contract.\nThe report on page 2 states: “In the near-term, for the winter of 2028/2029, the total pipeline is estimated at nearly 14,200 MW, representing an increase of more than 2,500 MW to the 11,600 MW estimated at the time of 2023 IRP Update filing in October 2023. The large load economic development pipeline for this same time period has increased by approximately 2,000 MW and totals approximately 12,500 MW.”", "response": "The following trade secret attachments contain the Contracts for Electric Service for large load customers that have committed to take service from Georgia Power.\nTS Attachment A.pdf\nTS Attachment B.pdf\nTS Attachment C.pdf\nTS Attachment D.pdf\nTS Attachment E.pdf\nTS Attachment F.pdf\nTS Attachment G.pdf\nTS Attachment H.pdf", "attachment_filenames": "STF-PIA-14-1; PD STF-PIA-14-1 Attachments A-H.docx", "confidentiality_files": ""}, {"filing_api_id": 219091, "filing_description": "DKT 55378 STF-PIA-14 Data Request Responses", "filing_date": "6/17/2024", "staff": "PIA", "doc_id": "STF-PIA-14-2", "is_protective_disclosure": "no", "question": "Define or describe “Total Pipeline” customers?", "response": "The “Total Pipeline” includes all Economic Development and Customer Choice projects that are being tracked by the Company. The Total Pipeline includes projects above and below the large load threshold (45 megawatts for the industrial class; 110 megawatts for the commercial class). Only projects above the large load thresholds are included in the external adjustment to the Load Forecast.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 219091, "filing_description": "DKT 55378 STF-PIA-14 Data Request Responses", "filing_date": "6/17/2024", "staff": "PIA", "doc_id": "STF-PIA-14-3", "is_protective_disclosure": "no", "question": "Define or describe “Large Load Economic Development Pipeline” customers?", "response": "The “Large Load Economic Development Pipeline” is a subset of the Total Pipeline, excluding non-large load projects that are considered organic growth. Therefore, the Large Load Economic Development Pipeline captures projects greater than or equal to 45 megawatts for the industrial class and 110 megawatts for the commercial class. The Large Load Economic Development Pipeline is the pool of potential load that qualifies for an external adjustment to the load forecast.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 219091, "filing_description": "DKT 55378 STF-PIA-14 Data Request Responses", "filing_date": "6/17/2024", "staff": "PIA", "doc_id": "STF-PIA-14-4", "is_protective_disclosure": "no", "question": "What is the difference between “Total Pipeline” and “Large Load Economic Development Pipeline” customers?", "response": "The Large Load Economic Development Pipeline is a subset of the Total Pipeline tracked by the Company and includes only those projects that meet the megawatt thresholds described in response to STF-PIA-14-3.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 219091, "filing_description": "DKT 55378 STF-PIA-14 Data Request Responses", "filing_date": "6/17/2024", "staff": "PIA", "doc_id": "STF-PIA-14-5", "is_protective_disclosure": "no", "question": "How much of the total pipeline 14,200 MW load customers have signed “Request For Electric Service” with Georgia Power? Identify those customers and their load ramp.", "response": "Please refer to TS STF-PIA-14-5 Attachment, which contains the projected load ramp by project. Of the 2028 load ramp, 2,744 of the 14,200 MW have signed a Request for Electric Service but not yet a Contract for Electric Service with Georgia Power.", "attachment_filenames": "STF-PIA-14-5; PD STF-PIA-14-5 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 219091, "filing_description": "DKT 55378 STF-PIA-14 Data Request Responses", "filing_date": "6/17/2024", "staff": "PIA", "doc_id": "STF-PIA-14-6", "is_protective_disclosure": "no", "question": "How much of the total pipeline 14,200 MW load customers have signed “Contract for Electric Service” with Georgia Power? Identify those customers and their load ramp.", "response": "Please refer to TS STF-PIA-14-5 Attachment, which contains the projected load ramp by project. Of the 2028 load ramp, 1,919 of the 14,200 MW have signed a Contract for Electric Service with Georgia Power.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 219091, "filing_description": "DKT 55378 STF-PIA-14 Data Request Responses", "filing_date": "6/17/2024", "staff": "PIA", "doc_id": "STF-PIA-14-7", "is_protective_disclosure": "no", "question": "How much of the large load economic development 12,500 MW load customers have signed “Request For Electric Service” with Georgia Power? Identify those customers and their load ramp.", "response": "Please refer to the TS Large Load Economic Development Report Q1 2024 – Attachment. The attachment contains the projected load ramp and project stage by project. Of the 2028 load ramp, 2,388 of the 12,500 MW of large load projects have signed a Request for Electric Service but not yet a Contract for Electric Service with Georgia Power.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 219091, "filing_description": "DKT 55378 STF-PIA-14 Data Request Responses", "filing_date": "6/17/2024", "staff": "PIA", "doc_id": "STF-PIA-14-8", "is_protective_disclosure": "no", "question": "How much of the large load economic development 12,500 MW load customers have signed “Contract for Electric Service” with Georgia Power? Identify those customers and their load ramp.", "response": "Please refer to the TS Large Load Economic Development Report Q1 2024 – Attachment. The attachment contains the projected load ramp and project stage by project. Of the 2028 load ramp, 1,701 of the 12,500 MW of large load projects have signed a Contract for Electric Service with Georgia Power.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 219905, "filing_description": "STF-PIA-15 Data Request Responses", "filing_date": "9/13/2024", "staff": "PIA", "doc_id": "STF-PIA-15-1", "is_protective_disclosure": "no", "question": "Please refer to the Application for Certification, pg. 4, stating that the Robins and Moody BESS will “be constructed with the capability to grid-charge if constraints are not present on the transmission system.”\nPlease describe the constraints that would prevent the BESS from charging from the grid.\nIn the economic analysis of the Robins and Moody projects, including the Aurora modeling, did the Company assume the projects are capable of charging from the grid? Please provide a narrative description of the modeling treatment of this constraint.", "response": "Please see the Company’s response to STF-DEA-9-5. Until firm transmission delivery service has been studied for the Robins and Moody BESS, grid-charging constraints related to congestion or stability issues on the bulk power system are unknown. The Company will investigate firm transmission deliverability service for charging in the future to expand the operational flexibility of the resources.\nThe Robins and Moody BESS projects will be primarily charged by the existing solar resources at each site. In the Aurora simulations, the Company limited charging to the adjacent solar facility. During real-time operations, the Company will grid-charge when transmission is available and it makes economic sense.  Given that firm transmission delivery for charging is currently unknown, this modeling approach is a reasonable approximation of energy benefits.", "attachment_filenames": "STF-PIA-15-10; STF-PIA-15-11; STF-PIA-15-16; PD STF-PIA-15-16 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 219905, "filing_description": "STF-PIA-15 Data Request Responses", "filing_date": "9/13/2024", "staff": "PIA", "doc_id": "STF-PIA-15-10", "is_protective_disclosure": "yes", "question": "Please refer to Trade Secret Attachment B.\nPlease provide a description of each data column in the table.\nBy dividing Total_Hours_Run by Startups, the average run time per start is REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED. Please explain how the units are expected to \noperate, and reconcile the data provided in Attachment B.\nBy dividing Output_MWH by Startups, the average output per hour is REDACTED REDACTED REDACTED REDACTED. Please explain how the units are expected to operate, and reconcile the data provided in Attachment B.", "response": "Description of each data column in the table is as follows:\nCapability_MWh: The total capability of the resource for the time period in MWh.\nGeneration_MWh: This column reports the total positive output in MWh over the time period for the unit. It will only be different from the Output_MWh column when the unit has negative output over the time period (e.g. storage unit).\nStartups: The total number of startups for the resource during the given time period. This refers to periods where the BESS generates.\nTotal_Hours_Run: The total number of hours in the Time_Period that the resource operated; both charging and generating.\nEFOR: Equivalent Forced Outage Rate; For these BESS projects, EFOR was set at REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.  This assumption is based in part on the \ntrack record of the equipment supplier.\nRound Trip Efficiency: This column is round-trip efficiency defined as a fraction, typically between 0 and 1. The efficiency is applied on the charging side. The energy used from the grid and the energy stored in a given hour are based on the efficiency such that Energy Stored = (Efficiency)*Energy Used.\nThe units are expected to operate at different levels of output based on the needs of the system in weather-normal conditions in Aurora (inclusive of point of interconnection [“POI”] limitations like at Robins and Moody).  From Attachment B, consider that Total_Hours_Run column factors both hours where the BESS generates as well as hours where it charges. The Startups column signifies hours where the BESS starts generating after an hour where the BESS was either idle or charging.\nPlease see the to the response to b. above.  Because the BESS are flexible assets to the system, the model will dispatch the resources in the most optimal fashion to provide lowest system production cost, which can be at levels below nameplate.", "attachment_filenames": "STF-PIA-15-10", "confidentiality_files": ""}, {"filing_api_id": 219905, "filing_description": "STF-PIA-15 Data Request Responses", "filing_date": "9/13/2024", "staff": "PIA", "doc_id": "STF-PIA-15-11", "is_protective_disclosure": "yes", "question": "Please refer to Trade Secret Attachment C. Please explain why the Hammond BESS project is REDACTED REDACTED on a $/kW basis than the other three proposed projects.", "response": "The need for a new 230 kV project level substation and associated generation tie-line, coupled with Hammond BESS being a smaller project, results in the BESS being more expensive on a $/kW basis than the other three projects.", "attachment_filenames": "STF-PIA-15-11", "confidentiality_files": ""}, {"filing_api_id": 219905, "filing_description": "STF-PIA-15 Data Request Responses", "filing_date": "9/13/2024", "staff": "PIA", "doc_id": "STF-PIA-15-12", "is_protective_disclosure": "no", "question": "Please provide a detailed explanation regarding how contingency was calculated for each of the proposed BESS projects.", "response": "As outlined in the Company’s Application for Certification of Robins, Moody, Hammond, and McGrau Ford Phase II Battery Energy Storage Systems; Docket No. 55378, the Company has secured multiple fixed price contracts to derisk the battery energy storage projects. The contingency for the Battery Energy Storage System (“BESS”) projects was determined by considering risk factors related to the development and deployment of BESS projects. These factors include market fluctuations, project complexity, supplier lead times, contractual terms, and the clarity and stability of the project scope. The rapid development, the complexity of managing multiple interdependent agreements and the critical need for a 2026 commercial operation date (“COD”) were also considered. Contingency was applied across all projects in consideration of these risks. Any unused contingency funds will not be included in the final cost of the project, and the Company expects to report out on contingency as part of the Construction Monitoring requirements.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 219905, "filing_description": "STF-PIA-15 Data Request Responses", "filing_date": "9/13/2024", "staff": "PIA", "doc_id": "STF-PIA-15-13", "is_protective_disclosure": "no", "question": "How will Georgia Power maintain system output for each of the full 20-year terms?  Are replacement components anticipated in the final 5-10 years? What is the estimated cost of these components?", "response": "Please see the Company’s response to STF-PIA-15-6 for details related to maintaining system output and estimated costs. As shown in the BESS augmentation schedules referenced in STF-PIA-15-6, the Company does anticipate replacement components in the final 5 – 10 years of operation.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 219905, "filing_description": "STF-PIA-15 Data Request Responses", "filing_date": "9/13/2024", "staff": "PIA", "doc_id": "STF-PIA-15-14", "is_protective_disclosure": "no", "question": "Referring to the Application for Certification, pg. 2, how will the Company be able to “streamline the contracting and construction process”? What best engineering practices and lessons learned provide this assurance? Does the use of the same contractor from Phase I, result in a reduced timeline for deployment?", "response": "Retaining the same contractor for McGrau Ford Phase I and II offers numerous advantages. The Company can streamline the contracting and construction processes by leveraging existing contract terms negotiated for Phase I, providing economies of scale for cost and labor, simplifying oversight by reducing interfaces and stakeholders and ensuring a consistent standard is maintained across the project site.\nThe use of a single EPC contractor for both phases of McGrau Ford will result in a more efficient and expediated project deployment versus utilization of two separate contractors.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 219905, "filing_description": "STF-PIA-15 Data Request Responses", "filing_date": "9/13/2024", "staff": "PIA", "doc_id": "STF-PIA-15-15", "is_protective_disclosure": "no", "question": "Please refer to Trade Secret Attachment A spreadsheet “Cost Inputs” tab. Please explain the calculation for “Fixed O&M” for the year 2046 for each project.", "response": "The Company escalates fixed O&M across the life of these projects. Additionally, in the final year of each project, the company adds an estimate of the cost of removal and remediation for each project site including this expense under the Fixed O&M line item. This is consistent with the approach used for the resources submitted for the 2023 IRP Update.  Please see the workpapers “TS SAM ('23) - 7.0.1 Hammond BESS Certification Final.xlsm,”  “TS SAM ('23) - 7.0.1 MF2 BESS Certification Final.xlsm,” “TS SAM ('23) - 7.0.1 Moody BESS Certification Final.xlsm,” and “TS SAM ('23) - 7.0.1 Robins BESS Certification Final.xlsm” provided concurrently with the Certification Application on August 16, 2024, for more information on the costs that produce this input value.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 219905, "filing_description": "STF-PIA-15 Data Request Responses", "filing_date": "9/13/2024", "staff": "PIA", "doc_id": "STF-PIA-15-16", "is_protective_disclosure": "yes", "question": "Please refer to Trade Secret Attachment A spreadsheet, “Summary” tab. Please explain how “WACC” was calculated. Identify capital structure components and their weights. Identify cost of equity and cost of debt. If these values are not consistent with capital structure and cost of equity approved by the Commission in the Company’s 2022 Rate Case order, provide an explanation for the difference.", "response": "The value in Attachment A on the “Summary” tab is based on the Company’s assumed marginal weighted average cost of capital (“WACC”). This differs from the 2022 Rate Case order as it relates to incremental expenditures.\nThe “Cost Inputs” tab in Attachment A uses a revenue requirement developed in the Company’s Standard Analysis Model (“SAM”), which has been provided to Commission Staff. The 2022 Rate Case order included a capital structure of 56% equity and 44% long term debt, with an approved ROE of 10.5%. The SAM data is an input to economic analysis. The REDACTED WACC in Attachment A for the Economic Analysis is based on a marginal cost of capital and is only used for discounting cash flows in Attachment A for the Economic Analysis. A description of each WACC is provided in the table below.  The SAM model used in the economic ranking analysis used the 10.5% ROE and capitalization ratios approved in the 2022 Rate Case order. However, for the cost of debt, the Company appropriately used a marginal cost of debt (REDACTED) consistent with the 2023 IRP Update filing. This marginal cost of debt is appropriate for incremental capital expenditures not currently included in rates and therefore not contemplated in the overall embedded cost of debt, as established in the 2022 Rate case order.   If the Company were to move forward with incremental capital investment(s), it would issue debt at the current, or marginal, market debt rates, not the overall embedded debt cost rates. The table below summarizes the two WACCs assumed.\n*Values reflect rounding\nThe Company also completed a sensitivity analysis of the economic ranking analysis Attachment A. Please see the TS STF-PIA-15-16 Attachment. This changes the WACC on the Summary tab to REDACTED.\nThe sensitivity analysis, using the alternative WACC, results in an economic ranking that is the same as what was filed.", "attachment_filenames": "STF-PIA-15-16; PD STF-PIA-15-16 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 219905, "filing_description": "STF-PIA-15 Data Request Responses", "filing_date": "9/13/2024", "staff": "PIA", "doc_id": "STF-PIA-15-2", "is_protective_disclosure": "no", "question": "Please refer to the Application for Certification, Figures 4-15; please provide a narrative description of each column/row in each figure.", "response": "The values included in Figures 4-15 were provided in accordance with Commission Rule 515-3-4-.07(3). Each figure offers a detailed breakdown of the costs associated with the respective Battery Energy Storage System (“BESS”) projects, including annual depreciation, financing costs, income taxes, fixed Operations and Maintenance (“O&M”), insurance, property taxes, and capital additions. The expenditure plans outline the costs over multiple years, while the Allowance for Funds Used During Construction (“AFUDC”), ad valorem, and sales tax estimates provide a detailed look at these specific costs.\nFigure 4, 7, 10, and 13:\nEstimated Annual Depreciation: This represents the annual book depreciation expense for each BESS resource.\nEstimated Annual Debt and Equity Financing Costs on Capital Investment: The annual costs associated with financing the capital investment through debt and equity.\nEstimated Annual Income Taxes on Capital Investment: The annual income tax expense related to the capital investment inclusive of applicable tax credits.\nEstimated Fixed O&M: Fixed O&M costs are the expenses required to keep the BESS operational over its life.\nEstimated Insurance: This is the estimated annual cost of insuring each BESS resource against certain risks.\nEstimated Property Taxes: This represents the annual property tax expenses forecasted for each BESS resource.\nEstimated Annual Capital Additions: These are the capital additions expected for the assumed augmentation cycles.\nFigure 5, 8, 11, and 14:\nThese figures show the different categories of expenditures for 2024-2026. Below each figure is a section with the heading “Descriptions of each category are provided below,” which offers a narrative description of each row. This section explains the nature of each expenditure category, such as planning, licensing, EPC contract costs, and more.\nFigure 6, 9, 12, and 15:\nA narrative description of these figures is provided in the preceding paragraph for each figure. These figures detail the AFUDC, ad valorem, and sales tax estimates. AFUDC represents the cost of financing the construction of the BESS before it is operational. Ad valorem taxes are property taxes, and sales tax estimates are provided for applicable items.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 219905, "filing_description": "STF-PIA-15 Data Request Responses", "filing_date": "9/13/2024", "staff": "PIA", "doc_id": "STF-PIA-15-3", "is_protective_disclosure": "no", "question": "The Application for Certification refers to a “Supply Chain RFP process” related to both the EPCs and BESAs. See, e.g. discussion of Robins major contracts on pg. 14.\nWas the Supply Chain RFP process the same process used for both the EPC and BESA?\nPlease provide a narrative description of the Supply Chain RFP process, including steps, schedule, entities involved, etc.\nProvide documentation (reports, analyses, presentations, etc.) summarizing the process and results of the RFP.", "response": "Yes.\nThe Company issued two Requests for Proposal (“RFPs”) in November 2023 to perspective vendors that could support upcoming battery storage projects. The first RFP focused on Battery Energy Storage System (“BESS”) suppliers, and the second RFP focused on engineering, procurement and construction (“EPC”) contractors. The Company considered several indicative qualitative and quantitative factors in evaluating each RFP response. The Company awarded contracts in the first and second quarters of 2024. Please see the attached files: TS STF-PIA-15-3 Attachments A, B, C, & D for further details.\nSee the following attachments, which represent internal documents prepared by the Company during the preliminary project assessment. Please note that several developments and changes have occurred since these documents were prepared.", "attachment_filenames": "STF-PIA-15-3; PD STF-PIA-15-3 Attachments A-D.docx", "confidentiality_files": ""}, {"filing_api_id": 219905, "filing_description": "STF-PIA-15 Data Request Responses", "filing_date": "9/13/2024", "staff": "PIA", "doc_id": "STF-PIA-15-4", "is_protective_disclosure": "no", "question": "Please refer to the Application for Certification, pg. 14.  Provide the Long-Term Commitments Agreement for each of the proposed BESS projects.", "response": "The attachments for the Long-Term Commitments Agreements (“LTCA”) are included as:", "attachment_filenames": "STF-PIA-15-4; PD STF-PIA-15-4 Attachments A-D.docx", "confidentiality_files": ""}, {"filing_api_id": 219905, "filing_description": "STF-PIA-15 Data Request Responses", "filing_date": "9/13/2024", "staff": "PIA", "doc_id": "STF-PIA-15-5", "is_protective_disclosure": "no", "question": "Regarding the McGrau Ford Phase II project.\nHow does this expansion impact the design of Phase I?\nHow is the Company allocating the common costs of the two projects between the Certification Applications for the two phases?\nHow does Phase II impact the interconnection requirements for the combined project?", "response": "Adding the McGrau Ford Phase II project to the same site as the McGrau Ford Phase I project did not impact the design of Phase I.\nCommon costs, such as the O&M building, water line, and land, are included within the McGrau Ford Phase I cost estimates. McGrau Ford Phase II covers any incremental costs associated with common facilities beyond what was originally planned for McGrau Phase I, such as the project level substation expansion.\nMcGrau Ford Phase I and Phase II will utilize the same Point of Interconnection (“POI”) and generation tie-line to the McGrau Ford Battery project level substation. McGrau Ford Phase II will be an incremental addition to the McGrau Ford Phase I project and will utilize the same interconnection.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 219905, "filing_description": "STF-PIA-15 Data Request Responses", "filing_date": "9/13/2024", "staff": "PIA", "doc_id": "STF-PIA-15-6", "is_protective_disclosure": "no", "question": "Please refer to the Application for Certification, pg. 4.  Please provide augmentation schedules and narrative summaries to ensure all proposed BESS facilities maintain adequate energy capacity over the 20-year life of the resources. Who is responsible for augmentation cost (e.g. Battery vendor or Georgia Power)? What is the estimated cost for augmentation for each project?", "response": "The BESS Certification Application included the requested augmentation schedules and cost estimates. Please see the Application in column 8- “Estimated Annual Capital Additions” of Figure 4 - Robins BESS Estimated Annual Costs on page 10, Figure 7- Moody BESS Estimated Annual Costs on page 18, Figure 10 – Hammond BESS Estimated Annual Costs on page 26, and Figure 13 – McGrau Ford Phase II BESS Estimated Annual Costs on page 34.\nRegarding energy capacity over time, please see Attachment A through Attachment D provided in the Company’s response to STF-PIA-15-4. These Long-Term Commitments Agreements (“LTCA”) with Tesla performance guarantee.  Under the LTCAs, Tesla has provided a guaranteed energy retention curve. The LTCA includes remedies if the energy capacity fades below performance guarantees. In addition, the Company plans to augment sites to mitigate impacts from normal degradation over the lifetime of the assets. The Company is responsible for these regular augmentations and associated costs over the 20-year life of the asset.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 219905, "filing_description": "STF-PIA-15 Data Request Responses", "filing_date": "9/13/2024", "staff": "PIA", "doc_id": "STF-PIA-15-7", "is_protective_disclosure": "no", "question": "Please refer to the Application for Certification, pg. 2, stating that “these projects save time and avoid additional capital investment otherwise required to construct interconnection facilities and transmission system upgrades to charge and discharge the BESS.”  Please reconcile this statement with the transmission analysis results presented in Trade Secret Attachment F.", "response": "The Company brought forth a 500 MW portfolio of BESS projects that required minimal network upgrades in years later than the commercial operation date and for only one BESS project, as discussed in Attachment F. Using existing transmission infrastructure, such as generator step-up (“GSU”) transformers, tie-lines and interconnection substations, will allow the Company to cost-effectively bring this portfolio of BESS projects online to meet capacity needs for the Winter of 2026/2027.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 219905, "filing_description": "STF-PIA-15 Data Request Responses", "filing_date": "9/13/2024", "staff": "PIA", "doc_id": "STF-PIA-15-8", "is_protective_disclosure": "no", "question": "Please refer to the Application for Certification, Figure 1 (pg. 4).\nPlease explain why there are differences in the site round-trip efficiency (“RTE”) for the different projects.\nPlease explain why the RTE values provided in TS Attachment B do not match the values provided in TS Attachment C.", "response": "The RTE variations are related to site specifics, such as variations in cabling and equipment losses that differ on a site-to-site basis.\nThe Company initiated Aurora simulations before the Battery Energy Supply Agreements (“BESA”) were finalized. The Company utilized a simplified RTE assumption in its Aurora simulations as a reasonable approximation, designated in the output data noted in “TS Attachment B – BESS Operational Data.xlsb” to the Application for Certification filed on August 16, 2024. Final contractual values for RTE ultimately reflect an improvement, providing greater customer benefits than the assumed amounts in the economic analysis and associated Aurora simulation.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 219905, "filing_description": "STF-PIA-15 Data Request Responses", "filing_date": "9/13/2024", "staff": "PIA", "doc_id": "STF-PIA-15-9", "is_protective_disclosure": "no", "question": "Please refer to Trade Secret Attachment A spreadsheet, ‘Energy Benefits tab. Please provide the workpapers calculating each of these values, including the source data from Aurora output files used for the calculations. Workpapers should be provided in electronic spreadsheet format with formulas intact.", "response": "Please see TS STF-PIA-15-9 Attachment for more information. The Aurora files were provided to PSC Staff concurrently with the certification filing on August 16, 2024.", "attachment_filenames": "STF-PIA-15-9; PD STF-PIA-15-9 Attachment.xlsx", "confidentiality_files": ""}];

// ── Staff filter state ──────────────────────────────────────────────────────
const STAFFS = ['DEA', 'GS', 'JKA', 'LA', 'PIA'];
const activeStaff = new Set(STAFFS);

function buildStaffButtons() {
  const container = document.getElementById('staffFilters');
  STAFFS.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'staff-btn active';
    btn.dataset.staff = s;
    btn.textContent = s;
    btn.addEventListener('click', () => toggleStaff(s, btn));
    container.appendChild(btn);
  });
}

function toggleStaff(staff, btn) {
  if (activeStaff.has(staff)) {
    if (activeStaff.size === 1) return; // keep at least one
    activeStaff.delete(staff);
    btn.classList.remove('active');
  } else {
    activeStaff.add(staff);
    btn.classList.add('active');
  }
  gridApi.onFilterChanged();
}

// ── Cell renderers ──────────────────────────────────────────────────────────
function staffRenderer(params) {
  return `<span class="badge badge-${params.value}">${params.value}</span>`;
}

function pdRenderer(params) {
  return params.value === 'yes' ? '<span class="pd-tag">PD</span>' : '';
}

function previewRenderer(params) {
  const text = (params.value || '').replace(/\s+/g, ' ').trim();
  return `<span class="preview">${escHtml(text)}</span>`;
}

function attachRenderer(params) {
  return params.value ? '<span class="clip-icon">📎</span>' : '';
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Column definitions ──────────────────────────────────────────────────────
const columnDefs = [
  {
    field: 'staff',
    headerName: 'Staff',
    width: 84,
    pinned: 'left',
    cellRenderer: staffRenderer,
    filter: false, // handled by our custom buttons
    sortable: true,
  },
  {
    field: 'doc_id',
    headerName: 'Doc ID',
    width: 148,
    pinned: 'left',
    sortable: true,
    filter: true,
  },
  {
    field: 'filing_date',
    headerName: 'Filed',
    width: 100,
    sortable: true,
    filter: true,
    comparator: (a, b) => {
      const parse = s => { const [m,d,y] = (s||'').split('/'); return new Date(+y, +m-1, +d); };
      return parse(a) - parse(b);
    },
  },
  {
    field: 'is_protective_disclosure',
    headerName: 'PD',
    width: 58,
    cellRenderer: pdRenderer,
    filter: true,
    sortable: false,
  },
  {
    field: 'question',
    headerName: 'Question',
    flex: 1,
    minWidth: 180,

    minWidth: 180,
    cellRenderer: previewRenderer,

    tooltipField: 'response',
  },
  {
    field: 'attachment_filenames',

// ── External filter (staff buttons) ────────────────────────────────────────
function isExternalFilterPresent() {
  return activeStaff.size < STAFFS.length;
}
function doesExternalFilterPass(node) {
  return activeStaff.has(node.data.staff);
}

// ── Grid init ───────────────────────────────────────────────────────────────
const gridOptions = {
  columnDefs,
  rowData: RAW_DATA,
  defaultColDef: { resizable: true, suppressMovable: false },
  rowSelection: 'single',
  suppressCellFocus: true,
  isExternalFilterPresent,
  doesExternalFilterPass,
  onRowClicked: e => showDetail(e.data),
  onFilterChanged: updateCount,
  onGridReady: updateCount,
  rowHeight: 108,
  headerHeight: 38,
  tooltipShowDelay: 400,
};

const gridApi = agGrid.createGrid(document.getElementById('myGrid'), gridOptions);

// ── Quick filter ────────────────────────────────────────────────────────────
document.getElementById('quickFilter').addEventListener('input', e => {
  gridApi.setGridOption('quickFilterText', e.target.value);
});

// ── Record count ────────────────────────────────────────────────────────────
function updateCount() {
  let shown = 0;
  gridApi.forEachNodeAfterFilter(() => shown++);
  document.getElementById('recordCount').textContent =
    shown === RAW_DATA.length ? `${RAW_DATA.length} responses` : `${shown} of ${RAW_DATA.length}`;
}

// ── Detail panel ────────────────────────────────────────────────────────────
let currentDocId = null;

function showDetail(row) {
  if (currentDocId === row.doc_id + row.zip_source) {
    closeDetail();
    return;
  }
  currentDocId = row.doc_id + row.zip_source;

  const attachments = (row.attachment_filenames || '')
    .split(';').map(s => s.trim()).filter(Boolean);

  const confFiles = (row.confidentiality_files || '')
    .split(';').map(s => s.trim()).filter(Boolean);

  const allAttach = [...attachments, ...confFiles];

  const panel = document.getElementById('detailPanel');
  const inner = document.getElementById('detailInner');

  inner.innerHTML = `
    <div class="detail-header">
      <div class="detail-meta">
        <div class="detail-doc-id">${escHtml(row.doc_id)}</div>
        <div class="detail-sub">
          <span class="badge badge-${row.staff}">${row.staff}</span>
          <span>${row.filing_date}</span>
          ${row.is_protective_disclosure === 'yes' ? '<span class="pd-tag">Protective Disclosure</span>' : ''}
        </div>
      </div>
      <button class="detail-close" onclick="closeDetail()" title="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="detail-body">
      <div class="qa-section">
        <div class="qa-label">Question</div>
        <div class="qa-text question">${escHtml(row.question || '—')}</div>
      </div>
      <div class="qa-section">
        <div class="qa-label">Response</div>
        <div class="qa-text response">${escHtml(row.response || '—')}</div>
      </div>
      ${allAttach.length ? `
      <div class="qa-section">
        <div class="qa-label">Attachments</div>
        <div class="attachments-list">
          ${allAttach.map(f => `
            <div class="attachment-item">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
              </svg>
              ${escHtml(f)}
            </div>`).join('')}
        </div>
      </div>` : ''}
    </div>
  `;

  panel.classList.add('open');
}

function closeDetail() {
  currentDocId = null;
  document.getElementById('detailPanel').classList.remove('open');
  gridApi.deselectAll();
}

// ── Keyboard close ──────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDetail();
});

buildStaffButtons();
</script>
</body>
</html>
