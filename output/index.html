: "STF-DEA-10-6", "is_protective_disclosure": "yes", "question": "Were any thermal loading concerns observed for the BESS projects when operating under charging mode?\nIf thermal loading issues were identified, please specify under which case scenarios and during what conditions these issues were observed.\nProvide details on the affected transmission lines, the magnitude of the loading issues, and the contingency conditions that led to these concerns.\nWere any mitigation strategies proposed or implemented to address these concerns during charging mode operations?", "response": "Yes, the McGrau Ford Phase II Battery Energy Storage System (“BESS”) created thermal loading constraints under its charging mode.\nPlease see table below: the charging overload was observed in the REDACTED \nstarting in year REDACTED.\nSee response to subpart a.\nNo mitigation strategies were proposed or implemented to address the concerns observed during the charging mode, other than rebuilding the constrained facilities due to the timing of the project.", "attachment_filenames": "STF-DEA-10-6", "confidentiality_files": ""}, {"filing_api_id": 219952, "filing_description": "STF-DEA-10 Data Request Responses", "filing_date": "9/16/2024", "staff": "DEA", "doc_id": "STF-DEA-10-7", "is_protective_disclosure": "yes", "question": "Were other solutions considered aside from rebuilding the REDACTED REDACTED REDACTED REDACTED lines, such as line monitoring devices or other Grid Enhancing Technologies (GETs) that could serve as an operational alternative to upgrading the lines?", "response": "No, rebuilding REDACTED REDACTED REDACTED REDACTED REDACTED transmission lines are viable solutions to resolve the constraints of the grid and can be constructed in the required timeframe. The Company made transmission project decisions based on technical and economic merit, as outlined in Technical Appendix Volume 3, Section A presented in Technical Appendix Volume 3 in the 2022 IRP in Docket No. 44160.", "attachment_filenames": "STF-DEA-10-7", "confidentiality_files": ""}, {"filing_api_id": 217020, "filing_description": "DKT 55378 STF-GS-1 Data Request Responses", "filing_date": "1/11/2024", "staff": "GS", "doc_id": "STF-GS-1-1", "is_protective_disclosure": "no", "question": "Has the Company evaluated the use of Battery Energy Storage Systems (BESS) to reduce, defer, or eliminate the need for the transmission upgrades identified in the Updated IRP? If so, please provide that evaluation and explain why BESS were not selected. If the Company has not conducted that evaluation, please explain why not.", "response": "Please refer to the Company’s response to STF-DEA-4-15.\nThe Company did not study Battery Energy Storage Systems (“BESS”) as options to reduce, defer, or eliminate the transmission upgrades identified in the 2023 IRP Update to facilitate the delivery of power from the proposed Plant Yates combustion turbines.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217020, "filing_description": "DKT 55378 STF-GS-1 Data Request Responses", "filing_date": "1/11/2024", "staff": "GS", "doc_id": "STF-GS-1-2", "is_protective_disclosure": "no", "question": "Please document the dispatch assumption (expressed as the dispatched capacity of a resource as a percent of its nameplate capacity) the Company uses for each generation type (including BESS and battery hybrid resources and their charge or discharge rate expressed as a percent of its nameplate capacity) in each of the case seasons (Summer Peak, Dusk Shoulder, Off-Peak, Daylight Shoulder) the Company ran for its Transmission Screening Analysis.", "response": "Please refer to the Trade Secret load flow files provided to Commission Staff on October 31, 2023.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217020, "filing_description": "DKT 55378 STF-GS-1 Data Request Responses", "filing_date": "1/11/2024", "staff": "GS", "doc_id": "STF-GS-1-3", "is_protective_disclosure": "no", "question": "In the context of the Transmission Screen Analysis or other planning or generator interconnection analysis, has the Company evaluated how alternate dispatch assumptions affect the need for transmission upgrades? If so, please provide that analysis. If not, please explain why the Company has not conducted that analysis.", "response": "Yes, the Company leveraged the use of generation redispatch and other applicable operating guides in evaluating transmission upgrades. Please refer to the Trade Secret load flow files provided to Commission Staff on October 31, 2023.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217020, "filing_description": "DKT 55378 STF-GS-1 Data Request Responses", "filing_date": "1/11/2024", "staff": "GS", "doc_id": "STF-GS-1-4", "is_protective_disclosure": "no", "question": "Please document, quantify, and explain any changes in the Available Transfer Capability across the transmission flowgate from the Yates substation to the Atlanta metro load center since the retirement of Plant Yates.", "response": "Please refer to Technical Appendix Volume 3 of the following Georgia Power Integrated Resource Plans to understand the changes to the transmission system since the retirement of Plant Yates Units 1-5.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217020, "filing_description": "DKT 55378 STF-GS-1 Data Request Responses", "filing_date": "1/11/2024", "staff": "GS", "doc_id": "STF-GS-1-5", "is_protective_disclosure": "no", "question": "Has the Company evaluated whether the upgrades identified to accommodate new generation in the Transmission Screening Analysis could be replaced with more cost-effective solutions if the Company simultaneously evaluated solutions to the need to accommodate new generation (as studied in the Transmission Screening Analysis) and the need to accommodate new loads (which the Company has indicated will be included in the January 2024 Supplement)? If so, please provide that analysis. If not, please explain why the Company has not conducted that analysis.", "response": "Please refer to the Transmission Planning study and project development processes outlined in Technical Appendix Volume 3 of the 2022 Georgia Power Integrated Resource Plan (“IRP”) (Docket No. 44160). The Company follows the transmission planning processes outlined in Volume 3 to ensure that projects are robust enough to handle various scenarios. Additional information will be provided in the Transmission Supplemental filing in January 2024 and with the 2023 Georgia Integrated Transmission System Ten Year Plan (2024 – 2033) that will be filed in February 2024.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217020, "filing_description": "DKT 55378 STF-GS-1 Data Request Responses", "filing_date": "1/11/2024", "staff": "GS", "doc_id": "STF-GS-1-6", "is_protective_disclosure": "no", "question": "Has the Company evaluated whether the transmission upgrades identified in the Transmission Screening Analysis will interfere with the ability to deploy higher voltage transmission on that right-of-way to meet future needs? If so, please provide that analysis. If not, please explain why the Company has not conducted that analysis.", "response": "No, the Company did not perform a direct evaluation of whether the identified transmission upgrades would impact further expansion of affected transmission rights-of-way. Please refer to the Transmission Planning study and project development processes outlined in Technical Appendix Volume 3 of the 2022 Georgia Power Integrated Resource Plan (“IRP”) (Docket No. 44160), which notes how projects are evaluated and developed. Due to the timing of the transmission constraints, the most appropriate projects were developed and should not impact further expansion of transmission right-of-way if needed.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217020, "filing_description": "DKT 55378 STF-GS-1 Data Request Responses", "filing_date": "1/11/2024", "staff": "GS", "doc_id": "STF-GS-1-7", "is_protective_disclosure": "no", "question": "Has the Company evaluated whether the transmission upgrades identified in the Transmission Screening Analysis could be reduced, deferred, or eliminated with the deployment of grid-enhancing technologies including dynamic line ratings, topology optimization, power flow control devices, and similar solutions?", "response": "Please refer to the Transmission Planning study and project development processes outlined in Technical Appendix Volume 3 of the 2022 Georgia Power Integrated Resource Plan (“IRP”) (Docket No. 44160) which notes how projects are evaluated and developed. Due to the timing of the transmission constraints, the most appropriate projects were developed. Additionally, please refer to the responses provided to STF-DEA-4-2 and STF-DEA-4-11.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217020, "filing_description": "DKT 55378 STF-GS-1 Data Request Responses", "filing_date": "1/11/2024", "staff": "GS", "doc_id": "STF-GS-1-8", "is_protective_disclosure": "no", "question": "As a follow-up to the STF-JKA-4-5 question about discussing non-firm, interruptible, or lower service quality options with new customers, has the Company evaluated demand response programs that would compensate those customers for curtailing their load, particularly during the generation or transmission system contingency events that triggered a need for upgrades in the Transmission Screening Analysis? If so, please discuss that evaluation. If not, please explain why the Company has not conducted that analysis.", "response": "The Company is proposing a new Curtailable Load program, which will compensate customers for curtailing load during periods of extreme supply and demand conditions. The customer payment will be directly linked to the capacity value provided by the potential demand reduction.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217020, "filing_description": "DKT 55378 STF-GS-1 Data Request Responses", "filing_date": "1/11/2024", "staff": "GS", "doc_id": "STF-GS-1-9", "is_protective_disclosure": "no", "question": "As a follow-up to the STF-JKA-4-5 question about evaluating non-firm, interruptible, or lower service quality options with new customers, has the Company spoken with new customers about an option for potential reductions in interconnection costs or rates from deploying customer-sited battery storage or demand response resources? If so, please describe those discussions. If not, please explain why the Company has not offered that option.", "response": "Yes, the Company makes potential customers aware of rate options and programs available to them, including the Real Time Pricing rate. The Company also has current demand response programs and is proposing three new DER and DR customer programs as part of this IRP Update to enable both new and existing customers to receive credit for providing system value from customer-sited resources.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217378, "filing_description": "DIT 55378 STF-GS-2 Data Request Responses", "filing_date": "2/8/2024", "staff": "GS", "doc_id": "STF-GS-2-1", "is_protective_disclosure": "no", "question": "Please confirm the below information requests.\nPlease confirm that the Company has requested Energy Resource Interconnection Service (ERIS) and not Network Resource Interconnection Service (NRIS) for the proposed combustion turbine additions at Plant Yates. (If needed, please see IC-1166, IC-1167, and IC-1168 on page 2 here: https://www.oasis.oati.com/woa/docs/SOCO/SOCOdocs/Active-Gen-IC-Requests.pdf)\nPlease confirm that ERIS is non-firm transmission service, in that generation using that type of service can be curtailed during periods of transmission system congestion.\nPlease confirm that on Georgia Power’s transmission system, congestion often occurs during periods of peak need.", "response": "The interconnection requests for IC-1166, IC-1167, and 1168 are ERIS.\nERIS is a type of interconnection service. Neither ERIS nor NRIS convey any delivery rights or grant any form of firm or non-firm transmission service. Firm transmission service will be separately obtained through the designation of the resource.\nPlease see the Company’s responses to STF-GS-1-6 and STF-DEA-8-1. Transmission constraints occur in all seasons. As such, the Company studies both peak and off-peak and will develop transmission solutions for all constraints identified in analyses (e.g., peak or off-peak). These solutions can range from operating guides to full projects.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217378, "filing_description": "DIT 55378 STF-GS-2 Data Request Responses", "filing_date": "2/8/2024", "staff": "GS", "doc_id": "STF-GS-2-2", "is_protective_disclosure": "no", "question": "Has the Company assessed how curtailment risk from the use of ERIS will limit the capacity contribution of the proposed Plant Yates CTs? If so, what did the Company find? If not, why not?", "response": "As noted in the Transmission Screen Analyses Overview in the Technical Appendix of the 2023 IRP Update filing, the Company plans to designate all 1,350 MW of proposed Plant Yates combustion turbines, and the facility will be limited to 600 MW of firm output until all identified transmission improvements are in-service by summer 2028. The requested energy resource interconnection service (“ERIS”) does not contribute to or increase the likelihood of transmission constraints or curtailments. Please refer to the Company’s response to STF-GS-2-1 part (b).", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217378, "filing_description": "DIT 55378 STF-GS-2 Data Request Responses", "filing_date": "2/8/2024", "staff": "GS", "doc_id": "STF-GS-2-3", "is_protective_disclosure": "no", "question": "Please reconcile the Company’s statement in the Transmission Screening Analyses that “the 750 MW Mississippi Power Company PPA can be accommodated along with the PPA for capacity and energy from the Santa Rosa combined cycle facility located in northwest Florida with no required transmission projects,” with the Company’s conclusions in the Southwest Quadrant Stability report (available at: https://www.oasis.oati.com/woa/docs/SOCO/SOCOdocs/SOCO-Southwest_Quadrant_Stability.pdf). In particular, given the report’s conclusions that southern Mississippi and northwest Florida are in the Southwest Quadrant, which is “a stability-limited region which constrains the total amount of generation that can be simultaneously delivered from the area. The level of constraint is impacted by on-line generation, load, and transmission topology in the area.” and that “Substantial, long lead-time transmission improvements may be required to accommodate additional transmission service sourced in this area,” does the Company believe the Mississippi Power and Santa Rosa PPAs will be deliverable capacity resources that are not at risk of curtailment during periods of peak need? Please provide any analysis the Company has conducted assessing that risk. If the Company has not conducted that analysis, please explain why.", "response": "The Santa Rosa Energy Facility and any Mississippi Power Company resources that are located in the Southwest Quadrant (“SWQ”) and supporting the 750 MW power purchase agreement (“PPA”) are existing resources that have been included in previous SWQ analysis. As such, their output has already been considered in the calculation of any limits. Additionally, the SWQ constraint occurs during light load and therefore does not pose a risk of curtailment during periods of peak system need.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217378, "filing_description": "DIT 55378 STF-GS-2 Data Request Responses", "filing_date": "2/8/2024", "staff": "GS", "doc_id": "STF-GS-2-4", "is_protective_disclosure": "no", "question": "For each scenario modeled using the Aurora planning software, provide the annual forecasted capacity factors and energy produced (in MWh), fuel consumption, and carbon emissions for the Mississippi Power PPA assets, the Santa Rosa PPA asset, and the Plant Yates combustion turbines.", "response": "Annual forecasted capacity factors, generation (MWh), fuel consumption (MMBtu), and carbon emissions (metric tons) for the Plant Yates combustion turbines and Santa Rosa power purchase agreement (“PPA”) are included within TS STF-GS-2-4 Attachment. The Mississippi Power PPA is not unit-specific, so operational data cannot be provided. This information is also contained within the Aurora workpapers and model data, which were provided to Commission Staff on or before October 30, 2023.", "attachment_filenames": "STF-GS-2-4; PD STF-GS-2-4 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217378, "filing_description": "DIT 55378 STF-GS-2 Data Request Responses", "filing_date": "2/8/2024", "staff": "GS", "doc_id": "STF-GS-2-5", "is_protective_disclosure": "no", "question": "Please provide the oil fuel consumption and cost forecasts for the Company.", "response": "Please see the Company’s responses to STF-JKA-2-12 and TS STF-JKA-2-12 Attachment D for the Company’s forecasted oil costs.\nOil consumption forecasts for specific units can be found in the Aurora output to the Resource Mix Study, provided to Commission Staff on or before October 30, 2023. This specific data can be pulled from the “ResourceYear” report using the column Fuel Usage for oil operation units. Additionally, oil consumption forecasts for generic combustion turbine (“CT”) additions are calculated at the System level by the Aurora model. No oil consumption calculations or forecasts at the Company level are developed for generic CT additions.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217378, "filing_description": "DIT 55378 STF-GS-2 Data Request Responses", "filing_date": "2/8/2024", "staff": "GS", "doc_id": "STF-GS-2-6", "is_protective_disclosure": "no", "question": "Please describe the methodological justification for providing multiple \"tranches\" for battery energy storage resources in the Aurora planning software, and any key data input assumptions that differentiate the various tranches.", "response": "As shown in JKA-2-11 Attachment F, average and incremental capacity values for battery resources drop as penetration increases. Because the number of tranches has a considerable impact on the computational time necessary to solve each planning scenario, the decision was made to limit the number of tranches. The tranche sizes and the number of incremental MW represented by each tranche are also detailed in JKA-2-11 Attachment F. The final tranche capacity values are roughly equal to the average 1 GW incremental capacity values that each tranche represents. There are no modeling or key data input assumption differences between the four battery tranches, besides that the reliable capacity of each tranche reflects the resulting effective load carrying capability (“ELCC”) value, as detailed in JKA-2-11 Attachment F.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217378, "filing_description": "DIT 55378 STF-GS-2 Data Request Responses", "filing_date": "2/8/2024", "staff": "GS", "doc_id": "STF-GS-2-7", "is_protective_disclosure": "no", "question": "Provide the historical hourly generation for each existing generation facility in the Southern Pool for the dates from December 21, 2022 to December 28, 2022.", "response": "Please see STF-GS-2-7 Attachment.", "attachment_filenames": "STF-GS-2-7; STF-GS-2-7 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217378, "filing_description": "DIT 55378 STF-GS-2 Data Request Responses", "filing_date": "2/8/2024", "staff": "GS", "doc_id": "STF-GS-2-8", "is_protective_disclosure": "no", "question": "Provide the historical hourly electric demand in the Southern Pool for the dates from December 21, 2022, to December 28, 2022.", "response": "Please see STF-GS-2-8 Attachment.", "attachment_filenames": "STF-GS-2-8; STF-GS-2-8 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217378, "filing_description": "DIT 55378 STF-GS-2 Data Request Responses", "filing_date": "2/8/2024", "staff": "GS", "doc_id": "STF-GS-2-9", "is_protective_disclosure": "no", "question": "Provide the Area Control Error values on a minute basis for the dates from December 21, 2022 to December 28, 2022 and provide a brief narrative explaining the primary drivers regarding any ACE value in excess of 500 MW deviation.", "response": "During the time frame of December 21, 2022 to December 28, 2022 there were four instances when the Southern Balancing Authority Area (“SBAA”) had Area Control Error (“ACE”) values in excess of 500 MW deviation. Those instances are denoted by red shading in STF-GS-2-9 Attachment, which provides the SBAA ACE values on a minute basis as requested. The days and times associated with those instances are as follows:\n12/23/2022 06:26:00 – 06:27:00,\n12/23/2022 23:15:00 – 23:20:00,\n12/24/2022 00:20:00 – 00:21:00, and\n12/24/2022 03:05:00 – 03:08:00.\nFor each instance, generating units within the SBAA that did not perform in the manner desired can be associated with the ACE deviations.", "attachment_filenames": "STF-GS-2-9; STF-GS-2-9 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-1", "is_protective_disclosure": "no", "question": "Please refer to the following statement on (or about) page 10: “Given the significance of the Company’s increased projected loads and corresponding capacity needs, Georgia Power cannot wait to conduct the All- Source RFP or wait until the 2025 IRP to address these needs.”  Please provide any analysis or documentation supporting this statement, including consideration of the actual or expected timing of load increases, the capacity available to the Company to serve the load and the length of time required to conduct an All Source RFP.  Please provide a table showing expected load requirements by month and the timelines for conducting an All Source RFP.", "response": "As shown in Figure 4 of the Main Document of the 2023 Integrated Resource Plan (“IRP”) Update, which was filed on October 27, 2023, without the capacity resources proposed in the 2023 IRP Update, Georgia Power has a capacity need as early as the winter of 2025/2026. The Company explained in the Main Document of the 2023 IRP Update that the Request for Proposal (“RFP”) process typically takes two to two and a half years from the selection of an independent evaluator (“IE”) to the certification of resources.\nAn RFP timeline is driven by the Commission’s RFP Rules, bid development, generation and transmission evaluation timing, whether the RFP is utilizing a refreshed bid process, contract execution, and Georgia law. Specifically, Commission Rule 515-3-4-.04(c)(3) states that the IE shall be retained in time to begin service at least six months prior to the expected issuance of the RFP. Following issuance of the RFP, approximately one and half months are allowed for bid development and submission. Upon receipt of bids, the Company begins the evaluation process. The time to complete bid evaluation can vary depending on whether the RFP utilizes a competitive tier and bid refresh process, as allowed by Commission Rules, and also the volume and technology types of bids. From RFP issuance to evaluation completion was approximately thirteen months in the Company’s 2022-2028 Capacity RFP but did not include transmission evaluation of Battery Energy Storage Solutions (“BESS”), which are expected to be part of future Capacity RFPs. Upon completion of bid evaluation, the Company pursues contract execution with the winning bidders. This took approximately two months in the 2022-2028 Capacity RFP. Finally, the Company must submit the recommended resources to the Commission for certification. In accordance with Georgia law, the certification process can take up to 180 days from submission of the certification application to a final order. Therefore, the typical RFP timeline from IE selection to certification of resources is approximately two to two and a half years. The timeline may vary for future RFPs depending on capacity procurement targets and the complexity of products sought as part of the RFP.\nFollowing certification of RFP resources, to the extent new-build resources were part of the recommended and certified resource portfolio, new generation resources must be constructed to achieve commercial operation before the Company’s capacity need year. As the Company’s RFI indicated minimal existing resources available, new-build resources will be the vast majority of future RFPs. Further, any transmission upgrades required by the new generation resource must be constructed, which can take substantial time given the current long lead times on the procurement and supply of transmission equipment.\nFollowing a typical RFP timeline of two to two and a half years, if an RFP process commenced now, certification would not be achieved until sometime in calendar year 2026, which is after the Company’s capacity need begins in the winter of 2025/2026, and does not account for the build time for any certified new resources regardless of resource type. Moreover, if the Company waited until the 2025 IRP to propose resources to meet capacity needs in the winter of 2025/2026 through the winter of 2027/2028, the commercial operation for new-build resources would be further delayed, and the Company would not be able to meet needs in the winter of 2026/2027. The development schedules for the Company’s proposed new-build resources are provided in the Technical Appendix to the 2023 IRP Update. See STF-JKA-2-2 Attachment B for the Company’s projected capacity needs based on the current development timelines for the proposed resources in the 2023 IRP Update.\nFor additional information regarding the timing and complexities of administering an RFP, please see the Company’s response to STF-JKA-4-2.\nPlease see TS STF-JKA-4-1 Attachment for the monthly load ramp up.", "attachment_filenames": "STF-JKA-4-1; PD STF-JKA-4-1 Attachment.xlsx; STF-JKA-4-11; STF-JKA-4-11 Attachment.xlsx; STF-JKA-4-13; PD STF-JKA-4-13 Attachments A-C.docx; STF-JKA-4-19; PD STF-JKA-4-19 Attachment.docx", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-10", "is_protective_disclosure": "no", "question": "Please refer to the paragraph on page 21, line 4, beginning with the statement: “The second driver, the decreased supply of electricity, is related to the limited amount of electric generation capacity available in the wholesale market.”\nPlease provide all documentation that the Company used to support that statement, in addition to the Company’s RFI referenced on page 22 of the testimony.\nPlease provide all workpapers the Company created associated with the RFI.  Provide those electronically, with all formulae intact.  For example, referring to the testimony on page 22, there were 44 submissions to the RFI.  Please provide any summary available such as a table the Company created containing bid details that identify each submission by provider, provide the bid prices and terms offered, and indicate the reason(s) why the Company determined they were not viable options.  If no table of this type, or a similar type was created, explain why not.\nProvide copies of all bids received in the RFI.\nSee the Company’s Supplemental Filing containing the review of the RFI. At pdf page 9, the Company noted there were 2 Qualifying Projects that were existing resources. At pdf page 11, the Company stated, “no existing resources were identified which could help meet the capacity needs being addressed in the Company’s 2023 IRP.”  Why couldn’t the 2 projects mentioned at pdf page 9 be acquired to help meet the capacity needs in the 2023 IRP?\nThe RFI Table 0-3-2 at pdf page 10 shows that 100 MW of capacity could be acquired for 2025, 1,110 in 2026, and 1,495 in 2027. Why didn’t the Company perform a comparison to compete those options against the Santa Rosa PPAs, Yates CTs, Mississippi PPA, 1,000 MW of Company developed, owned, and operated BESS, the DER option, or the new demand response tariff that the Company has proposed to acquire, build, or establish in this IRP?  If any analysis was performed please provide all workpapers and modeling analyses that were performed, electronically, with all formulae intact.", "response": "Based on the responses received to the Company’s Request for Information (“RFI”) issued in September 2023, there were no existing capacity resources available in the market to meet the need years addressed in this 2023 IRP Update. The Company’s RFI is located in Exhibit A of the RFI Summary that was filed as part of the Supplemental Filing made on December 4, 2023. Also, please reference the market activity referenced on page 15 of the 2023 IRP Update Main Document.\nPlease see the Company’s response to STF-JKA-2-24. In addition, the Request for Information conducted was not a Request for Proposals; therefore, the submissions were not bids and pricing was not required or provided by all respondents.\nPlease see the Company’s response to STF-JKA-2-24.\nThe two existing Qualifying Projects that submitted a response to the RFI are units that are (i) currently under contract with the Company and (ii) are subsequently not available during the need years addressed in this 2023 IRP Update.\nThe Company did not perform a detailed analysis on the potential projects identified in Table 2-3-2 in the RFI summary showing that 100 MW of capacity could be acquired for 2025, 1,110 in 2026, and 1,495 in 2027 because there was not adequate time to administer and conduct an RFP that provides for all bids to be properly evaluated, conduct transmission studies, and ultimately construct new assets or interconnection facilities to meet the capacity needs being addressed in the 2023 IRP Update.  In addition, if provided, pricing information was optional and non-binding for participants responding to the RFI and interconnection and construction plans are not known, any of which could significantly impact a potential project’s availability.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-11", "is_protective_disclosure": "no", "question": "Please refer to the following statement on page 25: “Consistent with Commission policy, the Company must maintain an appropriate balance between Company-owned resources and purchased power to ensure the reliability of the electric system and meet the energy needs of the customers it is obligated to serve.”\nDoes the Company agree the Commission could modify the policy in difficult situations such as this when substantial capacity needs exist which cannot be met quickly and sufficiently with Company-owned resources?  Please discuss how the policy might be modified to deal with such situations in the future.\nExplain whether the proposed MPC contract is consistent with this policy.  Is it the Company position that “Company-owned” means Georgia Power Company-owned, and whether “Southern Company capacity resources under contract to Georgia Power Company” may be considered equivalent to Company-owned capacity.\nSee page 30 of testimony, which states that the Company-owned resources would fall below 70% by the winter of 2026/2027 and decrease to approximately 56% by the winter of 2030/2031.  Please provide an analysis, electronically, with all formulae intact, showing all data such as the names of the Company resources, the MWs of the Company resources and the annual sum of all Company resources, and the name of the PPA resources, the MWs of the PPA resources, and the annual sum of all PPA resources, and the percent calculations the Company performed. Please provide this on an annual basis covering 2023 through 2045, or the last year that any modeling was performed in this IRP.\nDoes the proposed MPC contract count as part of the Company owned 70% or as part of the 30% PPAs?  If it counts as part of the PPA resources, please provide justification why Southern Company resources would be viewed as PPA resources for this policy consideration.\nDoes the Company agree that an important element of the decision to sign and seek approval of the MPC contract was the concern that MPC would retire some of its’ capacity absent the proposed sale to Georgia Power? Please explain.\nPlease explain why the policy of 70% ownership is critical to Georgia Power and explain whether the reasons today are the same as the reasons many years ago when the Commission first implemented this policy.\nExplain why Georgia Power attempts to require ownership of battery resources whereas other utilities allow battery resources to be acquired via PPAs.", "response": "The Commission has the authority to modify any Commission policy, including the policy on the appropriate balance between Company-owned resources and purchased power to ensure the reliability of the electric system and Georgia Power’s ability to meet the energy needs of the customers it is obligated to serve. However, the Company does not recommend the Commission modify its policy or the currently approved 70/30 ratio of Company-owned resources to purchased power. Georgia Power’s Direct Testimony highlights the potential challenges and risks associated with meeting the increased and earlier capacity need identified in the 2023 IRP Update, particularly related to the limited existing resource availability in the market, as exacerbated by the increased competition from other utilities. These challenges emphasize the importance of maintaining the minimum ownership percentage required by long-standing Commission policy to help ensure that the Company can reliably serve customers and that the Commission maintains sufficient oversight of the Company’s obligation to reliably serve customers.\nCompany-owned resources refer only to Georgia Power-owned resources and does not include affiliate-owned resources. Therefore, the Mississippi Power power purchase agreement (“PPA”) is appropriately considered as purchased power.\nPlease see the “Figure 6” worksheet in the “Figures 4, 5, 6, & 9 – Capacity Needs Data for B22, B23, and 2023 IRP Update.xlsx” file located in the “Main Document” folder of the “TS 2023 IRP Update Models and Workpapers,” which was previously provided to the Commission Staff on October 27, 2023, with the 2023 IRP Update filing. Note, the ownership percentages provided in Figure 6 of the 2023 IRP Update Main Document and referenced in Georgia Power’s Direct Testimony are calculated based on the assumption that capacity needs would be met exclusively with PPAs and do not include specific resources from the IRP Update resource plan. See rows 344-349 of STF-JKA-4-11 Attachment for owned and purchased capacity percentages incorporating the Company’s proposed resources from the 2023 IRP Update.\nThe Mississippi Power PPA is considered purchased power. Each Southern Company retail electric operating company (Georgia Power, Alabama Power, and Mississippi Power) owns and operates its own resources for the benefit of its respective customers, unless the unit is co-owned. Georgia Power has no ownership interest or operational control over the units supplying the Mississippi Power PPA. In fact, the Mississippi Power PPA is not unit specific and may be supplied by any resource in the Mississippi Power fleet. Nevertheless, in the absence of the Mississippi Power PPA, several Mississippi Power resources would be retired and removed from the Southern Company pool. The existence of the Mississippi Power PPA ensures that these resources will continue to be part of the Southern Company pool and that the power produced will be designated for service to Georgia Power’s customers. It is appropriate for the Mississippi Power PPA to be considered a PPA, not a Georgia Power-owned resource.\nAs discussed in the Company’s response to STF-JKA-2-20(a), Mississippi Power was ordered to retire approximately 950 MW of capacity by the end of 2027 or show with detailed evidence why continued operation of the resources is in the best interests of its customers. Therefore, Mississippi Power planned to retire some of that capacity by the end of 2023 and was actively marketing the remaining capacity to be sold outside of the Southern Company system. By purchasing 750 MW from Mississippi Power through this PPA, Georgia Power ensures that this resource not only remains in the Southern Company pool but also provides dedicated, reliable, market-priced capacity and energy to Georgia Power’s customers to meet its burgeoning short-term demand.\nConsistent with Commission policy established in 2001, the importance of the policy to maintain a minimum of 70% ownership is to help ensure that the Company can reliably serve customers and that the Commission maintains sufficient oversight of the Company’s obligation to reliably serve customers. The pace and volume of the capacity needs identified in the 2023 IRP Update cannot be met by market resources alone. As evidenced in the Company’s request for information (“RFI”), the capacity market is tight and there are limited existing resources available to meet the timing and volume of the Company’s needs. Therefore, in the absence of sufficient market resources,  the role of Company-owned resources is crucial to meeting customer needs on the system.\nAs stated in the 2023 IRP Update Main Document, Georgia Power is obligated to provide its customers with reliable electric service and, as such, cannot solely rely on existing or new market resources from independent power producers to provide the capacity needed to reliably serve its customers. The selection of market resources through the Commission’s competitive RFP process can benefit customers, and the Company continues to be supportive of this process. However, the market is neither obligated to serve the Company’s customers, nor is it positioned to fully address the accelerated timing and magnitude of the Company’s emerging capacity needs. To ensure Georgia Power can continue to reliably serve its customers in the face of increased and accelerated projected generation capacity needs, the Company must develop new resources in accordance with Commission Rules through RFP exceptions in the Commission Rules in addition to resources to be procured through the RFP process.\nWhile Georgia Power seeks approval of company-owned battery energy storage systems (“BESS”) in this IRP Update due to the timing necessary to address capacity needs as early as the winter of 2026/2027, the Company will also be seeking battery resources from the market through the upcoming request for proposals (“RFPs”) approved in the 2022 IRP: the All-Source RFP and the 500 MW energy storage system (“ESS”) RFP. These RFPs will present the market with opportunities to offer energy storage resources to Georgia Power via a PPA (selling energy and capacity to Georgia Power from a new or existing storage asset that remains third party owned), build transfer agreement (selling new energy storage assets proposed to be built by a third party and transferred to the Company upon completion), or asset purchase agreement (selling an existing storage asset to Georgia Power).", "attachment_filenames": "STF-JKA-4-11; STF-JKA-4-11 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-12", "is_protective_disclosure": "no", "question": "See page 26, line 26, which states, “The Company is well positioned to continue providing the resources and infrastructure required to power Georgia’s robust economy, including the capacity required to support continued economic development.” The Company also mentioned that it had to develop a forecasting model to capture uncertainties related to new large loads, and apparently that model determined that in this IRP, the Company will have to plan for 6600 MW between 2023 and 2030, whereas in the 2022 IRP, the Company only determined it would have to plan for less than 400 MW between that period (Page 8 of Testimony)\nWhat is the basis for the statement that the Company is “well positioned to continue providing the resources and infrastructure to power Georgia’s robust economy.”\nPlease define the limits to which the Company is well positioned to continue providing the resources. In other words, if the Company has understated the economic development load, how well positioned is the Company to provide resources to serve an even greater amount of load? Please identify a load level beyond which the Company would not be well positioned to continue providing the resources and identify the timing when problems would occur.\nGiven the Company’s statement of now having to plan for 6,600 MW, and previously the Company thought it would have to plan for less than 400 MW, please reconcile that information to the statement on page 9, line 25, which states, “Further, the magnitude of the projected capacity need in the winter of 2030/2031 has increased by 4,800 MW since the 2022 IRP.”  Please reconcile the 6,200 MW amount (6,600 – 400) and the 4,800 MW amount.", "response": "The basis for the statement that the Company is “well positioned to continue providing the resources and infrastructure to power Georgia’s robust economy” is provided in the remainder of the Company’s response to the question, “Can the Company support the rapid economic development and customer demand in Georgia?” on pages 26-27 of the Company’s Direct Testimony. In the response, the Company points to its well-established record of meeting the energy needs of its customers, the state’s constructive regulatory framework, the capacity resources approved in the 2019 and 2022 Integrated Resource Plans (“IRPs”), and the Company’s extensive planning and operational experience. With the support of the Commission, the Company is confident in its ability to continue to meet the needs of its customers and support the rapid economic development growth in Georgia. Together, the Company’s currently approved Requests for Proposals (“RFPs”) and the portfolio of resources proposed in the 2023 IRP Update are expected to meet customers’ capacity needs from now through 2031.\nThe Company proposed the Flex Capacity framework in the 2023 IRP Update in the event any subsequent updates to the 2023 IRP Update Load Forecast prior to the 2025 IRP result in a capacity need of 500 MW or greater prior to the winter of 2028/2029. If additional economic development load results in the Flex Capacity criteria being met, and the Flex Capacity framework is approved as proposed, the Company would: (i) identify new capacity resources to meet the increased capacity need, (ii) begin development activities for new-build resources or pursue power purchase agreements or acquisitions for market resources, if available, and (iii) seek expedited certification of such resources from the Commission. The Company is able to scale up development of new resources, but timing implications can occur if new large loads attempt to ramp up to full load faster than the Company can construct the necessary generation and transmission resources.\nFor the winter of 2028/2029 and beyond, the Company will meet capacity needs with the resources procured through 500 MW Energy Storage System (“ESS”) RFP and the All-Source RFP, which were approved in the 2022 IRP. The total capacity procurement for the All-Source RFP will adjust based on the Company’s latest projected capacity needs for 2029-2031 around the time a short list is selected and recommended for certification.\nThe values represent two different metrics and two different periods. The 6,200 MW value is a comparison of the projected load growth for one period (i.e., the winter of 2023/2024 to the winter of 2030/2031) from the 2022 IRP to the 2023 IRP Update. The 4,800 MW value is a comparison of the projected capacity need for one season (i.e., the winter of 2030/2031) from the 2022 IRP to the 2023 IRP Update. Capacity need consists of projected load, a target reserve margin, and projected capacity. In this instance, the capacity need difference is smaller than the projected load growth difference primarily due to a change in capacity resource assumptions in the 2023 IRP Update compared to the 2022 IRP. Specifically, for planning purposes, Plant Bowen Units 1-2 are assumed available through the end of 2035 in the 2023 IRP Update. Plant Bowen Units 1-2 were previously assumed to retire by the end of 2028 in the 2022 IRP. The units provide 1,538 MW of capacity.\nTo see additional details regarding projected loads and capacity needs between the 2022 IRP and the 2023 IRP Update and to reproduce the values used in the 2023 IRP Update Main Document and the Company’s Direct Testimony, see the “2022 IRP – Winter” and “2023 IRP Update – Winter” worksheets in the “Figures 4, 5, 6, & 9 - Capacity Needs Data for B22, B23, and 2023 IRP Update.xlsx” file within the “Main Document” folder of the “TS 2023 IRP Update Models and Workpapers,” which were previously provided to Commission Staff on October 27, 2023.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-13", "is_protective_disclosure": "no", "question": "Please refer to the following statement on (or about) page 27 of the testimony: “Further, the BESS projects approved in the 2019 IRP (Mossy Branch) and in 2022 (McGrau Ford) will provide valuable development and operational experience with this burgeoning technology.”\nDoes the Company agree that presently it has little or no operational experience with BESS projects?  Please explain.\nIf the Company agrees with the above statement in whole or in part, given lack of actual experience with BESS technology and limited operational history for these relatively new resources within the electric generation industry, how can the Company be confident that the requested BESS projects can provide reliable and economic solutions to the Company’s currently forecast capacity needs for the project lives assumed in its’ studies?\nPlease provide all documents relied upon by the Company used to evaluate the technical feasibility and long-term economic viability of BESS technology.  Please provide the information relied upon by the Company in determining the input data used in the economic evaluation of the BESS projects requested for approval in this proceeding.", "response": "No, the Company doesn’t agree that it has little or no operational experience with BESS projects. The Company’s operational and development experience with Battery Energy Storage System (“BESS”) has greatly benefited from the Commission’s foresight to approve the 80 MW BESS demonstration projects during the 2019 Integrated Resource Plan (“IRP”). The Company has spent the last four years proactively preparing for the integration of large-scale BESS onto Southern Company’s system. Automatic Generation Control (“AGC”), the system used to coordinate dispatch signals to the site, has been tested at Robins solar, and the learnings from that deployment will be included in AGC installation at Mossy Branch and future BESS projects. The algorithm that will optimize the dispatch of the BESS has been designed, configured, and will be installed into the Energy Management System (“EMS”) during commissioning of the Mossy Branch project. The Monitoring and Diagnostics (“M&D”) center has already pulled in the correct points for remotely monitoring Mossy Branch, and this will easily be duplicated with future BESS projects. In addition, following the 2019 IRP, an affiliate of the Company, Southern Power, has two large battery energy storage projects that operate on the California Independent System Operator (“CAISO”) transmission system where Southern Company has been gaining real-time operation and maintenance experience since 2021. Another affiliate, Mississippi Power, also has an operational BESS project that is Direct Current (“DC”) – coupled with solar and serves as a resiliency asset for the local community.\nThe Company is confident that the BESS will serve as a reliable and economical solution for the anticipated capacity needs. The rise of the electric vehicle (“EV”) industry has propelled advancements in stationary BESS. Batteries have become lighter, possess higher capacity, are cobalt-free, charge faster, and have longer cycle lives. Automotive demand for lithium-ion batteries increased by 65% to 550 GWh in 2022. This surge has led to billions in investment in EV and battery manufacturing, with many of these investments located in the state of Georgia.\nBESS technology is being demonstrated as a reliable generation option across the world. CAISO and Electric Reliability Council of Texas (“ERCOT”) have over 10.4 GW of BESS in operation with another 75 GW planned. The ease of installation of BESS, compared to alternative technologies will allow the technology to scale at an unprecedented pace.\nThe Company will utilize tier 1 suppliers for its BESS projects that have a proven track record and a portfolio of gigawatt hours of battery storage deployed. Initial performance testing of the battery will ensure the battery meets required performance standards. The system will be monitored 24/7 from the M&D center, which will be capable of detecting and alerting maintenance personnel to address any system abnormalities. Along with other preventive maintenance practices, this will ensure that the system maintains optimal reliability. Additionally, long-term guarantees for warranties, degradation and round-trip efficiency are available to ensure the system maintains performance over the 20-year life.\nWith the passing of the Inflation Reduction Act (“IRA”), and the significant advancement in battery technology, the economic and reliability proposition for BESS has never been greater for customers.\nThe Company has relied upon recent project experience, responses to a BESS supply Request for Information (“RFI”), and estimates from reputable Engineering, Procurement, and Construction (“EPC”) firms for technical and economic inputs. Please see TS STF-JKA-4-13 Attachment A, TS STF-JKA-4-13 Attachment B, and TS STF-JKA-4-13 Attachment C.", "attachment_filenames": "STF-JKA-4-13; PD STF-JKA-4-13 Attachments A-C.docx", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-14", "is_protective_disclosure": "no", "question": "Please refer to Bullet Point BESS on page 27 and the Commission’s Approval of BESS resources in the 2022 IRP.\nPlease provide a list of battery storage projects currently installed or being installed on the Georgia Power system, provide important details about the BESS projects such as when they were installed or will be installed, how they are or will be operated, and what operational experience has been gained so far, or is expected to be gained.\nAre the BESS resources the Company is requesting approval in this proceeding covered under the 500 MW of BESS approved in the 2022 IRP (See Paragraph 73 of the Order Adopting the Stipulation in the 2022 IRP, dated July 29, 2022)?  Or is the Company’s request in addition to the 500 MW that the Commission previously approved. If so, discuss whether the Company needs approval in this proceeding.\nReferring to the statement that “Georgia Power proposes to develop, own, and operate up to 1,000 MW of BESS and or BESS plus Solar at various sites” referenced on page 27 - is this amount in excess of the BESS resources currently in operation or under construction or planned and approved?  If so, please explain why the Company seeks such approval at this time.\nPlease provide a complete reconciliation of the Company’s request in this proceeding with the BESS resources already previously approved by the Commission, such as in the 2019 and 2022 IRPs.", "response": "A table of battery storage projects being installed on the Georgia Power system is provided below. The projects being installed will serve a variety of use-cases such as operating reserves, regulation, energy arbitrage, and solar shifting. Further, as a result of Company ownership, the Company can incorporate operational changes with these Battery Energy Storage Systems (“BESS”) as additional use cases are identified. The Company expects that all BESS will operate on Automatic Generation Control (“AGC”) and be optimized for the overall system. After Mossy Branch achieves commercial operation, it will operate in a testing phase to refine the AGC algorithm, which will be applied to future BESS.\nThe 500 MW of energy storage system (“ESS”) resources approved in the 2022 Integrated Resource Plan (“IRP”) was for a request for proposals (“RFP”) to the market and is not part of the 1,000 MW requested in the 2023 IRP Update.\nYes, the 1,000 MW of BESS are in excess of the BESS resources currently in operation, under construction, or planned and approved but the 1,000 MW includes Robins, Moody and 200 MW BESS plus 200 MW Solar listed in part a. The Company is seeking 1,000 MW in excess of what was previously approved because of the drastic changes in economic load growth from the conclusion of the 2022 IRP until now as detailed in the Company’s 2023 IRP Update. The 1,000 MW will be used to meet capacity needs, while the previous approvals of BESS were demonstration projects or projects to serve as operating reserves to support the continued addition of intermittent resources on the system.\nPlease see the chart below for a complete reconciliation of the Company’s request in this proceeding with the BESS resources already previously approved by the Commission, such as in the 2019 and 2022 IRPs.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-15", "is_protective_disclosure": "no", "question": "Please refer to Bullet Point Simply Cycle CT Resources on page 28.\nPlease explain the fuel choice(s) for these resources and how the Company modeled the fuel choices assumed at the time of the future winter peaks in the Generation Mix Aurora studies and its economic evaluation studies included with the filing.\nDoes the Company also assume and model the same fuel choices throughout future years, or is it the same as at the time of the winter peaks?\nDoes the Company agree that the CT resources reference on page 28 will provide less than 1,400 MW of capacity irrespective of fuel choice and potentially far less than 1,400 MW depending on the fuel used at the time of the expected winter peaks? Please explain.\nPlease provide a timeline showing the critical steps required to install the CTs by the expected in-service date.\nThe Company has always been hesitant in the past to assume a period of less than 5 to 7 years prior to COD to prepare for installation of CTs and CCs.  Please explain all factors associated with the Yates CTs that will allow the Company to accelerate this schedule to under 5 years.", "response": "Please see STF-JKA-2-22 for the fuel choices for Plant Yates Units 8-10. See STF-JKA-2-22 subpart (c) for more information on the economic analysis fuel assumptions. The proposed Plant Yates CTs were not explicitly modeled in the Resource Mix Study. Instead, the Company modeled generic CTs, which serve as a proxy for future simple cycle CTs such as Plant Yates CTs. Please see the Company’s response to STF-JKA-2-14 subpart (e) for more information on the generic CT assumptions.\nIn the Resource Mix Study, the Company models the same fuel choice for future generic CTs throughout the year in each year of the planning horizon. In the economic evaluation, the Company modeled Plant Yates Units 8-10 assuming oil dispatch costs for the winter months and assuming gas dispatch costs for the non-winter months in all years of the evaluation.\nPlease see STF-JKA-2-22 subpart (e).\nPlease refer to “Figure 2 – Estimated Project Schedule for Plant Yates Units 8-10” that was provided in the “Technical Information Supporting the Proposal to Develop up to 1,400 MW from Three Simple Cycle Combustion Turbines at Plant Yates” file in the Technical Appendix to the 2023 IRP Update.\nFactors that allow the Company to accelerate the schedule for Yates CTs to under 5 years include use of an advanced reservation agreement to provide for the procurement of long lead time equipment and services, utilization of previously performed diligence efforts, expedited permitting, and accelerated engineering, procurement, and construction.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-16", "is_protective_disclosure": "no", "question": "Please refer to the following statement on page 29 of the testimony: “Regarding the future of renewable energy, the renewable energy expansion plans developed for the 2023 IRP Update suggest the Company could economically add up to approximately 10,000 MW of new renewable resources by 2035, which is significantly more than the 6,000 MW projected in the 2022 IRP.”\nHas the increase of 4,000 MW resulted mainly from load increases, technology improvements or is it due to the tax benefits for BESS and Solar provided under the Inflation Reduction Act (as suggested on page 28 of the testimony.)\nHas the Company performed any Generation Mix studies that look at how the optimal expansion plan might change absent the IRA in future years?\nFor modeling in this IRP, what year did the Company assume that the IRA tax benefits would end, such that higher costs would have to be assumed for renewable resources in modeling?\n10,000 MW of solar in about 13 years amounts to an average of 769 MW of solar added to the system per year.  Please provide the amount of solar MWs that have been added to the Georgia Power System by year over the past 10 years. Please explain all factors that will allow the average the Company provides to accelerate to about 769 MW per year in the future.\nPlease explain why the Company believes the relatively new and somewhat unproven BESS technology is a viable option for providing reliable service in the face of the current situation of capacity shortage in the region and substantial new load growth.  Is the Company making too large of a bet on BESS technology, before it has even completed its’ small initial projects?\nWhat fallback plan does the Company have to meet significant load growth if it is unable to add the BESS and DER resources, and for that matter solar resources, indicated as part of the 2023 IRP, such that the Company can “continue providing the resources and infrastructure required to power Georgia’s robust economy?”", "response": "The increase in expected renewable additions by 2035 is primarily due to tax benefits for renewables as provided under the Inflation Reduction Act (“IRA”). The Company remains optimistic about the potential of the IRA to reduce the cost of new renewables for customers, as demonstrated in the Resource Mix Study. Additionally, the energy profiles for many of the new customers in Georgia Power’s system, such as data centers, have high load factors and require a substantial amount of generation where renewable resources are able to provide a low-cost option for additional energy.\nThe Company has not performed any Generation Mix studies that do not include the IRA for the optimal expansion plan in the 2023 Integrated Resource Plan (“IRP”) Update. However, the moderate gas $20 carbon (“MG20”), moderate gas $50 carbon (“MG50”), and emissions limit (“EL”) scenarios included in the Supplemental Filing on December 4, 2023, include various projected phase out dates for the IRA. The MG20 scenario has an assumed phase out date of 2045, and the MG50 and EL scenarios have an assumed phase out date of 2035.\nFor the moderate gas $0 carbon (“MG0”), low gas $0 carbon (“LG0”), and high gas $0 carbon (“HG0”) scenarios in the Resource Mix Study, the Company assumed that the IRA tax benefits would not phase out within the 30-year planning horizon. For the MG20 scenario, the Company assumed the IRA tax benefits would begin to phase out in 2045. For the MG50 and EL scenarios, the Company assumed the IRA tax benefits would begin to phase out in 2035.\nThe table below includes the historical annual solar additions by Georgia Power. The 10,000 MW of new renewable resources referenced in the 2023 IRP Main Document and the Direct Testimony is inclusive of both solar and wind additions.\nThe following factors will impact the speed in which Georgia Power can bring solar \tonline:\nEquipment Supply – A typical solar facility will require a robust supply chain for the following types of equipment (solar modules, inverters, medium voltage (“MV”) transformers, MV switchgear, high voltage (“HV”) breakers, HV transformers, etc.). Although the Company recognizes there is a growing constraint on high voltage equipment, the Company has multiple procurement methods to source this equipment, thus equipment supply is not seen as a hindrance in meeting the Company’s renewable expansion plans.\nLand – There remains significant availability of land in the state of Georgia therefore the Company does not see this as a limitation.\nTransmission – The Company continues to refine and develop necessary transmission improvements to facilitate additional load and generation growth through the annual Georgia Integrated Transmission System (“ITS”) Ten-Year Transmission Planning processes outlined in Technical Appendix Volume 3 of the 2022 Georgia Power IRP (Docket No. 44160). Concurrent to the annual transmission planning processes, the Company continues to refine and develop strategic transmission projects through the North Georgia Reliability & Resilience Plan, which focuses on the delivery of renewable resources to North Georgia. Additionally, the Company meets routinely with Commission Staff to review both the annual Georgia ITS Ten-Year Plan and North Georgia Plan, consistent with the Commission’s 2022 IRP Final Order.\nLabor – To achieve the Company’s renewable expansion plan will require a significant labor force. The Company does not see labor limiting the Company’s renewable deployment goals currently.\nCost Effectiveness – There have been significant cost pressures over the last 18 months, but the Company has seen prices returning to more economical levels. With passage of the IRA, the Company sees solar resources as a cost-effective asset.\nThere are approximately 11 gigawatt hours of BESS operating in the United Sates alone. With the passage of the IRA and the multi-year project development timeline for constructing and commissioning new resources, approving these BESS projects now will ensure they are operational to meet customers’ growing energy needs.\nThe Company would have to potentially seek existing market resources, if available, or new-build market resources, which could delay meeting significant load growth, if it were unable to add the proposed BESS and Distributed Energy Resources (“DER”) resources. Additional demand response programs are another potential option until an RFP could be run to help address needs. Renewable resources will continue to be added through the Commission’s RFP process. Renewable procurement plans beyond those approved in the 2022 IRP will be proposed in the 2025 IRP.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-17", "is_protective_disclosure": "no", "question": "Pleases explain the accounting assumptions made by the Company in modeling the revenue requirements impact of the IRA Investment Tax Credits (“ITC”) on BESS and Solar projects.  Please provide a specific example of the accounting method used in the revenue requirements calculation with and without the IRA ITC in the Company’s economic studies provided with the filing.", "response": "Please see the Company’s response to TS STF-JKA-2-19 subpart (f) for the assumptions made regarding the Investment Tax Credit (“ITC”) and Production Tax Credit (“PTC”). The Company didn’t model the revenue requirements without the Inflation Reduction Act (“IRA”) ITC in the economic studies provided.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-18", "is_protective_disclosure": "no", "question": "See page 32, which states that each of the proposed options has undergone a detailed economic ranking analysis as shown in the Technical Appendix to the IRP Update.  Has the Company provided detailed economic analyses of:\nup to 1,000 MW of Battery Energy Storage Systems at various sites (see pg. 7 of testimony, line 20).  If so, please provide all workpapers, electronically with all formulae intact. If not, explain why not.\nthe 2 new customer-sited distributed energy resource (“DER”) programs (see pg. 8 of testimony, line 4).  If so, please provide all workpapers, electronically with all formulae intact. If not, explain why not.\nthe new tariff-based demand response program (see pg. 8, line 6). If so, please provide all workpapers, electronically with all formulae intact. If not, explain why not.\nthe amended existing demand response program (see pg. 8, line 8). If so, please provide all workpapers, electronically with all formulae intact. If not, explain why not.", "response": "The Company has completed economic analyses for the proposed Robins, Moody, and the 200 MW Battery Energy Storage System (“BESS”) plus 200 MW solar projects. The Company has not completed economic analysis for the remaining capacity that would fully satisfy the 1,000 MW request. The Company anticipates that the costs and benefits of the remaining unidentified capacity will be consistent with Robins and Moody BESS resources if the Company can identify actionable locations with adequate transmission. Please see TS Technical Appendix TS Economic Analysis of Capacity workpapers provided on October 27, 2023.\nPlease see the Company’s response to STF-PIA-4-5.\nPlease see the Company’s response to STF-PIA-4-5.\nPlease see the Company’s response to STF-PIA-4-5 for information on why demand response was not included in the economic ranking analysis. Please see the Company’s response to STF-PIA-3-5 for the cost benefit analysis of the demand response program included in the 2023 IRP Update.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-19", "is_protective_disclosure": "no", "question": "Regarding the Mississippi Power and Santa Rosa capacity:\nSee page 32, at line 20 of the testimony. Please compare all of the costs (fixed, variable, fuel by cost component) of the Mississippi Power capacity that would have been “available for Georgia Power customers in times of need due to reserve sharing within the Southern Company pool” versus all of the costs of the Mississippi Power capacity that is being acquired via the PPA contract.\nSee page 33, at line 13, which discusses the plan for SWE to remarket the Mississippi Power capacity for years prior to the winter of 2025/2026.  Please provide the contract for the sale of the 500 MW and summarize the main terms of the contract, including identifying who the contract was sold to.\nGiven that the Mississippi Power capacity amounts to 750 MW, why wasn’t the counterparty that acquired the capacity for 2 years interested in the full 750 MW?\nPlease explain what steps SWE has taken to remarket the Mississippi capacity and identify the entities that SWE has already spoken with about the remaining capacity.\nSee page 35 at line 3, which discusses the plan for SWE to remarket the Santa Rosa capacity for years prior to the winter of 2025/2026.  Please explain what steps SWE has taken to remarket the Santa Rosa capacity and identify the entities that SWE has already spoken with about the sale.", "response": "There is no difference between the energy cost of the Mississippi Power Company (“MPC”) PPA and the cost of receiving energy from the Southern Company pool. The capacity price of the MPC PPA is reflective of the market and similar to the reserve sharing rate for 2024.  This contract guarantees that the capacity is available to serve Georgia Power customers throughout the term.\nPlease see TS STF-JKA-4-19 Attachment.\nThe counterparty has since requested additional capacity of 250 MW and negotiations are currently underway for the remainder of the 750 MW.\nSWE is currently in negotiations to sell the additional 250 MW for 2024 and 2025. Due to ongoing negotiations, the parties involved cannot be identified.\nOnce approved, SWE is prepared to include the Santa Rosa capacity during the period prior to winter of 2025/2026 in response to active Requests for Proposals. Due to potential negotiations, potential parties cannot be identified.", "attachment_filenames": "STF-JKA-4-19; PD STF-JKA-4-19 Attachment.docx", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-2", "is_protective_disclosure": "no", "question": "Please refer to the following statement on (or about) page 21: “Georgia Power’s RFP process typically takes two to two-and-a-half years to identify, evaluate, and select capacity resources.”  Can the Company identify any steps in this process which might be shortened (including but not limited to regulatory requirements) enabling a more nimble process in times of unexpected load growth?  Is this timely largely function of Commission rules or Company operations.", "response": "Georgia Power’s RFP process is a robust process that is governed by Commission Rule 515-3-4-.04. There are certain rules governing the RFP process that include but are not limited to (i) the six-month requirement between the RFP Service Date and the issuance of the RFP to the market, and (ii) that the draft of the RFP has to be shared with Commission Staff and Independent Evaluator at least one-hundred and twenty days prior to the planned issue date of the RFP. While these items are important to ensure that the market has sufficient time to develop their interest in the RFP, these are two items that the Company has identified that may be shorted in the process to expedite market offerings.\nRegarding Company operations of administering the RFP, it is imperative that bid evaluations are done correctly to ensure that the best bids are selected for the benefit of all customers. There are several factors that generally impact the time needed for bid evaluations, including but not limited to, the size of the procurement target, the differing technology types considered, agreement type, and the number of bids received. The bid evaluation generally includes initial economic evaluations of individual bids, individual interconnection evaluations on the applicable transmission and distribution systems and corresponding timing of building necessary transmission or distribution infrastructure, and conducting the portfolio analysis of competitive bids, each of which require appropriate diligence and are very difficult to complete on a condensed timeframe. Following resource selection and contract execution, the Company must file for certification of the awarded contracts, a process which can take anywhere from three to six months depending on the specifics of the RFP and Commission Staff’s agreement to expedite the certification process. In prior Georgia Power Renewable RFP certification proceedings, the Commission Staff has agreed to shorten the certification proceeding to less than six months, as appropriate. For reference, in the Company’s previous capacity RFP (2022-2028), the initial economic evaluations took approximately 5.5 months from the bid due date to the announcement of the competitive tier. In addition, detailed transmission evaluations required approximately 6 months from the competitive tier announcement to determine and announce a short list but did not include transmission evaluation of Battery Energy Storage Systems.\nFurther, in discussion with Commission Staff about the schedule for the Company’s upcoming All Source RFP, the Company has endeavored to shorten the RFP timeline as much and where possible to accommodate a quicker process but ensure the necessary evaluation of bids.\nThe RFP process is a robust process that takes time and diligence and must be done correctly each step of the way to ensure the reliability of meeting customer needs and to benefit all customers.", "attachment_filenames": "STF-JKA-4-20; STF-JKA-4-20 Attachment A.xlsx; STF-JKA-4-20 Attachment B.xlsx; STF-JKA-4-20 Attachment C.xlsx; STF-JKA-4-21; PD STF-JKA-4-21 Attachments A-B.docx; STF-JKA-4-24; STF-JKA-4-24 Attachment.xlsx; STF-JKA-4-28; PD STF-JKA-4-28 Attachment.xlsx; STF-JKA-4-29; PD STF-JKA-4-29 Attachment A.xlsx; PD STF-JKA-4-29 Attachment B.docx", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-20", "is_protective_disclosure": "yes", "question": "See page 36 of testimony, which discusses the Robins and Moody AFB BESS resource additions and the 200 MW BESS plus 200 MW solar project, and up to 1,000 MW of BESS.\nLine 8 states that without BESS, the winter planning capacity of the solar resources at the Robins and Moody AFB would be just 10% of nameplate, and with BESS it would be 100%.  Please provide all modeling analyses, reports, etc. performed to derive those values. Provide this electronically, with all formulae intact.\nPlease provide all economic analyses that were performed of these Robins and Moody AFB resources. Provide all modeling analyses, reports, etc. performed, electronically, with all formulae intact.\nPage 36 discusses the 200 MW BESS plus 200 MW solar project.   Please state where this project will be installed, and provide all modeling analyses, reports, etc. performed to derive the winter planning capacity value of those two resources. Provide this electronically, with all formulae intact.\nPlease provide all economic analyses that were performed of the 200 MW BESS plus 200 MW solar project. Provide all modeling analyses, reports, etc. performed, electronically, with all formulae intact.\nAt page 7 of testimony, the Company states it is requesting authority to develop, own, and operate up to 1,000 MW of BESS resources, and at page 37, line 5, the Company states that after identifying additional BESS resources, it will seek Commission approval and certification.  Please explain the difference between seeking authority now from the Commission to develop, own and operate BESS resources, and seeking Commission approval later for certification of those resources.", "response": "Robins and Moody solar resources are existing resources with a 10% winter Effective Load Carrying Capability (“ELCC”) based on their relatively early deployment and SERVM simulations summarized in STF-JKA-4-20 Attachment A. Adding a 4-Hour Battery Energy Storage System (“BESS”) with the same nominal capacity as the existing solar nominal capacity improves the overall aggregate facility (consisting of both the existing solar and incremental BESS components) to a 100% ELCC value, or 100% of the point of interconnection (“POI”) limit. The SERVM ELCC analysis for a combined solar and BESS facility is summarized in STF-JKA-4-20 Attachment B. See the response to STF-JKA-3-12 for further details on POI limitations.\nPlease see TS Economic Analysis Technical Appendix, TS Economic Analysis of Capacity Resources.xlsx workpaper, and SAM workpapers provided to Commission Staff on October 27, 2023.\nThis project will be installed in REDACTED REDACTED. New solar resources have a winter ELCC value of 5% via simulations performed within the SERVM reliability model and summarized in STF-JKA-4-20 Attachment C. Consistent with Robins and Moody, the overall aggregate facility (consisting of both the solar and incremental BESS components) will equate to 100% ELCC value, 100% of the POI limit at the facility, or 200 MW total facility capacity value as described in part (a).\nPlease see TS Economic Analysis Technical Appendix, TS Economic Analysis of Capacity Resources.xlsx workpaper, and SAM workpapers provided to Commission Staff on October 27, 2023.\nThe Company is seeking the authority to recover the costs associated with development activities on up to 1,000 MW of BESS to ensure it can meet the growing energy demands of its customers with resources to be online by the end of 2027. Approval of this for the 1,000 MW of BESS will allow the Company to begin the multi-year development process for these resources. As incremental BESS opportunities arise, the Company will bring specific project sites and costs to the Commission for review and certification.", "attachment_filenames": "STF-JKA-4-20; STF-JKA-4-20 Attachment A.xlsx; STF-JKA-4-20 Attachment B.xlsx; STF-JKA-4-20 Attachment C.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-21", "is_protective_disclosure": "no", "question": "Please provide any vendor literature available to the Company describing the advanced dual-fuel gas turbines with catalyst control systems that have been proposed by the Company to be built at Plant Yates.", "response": "The Company is providing available vendor literature with attachments (TS STF-JKA-4-21 Attachment A and TS STF-JKA-4-21 Attachment B). These attachments include information relating to the advanced dual fuel gas turbines with catalyst control systems proposed for Plant Yates. These attachments may be publicly available but are considered trade secret by the Company by virtue of these documents identifying the counterparty with whom the Company is actively negotiating the most favorable terms for the benefit of customers.", "attachment_filenames": "STF-JKA-4-21; PD STF-JKA-4-21 Attachments A-B.docx", "confidentiality_files": ""}, {"filing_api_id": 217009, "filing_description": "DKT 55378 STF-JKA-4 Data Request Responses", "filing_date": "1/10/2024", "staff": "JKA", "doc_id": "STF-JKA-4-22", "is_protective_disclosure": "no", "question": "On page 41 of the testimony the Company indicates that it has ceased negotia
