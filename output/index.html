ptimization selected sufficient BESS resources to provide for stable solar integration across all penetration levels. Given the favorable economics of BESS resources, it was unnecessary to alter the optimization in order to provide additional flexible resources.\nNeither operating reserves nor spinning reserves were adjusted dynamically with increasing penetration of expansion solar in Aurora. While it is likely that certain operating reserve levels will be adjusted with increased solar penetration, the cost of this is estimated and applied in the Solar Integration Cost. Applying the Solar Integration Cost and increasing operating reserve requirements in the model would effectively double count the impact of solar integration. The Company’s approach allows for the optimization to consider the cost of integration without the complexity of determining specific reserve levels for each generic solar selection.\nYes, the Company anticipates solar curtailments with increased penetrations. The Company allows Aurora to curtail solar as needed to optimize LTCE studies. Results of any Aurora solar curtailment can be found in the standard output ResourceHour table (if hourly reporting is selected) by comparing the Capability and Output_MWh columns for solar resources. The Company models new solar additions in a way Aurora can choose to curtail solar in any given hour, if needed. The solar cost is not altered if Aurora chooses to curtail since the price is fixed based on profile capability and independent of generation. Modeling new solar in this manner allows curtailment to become part of Aurora’s complete optimization algorithm rather than a model input. The Company reviewed the resulting solar selection to ensure the generic solar additions were economic even if such solar was curtailed during the optimization process.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-3", "is_protective_disclosure": "no", "question": "Refer to the file, “TS Economic Analysis of Capacity Resources” in the Technical Appendix folder “9 TS Economic Analysis.”\nPlease explain why the Company is not computing a capacity value for each resource in the Term Equalization tab. Is the Term Equalization tab intended to capture differences in the capacity value of the resources?  Please provide a detailed explanation of the purpose of the Term Equalization tab.\nIn the Annual Economics tabs, define in detail what “additional benefits” are assumed to included (for example see line 19). Are the same type(s) of “additional benefits” included for all of the resources evaluated in the “Annual Economics” Tab?\nDoes the Company utilize the “Other” category for benefits for any resources?  Please define the “Other” category and explain in what case scenarios “Other” would be used.", "response": "The Company’s analysis determines the total incremental cost of each capacity resource option to meet the identified capacity needs. Therefore, the results of the economic analysis itself represent the cost or value of capacity available to the Company at this point in time. This approach is consistent with the Company’s typical analysis used in evaluating bids submitted in a capacity request for proposal (“RFP”). As described in Section 3.5 of the Technical Appendix TS Economic Analysis of Capacity Resources, the cost of term equalization accounts for the varying useful lives and alternative capacity contributions in the economic analysis. Please see STF-JKA-1-4 for additional information.\nPlease see STF-JKA-1-5.\nThe Company did not use the “Other” category. That category was a placeholder category to use as the Company continued to acquire additional information about each option.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-30", "is_protective_disclosure": "no", "question": "Regarding the Company’s Wholesale to Retail offers that were made in the 2022 IRP\nPlease provide the status of such WTR resources, and whether the Company entered into contracts for the capacity that had been offered.\nThe Company did not offer Scherer 3 or Gaston 1-4 due to expected retirements, however it now appears these units may not be retired. Please explain if the Company is or will be offering these resources to retail? If not, please explain why not.", "response": "The approximately 65 MW of capacity from Plant Yates Units 6&7 remains under contract with EnergyUnited Electric Membership Corporation through the end of 2023, and the approximately 23 MW of capacity from Plant McManus and Plant Wilson oil-fired CTs remains under contract with Flint Electric Membership Corporation through the end of 2024. The Company executed a wholesale power purchase and sale agreement on April 27, 2022, which covers a portion of the offered capacity from the 2022 IRP. There are outstanding offers and options for wholesale deals to increase capacity, which would provide wholesale coverage for the remaining previously offered capacity. If these contracts are not executed, any additional available Company wholesale capacity could be offered to retail in a future IRP.\nAt this point, the Company has not made a final decision on a recommendation for the retirement dates for Plant Scherer Unit 3 or Plant Gaston Units 1-4, nor has any such request been made or ruled on by the Commission. The Company plans to address the retirement decisions for these units in the 2025 IRP. Once a decision for a recommendation has been made around retirement of the units, the Company will make a corresponding decision on offering the resources to retail.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-31", "is_protective_disclosure": "no", "question": "Please indicate if the Company would agree to allow all discovery in the 2022 IRP case (Docket No. 44160) to be used in this proceeding.  If so, please so state the Company’s agreement, if not please state why not.", "response": "No. Given the significant changes to the underlying assumptions since the 2022 IRP, the Company does not believe it would be appropriate to allow all the discovery in the 2022 IRP case to be used in this proceeding, as many of the responses likely will have changed or no longer be relevant. Also, due to the more limited scope of issues in this IRP Update, many items in the 2022 IRP are not relevant to the issues in this docket. If PIA Staff seeks to incorporate certain data request responses previously filed in the 2022 IRP, to the extent they remain relevant, or wishes to re-ask certain data requests to be provided with the most current and up to date information, the Company can accommodate Staff’s request for specified data requests.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-4", "is_protective_disclosure": "no", "question": "Regarding the development of the energy value derived in Aurora and computed for “TS Economic Analysis of Capacity Resources.”\nHow has the Company accounted for the “order” or stacking of resources in its economic analysis?\nDoes the Company agree that as resources are added to the mix, the incremental capacity and energy value likely decrease?  Please explain.", "response": "The Company’s economic analysis did not account for an order or ranking in the development of the energy value derived in Aurora. The results of the Company’s economic analysis determine the order or ranking. Order is not an input to the analysis.\nNo. Within the context of the 2023 IRP Update, the Company does not agree with the statement “that as resources are added to the mix, the incremental capacity and energy value likely decrease.” The primary driver behind the 2023 IRP Update is to add resources to meet unprecedented load growth. Adding resources would potentially decrease the value of capacity and energy if all other assumptions were held constant and no other changes occurred. However, that assumption would require ignoring the unprecedented load growth. Therefore, when considered holistically, it is foreseeable that the value of energy increases due to the increase in load growth even as additional resources are added. Likewise, as load growth continues, the relative supply of capacity in the region tightens while demand for capacity increases. This increase in demand and decrease in supply could increase the cost and value of capacity.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-5", "is_protective_disclosure": "yes", "question": "Refer to the Aurora files provided in the “TS Technical Appendix / 9 TS Economic Analysis” Folder.\nPlease provide a table of all Aurora runs that the Company used to track runs performed as part of the 2023 IRP study.  At a minimum include the name of each run, naming convention, purpose of the run, and study that run was used for.  Also, include any other information that the Company uses to keep track of the Aurora runs. Also, for each run made, provide the version of Aurora utilized for the various studies provided.\nIn the table in the prior question, please indicate which runs made that were for the GenMix study.  Version 14.2.1084?  Explain which runs were made for the TS Economic Analysis folder.\nFor each run made, please explain why the run logs do not contain information regarding the version of Aurora utilized.", "response": "Please see the table below for a list of Aurora runs the Company used for the Economic Analysis. The naming convention used for each runs identifies the resource name and budget cycle database.\nAll runs in the previous table were used for the TS Economic Analysis using Aurora version 14.2.1084. None were made for the Resource Mix Study.\nThe lack of version information in the study logs appears to be an unexpected outcome of the model. The Company contacted the vendor of Aurora, Energy Exemplar, and they are looking into this anomaly. However, all runs were performed with Aurora version 14.2.1084.", "attachment_filenames": "STF-JKA-2-5", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-6", "is_protective_disclosure": "yes", "question": "For the economic analysis of the specific resources, discussed in TS Economic Analysis of Capacity Resources,” describe how the Company derived the expansion plans for different cases and explain the process by which economic benefits were derived based on avoided cost profiles.  In other words, how did the Company determine the avoided cost profile to dispatch the contracts or units of interest against?\nHow did the Company derive the MG20, MG50, LG0, and HG0 avoided cost profiles?\nDid the Company’s derivation of the various fuel forecast avoided cost profiles reflect a variation in the capacity expansion plans?  For example, if the Company expects a MG50 fuel/carbon scenario, did the avoided cost profile reflect an MG50 expansion plan?\nPlease explain why the Company’s runs only reflect the avoided cost single zone for the resources evaluated. In other words, why didn’t the Company run a production cost study with all the units running in optimal dispatch to meet system load?\nDid the Company utilize the Aurora output for the original price or Native price when developing the avoided cost curve. What was assumed when developing the 2022 IRP Unit Retirement Study, and what was assumed for the 2023 IRP Update Capacity Resource Economic Analysis.  Explain the difference in logic, if any.\nFor the current IRP update, please provide the hourly avoided cost $/MWh profiles utilized for each asset evaluated, and the assumed hourly generation dispatch MWh for each asset across each fuel case performed. Please provide this in Excel format for all the years each asset evaluated.\nFrom the 2022 IRP, please provide the hourly avoided cost $/MWh profiles utilized for each retirement candidate, and the assumed hourly generation dispatch MWh for each asset across each fuel case performed. Please provide this in Excel format for all the years and each candidate retirement unit evaluated.", "response": "The Company executed Long-Term Capacity Expansion (“LTCE”) runs to develop the generic expansion plans for the Budget 2023 scenarios. The resulting expansion plans were then incorporated into Zonal runs to develop the avoided energy cost for each scenario.\nYes, a separate capacity expansion run and Zonal run was conducted for each scenario.  These scenario expansion plans were then incorporated into the Zonal run to create an avoided cost profile for each scenario.  In the stated example, the MG50 avoided cost profile reflected an MG50 expansion plan.\nThe Company’s Economic Analysis approach of using the avoided energy costs (or marginal energy costs) methodology is consistent with numerous cost /benefit analyses provided in prior Georgia Power Integrated Resource Plans (“IRPs”). This long-standing practice routinely demonstrates accurate results. The Company utilized Aurora’s zonal input price dispatch for this analysis. For the units under consideration, this method uses the same set of operating parameters and assumptions that would be required for an alternative form of production costs analysis with all units running. The main advantages of this method are increased flexibility, reduced run time, and less computing power requirements. Given the condensed timeframe to compile the 2023 IRP Update Economic Analysis, the Company maintained its past practice with numerous of its cost/benefit analyses using the avoided energy costs approach. This approach was used consistently across all resources for the ranking analysis.\nThe original prices were used to develop the avoided cost curves.  The 2022 IRP Unit Retirement Study (“URS”) study utilized LTCE runs on the Budget 2022 (“B2022”) databases and assumptions to establish the generic expansion plans. Once the expansion plans were established for each scenario, Zonal runs were then executed to develop the pre-retirement avoided energy costs used in the URS analyses.  The 2023 IRP Update Capacity Resource Economic study utilized LTCE runs on the Budget 2023 (“B2023”) databases and planning assumptions to establish the generic expansion plans. Once the expansion plans were established for each scenario, Zonal runs were then executed to develop the avoided energy costs used in the capacity resource economic evaluations. While there are differences due to assumptions differences, the logic for determining avoided cost curves is the same between the 2022 IRP URS and the 2023 IRP Update Capacity Resource Economic Analysis.\nEach asset was evaluated against the same stream of avoided energy costs. Hourly avoided cost streams for the five scenarios (MG0, MG20, MG50, LG0, HG0) have been placed in the excel file TS STF-JKA-2-6 Attachment A.xlsx. This information was provided to the Commission Staff on October 27th, 2023, in the Aurora input files titled “B2023_Final_GPC_IRP_update_Archive” and “B2023_Final_GPC_IRP_update_REDACTED_Archive.” Additionally, hourly generation MWh for Moody BESS, Robins BESS, and SantaRosa CC PPA have been placed in TS STF-JKA-2-6 Attachment A. The Company did not select the Aurora output option to produce hourly generation data for Plant Yates Units 8-10 and REDACTED REDACTED REDACTED. Therefore, hourly data is not available.  However, monthly and annual resource output data is available in each of the Aurora output files.\nPlease see STF-JKA-2-6 Attachment B for hourly avoided energy costs ($/MWh) from the 2022 IRP. The Company did not produce hourly generation MWh reports for the 2022 IRP.", "attachment_filenames": "STF-JKA-2-6; PD STF-JKA-2-6 Attachment A.xlsx; PD STF-JKA-2-6 Attachment B.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-7", "is_protective_disclosure": "no", "question": "Refer to the Aurora Files in the “TS Technical Appendix / 8 TS Resource Mix Study” folder for study MG0_P95\nConfirm that the RMT table in this study “B2024_GPC_Final_IRP_MG0_P95_v2” was derived based on the Aurora project file and study provided.\nDid the Company utilize this RMT and resource plan to derive the avoided cost profile(s) utilized in the economic evaluation?  Why or why not?\nIf the Company did not utilize this mix file, are the avoided cost profiles similar between the Aurora Mix Study (MGO_P95) and the Economic Evaluations for MG0?  Please explain.\nPlease provide the underlying Aurora optimization studies and RMT development, and production cost runs with hourly output, that derived the avoided cost profiles utilized in the economic analysis.", "response": "Yes, the Resource Modifier Table (“RMT”)   in this study “B2024_GPC_Final_IRP_MG0_P95_v2” was derived from the Aurora project file and study provided.\nAs mentioned in the Company’s response to STF-JKA-2-1, due to Budget 2023 (“B2023”) data being the only data available at the time of the analysis, the Company’s Economic Evaluation’s relied on B2023 data for production cost modeling while the Resource Mix Study used 2023 IRP Update assumptions. As such, the economic evaluations did not utilize the RMT and resource plan referenced in subpart (a).\nThe Company does not have an avoided cost output from the MG0_P95 Aurora Mix Study. Therefore, the Company cannot perform this comparison.\nThe avoided energy costs profiles in the economic analysis are in the Aurora files 9 TS Economic Analysis folder as previously provided on October 27, 2023. Please see TS STF-JKA-2-7 Attachment for the Aurora optimization studies RMT and production cost runs with hourly output.", "attachment_filenames": "STF-JKA-2-7; PD STF-JKA-2-7 Attachment.docx", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-8", "is_protective_disclosure": "no", "question": "Main document page 27 states: “In the 2022 IRP Final Order, the Commission approved the retirement and decertification of Plant Scherer Unit 3 and Plant Gaston Units 1-4 and Unit A by December 31, 2028. With continuing increases to the projected load forecast and capacity needs following 2028, the Company will likely evaluate extending the operation of certain units, particularly Plant Scherer Unit 3, beyond 2028.“\nConfirm that the Company has modeled Scherer 3 with retirement in 12/31/2028 in all of the Aurora runs modeled.\nDoes the Company believe the Aurora modeling reflects the Company’s most up-to-date understanding of its capacity plan?", "response": "Yes, Plant Scherer Unit 3 was modeled with a resource end date of 12/31/2028 in all of the Aurora runs.\nYes, the Company believes that its system modeling using Aurora for this 2023 IRP Update provides the most up-to-date understanding of its capacity plan at this time. As stated in the 2023 IRP Update Main Document, with the increase in capacity needs in 2028 and beyond, the Company is assuming Bowen Units 1-2 will retire at the end of 2035 for planning purposes. Also, while the current assumed retirement date for Scherer Unit 3 and Plant Gaston Units 1-4 and Unit A are at the end of 2028, the Company will likely evaluate extending operation of certain units beyond 2028 in the 2025 IRP.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-9", "is_protective_disclosure": "no", "question": "Provide all workpapers used to create the following graphs, figures, etc, with all formulae intact, and no pasted values.\nFigure 2 – MGO expansion plan.\nTable 1, Capital Structure and calculations.\nPg. 6, provide data showing how the current generating capacity mix was derived in Section 2.3.\nFigure 3, Existing and Planned Capacity Forecast.\nFigure 10, Normalized cost projections for Southeast wind, solar and BESS.", "response": "Figure 2 of the Resource Mix Study was provided in a workpaper as part of the Company’s initial submission in “TS Mix Study – Figure 2 & 12 System Cumulative Build by 2043 Workpaper.xlsx.”  The MW build values are directly from the “LTBuildReport” output from Aurora, which can be found in the Aurora output database provided with the Company’s initial filing on October 27, 2023.\nThe Markit forecasts and workpapers used to determine financial assumptions are provided in attachments tabulated below. These attachments are trade secret and are being provided in electronic format only.\nAdditional details on the current generating capacity mix described in Section 2.3 are provided in the workpapers to the Technical Appendix to the Resource Mix Study (see “2024 Capacity Mix.xlsx”).\nData for Figure 3, Existing and Planned Capacity Forecast, are provided in the workpapers to the Technical Appendix to the Resource Mix Study. For more details around individual unit capacity see “Georgia Power Territorial Base Case Load vs. Existing Capability Table.xlsx” provided as part of the Technical Appendix to the Resource Mix Study.\nThe normalized cost projections for Southeast wind, solar, and BESS shown in Figure 10 are based on the most recent Bloomberg New Energy Finance (“BNEF”) capital cost forecasts included in its publications, which are accessible to BNEF clients.", "attachment_filenames": "STF-JKA-2-9; PD STF-JKA-2-9 Attachment A.xlsx; PD STF-JKA-2-9 Attachment C.xlsx; PD STF-JKA-2-9 Attachment F.xlsx; PD STF-JKA-2-9 Attachment B.xlsx; PD STF-JKA-2-9 Attachment D.xlsx; PD STF-JKA-2-9 Attachment E.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217672, "filing_description": "DKT 55378 STF-JKA-8 PD", "filing_date": "2/22/2024", "staff": "JKA", "doc_id": "STF-JKA-8-04", "is_protective_disclosure": "yes", "question": "Please refer to Table 2 “Candidate Technology Assumptions” of the file named “TS Resource Mix Study.docx” and the file “TS SAM ('23) - 7.0.1 - BESS 4hr.xlsm”.\nCosts in the two files do not appear to be consistent. Table 2 shows that the overnight cost for a 4-hour BESS is REDACTED$/kW ($2023), and TS SAM ('23) - 7.0.1 - BESS 4hr.xlsm shows the pre-COD spend curve has a value of REDACTED REDACTED REDACTED REDACTED REDACTED. Please reconcile the two values.\nPlease provide all workpapers, electronically with all formulae intact, and no pasted-in values for all generic resources that were used to take the overnight costs on Table 2, and develop the spending curve inputs that are included in the SAM files for each respective generic resource. This should provide traceable workpapers between Table 2 overnight cost assumptions and the SAM workpapers spending curve inputs for each generic resource.", "response": "Differences in 4-hour BESS overnight cost between Table 2 of the Resource Mix Study and the SAM file workpaper are a result of expected nominal cost reductions in the cost of BESS technology between 2023 and 2029, the modeled COD used as the reference year for the SAM file. The cost escalation curves used to adjust the in-service year overnight cost can be found in TS JKA-8-4 Attachment, tab “Escalation Monthly.”\nThe spend curves listed in the SAM models are the product of multiple macro-based spreadsheets reading from a Microsoft Access database of inputs that are designed to simplify workflow. Providing these spreadsheets as is would likely further obfuscate the information that is requested. In lieu of this, a simplified version of the macro/database process to get from the overnight costs in Table 2 to the spend curves in the SAM files is provided in TS STF-JKA-8-4 Attachment. There will be minor discrepancies between the spend curves developed in this conceptual document and the spend curves pasted in SAM due to rounding in the calculation of total overnight costs in Table 2 as well as an additional breakout of land cost assumptions seen in the SAM file.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217672, "filing_description": "DKT 55378 STF-JKA-8 PD", "filing_date": "2/22/2024", "staff": "JKA", "doc_id": "STF-JKA-8-1", "is_protective_disclosure": "yes", "question": "Regarding the co-located BESS plus Solar project, the Company provided Large Generator Interconnection Agreements in responses to PIA 4-15 and JKA 2-19.\nPlease provide a summary of each agreement, and explain the differences between the agreements dated REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.\nWhat changes were made to the interconnection agreements as a result of Georgia Power being interested in entering into an agreement with the developer?\nPlease see the Agreements the Company provided in PIA 4-15 H (service agreement REDACTED), JKA 2-19 K (service agreement REDACTED) and Attachment L (service agreement REDACTED). Also, see the Company’s response to JKA 2-19 h, which states, “A site visit with the developer occurred on November 8 in support of developing an EPC agreement. On October 13, the developer executed an amendment with SCS Transmission to extend the commercial operation date into 2027, and on November 20, the developer executed a subsequent amendment to identify specific phases including this 200 MW BESS / 200 MW solar opportunity achieving commercial operation on November 1, 2026.”\nFor each service agreement and amendment, including any others besides those in PIA 4-15 H, JKA 2-19 K, and JKA 2-19 L, please explain the purpose of each service agreement and amendments.\nThere appears to be more going on at the site of the co-located 200 MW BESS plus 200 MW Solar project. Please clarify all interactions with the owner of that site that Georgia Power is engaged in beyond the 2002 BESS plus 200 MW solar project.\nMr. Grubb at the hearing talked about favoring projects that do not have transmission upgrade requirements other than the Yates project.  Will any of the potential projects at the 200 MW BESS plus 200 MW solar site require transmission upgrades.  If so, please explain what will be required  and explain how that is consistent with Mr. Grubb’s position regarding transmission upgrades.\nThe paragraph referenced above states a commercial operation date was extended into 2027.  Please clarify what project, and what it was extended from, and why it is being extended.\nThe paragraph referenced above references subsequent phases.  If not already explained, please explain in detail what each phase refers to and the status of each of the phases and provide the important characteristics of each phase.\nThe paragraph referenced above refers to a commercial operation on November 1, 2026, please clarify that in light of the statement about the Commercial operation date being extended into 2027.\nPlease explain how these additional agreements fit into the Company’s request for 1,000 MW BESS.", "response": "The initial agreements dated REDACTED and REDACTED REDACTED are standard FERC pro forma Large Generator Interconnection Agreements (“LGIA”) identifying a facility to be interconnected to the transmission system, the identified system and interconnection upgrades, construction sequencing, expected in-service dates, and many more elements. The REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED. The other two documents dated REDACTED and REDACTED are amendments to the REDACTED REDACTED LGIA. The REDACTED amendment changes the expected in-service date for the REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED . The REDACTED amendment REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED to the 200 MW of BESS and 200 MW of solar requested in this 2023 IRP Update.\nREDACTED requested the REDACTED amendment REDACTED REDACTED  pursuant to available mechanisms within the FERC Large Generator Interconnection process. For the REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED with this request in the 2023 IRP Update.\nPlease see response to part (a) above. STF-PIA-4-15 Attachment H is the REDACTED REDACTED LGIA, which added 200 MW of BESS to the originally proposed solar facility. STF-JKA-2-19 Attachment K is the REDACTED Amendment and STF-JKA-2-19 Attachment L is the REDACTED Amendment.\nPlease see the response in TS STF-PIA-4-15(i), which identifies the additional opportunities for the Company upon completion of the transaction. The Company is fully focused on developing the 200 MW BESS and 200 MW solar facility as proposed in the 2023 IRP Update and is not performing unrelated work to develop projects that would conflict with or impede the development of the 200 MW BESS and 200 MW solar facility.\nGeorgia Power Witness Grubb was correct in that 200 MW BESS and 200 MW solar facility will not require transmission upgrades. No transmission projects were attributed to the 200 MW BESS and 200 MW solar facility. Please refer to the Company’s responses to STF-JKA-1-3, STF-JKA-8-10, and STF-JKA-8-14.\nThe Large Generator Interconnection Agreement dated REDACTED REDACTED for the REDACTED REDACTED REDACTED, as developed by the developer, originally contemplated an REDACTED REDACTED. As mentioned in subpart (a) above, the COD was extended by 3 years to April 30, 2027 REDACTED REDACTED REDACTED.\nPlease see TS STF-JKA-2-19 Attachment L Appendix B for the Milestone Table that identifies the MW and expected COD for each phase. The project site can support multiple phases, but the development and timing of additional phases is undecided and is not contemplated or requested as part of this 2023 IRP Update.\nAs identified and communicated in the 2023 IRP Update, Georgia Power is working towards and intends for the 200 MW BESS and 200 MW solar facility to achieve commercial operation by November 1, 2026. The FERC prescribed processes allow an Interconnection Customer a one-time extension up to 3 years for the project COD, and REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED. The LGIA COD of 2027 for the full facility does not prevent Georgia Power from achieving an earlier COD like November 1, 2026, for Phase 1 as discussed in (a) above.\nThese agreements represent steps to achieve the interconnection of the 200 MW BESS and 200 MW solar facility, which will be a portion of the 1,000 MW BESS request in this case.", "attachment_filenames": "STF-JKA-8-10; STF-JKA-8-19; STF-JKA-8-14; STF-JKA-8-13; STF-JKA-8-1; STF-JKA-8-18", "confidentiality_files": ""}, {"filing_api_id": 217672, "filing_description": "DKT 55378 STF-JKA-8 PD", "filing_date": "2/22/2024", "staff": "JKA", "doc_id": "STF-JKA-8-10", "is_protective_disclosure": "yes", "question": "Transmission Filing\nPlease provide a detailed explanation of each transmission element that changed pricing since the $REDACTED million Yates estimate was first presented, and the reason the costs changed.\nProvide further explanation of the following statement, “Additionally, the REDACTED BESS & Solar facility will remain limited to 200 MW of firm output until summer 2029, when all prior planned transmission projects are in service.” Please provide details about what the prior planned transmission projects are.\nWhat are the transmission related costs required that will allow the BESS & Solar facility to increase in firm output by summer 2029.", "response": "The $19,334,000 cost reduction noted in the transmission supplemental filing was due to project advancement costs (REDACTED) being attributed to the Yates CTs instead of the full project cost (REDACTED).  The full project cost was initially attributed to Yates CTs prior to the finalization of the 2023 Georgia ITS Ten-Year Plan. The project in question is identified as required by REDACTED in the Ten-Year Plan and the Yates CTs advanced the project two years to REDACTED.\nPlease refer to the Company’s response to STF-JKA-1-3 part (e). The prior planned projects are those in the area that are timed for 2026 – 2029 and listed in the trade secret 2023 Ten-Year Plan Comparison spreadsheet provided in the Transmission Supplemental Filing. The notable projects are:\nGTC: Lagrange Primary – North Opelika 230kV (REDACTED)\nGTC: SR Robins – Transmission Improvements (REDACTED)\nGTC: Dresden 500kV Bus Expansion (REDACTED)\nGTC: Dresden – Talbot 500kV Line (REDACTED)\nNo additional transmission costs are assigned to the 200 MW of REDACTED BESS and Solar. See part (b).", "attachment_filenames": "STF-JKA-8-10", "confidentiality_files": ""}, {"filing_api_id": 217672, "filing_description": "DKT 55378 STF-JKA-8 PD", "filing_date": "2/22/2024", "staff": "JKA", "doc_id": "STF-JKA-8-11", "is_protective_disclosure": "no", "question": "Refer to the Company’s supplemental Resource Mix Study.  These studies appear to use a “B2024 LTCE” parameter set. The “B2024 LTCE” parameter set appears to use a different precision level (0.01) compared to the B2022 LTCE” that was used in the filed MG0 mix study (0.001).\nPlease explain the reason for this change between B2022 LTCE and B2024 LTCE\nPlease explain if there were any performance issues with the B2022 LTCE set and what issues were identified to cause the change.", "response": "Increased load forecasts and additional limitations on generic technology additions have continued to extend Aurora simulation run times. For the supplemental filing, long term expansion plan simulations took upwards of three days to complete, and the computers were sometimes running out of memory due to the long run times. To ensure that runs would complete in a reasonable amount of time and to optimize memory on machines, Energy Exemplar, the vendor for the Aurora model, recommended the Company adjust certain simulation settings. The recommended settings help to reduce run time and optimize computer memory, without sacrificing an economically optimal result. The table below includes a comparison of all simulation setting differences between the B2022 LTCE and B2024 LTCE parameter sets.\nThere were no performance issues identified within Aurora by using the B2022 LTCE parameter set. The B2022 LTCE parameter set uses higher study precision levels and combined with higher loads in the model and additional generic technology limitations, caused increased simulation run time and, therefore, memory issues on computers. As stated in part (a), Energy Exemplar recommended an adjustment to simulation settings to reduce run time and optimize computer memory without sacrificing an economically optimal result.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217672, "filing_description": "DKT 55378 STF-JKA-8 PD", "filing_date": "2/22/2024", "staff": "JKA", "doc_id": "STF-JKA-8-12", "is_protective_disclosure": "no", "question": "Refer to the Aurora Mix Study and the Change Set, “B2024 Final IRP – Reduce Optimization Noise”\nPlease explain what the “reduce optimization noise” supplemental parameter in this change set is trying to accomplish?\nPlease explain what necessitated the need for this change set.", "response": "The following “Reduce Optimization Noise” parameter description has been provided by the Aurora software developer and will be included in the help file for a future update.\nWhen True, this parameter activates logic throughout the simulation that seeks to minimize potential differences in the solution that might occur when the same project is run on different machines. The following steps are taken:\nThe constrained dispatch variable objective coefficients are adjusted slightly to reduce the likelihood of multiple optimal solutions existing.\nThe constrained dispatch solution is rounded before the results are passed to the commitment optimization logic.\nThe RHS values for daily limits in the commitment optimization originating from the constrained dispatch logic are rounded in the formulation.\nThe solution to the month-ahead storage scheduling logic is rounded and the simplex method is forced for the quadratic program solving for the storage schedule.\nThe mixed-integer program solving for the LT decisions uses a “Work Limit” instead of a “Time Limit” when solving with Gurobi.\nNote that because the solver can behave slightly differently on different hardware, it is not guaranteed that Aurora will give identical results on different machines. But it is much more likely when this parameter is set to True.\nDuring post-processing analysis work of previous Aurora runs, it was discovered that there were variations in capacity expansion plan results across different machines having only slightly different architectures. This change set is the solution proposed by Energy Exemplar to overcome the differences.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217672, "filing_description": "DKT 55378 STF-JKA-8 PD", "filing_date": "2/22/2024", "staff": "JKA", "doc_id": "STF-JKA-8-13", "is_protective_disclosure": "yes", "question": "Please refer to the files: “TS Economic Analysis of Capacity Resources.xlsx” and “TS TAS to Aurora B2024.docx”.\nIn the file, “TS Economic Analysis of Capacity Resources.xlsx” Tab: “Cost Inputs,” the NPV $/kW cost as derived by the sum of Inservice Capital + Maintenance Capital + Fixed O&M is REDACTED for the Robins BESS, and in the file “TS TAS to Aurora B2024.docx” the 4-Hour BESS generic resource cost is REDACTED REDACTED, as derived by the sum of B22:B24 on tab: “Battery 4” REDACTED REDACTED.  Explain why the revenue requirement costs are significantly higher for the Robins BESS project compared to the generic 4-hour BESS resource.\nIn the file “TS Economic Analysis of Capacity Resources.xlsx” Tab: “Cost Inputs,” the NPV $/kW cost as derived by the sum of Inservice Capital + Maintenance Capital + Fixed O&M is REDACTED for the Moody BESS, and in the file “TS TAS to Aurora B2024.docx” the 4-Hour BESS generic resource cost is REDACTED as derived by the sum of B22:B24 on tab: “Battery 4” REDACTED.  Explain why the revenue requirement costs are significantly higher for the Moody BESS project compared to the generic 4-hour BESS resource.\nIn the file “TS Economic Analysis of Capacity Resources.xlsx” Tab: “Cost Inputs,” the NPV $/kW cost as derived by the NPV sum of Inservice Capital + Maintenance Capital + Fixed O&M is REDACTED for the REDACTED BESS, and in the file “TS TAS to Aurora B2024.docx” the 4-Hour BESS generic resource cost is REDACTED as derived by the sum of B22:B24 on tab: “Battery 4” REDACTED REDACTED. Explain why the revenue requirement costs are significantly higher for the REDACTED BESS project compared to the generic 4-hour BESS resource.", "response": "The differences in revenue requirement costs between the Robins BESS project and the generic 4-hour BESS resource are primarily attributable to the difference in Investment Tax Credit (“ITC”) assumptions and the kilowatt (“kW”) basis used in the denominator of the net present value (“NPV”) $/kW values. The ITC assumptions for the Robins BESS project is modeled with a 30% ITC at installation, in contrast to the 40% ITC assumed for the generic BESS. This assumption markedly influences the overall NPV $/kW cost. kW Basis. The file ‘TS Economic Analysis of Capacity Resources.xlsx’ calculates the NPV $/kW using the Winter Capacity value. ‘TS TAS to Aurora B2024.docx’ calculates the NPV $/MW using the Winter Nameplate value. In addition to these items, other unique factors contribute to the variance that are generally attributable to the normal differences identified between generic resources and location specific actionable resources. As part of the Company’s annual planning process, the Company regularly revises its generic resource assumptions to ensure they align with the latest market data and intelligence. Upon conclusion of vendor and EPC agreements for the Robins BESS and as new market information becomes available, the Company will adjust and update its cost assessments with the most current projections.\nPlease refer to the response in part (b). The differences for Plant Moody are consistent with Robins.\nPlease refer to the response in part (b). The REDACTED project is also a build-transfer project with certain costs applicable to the unique nature of this proposed agreement. Please see the Company’s response to TS STF-DEA-9-9 for additional details on the indicative costs.", "attachment_filenames": "STF-JKA-8-13", "confidentiality_files": ""}, {"filing_api_id": 217672, "filing_description": "DKT 55378 STF-JKA-8 PD", "filing_date": "2/22/2024", "staff": "JKA", "doc_id": "STF-JKA-8-14", "is_protective_disclosure": "yes", "question": "See the Company’s latest supplemental filing on 1/19/23 regarding Transmission costs.\nThe filing states, “Additionally, the REDACTED BESS & Solar facility will remain limited to 200 MW of firm output until summer 2029, when all prior planned transmission projects are in service.”  Were any transmission upgrades included in the Economic Analysis the Company performed similar to the way transmission costs were included for Yates.  If not why not, if so please state where those costs may be found.", "response": "Please see the Company’s response to STF-JKA-1-3 and STF-JKA-8-10. The Transmission Supplemental Filing did not change the Company’s response to STF-JKA-1-3.", "attachment_filenames": "STF-JKA-8-14", "confidentiality_files": ""}, {"filing_api_id": 217672, "filing_description": "DKT 55378 STF-JKA-8 PD", "filing_date": "2/22/2024", "staff": "JKA", "doc_id": "STF-JKA-8-15", "is_protective_disclosure": "no", "question": "The document “TS Technical Information Supporting the Proposal to Develop 178 MW of BESS” states that “The BESS projects will incorporate LFP battery cell technology and power conversion systems provided by reputable manufacturers.” Please confirm if the LFP battery chemistry will be used on all of the BESS projects planned for in this proceeding. If not, please state which ones will not use it, and explain why not.", "response": "The Company plans to use LFP battery chemistry on all BESS projects planned for this proceeding.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217672, "filing_description": "DKT 55378 STF-JKA-8 PD", "filing_date": "2/22/2024", "staff": "JKA", "doc_id": "STF-JKA-8-16", "is_protective_disclosure": "no", "question": "Please confirm if battery factories currently in operation, or being built in Georgia are expected to supply the LFP batteries. If not, where does the Company expect that the batteries will be sourced from?", "response": "The Company has not finalized its battery procurement contracts and therefore is not certain from where the batteries will be sourced. For projects that have near-term Commercial Operation Dates (“COD”), it is unlikely that batteries for stationary storage projects will come from Georgia manufacturers. As the stationary storage battery market develops in Georgia, the Company will evaluate and consider options from operational Georgia manufacturing facilities on future projects.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217672, "filing_description": "DKT 55378 STF-JKA-8 PD", "filing_date": "2/22/2024", "staff": "JKA", "doc_id": "STF-JKA-8-17", "is_protective_disclosure": "no", "question": "Even though Batteries have 30% or even higher ITC’s available, won’t the prices of BESS components be driven up in the future, such as from supply chain issues and market demand for batteries?", "response": "No, the Company does not agree that the prices of Battery Energy Storage Systems (“BESS”) components will generally increase in the future. The responses received from the Company’s 2023 Request for Information (“RFI”) and Request for Proposals (“RFP”) have shown that BESS prices have declined since the highs seen in 2022 and that lead times are well under 18 months. The Company is currently in negotiations to secure competitive market pricing for the BESS.\nWhile market demand is expected to continue increasing for BESS components, global production capacity is also expected to continue to increase across the BESS value chain. The supply-side growth is expected to drive further economies of scale and drive prices down even as demand rises. The BESS industry is still relatively young, and significant gains in technological advancement and manufacturing improvements, which will put more downward pressure on prices, are still expected this decade. In 2023, the Company observed notable growth in investment in energy storage manufacturing projects that will drive these economies of scale and help secure supply chains. Further, industry analysts expect this trend to continue for years.\nBloombergNEF surveyed miners and metal traders in 2023 and found that respondents expect key battery metals to fall farther in 2024. Changes in battery pack prices are largely tied to the cost of such material inputs.1 The industry’s overall transition from using nickel manganese cobalt oxide (NMC) cells to lithium iron phosphate (LFP) cells in grid applications places long-term downward pressure on BESS because LFP relies on less expensive and less volatile raw materials, overall. In addition, new lithium deposits are being discovered and a nascent battery recycling industry is growing, both of which will be able to expand the raw material supply base, increase raw material competition, and further support the continuation of long-term price decline.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217672, "filing_description": "DKT 55378 STF-JKA-8 PD", "filing_date": "2/22/2024", "staff": "JKA", "doc_id": "STF-JKA-8-18", "is_protective_disclosure": "no", "question": "Please reference the Trade Secret Document XMLID2504932 named REDACTED REDACTED REDACTED that was provided in the workpapers and the technical appendix to Company’s Exhibit 9 from the original filing REDACTED REDACTED REDACTED REDACTED REDACTED.  Refer to figure 1 “Details & Estimated Performance Metrics for Robins & Moody BESS” in the technical document. The MW of the Robins project is 128 MW and the MW of the proposed project #1 is REDACTED MW. The capital cost for proposed project #1 is REDACTED, while the costs of the Robins project is REDACTED for the overnight cost. Please explain why the Company’s Robins project appears to be so much more expensive for a smaller project compared to proposed project #1 on a $/kW basis.", "response": "The overnight cost provided for the Robins BESS project was the Company’s estimate based on project specific market information. As stated by REDACTED on page 9 of Trade Secret Document “XMLID2504932,” the pricing details provided for these proposals are indictive in nature. The project sites described are not specific and are not inclusive of the site characteristics, interconnection costs, and the technical constraints that have the potential to influence pricing and site suitability. Also, site control had not yet been established and the information provided did not confirm whether the equipment would meet site-specific technical requirements of the Company.\nThe Company is firming up this pricing based on recent Battery Energy Storage System (“BESS”) equipment and Engineering, Procurement and Construction (“EPC”) Request for Proposals (“RFP”) and will return to the Commission with final pricing as part of the Company’s request for Commission certification of the Robins BESS project.", "attachment_filenames": "STF-JKA-8-18", "confidentiality_files": ""}, {"filing_api_id": 217672, "filing_description": "DKT 55378 STF-JKA-8 PD", "filing_date": "2/22/2024", "staff": "JKA", "doc_id": "STF-JKA-8-19", "is_protective_disclosure": "yes", "question": "Please provide a copy of the 2022 IRP (Docket 44160) responses to these data requests and supplement the answers if things have changed in the 2023 IRP Update.\nJKA 3-7\nJKA 4-9\nJKA 6-2\nJKA 6-3\nJKA 8-9\nTrade Secret Resource Mix Study (2022 IRP)\nTrade Secret Unit Retirement Study (URS) Report (2022 IRP)", "response": "2022 IRP STF-JKA 3-7\nQuestion:\nRegarding Wansley. It appears the Company does not have workpapers to support the 2022 retirement for Wansley 1 and 2, but does have workpapers supporting a 2025 retirement date. Please explain how the Company determined that retirement in 2022 was economic and appropriate.\nResponse:\nThe Unit Retirement Study (“URS”) is the evaluation of continuing to operate a unit versus a replacement unit. The URS filed in Technical Appendix Volume 2 supports the Company’s retirement recommendation. The result from the analysis indicates a retirement of Wansley would be an economic option for customers versus continuing to operate the units. To determine the appropriate or optimal timing of retirement for each unit, the Company considers upcoming environmental requirements, reliability impacts, and possible cost reduction strategies. Therefore, the retirement date reflects the earliest possible date to optimize savings while maintaining a reliable system. Please see Technical Appendix Volume 2 Unit Retirement Study Section 5 for “Retirement Timing Considerations” and Table 6 for the earliest reliable transmission retirement date.\n2022 IRP JKA-3-7 Update:\nPlease reference the Company’s response to STF-JKA-2-24, subpart (a) in this 2023 IRP Update, Docket No. 55378. The Company is evaluating Plant Wansley Units 1-2 as alternative assets to continue operating either on coal or to be converted into gas steam units. Neither of these options were feasible at the time of the filing due to reasons referenced in STF-JKA-2-24.\n2022 IRP STF-JKA-4-9\nQuestion:\nRefer to the Company’s Unit Retirement Study and the MG0 case Aurora runs for the LTCE, Zonal, and Asset Valuation Cases. (Aurora reference files: TS B2022 Final IRP MG0 URS Base LTCE_Archive.zip; TS B2022 Final IRP MG0 URS Base Zonal_Archive.zip; TS Output_B2022_Final IRP URS.xdb in the “Asset Evaluation Archives” folder)\na. Please explain why the Bowen plant annual output MWh drops significantly going from the System Operation Production Cost style analysis (LTCE, Zonal Runs) to the Avoided Cost methodology in the Asset Evaluation case (Bowen 1-4).\nb. Does the Company utilize different operating characteristics for the candidate retirement units between the various runs? Please explain.\nc. Does the Company’s Asset Evaluation study methodology account for system reliability constraints and operating reserve value of candidate units?\nd. Please confirm that the Company estimates that the Bowen units would not run at all in calendar years 2025-2027 and 2032-2036, according to the Asset Valuation dispatch underlying the Unit Retirement Study.\ne. Does the Company believe that if it kept the Bowen units online, in a zero carbon price future, that they would not be utilized, or would only operate uneconomically, for 3 consecutive years? Please explain.\nResponse:\na. The LTCE and Zonal runs are full production cost runs dispatched against load. In these runs, all constraints associated with meeting system requirements needed to serve load are considered, including minimum up and down time of resources, known local reliability constraints, operating reserve requirements, etc. Given the large minimum up and down times and startup time requirements for coal plants along with other system constraints, they generally remain online for extended periods in the zonal analysis as they are not flexible enough to only operate during the period they are needed, often resulting in a net cost. In the Asset Valuation runs, the units are dispatched against a fixed energy price stream only. The Asset Valuation runs maximize net energy benefit for a generating unit assuming a fixed energy price to determine the energy benefit or value of the existing unit and replacement unit in the same environment. In these runs, Plant Bowen does not run when its dispatch cost is greater than the marginal energy price over a commitment period equal to or greater than its minimum up time. This difference results in the Bowen plant annual output being greater in the LTCE and Zonal runs than in the Asset Valuation runs.\nb. No, the Company does not utilize different operating characteristics for the candidate retirement units between the various runs.\nc. No, the Asset Valuation runs themselves do not include system reliability constraints such as operating reserves. However, the Pre-Retirement Avoided Energy Costs (“PAEC”) thaare used in the Asset Valuation runs are a product of the Zonal runs that do account for system reliability constraints and operating reserve considerations.\nd. The Company estimates that, in the Asset Valuation study based on its dispatch against PAEC, the Bowen units do not show economic unit operations in 2025-2027 and 2032-2036 when considering the individual unit economics apart from system needs.\ne. The Company believes it is likely that the Bowen plant would run in a zero-carbon price future if the plant were kept online. As stated above regarding LTCE and Zonal runs, which are full production cost runs and more closely resemble how units would be committed and operated for system needs, it is anticipated that Bowen would be needed either for system economic or reliability needs. See TS STF-4-9 Attachment for additional information from the Aurora Zonal run.\n2022 IRP JKA-4-9 update:\nThe Company performed new Aurora runs for the mid-cycle IRP Update supporting the Resource Mix Study and the projects submitted in the Economic Analysis. Please reference the Aurora model files provided to Commission Staff on October 30, 2023. The updated results did not include Plant Bowen Units 1-4. Unit Retirement Studies for Bowen 1-4 will be updated during the 2025 IRP.\nSTF-JKA-6-2\nQuestion:\nRefer to the Main IRP Document at page 1-14, at Item 20, which indicates the Company is seeking approval “for planning purposes” of the Company’s long-term plan to own and operate 1,000 MW of ESS by 2030.\na. Please explain if approval of a resource for “planning purposes” means the same thing as approval of a resource to begin construction. Please explain the difference. Does the Company believe that if the Commission approves the 1,000 MWs of BESS in this IRP that it has the authority to construct that 1,000 MW of BESS capacity? Explain in detail what authority the Company is seeking.\nb. What economic analysis did the Company conduct that determined 1,000 MW is appropriate to add? Please provide the analyses electronically, with all formulae intact.\nc. At page 1-9 of the Main Document, the Company refers to Chapter 5 of that same document as providing support for “the required ESS need”. Chapter 5 explains the Company’s Renewable Integration Study, which found that the capacity equivalence of solar increases if BESS is added with solar. Please explain how the findings from this reliability analysis translates into an economic analysis and should justify Commission approval of 1,000 MWs of battery storage in this IRP.\nd. What parts of the state does the Company believe the 1,000 MW of BESS will be located?\ne. Have any transmission studies been performed regarding the 1,000 MW of BESS?\nResponse:\na. The Company is seeking approval for the authority to procure 1,000 MW of ESS resources for ownership using a competitive EPC turnkey RFP. As stated in the Energy Storage Procurement Action plan, the Company will return to the Commission for approval and certification of the EPC turnkey RFP results prior to construction. The Company is requesting approval to move forward with the results from the Renewable Integration Study for resource planning and cost benefit analysis of these Company-owned storage resources. The Company will plan on and use the results of the Renewable Integration Study to evaluate the cost-effectiveness of ESS bids from the EPC turnkey RFP while seeking to add 1,000 MW of ESS.\nb. The Renewable Integration Study establishes an economic benefit to integrating renewable resources when flexible resources such as BESS are available to the electric system equivalent to approximately 15% of the solar resource penetration. The Company will\nevaluate the results of the EPC turnkey RFP to determine cost-effectiveness for certification of the 1,000 MW.\nc. The Renewable Integration Study does not directly evaluate the capacity equivalence of solar resources. Instead, the study determines the cost to mitigate potential balancing violations through the use of operating reserves, specifically those with instantaneous load following capability. The analysis shows that this mitigation cost is significantly reduced by the presence of flexible resources in the energy system equivalent to approximately 15% of the solar resource penetration. This reduced mitigation cost is part of the economic analysis provided in the Battery Storage Cost-Benefit Analysis.\nd. Of the 1,000 MW of Company-owned BESS, the Company plans to locate 265 MW at McGrau Ford Battery Facility in North Georgia. The Company is also conducting a state-wide land potential study to identify other possible locations in accordance with the Company’s BESS procurement action plan laid out in Section 13.4 of the Georgia Power 2022 IRP.\ne. The Company has completed transmission interconnection studies for its proposed McGrau Ford Battery Facility. Please see TS STF-JKA-6-2 Attachment. Additional transmission studies will be performed as suitable sites are identified and in accordance with the Company’s BESS procurement action plan laid out in Section 13.4 of the Georgia Power 2022 IRP.\nand (d) Update for 2022 IRP STF-JKA-6-2 & JKA-6-3:\nThe 2022 IRP Final Order approved the McGrau Ford BESS and an additional 500 MW of additional BESS to be procured via a competitive RFP process (“ESS RFP”). Please see the Company’s response toSTF-JKA-3-16 to see how these resources have been modeled in the 2023 IRP Update Aurora database. See also the Company’s response to STF-JKA-4-11(g) for additional commentary regarding the 500MW ESS RFP. Please see the Company’s response to STF-JKA-4-14(b) regarding how the 500 MW reconciles to the 2023 IRP Update requests. \n\nMossy Branch, Ft. Stewart, and the distributed interconnected facilities were approved as demonstration projects in the 2019 IRP Final Order, each of which are in different stages of development.\nSTF-JKA-6-3\nQuestion:\nRegarding the 1,000 of BESS resources the Company is seeking approval for.\na. Please confirm that the Company only has 347 MW of BESS projects in various stages of development at this time. (65 MW Mossy Creek, 13 MW Ft. Stewart, 2 MW distribution interconnected, and 265 MW McGrau Ford).\nb. What other ESS is the Company considering in addition to BESS?\nc. Does the Company expect the additional 653MW to be identified in future RFP processes as PPAs or self-build?\nd. What is the total lead time included planning, regulatory approvals, and constructing/testing for new BESS resources?\nResponse:\na. The Company has 345 MW of BESS under development at this time (65 MW Mossy Branch, 13 MW Ft. Stewart, 2 MW distribution interconnected, and 265 MW McGrau Ford). The Company is also conducting a state-wide, land potential study to identify other possible locations in accordance with the Company’s BESS procurement action plan laid out in Section 13.4 of the Georgia Power 2022 IRP. Specific sites or capacity sizes have not been identified at this time.\nb. In regard to the 1,000 MW of ESS resources the Company is seeking approval for, the Company has identified lithium-ion battery energy storage as a cost-effective storage solution. However, the Company continues to investigate other storage technologies and will consider those solutions for the 1,000 MW of ESS if they meet the Company’s requirements.\nc. The Company expects the remaining 655 MW to be identified as self-build ESS to be developed, owned, and operated by Georgia Power. Commensurate with Chapter 13 of the Georgia Power 2022 IRP, the Company believes the establishment of an appropriate level of Company-owned storage resources provides a mechanism to advance the growth of renewable resources in Georgia, while ensuring the Company can continue to serve its customers reliably.\nd. The anticipated total lead time for a standalone BESS is 4 to 5 years. This timeframe includes siting activities, interconnection studies, project development, regulatory approvals, and construction/testing. It should be noted that the quoted project lead time is subject to change based on factors including, project size, project complexity, market\nconditions, supply chain constraints, and other factors that could conceivably impact projects of this nature.\nSTF-JKA-8-9\nQuestion:\nSee Page 17 of the Unit Retirement Study report, which compares capital cost requirements by retirement units:\nProvide workpapers that led to the determination of these capital costs under the Capital without Retirement scenario, and the Capital with Retirement scenario in the continue to operate case versus the retirement case.\nFor Bowen 1-2 explain the projects that must be performed that lead to such significant costs in 2023, 2024, 2026, and 2027 in the continue to operate case versus the retirement case.\nFor Gaston 1-4 explain the projects that must be performed that lead to such significant costs in 2025, 2026, 2027, and 2028 in the continue to operate case versus the retirement case.\nFor Scherer 3 explain the projects that must be performed that lead to such significant costs in 2023 and 2025 in the continue to operate case versus the retirement case.\nResponse:\nPlease see TS STF-JKA-8-9 Attachment for a list of projects required in each scenario.\nThe Company’s long-term operation case assumes continued proactive maintenance activities that are necessary to support long-term reliable operation. Without replacement capacity and transmission system improvements, these investments must be made to ensure long-term reliable operation to support system reliability. The majority of the capital investment required to support reliable operation of Plant Bowen Units 1-2 beyond 2028 are associated with the boiler. The current condition of boilers at Plant Bowen Units 1-2 does require significant maintenance to support reliable operation beyond 2028 or if sustained high-capacity factors are expected. The establishment of a known near-term retirement date of 2028 or earlier supports the avoidance of these capital investments. However, avoidance of capital investment could carry performance risk for the units. The impact of performance risk to the system is reduced by the establishment of a retirement transition strategy, including transmission system improvements and replacement capacity.\nThe Company’s long-term operation case assumes continued proactive maintenance activities that are necessary to support long-term reliable operation. Without replacement capacity and transmission system improvements, these investments must be made to ensure long-term reliable operation to support system reliability. The majority of the capital investment required to support reliable operation of Plant Gaston Units 1-4 beyond 2028 are associated with the boiler (or superheater) and certain environmental costs. The establishment of a known near-term retirement date of 2028 or earlier supports the avoidance of these capital investments. However, avoidance of capital investment could carry performance risk for the units The impact of performance risk to the system is reduced by the establishment of a retirement transition strategy, including transmission system improvements and replacement capacity.\nThe Company’s long-term operation case assumes continued proactive maintenance activities that are necessary to support long-term reliable operation. Without replacement capacity and transmission system improvements, these investments must be made to ensure long-term reliable operation to support system reliability. The majority of the capital investment required to support reliable operation of Plant Scherer Unit 3 beyond 2028 is associated with the boiler. The establishment of a known near-term retirement date of 2028 or earlier supports the avoidance of these capital investments. However, avoidance of capital investment could carry performance risk for the units The impact of performance risk to the system is reduced by the establishment of a retirement transition strategy, including transmission system improvements and replacement capacity.\n2022 IRP JKA-8-9 update:\nThe Unit Retirement Study has not been updated as part of this mid cycle IRP Update. No capital cost assumptions have been updated if not otherwise mentioned for the specific units mentioned in the subparts below.  .\nChanges to the unit retirement assumptions for Plant Bowen from the 2022 IRP have not been made for this mid-cycle IRP Update but will be addressed during the 2025 IRP. See the Company’s response to STF-JKA-2-8(b).\nChanges to the unit retirement assumptions for Plant Gaston 1-4 from the 2022 IRP have not been made for this mid-cycle IRP Update but will be addressed during the 2025 IRP. See the Company’s response to STF-JKA-2-8(b) and JKA 2-30(b).\nFor Plant REDACTED, please see the Company’s response to STF-JKA-2-24, where it was noted that acquisition of additional shares of a co-owned unit was considered but ultimately abandoned because negotiations did not yield a suitable path forward. As with the units mentioned above, no updates from the 2022 IRP have been made regarding retirement date. These decisions will be addressed with the 2025 IRP. See the Company’s responses to STF-JKA-2-8(a)-(b) and JKA-5-2.\nTrade Secret Resource Mix Study (2022 IRP)\nUpdated: For any updates to the Resource Mix Study since the 2022 IRP, please reference the Resource Mix Study submitted as part of the initial filing on October 27, 2023 as well as the Resource Mix Study filed as Supplemental Information on December, 4, 2023 and the related errata filed on December 7, 2023.\nTrade Secret Unit Retirement Study (URS) Report (2022 IRP)\nUpdate: The Unit Retirement Study has not been updated for this 2023 IRP Update.", "attachment_filenames": "STF-JKA-8-19", "confidentiality_files": ""}, {"filing_api_id": 217672, "filing_description": "DKT 55378 STF-JKA-8 PD", "filing_date": "2/22/2024", "staff": "JKA", "doc_id": "STF-JKA-8-2", "is_protective_disclosure": "no", "question": "Regarding the Company’s request for “Authority to develop, own, and operate up to 1,000 MW of BESS at various sites as described in this IRP Update and the Technical Appendix.”\nIt appears that beyond Robins, Moody, and the 200 MW BESS + solar installation, the Company is planning on another 560 MW of BESS.\nHow is the company planning to develop this 1,000 MW? Will this 1,000 MW be self-build proposed projects, or identified through an ESS RFP process?\nPlease provide a timeline of all activities to date that have taken place to secure this additional 560 MW.\nPlease provide a timeline of all future activities that will be taken to secure this additional 560 MW of BESS capacity.", "response": "The Company is planning for another 622 MW of BESS resources, which represents the balance of the 1,000 MW request after taking into consideration the 200 MW BESS plus 200 MW solar facility, Robins, and Moody.\nThe 1,000 MW will be self-build projects owned by the Company. This 1,000 MW will include a combination of projects fully developed and constructed by the Company and projects developed and constructed by others. For projects developed and constructed by others, the Company will assume ownership once certain critical milestones and conditions have been met. The Company’s 1,000 MW BESS request in this case is separate and in addition to resources that will be procured through the forthcoming ESS Request for Proposals (“RFP”).\nFrom August 2023 – January 2024 the Company has:\nSurveyed the market for opportunities to co-locate additional BESS behind existing solar interconnection facilities.\nReviewed Company-owned sites for transmission headroom and identified short list of opportunities.\nSubmitted interconnection requests.\nInitiated term sheet negotiations with two counterparties for an Asset Purchase Agreement (“APA”) that will allow the Company to co-locate BESS at existing solar interconnection facilities.\nReleased a Supply Chain RFP for battery supply and Engineering Procurement Construction (“EPC”) contractors to firm up pricing.\nBegun contract negotiations for battery supply.\nFrom February 2024 onward the Company expects to:\nInform the Commission of progress made towards securing the remaining 622 MW of the 1,000 MW request.\nContinue development activities to ensure 2026 and 2027 Commercial Operation Dates (“COD”).\nExecute necessary agreements.", "attachment_filenames": "STF-JKA-8-20; PD STF-JKA-8-20 Attachment A.xlsx; PD STF-JKA-8-20 Attachment F.xlsx; PD STF-JKA-8-20 Attachment C.xlsx; PD STF-JKA-8-20 Attachment E.xlsx; PD STF-JKA-8-20 Attachment D.xlsx; PD STF-JKA-8-20 Attachment B.docx", "confidentiality_files": ""}, {"filing_api_id": 217672, "filing_description": "DKT 55378 STF-JKA-8 PD", "filing_date": "2/22/2024", "staff": "JKA", "doc_id": "STF-JKA-8-20", "is_protective_disclosure": "no", "question": "Please provide the following regarding the load forecast that was used in Aurora modeling:\nProvide the workpapers that took the B2024 load forecast and added in the P95 load forecast of the new economic development load and created the load forecast that was modeled in Aurora.  Provide these forecasts on an hourly basis.\nProvide workpapers, electronically with all formulae intact, and no pasted-in values used to derive the P95 load forecast from the individual potential customer load projects.  Provide these forecasts on an hourly basis.\nFor each of the new customer loads provide an expected hourly load shape and load factor specifically describing the company’s expectations for data centers as well as for crypto customers.", "response": "Several steps are involved to move from the Budget 2024 (“B2024”) load forecast to get to the load forecast included in Aurora for the 2023 IRP Update. First, two Metrix ND models are built to get the hourly load shape forecasts, one for weather sensitive load and the other for non-weather sensitive load. These models were part of the initial 2023 IRP Update filing along with the other models. The names of these Trade Secret models are: “GPC - B24 Base - WS.NDM” and “GPC - B24 Base - Non WS.NDM.”\nThe next step is to calibrate the hourly load shapes to the B2024 unadjusted energy forecast using Metrix LT. This model was also included with the initial filing. The name of this trade secret file is: “GPC_Peak_B24.ltm.”\nDuring the calibration process, the hourly loads for residential, commercial, industrial, MARTA, government lighting, res/com/ind solar, res/com light-duty EV, heavy-duty-medium-duty EV, commercial large customer (com_p95), and industrial large customer (Ind_p95) are generated. The calibrated values for each category are summed up to obtain the total unadjusted Georgia Power hourly load. Please see TS STF-JKA-8-20 Attachment A.\nThe last step is to convert the total unadjusted hourly load to central time and calibrate it to the B2024 adjusted energy and peak forecast, which includes adjustments for demand side management (“DSM”) and cogeneration, using Metrix LT. TS STF-JKA-8-20 Attachment B contains the Metrix LT model used for this final calibration. The model uses TS STF-JKA-8-20 Attachment C and TS STF-JKA-8-20 Attachment D as inputs for the calibration. The output of this model – Georgia Power total calibrated hourly loads in central time – is what is used in Aurora. Please refer to TS STF-JKA-8-20 Attachment E for the input to Aurora.\nSince the 2023 IRP Update Load and Energy Forecast is based on the whole portfolio of new large customer projects, information on individual projects is not available. The commercial and industrial P95 hourly load forecasts are found in TS STF-JKA-8-20 Attachment A, “Hourly” tab, columns H and M.\nThe Company uses one load shape for data centers and crypto customers. Please refer to TS STF-JKA-8-20 Attachment F.", "attachment_filenames": "STF-JKA-8-20; PD STF-JKA-8-20 Attachment A.xlsx; PD STF-JKA-8-20 Attachment F.xlsx; PD STF-JKA-8-20 Attachment C.xlsx; PD STF-JKA-8-20 Attachment E.xlsx; PD STF-JKA-8-20 Attachment D.xlsx; PD STF-JKA-8-20 Attachment B.docx", "confidentiality_files": ""}, {"filing_api_id": 217672, "filing_description": "DKT 55378 STF-JKA-8 PD", "filing_date": "2/22/2024", "staff": "JKA", "doc_id": "STF-JKA-8-21", "is_protective_disclosure": "no", "question": "What proposed tariffs programs are included in the Load and Resource Balance? What’s the expected impacts with existing and new load participation?\nDCL\nDCO\nCL", "response": "The proposed tariff programs have not yet been included in the Load and Resource Balance. The Company is unable to project the expected impacts of the proposed programs as they will be highly dependent on the level of customer interest, timing, and the size of each project. The Company has engaged existing and potential customers regarding the proposed programs but will not know ultimate participation until tariffs are approved and project specifics have been defined.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217672, "filing_description": "DKT 55378 STF-JKA-8 PD", "filing_date": "2/22/2024", "staff": "JKA", "doc_id": "STF-JKA-8-3", "is_protective_disclosure": "no", "question": "Please refer to Table 2 “Candidate Technology Assumptions” of the file named “TS Resource Mix Study.docx” and the response to JKA-2-16, which contains a table labeled “Attachment B: Technology Application Standards Data Summaries.”\nFor the overnight cost for each resource appearing on Table 2, provide a pointer to the same resource that appears in Attachment B, and identify where in Attachment B the Overnight cost ($/kW) that matches up to Table 2 can be found or calculated. Also, this may require providing additional information as it appears Attachment B does not provide Technology Application Standards Data Summaries for each resource found in Table 2.\nAttachment B appears to provide EPC costs, Owners costs, and Land costs for resources. This question requests information for all resources found in Table 2, and seeks the following:\nProvide the workpapers that were used to derive EPC costs, Owners costs, and Land Costs.\nProvide a narrative for each resource explaining the source of assumptions used to derive EPC costs, Owners costs, and Land Costs.", "response": "The following table explains the relationship between the technologies included in Table 2 of “TS Resource Mix Study.docx” and Attachment B of the response to STF-JKA-2-16. For technologies with mismatched MW ratings, the degradation factor found in Attachment B of JKA-2-16 has been applied. Additionally, there are multiple variants of technologies (i.e., tracking solar and fixed solar) that were ultimately not included in the resource mix due to similar use cases with worse economics.\nb.\nI. \tThe workpapers that were used to derive EPC costs, Owners costs, and Land Costs for the resources included in Table 2 were provided as part of the Company’s response to JKA-2-11.\nII. \tBelow is a high level list of assumptions used in the development of EPC costs, Owner’s costs, and Land Cost used as the basis of the cost information in the Resource Mix Study.\nCost Assumptions\nReference costs are expressed in 2023$ unless otherwise noted and assume an immediate overnight commercial operation date (“COD”) (overnight costs).\nEngineering, Procurement, and Construction (EPC)\nThe EPC cost is equivalent in scope to what a turnkey contract would quote for the project and includes the following:\nAll process equipment and materials associated with the plant\nElectrical scope including the high side Generator Step-up Transformer (GSU), collector bus, breakers, and other terminal points for piping, etc. at the plant boundary line\nConstruction and construction management of all plant equipment and material (includes plant underground work and piling, all temporary construction related equipment, facilities, and services)\nPlant engineering, project management, and support services (including start-up support)\nGas metering and conditioning station for gas-fired generation\nEPC contractor cost contingency, overheads, and profits\nSite Costs\nSite preparation costs including site clearing and earthwork (excavation and backfill)\nSite improvements including site drainage, retention ponds, fencing, etc.\nAny onsite fuel storage and waste disposal and preparation\nRoad access and parking\nGas lateral, water intake, and pumping station where relevant\nLand cost (“greenfield” site assumed, within plant site boundary)\nTransmission connection line to substation beyond the plant switchyard\nOwner's Costs\nPre- COD fuel consumption for start-up and commissioning, net of any energy sales\nProject development, including permitting, legal, public relations, insurance, etc\nOwner’s pre-COD project management\nOwner’s project-level contingency", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217672, "filing_description": "DKT 55378 STF-JKA-8 PD", "filing_date": "2/22/2024", "staff": "JKA", "doc_id": "STF-JKA-8-5", "is_protective_disclosure": "no", "question": "Refer to “TS SAM ('23) - 7.0.1 - BESS 4hr.xlsm” (referred to as the “SAM file”) and “TS TAS to Aurora B2024.docx” (referred to as the “Aurora input file”).\nIt appears the SAM PVRR data has been pasted in to the Aurora input file (around rows 22 to 28 of each tab) from the SAM file, and that data for the 4-hour battery for the year 2029 can be approximately tracked directly between the two files.  Please provide a narrative explanation how the PVRR values for the 4-hour battery, and all of the other generic resources in the Aurora input file, were derived for all of the years through 2058, as the Company provided pasted values for all PVRR values and there is no tie to the SAM file.\nProvide all calculations and workpapers, electronically with all formulae intact and with no pasted-in values, to derive the PVRR values for each generic resource found in separate tabs in the Aurora input file around rows 22 to 28 for each year.", "response": "Please see TS STF-JKA-8-5 Attachments A and B, which provide a fixed cost summary that takes the reference year SAM PVRR and uses corresponding escalation rates, provided in TS STF-JKA-8-4 Attachment, for each technology to change those PVRR’s to different modeled commercial operations dates. These PVRR’s are then used in the TS Technology Application Standards (“TAS”) to Aurora B2024 input file to prepare them for entry into the Aurora model.\nFull calculations to develop the generic resource in-service costs for each year are found in TS STF-JKA-8-5 Attachment A an
