resources modeled in the IRP Resource Mix Study.  These solar shapes should have capacity factors that match up to the values shown in Table 2 of the IRP Resource Mix Study.  Also provide, electronically, any other production profiles modeled in the IRP Resource Mix Study developed for other renewable resources such as wind resources, etc.\nOvernight cost – Provide engineering documentation and other workpapers, electronically, that overnight costs for each resource was sourced from.\nDid the Company evaluate a CC without CCS?  Please provide any analysis the Company has that would explain the difference in cost between a CC with and without CCS.", "response": "Battery energy storage systems (“BESS”), solar, wind, and reciprocating engine (“RICE”) Capacity Winter MW are equivalent to the overall facility “nameplate” rating for alternating current (“AC”) power at the high side of the generator step up (“GSU”) transformer.\nThe winter and other seasonal MW ratings for combined cycle (“CC”), combustion turbine with future emission controls (“CT w SCR”), and combined cycle with carbon capture and sequestration (“CC w CCS”) are sensitive to ambient conditions that change from one season to another. For RICE, the heat rate is affected by ambient conditions, but the effect on maximum output is expected to be negligible.\nPlease see the following attachments that detail the basis for unit winter capacity ratings and seasonal differences related to CC, CT w SCR, RICE, and CC w CCS. The seasonal performance differences for CC w CCS are directly correlated to the seasonal differences for CC.\nTS STF-JKA-2-11 Attachment A\nTS STF-JKA-2-11 Attachment B\nTS STF-JKA-2-11 Attachment C\nTS STF-JKA-2-11 Attachment D\nThe general net heat rate equation for a thermal electric power resource is as follows:\nHeat Rate (Btu/kWh) = Total Energy Input as Fuel (Btu) / Net Energy Output as Electricity (kWh)\nPlease see the attached workpapers referenced in part (a) for design basis of thermal resource heat rates. Heat rate values used for the Company’s IRP development are given in terms of the higher heating value (“HHV”) of the input fuel. Where design basis documents show heat rates in terms of the lower heating value (“LHV”) of natural gas, a conversion factor of approximately 1.1 can be used to find the HHV heat rate equivalent. In other words, HHV is approximately 1.1 x LHV. The heat rates for precommercial thermal resource candidate technologies were provided by relevant technology companies. In addition, please see TS STF-JKA-2-11 Attachment E for the energy input and output for thermal generating resources.\nFor heat rate degradation factors, please see TS STF-JKA-2-16 Attachment A.\nPlease see STF-JKA-2-11 Attachment F.\nAll capital expenditures and revenue requirements can be found in the “SAM Files for Generic Resources” folder located in the “8 TS Resource Mix Study” folder within the “TS Technical Appendix” folder of the “TS 2023 IRP Update Models and Workpapers,” which were previously provided to the Commission Staff on October 27, 2023, with the 2023 IRP Update filing.\nPlease see the following attachments.\nTS STF-JKA-2-11 Attachment G\nTS STF-JKA-2-11 Attachment R\nTS STF-JKA-2-11 Attachment D\nTS STF-JKA-2-11 Attachment H\nTS STF-JKA-2-11 Attachment I\nVariable operations and maintenance (“O&M”) for precommercial resource candidate technologies were provided by relevant technology companies. Variable O&M for Compressed Air Energy Storage is informed by the relevant entry in the 2020 Generation Technology Data Book.\nRefer to the attachments provided in response to part (e) as well as TS STF-JKA-2-11 Attachment J.\nFixed O&M for Supercritical CO2 and Medium Duration Energy Storage (“MDES”) was provided by each vendor, and reoccurring fixed costs for the precommercial nuclear resources are based on both vendor guidance and the nuclear entry in the 2019 Generation Technology Data Book. Refer to TS STF-JKA-2-11 Attachment K for more information.\nPlease see TS STF-JKA-2-11 Attachment R for the Round Trip Efficiency for BESS.  Round Trip Efficiency for MDES is based on conversations with manufacturers.\nPlease see the following attachments for relevant 8760 profiles for all included expansion resources:\nTS STF-JKA-2-11 Attachment L\nTS STF-JKA-2-11 Attachment M\nTS STF-JKA-2-11 Attachment N\nTS STF-JKA-2-11 Attachment O\nPlease see the following attachments.\nTS STF-JKA-2-11 Attachment P\nTS STF-JKA-2-11 Attachment R\nTS STF-JKA-2-11 Attachment D\nTS STF-JKA-2-11 Attachment H\nTS STF-JKA-2-11 Attachment I\nTS STF-JKA-2-11 Attachment K\nPlease see section 2.6.1 of the Resource Mix Study in the 2023 IRP Update filed on October 27, 2023, where CC resources were evaluated extensively. Additionally, for more information on CCS cost, see TS STF-JKA-2-11 Attachment Q.", "attachment_filenames": "STF-JKA-2-11; STF-JKA-2-11 Attachment F.xlsx; PD STF-JKA-2-11 Attachments A-E and G-R.docx", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-12", "is_protective_disclosure": "no", "question": "Please provide workpapers, with all formulae intact, detailing the Company’s development of the following forecasts for the Capacity Resource Economic Analysis and the Resource Mix Study:\nFuel price forecasts. Provide information for all fuels including natural gas, coal, nuclear, oil, etc. (See Figures 5-9 in the IRP Resource Mix Study Document.  Note that nuclear is requested also).\nCO₂ price scenarios.\nFor all fuel forecasts and CO2 forecasts, please provide copies of any other current forecasts that the Company has obtained or that is in its possession for any purpose.  Provide them electronically, with all formulae intact.\nFor the gas forecast for candidate expansion gas units, provide the workpapers that were developed to derive the capacity need weighted average price forecast.  Provide them electronically with all formulae intact. Explain what a capacity need weighted average gas price forecast is.", "response": "For its long-term fuel price forecasts (natural gas, coal and oil), the Company uses projections provided by the United States Energy Information Administration in its Annual Energy Outlook (“AEO”). For the economic analysis supporting the 2023 IRP Update, the Company used fuel price forecasts from AEO 2022 and for the Resource Mix Study supporting the 2023 IRP Update, the Company used fuel price forecasts from AEO 2023.\nThe natural gas price projections supporting the economic analysis are provided in TS STF-JKA-2-12 Attachment A. The natural gas price projections supporting the Resource Mix Study are provided in TS STF-JKA-2-12 Attachment B.\nThe coal price projections supporting these analyses are provided in TS STF-JKA-2-12 Attachment C. The price projections used in the economic analysis are on the tab labeled “Coal - Economic Analysis,” and the projections used in the Resource Mix Study are on the tab labeled “Coal - Mix Study.”\nThe oil price projections supporting the economic analysis are provided in TS STF-JKA-2-12 Attachment D. The oil price projections supporting the Resource Mix Study are provided in TS STF-JKA-2-12 Attachment E.\nThe workpaper detailing nuclear fuel price forecasts used in the economic analysis is provided in TS STF-JKA-2-12 Attachment F, and nuclear fuel price forecasts used in the Resource Mix Study are provided in TS STF-JKA-2-12 Attachment G.\nThe degree of pressure on greenhouse gas emissions in the future is uncertain. The Company has considered four different views of how that pressure could evolve. One of those views assumes the degree of pressure remains largely unchanged from where it is today (“$0” view). Two of those views involve a fee imposed on each ton of carbon dioxide that the Company emits (“$20+” and “$50+” views). A fourth view involves annual limits on the amount of CO2 that the Company could emit (“Emissions Limit”). These views were chosen to span a range of current plausible outcomes. The values representing these views are provided in TS STF-JKA-2-12 Attachment H.\nIn addition to the price projections provided in the Annual Energy Outlook, the Company has short term price forecasts provided in the EIA’s Short Term Energy Outlook, shown in STF-JKA-2-12 Attachment I, and coal price forecasts provided by Energy Ventures Analysts (“EVA”), shown in TS STF-JKA-2-12 Attachment J, and by Coaldesk, shown in TS STF-JKA-2-12 Attachment K. Short Term Energy Outlook is a monthly product. The attachment is a sample from a recent month. Coaldesk is a daily product. The attachment is a sample from a recent day.\nCandidate resource additions in the Resource Mix Study reflect generic resources that are not location specific. Because of this, for generic expansion gas and oil units, the fuel price used in the Aurora modeling reflects a capacity-weighted fuel price forecast based on the three territories that make up the Southern Company retail operating companies’ footprint. Because fuel prices can vary based on the pipeline location and state tax rates, it is necessary to create a single capacity-weighted fuel price forecast that is representative of the projected fuel price within the Company footprint. To do this, the Company utilizes the projected gas build allocated to each operating company from the previous year’s planning cycle to create a ratio of gas build within the state to total gas build within the System. This ratio is then applied to each state’s projected fuel price to determine the capacity-weighted price.\nSee TS STF-JKA-2-12 Attachment L and TS STF-JKA-2-12 Attachment M for the workpapers that calculate the capacity-weighted fuel price forecast for generic CT and CC additions for the economic analysis and Resource Mix Study, respectively.", "attachment_filenames": "STF-JKA-2-12; PD STF-JKA-2-12 Attachment A.xlsx; PD STF-JKA-2-12 Attachment B.xlsx; STF-JKA-2-12 Attachment I.pdf; PD STF-JKA-2-12 Attachment C.xlsx; PD STF-JKA-2-12 Attachment E.xlsx; PD STF-JKA-2-12 Attachment D.xlsx; PD STF-JKA-2-12 Attachment H.xlsx; PD STF-JKA-2-12 Attachment F G J K L and M.docx", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-14", "is_protective_disclosure": "no", "question": "See Candidate Expansion Unit Section 2.6.1\nPlease provide all reports, analysis, studies, etc., that supports the fact that Georgia Power could capture 90% of CO2 emissions.\nProvide all reports showing where Georgia Power could possibly store 90% of the CO2 emissions from CC resources.\nExplain why Georgia Power did not assume that CC units would operate on hydrogen instead of assuming that those CC resources would store 90% of the CO2 emissions.\nPlease provide a copy of any comments that Southern Company or Georgia Power filed on August 8th or later in response to the EPA’s request for comments in review of the EPA Section 111 proposed rule.\nPlease explain why the Company chose to use the assumption that CTs “are assumed to operate with oil as a primary fuel source.”  Why not natural gas and what assumption was used for the secondary fuel source given that the CTs were assumed to be Dual-fuel CTs?\nExplain what assumptions have changed associated with the following resources between the 2022 IRP and the 2023 IRP.  This should include capacity, costs, modeling limits, etc.\nSolar\nBattery Storage\nWind\nCTs\nCCs\nNuclear\nExplain why the Mississippi Power PPA was included as a resource option, and none of the other PPAs such as Santa Rosa, etc. were included as resource options.", "response": "Please see TS STF-JKA-2-14 Attachment A for details on the generic carbon capture equipment assumption included in the Resource Mix Study.\nPlease see STF-JKA-2-14 Attachment B for details on storage viability in the United States. STF-JKA-2-14 Attachment B is a Department of Energy/National Energy Technology Laboratory report on sequestration viability in the United States that details a large amount of storage capacity available in the southeast as well as ongoing projects in the region to characterize that storage.\nProduction and transport of low greenhouse gas hydrogen is currently not demonstrated to the scale required to qualitatively satisfy the requirements of multiple retrofit or expansion resources operating at an 85% capacity factor assumption used for the generic combined cycle expansion units.\nSee STF-JKA-2-14 Attachment C for the Company’s comments on the EPA section 111 proposed rule for Electric Generating Units.\nThe Company assumed oil dispatch for new generic combustion turbines (“CTs”) because the pipelines serving the Company region have become increasingly constrained and less flexible in recent years. These constraints limit the amount of swing and daily imbalance through frequent issuance of daily Operational Flow Orders (i.e., curtailment of gas supply). These constraints bind the Southern Company retail operating companies’ ability to operate any of its natural gas units on the same pipeline system, including new CTs. The Company can successfully manage this through the usage of fuel oil. Additionally, the ability to construct new pipeline infrastructure to alleviate pipeline constraints has been very challenging (e.g., Mountain Valley Pipeline). Therefore, assuming new pipeline infrastructure will be available for all future natural gas units is unrealistic. Given the current operational realities and the challenges facing the pipeline infrastructure industry, the Company assumes the most reliable operational plan for new generic expansion CTs is for them to be dual-fueled with the ability to burn fuel oil year-round and plan to be augmented with natural gas when it is available. The availability of firm natural gas supply is highly location dependent. Therefore, the Company will evaluate the applicability of firm transportation on a case-by-case basis as specific resource decisions are identified.\nSee TS STF-JKA-2-14 Attachment D for details on year-to-year changes in the requested technologies.\nThe Mississippi Power Company power purchase agreement (“MPC PPA”) was the only proposed resource allowed to be selected in the Resource Mix Study. The MPC PPA negotiations were near final when the modeling was being conducted, and the Mississippi Power Company resources are already included in the model, making it easy to implement this assumption. The other proposed resources will be included in future modeling if approved in this docket.", "attachment_filenames": "STF-JKA-2-14; STF-JKA-2-14 Attachment B.pdf; STF-JKA-2-14 Attachment C.pdf; PD STF-JKA-2-14 Attachment D.docx; PD STF-JKA-2-14 Attachment A.docx", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-15", "is_protective_disclosure": "no", "question": "Constraint in Aurora.\nDid the Company make any input constraint adjustments in Aurora, in an attempt to optimize runtime?  Please explain any tunnel constraints utilized for reserve margin, generic unit minimum/maximum annual additions, cumulative additions, etc.  (See the Company’s response to STF-JKA-2-10 in answering this question).  As just one example, explain why the Company limited Southeast Wind resources to 8,100 MWs.\nDid the Company model any capacity factor limits in this IRP? If so why, if not why not, as the Company did so in the 2022 IRP.", "response": "The Company adjusted the annual max and overall max build for the following new resource options to optimize Aurora Long Term Capacity Expansion (“LTCE”) runtime:\nCT with SCR\nCC\nCC with CCS\nMedium Duration Storage\nReciprocating Engines\nThe annual max was calculated by dividing the retail system’s annual incremental capacity need (based on a 30% reserve margin) by the 300 MW new resource block size, rounding up to the nearest whole number, and adding a 1-unit buffer. The reserve margin is constrained in Aurora to meet a range between the target 26% and 30% upper bound. The 30% reserve margin is used as an upper bound for Aurora optimization and does not represent the proposed or currently approved System Target Reserve Margin. Using this method allows Aurora to meet an entire year’s capacity need with a single new resource type (if optimal) but also limits the number of new resource options Aurora evaluates, which improves runtime. For example, if an incremental capacity need of 750 MW is determined in a scenario, the annual max is calculated as follows:\nThe overall max is set to an amount greater than the study period sum of the calculated annual max stream. Aurora will honor the most limiting constraint when considering annual max and overall max entries.\nWhile the above resource options were limited to optimize LTCE runtime, additional limitations were placed on new resource options based on new resource availability assumptions, rather than to reduce runtimes. For example, based on land-use constraints and current wind turbine technology, a maximum wind development limit of 8,100 MW was established. Setbacks due to existing structures, roadways, property lines, and environmental attributes in conjunction with terrain were all considered when determining site suitability for development. For a list of all resource constraint assumptions, please see the Company’s response to STF-JKA-2-14 subpart (f) for additional information.\nYes, the Company modeled a 25% annual capacity factor constraint in Aurora for new and existing simple-cycle combustion turbines (“CTs”) based on requirements under the Clean Air Act’s New Source Performance Standards (“NSPS”) Subpart TTTT as well as existing and potential air permit limitations. Under the NSPS regulation, new simple-cycle CTs must meet a capacity factor limitation that is equivalent to the unit’s design efficiency. In addition, simple-cycle CTs could be required to limit capacity factor due to New Source Review air permit limitations under the Clean Air Act. While air permit constraints are determined on a case-by-case basis, many existing air permits limit simple-cycle CTs to 25% annual capacity factor or less. Simple-cycle CTs are generally used as peaking generation and typically operate far less than a 25% capacity factor on an annual basis.\nFor the moderate and higher greenhouse gas (“GHG”) pressure views provided in the supplemental update (“MG20,” “MG50,” and “EL”), an additional annual capacity factor constraint of 10% is included beginning in 2035.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-16", "is_protective_disclosure": "no", "question": "Please provide all workpapers, electronically with all formulae intact, used in the technology screening process (discussed in Section 2.6), to reduce the potential list of new supply-options.  For each step performed in the process, show the resources at the start and end of the process.", "response": "Please see TS STF-JKA-2-16 Attachment for details on the Technology Screening Process.", "attachment_filenames": "STF-JKA-2-16; PD STF-JKA-2-16 Attachment.docx", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-17", "is_protective_disclosure": "no", "question": "Regarding the Commission’s 30% PPA limit requirement in Commission Rule 515-3-4-.04(3)(f)7. What did the Company do in this IRP to ensure that it will not exceed the 30% requirement?", "response": "If Georgia Power were to contract for the entirety of capacity needs through power purchase agreements (“PPAs”), the ownership percentage would drop below the minimum 70% as early as the winter of 2026/2027. Pursuant to the Final Order for the Georgia Power Company Application for Approval of an Integrated Resource Plan, Georgia Public Service Commission, Docket No. 13305 at 21 (July 17, 2001) (“2001 IRP Final Order”), “When the limit is reached the utility will meet its next capacity need through a traditional self-build project to be placed in rate base.”\nTherefore, due to the accelerated need for generating capacity, the limited availability of market resources, the time required to complete the RFP process and build new transmission and generation assets, and the Commission policy regarding Company ownership of at least 70% of generating resources to serve customers, Georgia Power is requesting the authority to develop, own, and operate the following company-owned resources: up to 1,000 MW of battery energy storage systems (“BESS”) and up to 1,400 MW from three simple cycle CT resources at Plant Yates.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-18", "is_protective_disclosure": "no", "question": "Please provide all assumptions regarding the McGrau Ford battery storage resource assumed in this IRP.", "response": "The McGrau Ford battery has summer and winter capacity values of 265 MW and 252 MW, respectively, throughout its modeled 20-year life without capacity degradation. It is available starting in 2027 and can be used as both an energy and capacity resource. Additional modeling details are contained in the Aurora database file submitted with the Company’s initial filing of the 2023 IRP Update on October 27, 2023.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-19", "is_protective_disclosure": "yes", "question": "For each of the following, unit acquisitions, BESS resources, Mississippi PPA, Santa Rosa PPA, Yates CTs, REDACTED BESS + Solar,\nIf not already provided, provide copies of all PPAs or other agreements/commitments/corporate board approvals for the resources the Company plans to acquire.\nHas the Mississippi Power PPA been approved by the Mississippi Public Service Commission?\nSeparately for each resource above, provide justification for the $3/kW additional sum charge that the Company included.  Why does the Company consider $3/kW the appropriate charge for each resource?\nIdentify which resources received the accounting lease cost and provide an explanation and provide workpapers for how the lease cost was derived, electronically and with all formulae intact.\nIdentify which resources received sales revenues and explain how the sales revenues were derived and provide workpapers for how the sales revenues were derived, electronically and with all formulae intact.\nIdentify where the PTC and ITC calculations for resources may be found, and explain any differences in the PTC and ITC calculations for the Economic Analysis of Resources versus what was used in the Generation Resource Mix study.  Also, explain why PTC was selected instead of ITC, or why the ITC was selected instead of PTC.\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED\nFor each resource, provide a timeline when the Company first began consideration of the resource acquisitions, counterparty negotiations, discussions with site owners, important activities, etc.\nFor each resource, provide documentation supporting the timeline activities, including agreements, PowerPoint presentations, memos, letters, term sheets, analyses, electronically with all formulae intact.", "response": "Please see TS Technical Appendix Mississippi Power PPA and TS Technical Appendix Santa Rosa PPA for a copy of the power purchase agreements (“PPAs”). This information was included in the 2023 IRP Update filing and provided to Commission Staff on October 27, 2023. Please see TS STF-JKA-2-19 Attachment A for an executed agreement for preliminary engineering and development services and option to purchase equipment (“PES”) for Plant Yates Units 8-10. Please see the Company’s response to STF-JKA-2-19 part (i) for additional information for the remaining resources.\nMississippi Public Service Commission (“MS Commission”) approval is not required for Mississippi Power to execute a PPA for the sale of capacity and energy with Georgia Power or any other off-taker; however, because Georgia Power is an affiliate of Mississippi Power, Mississippi Code § 77-3-10, requires filing the executed PPA with the MS Commission. Further, Mississippi Code § 77-3-42 requires a filing with the MS Commission as part of the MS Commission’s general oversight of capacity resources of public utilities in Mississippi. No formal review or approval procedure is prompted by this filing. The filing is for informational purposes. Mississippi Power Company has completed the required notice filing with the MS Commission with respect to the Georgia Power PPA recently executed.\nThe Company included $3/kW-year of additional sum consistent with the 2022 IRP Stipulated Agreement and the 2022 IRP Final Order. The Company considers this an appropriate amount given it was approved in the last IRP for capacity resources.\nThe Company’s Economic Analysis of Capacity resources includes accounting lease costs for the Santa Rosa PPA. The Company did not impute these costs on the other options in the economic analysis. The Company’s derivation of lease costs was included in “TS SAM (’23) – 7.0.1 – Santa Rosa Final.xlsm” provided to Commission Staff on October 27th, 2023. Please see row 34 on the Santa Rosa tab in this workpaper for the accounting lease costs.\nPlease see the 2023 IRP Update Main Document for more information. The Company intends to remarket the capacity associated with the MPC PPA in the years prior to the winter of 2025/2026. The Company did not include wholesale sales revenues for other resources. The derivation of the revenue is based on the agreement the Company has for the remarketed capacity. Please see TS STF-JKA-2-19 Attachment B for a copy of this agreement. The revenues from remarketing that capacity in 2024-2025 were quantified in the Technical Appendix “TS Economic Analysis of Capacity Resources.xlsx” file. On the Annual Economics tab, cells H64 and I64 show the capacity payment revenue derived by multiplying the capacity of the sale, the number of months, and the monthly capacity payment revenue received.\nThe Production Tax Credits (“PTC”) and Investment Tax Credits (“ITC”) calculations can be identified in the SAM workpapers provided to Commission Staff on October 27, 2023 and in the Aurora model files provided to Commission Staff on October 30, 2023.\nBoth the Company’s economic analysis and Resource Mix Study assume BESS resources would utilize the ITC. Likewise, both evaluations assume solar resources would utilize the PTC. The economic analysis does not assume domestic content or energy community benefits at commercial operation for the proposed projects given the chosen locations and likely source of materials for construction. However, the BESS augmentations are expected to receive bonus credits for domestic content. The Resource Mix Study assumes either energy community or domestic content benefits will be available for generic renewable or BESS additions. Therefore, the Resource Mix Study assumes those Inflation Reduction Act (“IRA”) benefits.\nBESS facilities only qualify for ITC. Solar facilities qualify for either the PTC or ITC benefits. In general, PTC are typically more economic than ITCs for solar resources for the Company. However, the decision is likely to be situation specific. The Company will continue to evaluate the selection of ITC or PTC for solar resources. As additional information becomes available, the Company will seek to select the most economic option available.\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED. As stated in direct testimony filed on December 4, 2023, the parties were unable to reach an agreement at this time. Therefore, the compliance obligations remain unchanged.\nBelow is a general timeline from when the Company first began consideration of the proposed resources and the important activities for each.\nREDACTED REDACTED\nInitial exploratory conversations between the parties began in early August 2023 regarding Georgia Power’s potential acquisition of additional ownership interests in an existing generation asset within the Southern Company footprint. Following initial discussions and through September 2023, the Company began its due diligence on the assets, scope, risks, and applicable regulatory requirements for the potential acquisition. Between early October 2023 and end of November 2023, the parties engaged in active negotiations regarding the terms and conditions for the proposed asset purchase agreement. However, on November 30, 2023, the parties agreed to suspend negotiations and not move forward with the transaction at this time. As stated in the direct testimony filed on December 4, 2023, the Company is no longer pursuing the potential acquisition of additional ownership interests in an existing generation asset within the Southern Company footprint.\nSanta Rosa PPA:\nInitial conversations with Santa Rosa began in late July 2023. After working through confidentiality items, the Company and Santa Rosa worked together to draft a non-binding term sheet before discussing a more detailed and actionable PPA. This non-binding term sheet was finalized in early September 2023. A PPA was then negotiated and executed on October 23, 2023. A copy of the PPA was included in the 2023 IRP Update filing on October 27, 2023.\nMississippi Power PPA:\nInitial conversations occurred in late July 2023. A non-binding term sheet was agreed upon before discussing more a detailed and actionable PPA. PPA negotiations began in late August. The PPA was subsequently executed on October 11, 2023. A copy of the PPA was included in the 2023 IRP Update filing on October 27, 2023.\nBESS Resources\nIn July 2023, the Company began an initial screening to aid in selection of potential BESS resources that could achieve commercial operation by November 2026. The initial screen contained a constraint analysis, survey analysis, environmental analysis, and substation analysis. By August, a preliminary screening for Robins and Moody identified these were suitable sites for BESS development.\nIn addition to the site screening, a request for information (“RFI”) was sent out to battery vendors in June to develop an updated understanding of BESS pricing and equipment lead times. By August, the Company had evaluated the existing land leases at Moody and Robins Solar and made notifications to the landowner at Moody Solar. In late August, the Company held a call with the Central Georgia Joint Development Authority (“CGJDA”) regarding the planned addition of a BESS at Robins Solar. The Company is working with CGJDA to modify any existing agreements. In late September and early October, the Company received preliminary layouts and single-line diagrams for both BESS projects. The incremental interconnection application requests were submitted for Robins BESS and Moody BESS on October 26 and November 3, respectively. In November, the Company sent out a request for proposal (“RFP”) to battery suppliers to determine a vendor for the Robins BESS and Moody BESS and an Engineering, Procurement, and Construction (“EPC”) RFP to determine a contractor for the Robins BESS and Moody BESS.\nREDACTED BESS + Solar\nIn April 2023, the Company executed a Non-Disclosure Agreement with the developer to pursue a renewable focused project to submit into an upcoming RFP. In July 2023, the Company began a due diligence exercise to evaluate the BESS + Solar opportunity. The Company is currently negotiating an Asset Purchase Agreement with the developer. In August 2023, a project team was pulled together consisting of subject matter experts from departments such as land, environmental, engineering, legal, tax, generation development, and finance. In early October, transmission completed the screening analysis described in the Technical Appendix to the 2023 IRP Update. Also, in early October, the developer provided indicative pricing, which was included in the SAM files and economic analysis. A site visit with the developer occurred on November 8 in support of developing an EPC agreement. On October 13, the developer executed an amendment with SCS Transmission to extend the commercial operation date into 2027, and on November 20, the developer executed a subsequent amendment to identify specific phases including this 200 MW BESS / 200 MW solar opportunity achieving commercial operation on November 1, 2026.\nYates Resources\nIn July 2023, the Company began the process of developing simple cycle combustion turbine (“CT”) plans for Plant Yates. The Company previously developed a Company-owned combined cycle (“CC”) proposal at Plant Yates, and this served as the basis for simple cycle due diligence.\nIn August 2023, the Company formally established a project team to begin development and negotiation of the project. Negotiations with the Consortium of REDACTED REDACTED and REDACTED REDACTED also began in August and will continue until the anticipated fully negotiated turnkey EPC and companion long-term service agreement (“LTSA”) are complete (anticipated in mid-January 2024). In addition, the Company submitted interconnection applications for each of the units. On October 2, 2023, the Company executed an agreement for preliminary engineering and development services and option to purchase equipment.\nBelow is a list of additional documents that support the timeline of activities.", "attachment_filenames": "STF-JKA-2-19; PD STF-JKA-2-19 Attachment G.pdf; PD STF-JKA-2-19 Attachment I.pdf; PD STF-JKA-2-19 Attachment H.pdf; PD STF-JKA-2-19 Attachment L.pdf; PD STF-JKA-2-19 Attachment A.pdf; PD STF-JKA-2-19 Attachment K.pdf; PD STF-JKA-2-19 Attachment O.pdf; PD STF-JKA-2-19 Attachment J.pdf; PD STF-JKA-2-19 Attachment N.pdf; PD STF-JKA-2-19 Attachment F.pdf; PD STF-JKA-2-19 Attachment M.pdf; PD STF-JKA-2-19 Attachment D.docx; PD STF-JKA-2-19 Attachment C.docx; PD STF-JKA-2-19 Attachment E.docx; PD STF-JKA-2-19 Attachment B.docx", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-2", "is_protective_disclosure": "no", "question": "Refer to the Load and Resource Balance presented in “TS 2023 IRP Update Models and Workpapers.zip\\Main Document\\Figures 4, 5, 6, & 9 - Capacity Needs Data for B22, B23, and 2023 IRP Update.xlsx”\nExplain the change in capacity values for Bowen 1-2, 3-4, and Scherer 3, as the capacity values of those units appear to be different than what was assumed in the 2022 IRP.\nExplain the decrease in assumed DSO capacity, as the capacity value for DSO resources appears to be different than what was assumed in the 2022 IRP.  Also, please explain any change in assumptions such as customer participation since the 2022 IRP.\nWhat capacity equivalence (ICE, ELCC, etc.) factors are assumed for new and existing resources in the Company’s load and resource balance as presented?  Also, importantly, provide a view of the “2023 IRP Update w Extensions” tab but with nameplate capacity ratings for winter for each resource.\nWhat capacity equivalence (ICE, ELCC, etc.) factors are assumed for the proposed capacity resources evaluated in “TS Economic Analysis of Capacity Resources?” Provide such capacity equivalence factors for every unit.\nWhat capacity equivalence (ICE, ELCC, etc) factors are assumed for the proposed resources in the GenMix Study? Provide such capacity equivalence factors for every unit.\nHas the Company generated a load and resource balance view with the proposed capacity resources included associated with “TS Economic Analysis of Capacity Resources”?  If not, why not? Please provide such a view if it is available.\nHas the Company generated a load and resource balance view with the proposed capacity resources included associated with each GenMix case? If not, why not? Please provide such a view if it is available.\nPlease provide the Company’s assumptions for capacity additions (technology, collocated with or without BESS, baseload/intermediate/peaking, MW target factors to adjust the solicitation target amounts by the expected procurement amounts, etc.) that are planned to be procured through RFPs that were approved in the Company’s 2022 IRP.", "response": "The winter capacity values for Plant Bowen Units 1-4 and Plant Scherer Unit 3 increased due to additional demonstrated winter peaking capacity.\nThe Demand Side Option (“DSO”) capacity resources are updated annually to reflect the best available information on program participation and Economic Load Carrying Capability (“ELCC”). The decrease in planning capacity between the 2022 IRP and the 2023 IRP Update is primarily driven by a change in the ELCC for the Demand Plus Energy Credit (“DPEC”) program. Updated ELCC values reflect modeling of program parameters (resource availability, call limits, call conditions, required notice) and recently observed response rates.\nPlease see STF-JKA-2-2 Attachment A.\nPlease see TS STF-JKA-1-4 Attachment columns H and I for the annual capacity contribution for each resource in the economic analysis.\nThe MPC PPA was the only proposed resource explicitly modeled in the Resource Mix Study, and it was assumed to have an ELCC of 100%.\nPlease see STF-JKA-2-2 Attachment B. The Company did not include the potential option to acquire an additional ownership interest in an existing generating asset within the Southern Company footprint because the parties were unable to reach agreement at this time, as described in the Company’s Direct Testimony filed on December 4, 2023.\nPlease see STF-JKA-2-2 Attachment C for the load and resource balance views that include the generic expansion resources for each planning scenario from the Resource Mix Study associated with the Errata to the 2023 IRP Update Supplemental Filing that was filed on December 7, 2023. The Mississippi Power Company (“MPC”) power purchase agreement (“PPA”) was the only proposed resource explicitly modeled in the Resource Mix Study. The MPC PPA is immediately available, without construction delay or transmission restrictions, and represents a supply-side resource of extraordinary advantage. Additionally, the MPC PPA negotiations were near finalized at the time modeling began for the 2023 IRP Update, and the MPC resources are already included in the model, which simplified capturing the MPC PPA. Therefore, the MPC PPA was represented in the Resource Mix Study analysis.\nPlease see STF-JKA-2-2 Attachment D for the Company’s assumptions for capacity values for additions that are planned to be procured through requests for proposals (“RFPs”) that were approved in the Company’s 2022 IRP. The target procurement amounts can be found in Column E. The Company does not model or assume the results of future RFPs to be conducted to meet the Company’s capacity needs for certain periods, such as the 2029-2031 All-Source RFP.", "attachment_filenames": "STF-JKA-2-28; PD STF-JKA-2-28 Attachment.docx; STF-JKA-2-26; STF-JKA-2-25; STF-JKA-2-24; PD STF-JKA-2-24 Attachments A, B, C.docx; STF-JKA-2-23; STF-JKA-2-22; STF-JKA-2-20; STF-JKA-2-20 Attachment.pdf; STF-JKA-2-2; STF-JKA-2-2 Attachment C.xlsx; STF-JKA-2-2 Attachment A.xlsx; STF-JKA-2-2 Attachment B.xlsx; STF-JKA-2-2 Attachment D.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-20", "is_protective_disclosure": "yes", "question": "Mississippi Power PPA\nWhy did the Company acquire the Mississippi Power resource as early as 2024 when there is no need for capacity that early?\nProvide copies of any orders in which the Mississippi Commission required Mississippi Power to shut down resources or otherwise eliminate excess capacity that was ultimately relevant to the decision to enter into the PPA with Georgia Power.\nExplain what issues will be addressed by the Operating Committee specifically related to the “day-to-day operating procedures”.\nPlease explain all requirements for FERC approval and what the status of obtaining that approval is.\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED\nSee Table 1, Contract Capacity Price.  Please provide all of the Company’s workpapers that were used that led the Company to agree to the reasonableness of the prices in the table.\nPlease provide the workpapers that took the formulas associated with the Contract Capacity price and computed costs that were modeled in the TS Economic Analysis of Capacity Resources.xlsx analysis.", "response": "The term of the Mississippi Power Company (“Mississippi Power”) power purchase agreement (“PPA”) begins January 1, 2024, because Mississippi Power was ordered to retire approximately 950 MW of capacity by the end of 2027 or show with detailed evidence why continued operation of the resources is in the best interests of its customers. Therefore, Mississippi Power planned to retire some of that capacity by the end of 2023 and was actively remarketing the remaining capacity to be sold outside of the Southern Company system. Had Georgia Power not executed the PPA for the full five years, the proposed resource very likely would not have been available for the last three years when the Company has a capacity need. By purchasing 750 MW from Mississippi Power through this PPA, Georgia Power ensures that this resource not only remains in the Southern Company pool but also provides dedicated, reliable, market-priced capacity and energy to Georgia Power’s customers to meet its burgeoning short-term demand.\nFor the benefit of customers, Southern Wholesale Energy (“SWE”), on behalf of Georgia Power, will attempt to remarket capacity for the years prior to the winter of 2025/2026. The Company has already contracted for the sale of 500 MW to a regional electrical service provider for January 1, 2024, through September 30, 2025, thereby recovering costs from a third party in a period before the capacity is needed to serve Georgia Power retail customers.\nPlease see STF-JKA-2-20 Attachment for the applicable order from Mississippi Public Service Commission in Docket No. 2018-AD-145.\nSince both Georgia Power and Mississippi Power are members of the Southern Company Pool, which adheres to Southern Dispatch practices and the Intercompany Interchange Contract (“IIC”), “day-to-day operating procedures” will not be necessary. If the affiliate or pool relationship were to change during the term of the PPA, the Operating Committee would have responsibility for developing any subsequently needed operating procedures.\nThis PPA is executed under Southern Operating Companies’ Market Based Rate Tariff (“MBR”) with Mississippi Power as an electric utility operating company engaged in the sale of electric power at wholesale that has received authorization from the Federal Energy Regulatory Commission (“FERC”) to provide wholesale power supply services at market-based rates. Transactions made under MBR do not require separate filings at FERC for approval. Further, Georgia Power is an electric utility operating company which provides retail electric service to end-use customers in its franchise service territory in the state of Georgia that is authorized to purchase wholesale power supply services.\nAs discussed in the response to subparts (a) and (b) above, purchasing 750 MW that can be met by any resources available to Mississippi Power prevented this capacity from being removed from the Southern Company pool where it would no longer be available through system reserve sharing to serve Georgia Power customers. The Mississippi Power PPA was set up to be similar to system reserve sharing as allowed under the IIC, which is based on total capacity available from each Operating Company. Mississippi Power will continue to evaluate any necessary actions associated with the Mississippi Public Service Commission order in Docket No. 2018-AD-145.\nAs defined in the Power Supply Service Schedule, “seller generating resources” are, at any given time, the electric generating units owned or controlled by Mississippi Power that are in commercial operation and are submitted to Southern Dispatch. The PPA obligations can be met by any resources available to Mississippi Power.\nGeorgia Power and Mississippi Power both operate as part of the Southern Company system pool, and the expectation is that the conditions in Section 4.2 of the Power Supply Service Schedule would potentially occur under emergency situations, such as winter weather events, where the Southern Company system is impacted.  Mississippi Power has every incentive for high levels of unit performance under the Southern Company system and its obligation to provide reliable service to its customers through the Southern Company system pool. No other data was acquired from Mississippi Power or Southern Company to evaluate the inclusion of this provision in the Mississippi Power PPA.\nPlease see the “9 TS Economic Analysis” folder in the Technical Appendix to the 2023 IRP Update for an economic assessment of the Mississippi Power PPA. This resource is available to meet near-term capacity needs. The results of the economic analysis demonstrate this PPA is competitive with other options. Furthermore, the capacity prices listed in Table 1 reflect the market price of capacity and are consistent with other recently executed contracts, such as TS STF-JKA-2-19 Attachment B. Finally, the 2024 reserve sharing rate as prescribed in the IIC and filed with FERC as part of the informational filing is $73.20/kw-year which is within REDACTED of the annualized rate in Table 1.\nPlease see the “TS Economic Analysis of Capacity Resources.xlsx” file in the “9 TS Technical Appendix Economic Analysis” folder of the “TS Technical Appendix,” which was previously provided to the Commission Staff on October 27, 2023, in the 2023 IRP Update filing. The formulas associated with the contract capacity price and computed costs are on the “Cost Inputs” worksheet.", "attachment_filenames": "STF-JKA-2-20; STF-JKA-2-20 Attachment.pdf", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-21", "is_protective_disclosure": "no", "question": "Santa Rosa PPA\nSee section 5.1.3, the parties appear to be agreeing that no additional transmission upgrade costs will be required, please explain why that is, and why no transmission study will be required to determine that?\nSee Tables A-1 and A-2, Annual Capacity Price.  Please provide all of the Company’s workpapers that were used that led the Company to agree to the reasonableness of the prices in the table.\nPlease explain how the annual capacity price factors into the formulae for the Monthly capacity payment.\nPlease provide the workpapers that took the formulas in Appendix B and computed costs that were modeled in the TS Economic Analysis of Capacity Resources.xlsx analysis.", "response": "A transmission screening was conducted for the Santa Rosa combined cycle facility prior to the execution of the power purchase agreement (“PPA”), and no transmission upgrades were identified. In order to finalize the Native Load Request for the resource, a more formal study is currently underway.\nPlease see the “9 TS Economic Analysis” folder in the Technical Appendix to the 2023 IRP Update for an economic assessment of the Santa Rosa PPA. This resource is available to meet near-term capacity needs. The results of the economic analysis demonstrate this PPA is competitive with other options. Furthermore, the capacity prices listed in Table A-2 reflect the market price of capacity and are consistent with other recently executed contracts, such as TS STF-JKA-2-19 Attachment B. Finally, see the Company’s response to STF-JKA-2-20 part (h) for a comparison to the 2024 reserve sharing rate as prescribed in the Intercompany Interchange Contract (“IIC”) and filed with the Federal Energy Regulatory Commission.\nThe Monthly Capacity Payment is the product of the Monthly Capacity Fee and the Monthly Availability Adjustment. The Monthly Capacity Fee is the product of the Designated Capacity, the Annual Capacity Price, and the Monthly Value Factor. Thus, the Annual Capacity Price is weighted each month by a value factor that places more emphasis on peak months. The sum of the monthly payments equates to the Annual Capacity Price absent any availability adjustments.\nPlease see the “TS SAM ('23) - 7.0.1 - Santa Rosa Final.xlsm” file located in the “SAM Files” folder within the “9 TS Economic Analysis” folder of the “TS 2023 IRP Update Models and Workpapers,” which were previously provided to the Commission Staff on October 27, 2023, for a workpaper that computes the capacity payment and fixed costs for the Santa Rosa PPA. Please see the Aurora model files located in the “9 TS Economic Analysis” folder, which were previously provided to Commission Staff on October 30, 2023, for the variable costs components.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-22", "is_protective_disclosure": "yes", "question": "Please provide all documents that serve as the basis for the cost assumptions for the Yates CTs.\nWhat is the primary fuel for Yates CTs? If gas, has the Company made arrangements to obtain firm gas transportation?\nExplain why Yates can be modeled to use natural gas while the generic CTs are modeled using oil?\nPlease provide all assumptions regarding gas deliverability to Yates, including firm transportation costs, the need to construct natural gas pipeline capacity, etc.\nWhy does page 21 state that the CTs will add between 1,000 MW and 1,400 MWs of capacity.  Why isn’t this statement more definitive and when will the decision about that be made?  If the Company had wanted, would the Yates site support the addition of a 4th CT addition?\nIf the CTs are approved in this case, how long after that would be required for the Company to construct the CTs.", "response": "Please see STF-JKA-2-19 for costs the Company has already incurred. The Company remains in active negotiations on the project. These negotiations and Southern Company’s recent experience building new natural gas plants informed the cost estimates for the Yates CTs. As mentioned in the “Technical Information Supporting the Proposal to Develop up to 1,400 MW from Three Simple Cycle Combustion Turbines at Plant Yates,” found in the Technical Appendix to the 2023 IRP Update filing, these costs estimates are subject to change prior to the execution of an Engineering, Procurement, and Construction (“EPC”) agreement. As mentioned in the Technical Appendix the Company will update the Commission upon execution of a final EPC contract and request certification of Plant Yates Units 8-10 at that time.\nPlant Yates Units 8-10 are dual fuel units. They can operate on natural gas as available, but they are unlikely to have reliable supply of natural gas during peak winter periods without firm transportation (“FT”).  No FT has been procured for these units.  Therefore, these units will be supplied with oil to support continued operation during peak conditions. These units will be able to utilize gas when FT is available from other units such as the Plant Yates steam units or when interruptible pipeline transportation is available.\nThe Company modeled Plant Yates Units 8-10 assuming oil dispatch costs for the winter months. For the non-winter months, the Company assumed availability of natural gas in its economic analysis production cost modeling, which is weather normalized. Plant Yates Units 6-7 have firm gas transportation that can be utilized for Plant Yates Units 8-10 if economic. Additionally, natural gas pipelines are generally less constrained during non-winter months. This may differ from generic repeatable combustion turbines (“CT”) as the available of natural gas is highly location dependent and generic CTs do not have a specific location. Please see the Company’s response to STF-JKA-2-14 subpart (e) for more information on the generic CT assumption.\nPlant Yates Units 8-10 will primarily run on fuel oil during peak winter and summer periods when the pipeline is constrained. No FT or additional gas capacity is being proposed to support these units since these units can burn oil year around. It is being proposed to build a new pipeline lateral from Transco’s mainline to the plant. The new lateral would be adjacent to the existing pipeline lateral to Plant Yates from Transco.\nThe range of output capacity was used to illustrate the variance between oil and gas fired operations. Active negotiations over REDACTED guaranteed capacity have informed this range. The guaranteed capacity will be finalized upon execution of the final EPC contract. A fourth combustion turbine has not been evaluated for the 2023 IRP Update but could be considered in the future.\nUnder the preliminary schedule as shown in Figure 2 of the Technical Appendix for the Yates CTs, construction of the first two units will be substantially completed in 32 months with the third unit under construction for 36 months assuming a final decision for the 2023 IRP Update is obtained in April 2024. The Company has already begun activities in advance of a final decision to preserve the current timeline. Information on these activities is further described in STF-JKA-2-19, which are necessary to support engineering and procurement of critical equipment in a timely manner.", "attachment_filenames": "STF-JKA-2-22", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-23", "is_protective_disclosure": "yes", "question": "See page 20 of the Main Document, which states, “Since the availability of additional transmission capacity could limit the timeframe in which the Company can deploy new resources, the Company requests the flexibility to add up to 1,000 MW total of BESS resources”. Why does limited transmission capacity make a difference such that the Company believes it should be given approval now for up to 1,000 MW of BESS resources, when costs and other information about the resources are unknown at this time?  In other words, why should the Commission be persuaded to give approval now as opposed to waiting until specific resources are identified?", "response": "Authority to develop, own, and operate up to 1,000 MW of Battery Energy Storage Systems (“BESS”) will allow the Company to make strategic development decisions to ensure that it can respond to increasing load growth in 2026 and 2027. To achieve a 2026 or 2027 commercial operation date (“COD”) for a BESS project, the Company must move quickly to identify and reserve transmission capacity, initiate the interconnection process, and purchase long-lead-time equipment. Also, it is important to note that the Company will return to the Commission with the identified projects and associated costs when seeking certification of identified projects.\nTransmission capacity and availability at a particular location change frequently based on the assumptions around load growth and other updates to the transmission plan. Many recent screens for generation projects indicate limited capacity to charge or discharge a battery until REDACTED or later until expensive and long-lead-time transmission projects are completed. Authority to develop, own, and operate up to 1,000 MW of BESS will allow the Company to identify and reserve available transmission capacity for particular projects that can achieve a COD by the end of 2026 or 2027.\nThe interconnection process is changing due to FERC Order 2023. The process could extend the timeline for projects to achieve COD due to the transition to the cluster study process. By receiving authority to develop, own, and operate up to 1,000 MW of BESS, the Company can focus on initiating the necessary interconnection requirements to connect to the grid and ensure projects are able to meet a 2027 COD.\nSupply chain lead times and costs for power generation and transmission equipment can fluctuate greatly from year to year. In early 2023, 230-kV breakers had a REDACTED lead time. By the second half of 2023 this shifted to REDACTED REDACTED for some vendors that responded to a recent request for information. Other major equipment such as batteries, medium voltage transformers, potential transformers, and inverters also have varying lead times that can change quickly based on world events. Having a portfolio of known projects will allow the Company to make more informed advanced procurement decisions and ensure economies of scale both from a labor and equipment perspective.\nIf the Company isn’t granted the authority and flexibility to develop, own, and operate up to 1,000 MW of BESS as requested, then it won’t be able to deploy additional battery storage projects to meet increasing capacity demands in 2026 and 2027.", "attachment_filenames": "STF-JKA-2-23", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-24", "is_protective_disclosure": "yes", "question": "Regarding alternative resources considered:\nProvide a list of all alternative resources considered, but that were discarded, with important details, including costs, capacity, counterparty, term length, energy, timing, etc., and provide reasons they were not ultimately pursued.\nProvide documentation supporting the alternative resources, including agreements, memos, letters, term sheets, analyses, electronically with all formulae intact.\nPlease provide a copy of 4.1 Ranking and Summary of Results (2024 NPV $/kW) with all alternative resource options considered included.  Provide it electronically, including evaluation analysis spreadsheets, with all formulae intact.\nProvide all responses received from counterparties that responded to the Company’s RFI.  Provide all information electronically with all formulae intact.\nProvide all analyses performed to date evaluating the responses received from counterparties that responded to the Company’s RFI.", "response": "Below is a list of resources the Company considered but discarded.\nPlease see the Company’s response to STF-JKA-2-24 part (c) for more information on the Company’s consideration of Plant Yates Units 8-10 with annual Firm Transportation (“FT”). This option for Plant Yates Units 8-10 would allow for additional capacity from the units that is not available on oil operation. While the Plant Yates Units 8-10 option is recommended, the ability to rely on the additional capacity with firm gas transportation during extreme conditions is not recommended for the 2023 IRP Update. This is driven by uncertainty with the ability to procure adequate FT, and associated pipeline expansion, in a timely manner.\nPlant Lindsay Hill is an REDACTED REDACTED REDACTED. Please see TS STF-JKA-2-24 Attachment A for the details of the potential option. This option was ultimately not pursed due to timing issues and transmission system limitations. Transmission system limitations prevent the resource from providing reliable capacity until 2029. Therefore, this option was not considered a viable option to meet capacity needs before 2029. The Company will continue to assess opportunities like Plant Lindsay Hill during future solicitation while seeking to gather more information during request for information (“RFI”) processes.\nContinuing to Operate Plant Wansley Units 1-2 on coal. The Company did not pursue this option because of high risk that this option cannot meet capacity needs in 2027-2028. Additionally, this would require sign off and participation from the co-owner which is not known at this time. Significant additional environmental compliance costs, as well as potential future permitting and operational constraints related to environmental requirements, are anticipated in order to continue to operate Plant Wansley Units 1-2 on coal. The capacity contribution would be around 930 MW.\nContinuing to Operate Plant Wansley Units 1-2 on gas. Please see TS STF-JKA-2-24 Attachment B for information on costs associated with this option. This would require sign off and participation from the co-owners. The gas supply remains uncertain while additional gas to this area could cause gas pressure and operational reliability issues. The capacity would be around 930 MW.\nMore battery energy storage systems (“BESS”). The Company is still exploring these options and will update the Commission as it identifies opportunities that can meet capacity needs.\nREDACTED REDACTED was considered for purchase; however, the terms did not work out. Additional ownership in REDACTED would have provided REDACTED REDACTED. REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.\nAdditional retail affiliate PPA capacity. This option was not approved by counterparties.\nPlease see TS STF-JKA-2-24 Attachment A for the potential Lindsay Hill option. Please see TS STF-JKA-2-24 Attachment B for the assumed cost to continue operation of Plant Wansley Units 1-2. Please see TS STF-JKA-2-24 Attachment C for economic analysis for Plant Yates Units 8-10 with annual FT.\nPlease see TS STF-JKA-2-24 Attachment C. This workpaper includes the economic ranking analysis with Plant Yates Units 8-10 operating with annual FT. This workpaper also includes an assessment of Plant Wansley Units 1-2 operating on natural gas.\nPlease refer to the “TS_Zip_AllResponses_(XML+PDFs).zip” and “TS_AllResponses_RawDataTranslatedToExcel.xlsx” files located in the “1 TS Request for Information” folder of the “TS 2023 IRP Update Supplemental Filing 12-4-23 Workpapers,” which were previously provided to the Commission Staff on December 4, 2023, with the 2023 IRP Update Supplemental Filing.\nPlease refer to the “Request for Information Summary” document, which was filed in the Company’s 2023 IRP Update Supplemental Filing on December 4, 2023. Please also refer to the “TS_ResponseDataScrubbed_ForRFISummary.xlsx” file located in the “1 TS Request for Information” folder of the “TS 2023 IRP Update Supplemental Filing 12-4-23 Workpapers,” which were previously provided to the Commission Staff on December 4, 2023, with the 2023 IRP Update Supplemental Filing.", "attachment_filenames": "STF-JKA-2-24; PD STF-JKA-2-24 Attachments A, B, C.docx", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-25", "is_protective_disclosure": "yes", "question": "Section 3.4 Transmission\nProvide all transmission screening analyses performed, electronically with all formulae intact.\nIn the context of performing transmission screening analysis, explain this discussion further and explain why this was included: “as well as the potential impact to capacity contributions in the economic assessment of each resource.”\nThe Transmission Screening Analysis Technical appendix mentions a Lindsay Hill PPA, please explain what that PPA is.\nThe Company has stated that between 1,000 and 1,400 MW of capacity would be built at Yates, and the Transmission Screening analysis indicates that if the full capacity (1,400 MW) is built, $80 million would be required in transmission upgrades.  Why is $80 million of transmission upgrades necessary given that Yates originally had transportation capacity for seven coal generation units and five coal units have been retired. Identify the specific transmission capital expenditures necessary to accommodate the addition of CT capacity at Plant Yates What capital expenditure amount would be required if 1,000 MW were built at Yates?\nThe file TS Transmission Screening Analyses.docx in the TS 2023 IRP Update Models and Workpapers.zip states: “Due to the size of the model files, Transmission Screening Analyses workpapers are provided via flash drive.” Please identify where these files were provided. if in fact they have been.  If they have not been provided, please expedite delivery of the files.", "response": "All transmission screening information was provided to Commission Staff via four 128GB trade secret thumb drives on October 31, 2023.\nThe transmission screening analysis considered the full output of each resource under consideration. The results of the transmission screening analysis impacted the Economic Analysis. In certain situations, the transmission system requires improvements before units can reach their maximum output during peak periods which impacts capacity contributions. Until these improvements are completed, the Company’s economic analysis assumed resources could only provide capacity contribution up to the amount of capacity available on the transmission system. For example, the output of Plant Yates Units 8-10 is limited to 600 MW during peak periods until summer of 2028. After the summer of 2028, the transmission system can accommodate the full output of Plant Yates Units 8-10. For REDACTED REDACTED, the transmission system can only accommodate capacity in the non-summer months until improvements are completed, which is not expected to be achievable until 2031. The other resources included in the economic analysis did not have these transmission system limitations. Therefore, the Company can count on their full output, or full capacity contribution, during peak periods.\nThe Lindsay Hill power purchase agreement (“PPA”) was a potential resource that was considered by the Company. Due to transmission impacts, the Lindsay Hill PPA was determined not to be a viable option for the 2023 IRP Update.\nWhen Plant Yates Units 1 – 5 were decertified in the 2013 IRP and subsequently retired on April 15, 2015, the transmission service required for the units was no longer preserved in the transmission planning cases.  The $80M in transmission upgrades is to secure the transmission service for Plant Yates Units 8 – 10.\nSee response to part (a) of STF-JKA-2-25.", "attachment_filenames": "STF-JKA-2-25", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-26", "is_protective_disclosure": "yes", "question": "Regarding the Transmission results in the file TS Economic Analysis of Capacity resources, Tab = Summary:\nPlease explain why there is no transmission cost for the REDACTED REDACTED, but there is with REDACTED REDACTED.\nExplain why Moody BESS, Robins BESS, MPC PPA, and Santa Rosa do not require any transmission expense.\nExplain why the REDACTED BESS + Solar does not require any transmission expense when it is a Greenfield site.", "response": "Please see the Company’s responses to STF-JKA-1-3 part (c) and STF-JKA-1-3 part (d).\nPlease see the Company’s response to STF-JKA-1-3 part (e).\nPlease see the Company’s response to STF-JKA-1-3 part (e).", "attachment_filenames": "STF-JKA-2-26", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-27", "is_protective_disclosure": "no", "question": "See Term Equalization Section 3.5\nWhy did the Company conduct modeling using the avoided cost analysis which required assumptions about what to do for the remaining study period when resources had shorter lives than Yates Units 8-10.  In other words, why didn’t the Company perform optimization analysis in Aurora and allow Aurora to optimally select the correct resources, the optimal timing, and fill out the expansion for the entire study period.  Please explain.\nPlease identify all pros for the modeling approach the Company took in conducting its analysis.\nPlease identify all cons for the modeling approach the Company took in conducting its analysis.\nWhat alternatives to using Yates units 8-10 did the Company consider and why did the Company decide to use Yates 8-10.", "response": "The economic ranking analysis compares the relative cost and benefits of each resource option available to the Company. However, the Company must select each unique resource to meet the identified capacity needs. Therefore, economic analysis provides useful cost and benefit information for each resource while all resources should be selected to meet near-term capacity needs. Performing an alternative portfolio optimization analysis in Aurora of these options would simply be offering Aurora a predetermined answer with no alternatives to meet near term capacity needs. An alternative longer term resource selection beyond what is included in the 2023 IRP Update will be the subject of future request for proposals (“RFP”) and IRP activities.\nIn general, the main advantages of this method are increased flexibility, reduced run time, and less computing power requirements while maintaining accuracy. Given the condensed timeframe to compile the 2023 IRP Update economic analysis, the Company maintained its past practice with many of its cost-benefit analyses using the avoided energy costs approach. This approach was used consistently across all resources for the ranking analysis. Additionally, the Company must add all resources to meet forecasted capacity needs. The economic analysis inputs and results can be provided in a transparent manner supported largely by spreadsheet-based information with granular detail.\nThe Aurora expansion planning style analysis can capture certain interactive impacts of resource decisions in its simulations. However, the expansion planning style analysis in Aurora’s modeling, or optimization model’s generally, rely on certain precision levels or solve tolerance thresholds. Given the size of the Southern Company system, the precision tolerance of the solution algorithm in any solve can easily be larger than the difference in net value of any single unit or resource selection decision. Therefore, the difference in optimization solves between decisions within Aurora can be due to imprecision in the solution algorithm. This issue is manageable but does require additional steps, longer runtimes, or extra runs to ensure results from Aurora are truly optimal. This is not required in the Company’s economic analysis approach.\nPlease see Technical Appendix Economic Analysis of Capacity Resources Section 3.5 on the selection of Plant Yates Units 8-10. The Company selected a combustion turbine (“CT”) for Term Equalization as it continues to represent the lowest repeatable fixed costs option or capacity resource to meet peak demands. Notably, the economic carrying costs ($/kW-yr) of Plant Yates Units 8-10 are lower than the Battery Energy Storage System options. Additionally, Plant Yates Units 8-10 represent the most recent information on the costs of a new CT. Therefore, it was used to represent the marginal costs of capacity.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-28", "is_protective_disclosure": "yes", "question": "Refer to TS Technical Appendix 5 TS BESS Co-located Solar Folder file: “TS Technical Information Supporting the Proposal to Develop 200 MW BESS Co-located with 200 MW Solar.docx” and excerpt that states: ”REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED” Provide a copy of REDACTED REDACTED REDACTED.", "response": "Please see TS STF-JKA-2-28 Attachment for a copy of REDACTED REDACTED REDACTED.", "attachment_filenames": "STF-JKA-2-28; PD STF-JKA-2-28 Attachment.docx", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-29", "is_protective_disclosure": "no", "question": "The Company modeled solar resource options within Aurora for future selection in its Long Term Capacity Expansion (LTCE) studies (Mix Study) and in the Economic Analysis supporting proposed Capacity Resources (Economic Analysis). For each study type – please describe the following:\nPlease explain how the Company accounted for renewable integration within the Aurora LTCE modeling.\nPlease explain what studies were done to validate the Company’s modeling of solar in Aurora was reasonable.\nWere capacity equivalence values/capacity contribution values adjusted or dynamic based on solar penetration? If so, please provide the workpapers supporting the derivation of this input and the specific aurora input table/column adjustment. Please compare this value to the ELCC study. If not, please explain why not and why the Company believes the current modeling analyses are reasonable.\nWere solar integration charges in $/MWh considered or modeled? Were they adjusted or dynamic based on solar penetration? If so, please provide the workpapers supporting the derivation of this input and the specific Aurora input table/column adjustments. If not, please explain why not and why the Company believes the current modeling analyses are reasonable.\nWas support capacity considered? If so, please provide the workpapers supporting the derivation of this input and the specific Aurora input table/column adjustment. Were CTs or BESS tied to solar selection in any way? If not, please explain why not and why the Company believes the current modeling analyses are reasonable.\nWere the operating reserve or spinning reserves requirements modeled in Aurora adjusted or dynamic to reflect increasing penetrations of solar? If not, please explain why not and why the Company believes the current modeling analyses are reasonable.\nDoes the Company anticipate solar curtailments with increased penetrations? Are these modeled within Aurora? Please explain how the Company evaluated the curtailments in Aurora, what output was reviewed, and the findings of any investigations conducted.", "response": "The Company applied a $1.52/MWh cost for renewable integration to the LTCE runs completed within the Resource Mix Study. To accurately reflect renewable integration costs in future generic solar decisions, it is incorporated as a variable cost to generic solar by utilizing the cost associated with increased solar penetration along with storage build. These costs were calculated from the mitigation costs in Table 4 of the 2022 IRP Renewable Integration Study (“RIS”).\nThe Company’s transition to Aurora for capacity expansion planning was a multi-year effort. During this time, the Company engaged with the Aurora vendor to learn from their experiences with incorporating solar resources into expansion planning. This effort included detailed exploration into the value calculations of each solar expansion resource offering in each iteration of Aurora’s LTCE solve. The Company further tested solar using its scenario planning process in which fuel and carbon prices were varied. The correlation of both the timing of solar selection and the magnitude of solar expansion to the fuel and carbon prices is intuitive. Higher fuel and carbon price assumptions resulted in greater solar expansion compared to scenarios with lower fuel and carbon prices. These results demonstrated that the Company solar modeling was sufficient.\nGeneric solar additions are assumed to have zero capacity value in the Aurora studies. The system’s capacity needs are driven by the winter season during which solar has minimal capacity value. In addition, solar capacity values decline as solar penetration increases. The system has approximately 6,300 MW of existing, committed, and planned solar by the time generic solar is available in 2027 and approximately 14,000 MW of solar in the plan overall. Given that system needs are driven by the winter season and the system has over 14,000 MW of existing and committed solar, incremental generic solar is expected to provide minimal winter capacity value. Therefore, generic solar is modeled as an energy-only resource in the IRP.\nSince the 2022 IRP, the Company updated resource economic load carrying capabilities (“ELCCs”) to ensure all capacity equivalence values are up to date with any projected system changes. The results of the most recent ELCC analysis show that once total solar on the system reaches 8,500 MW, the Winter ELCC value for solar drops to 0%. This is consistent with the assumption that generic solar additions receive zero capacity value in Aurora studies. See STF-JKA-2-11 Attachment F for the results of the most recent solar ELCC analysis.\nSolar integration costs were considered in the model at a cost of $1.52/MWh in 2025 dollars, rising over time at inflation. This cost does not change as solar penetration increases, based on the assumption that BESS would likely be built alongside solar and would help to mitigate additional integration costs that could occur. This assumption comes from the 2022 IRP RIS. Table 4 of the RIS details the specific mitigation costs associated with increased solar and BESS penetration. At around 10,000 MW of solar penetration, this cost begins to level off and converge. Because the system has approximately 14,000 MW of existing and committed solar, the $1.52/MWh solar integration cost reflects the average integration cost of the 10,000 – 20,000 MW of solar penetration.\nIntegration costs within Aurora can be found as an annual time series in the New Resources table in column Var Cost Mod2.\nPursuant to the 2022 IRP, Support Capacity is no longer a component of the Renewable Cost Benefit Framework (“RCB”). Consistent with the RCB, Solar Integration Cost was applied as described in parts (a) and (d) above. Flexible resources such as BESS were not tied to solar selection; however, the Aurora o
