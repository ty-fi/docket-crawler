 Operating Company is responsible for maintaining adequate resources to reliably serve its own obligations.\nSee STF-JKA-6-1 Attachment A for a revised Load and Resource table that accounts for Georgia Power relying on reserve sharing. To maintain consistency with the Load and Resource table provided at the time of filing, STF-JKA-6-1 Attachment A does not reflect any of the proposed resource additions as requested in the 2023 IRP Update, which would likely have a large impact on the reserve sharing MWs that are available to Georgia Power. Also, see “TS GPC and System IRP Summary Data” filed with the Commission on October 27, 2023, which illustrates the System capacity balance and status of the System at the time the Company filed its 2023 IRP Update.\nThe Southern Company System capacity need is REDACTED. As stated in part (a), while Georgia Power may have the potential to utilize planning reserve sharing to slightly lessen their capacity need in future years, other retail Operating Companies may decide at any point to retire some of their capacity, make it available for wholesale contracts, or may experience a similar increase in economic development activity that may make their surpluses unavailable.\nThe Company’s Target Reserve Margin (“TRM”) for both short term and long term have changed from the 2022 IRP due to the updated diversity factors that are applied to the Southern Company System TRM. Both the 2023 IRP Update and the 2022 IRP utilized the 25.5% short term TRM and 26% long term TRM for the System, but the diversity factors are updated annually based on a historical ten-year average of monthly diversities, resulting in different TRMs for the Company. The 2022 IRP TRM was 24.69% and 25.18% for short- and long-term, respectively. The 2023 IRP Update TRM is 24.43% and 25.00% for short- and long-term, respectively.\nYes, the System TRM is based on the same SERVM analysis that was performed in the 2022 IRP.\nCalculations to derive the Georgia Power TRM based on diversity are provided in TS STF-JKA-6-1 Attachment B. Workpapers used to develop the diversity factors for the 2023 IRP Update are provided in STF-JKA-2-10 Attachment A.", "attachment_filenames": "STF-JKA-6-1; PD STF-JKA-6-1 Attachment B.xlsx; STF-JKA-6-1 Attachment A.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217231, "filing_description": "DKT 55378 STF-JKA-6 Data Request Responses", "filing_date": "1/26/2024", "staff": "JKA", "doc_id": "STF-JKA-6-2", "is_protective_disclosure": "no", "question": "Refer to the Company’s Load and Resource table, “Georgia Power Territorial Base Case Load vs. Existing Capability Table.xlsx.” Refer to Dispatchable DSO’s beginning around line 318:\nOn row 321, the Company includes an assumptions for DER Customer Programs to grow to approximately 148MW by 2028.  Please explain what programs are captured in this line item.\nWhat could be done to accelerate the growth of these programs if it would help meet reserve margin requirements.\nOn row 322, the Company notes DPEC of approximately 80MW, whereas in the 2022 IRP, the Company was expecting 160MW.  Please explain the change.", "response": "The line item refers to the Distributed Energy Resource (“DER”) Customer Pilot approved in the 2022 IRP and implemented through the RAS-1 and DRC-1 tariffs.\nBased on customer feedback received regarding the DER Customer Pilot Program, the Company has developed the two new DER programs (DCO & DCL), both of which should help to accelerate adoption of dispatchable DER. Deploying a DERMS platform will further enable the growth of dispatchable Demand Side Options (“DSOs”).\nThe updated value for DPEC reflects the most recent inputs regarding the response rate, program parameters, and coincidence between the potential load reduction and projected periods of extreme supply and demand conditions, as captured by the ELCC.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217231, "filing_description": "DKT 55378 STF-JKA-6 Data Request Responses", "filing_date": "1/26/2024", "staff": "JKA", "doc_id": "STF-JKA-6-3", "is_protective_disclosure": "yes", "question": "The Company’s Aurora change set associated with the REDACTED project economic evaluation appears to add a REDACTED REDACTED REDACTED annual timeseries.  Please explain how this time series is used in the analysis and how it is applied to the project(s) modeled.", "response": "The REDACTED REDACTED annual timeseries was entered to apply degradation to the REDACTED solar project. The values represent a percentage and are multiplied by the base solar profile in Aurora.", "attachment_filenames": "STF-JKA-6-3", "confidentiality_files": ""}, {"filing_api_id": 217231, "filing_description": "DKT 55378 STF-JKA-6 Data Request Responses", "filing_date": "1/26/2024", "staff": "JKA", "doc_id": "STF-JKA-6-4", "is_protective_disclosure": "no", "question": "Regarding the Company’s Request for Information Summary, Section 2.1, the Company notes, “The remaining qualifying submissions either indicated new or planned potential projects.”  Please explain the difference in the Company’s use of the words “new” and “planned.”", "response": "The Company was seeking information on existing or planned projects as part of the Request for Information (“RFI”) issued in September 2023. Respondents were able to indicate three options with their submissions: existing, planned, or new. The Company did not define these options within the RFI, but the intent was to capture information on existing, planned, or new projects available in the market within the timeframes addressed in the RFI, including information on projects that may participate in the Company’s forthcoming All-Source Capacity RFP. The Company anticipates that “new” projects refers to projects that may or may not be originating (e.g., site control not yet secured, interconnection plans not yet known, etc.) and “planned” projects to indicate that respondents have performed necessary diligence (e.g., secured site control, are actively working with a transmission service provider, etc.) to originate a project and may be in various stages of project development.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217231, "filing_description": "DKT 55378 STF-JKA-6 Data Request Responses", "filing_date": "1/26/2024", "staff": "JKA", "doc_id": "STF-JKA-6-5", "is_protective_disclosure": "yes", "question": "Regarding the Company’s Request for Information Summary, Section 2.3, the Company states, “There is not enough time for an RFP to be conducted, resources to be constructed following certification, and transmission projects to be identified and completed to allow delivery by the end of calendar years 2025, 2026 or 2027.”\nPlease explain if the Company could have considered an agreement outside of an RFP process, such as an unsolicited offer.\nPlease explain how the Company was able to negotiate the Santa Rosa PPA outside of an RFP, but did not consider negotiating an agreement for any of the RFI identified projects the same way.\nPlease explain how the Company was able to negotiate the Mississippi Power agreement outside of an RFP, but did not consider negotiating an agreement for any of the RFI identified projects the same way.\nPlease explain what transmission constraints are a barrier to the ESS projects identified in the RFI, but are not a barrier to the REDACTED Solar + BESS projects.", "response": "Yes, the Company could consider an agreement outside of a Request for Proposal (“RFP”) process for the potential new or planned projects that responded to Georgia Power’s Request for Information (“RFI”). However, the Company would need to solicit additional information, including pricing, from such projects and evaluate the generation and transmission costs and benefits for each response to determine which projects are viable, which projects are most cost-effective, and when the Company could receive delivery from each potential project. Any transmission upgrades required by new generation resources must be identified and constructed, which can take substantial time given the current long lead times on the procurement and supply of transmission equipment. Instead, as described in the Company’s response to STF-PIA-4-16(d), the Company is currently focusing its efforts on identifying existing sites where battery energy storage systems (“BESS”) can be deployed and deliver energy to the transmission system prior to November 2027.\nThe Santa Rosa Energy Center was a known, existing generation asset that was identified in July 2023 as a potential resource to meet the Company’s 2023 IRP Update capacity needs. Given identification in July 2023 and the fact that it is an existing asset that can meet the Company’s generation needs in the 2023 IRP Update without the construction of transmission projects, the Company was able to negotiate a power purchase agreement (“PPA”) with Santa Rosa Energy Center, LLC, prior to filing the 2023 IRP Update on October 27, 2023. The Company issued its RFI in September 2023 to gather market information regarding the availability of existing and planned capacity resources for years 2026-2031. The RFI closed on October 24, 2023 and confirmed that no existing capacity resources could help meet the Company’s capacity needs being addressed in the 2023 IRP Update. For potential new or planned projects, the Company would need additional information, including pricing, from the respondents to determine viability, cost-effectiveness, and deliverability of each potential project. See the Company’s response to part (a) for transmission considerations for potential new or planned projects.\nThe Mississippi Power PPA consists of known, existing generation assets and was identified in July 2023 as a potential resource to meet the Company’s 2023 IRP Update capacity needs. Given identification in July 2023 and the fact that it contains existing assets that can meet the Company’s generation needs in the 2023 IRP Update without the construction of transmission projects, the Company was able to negotiate a PPA with Mississippi Power prior to filing the 2023 IRP Update on October 27, 2023. The Company issued its RFI in September 2023 to gather market information regarding the availability of existing and planned capacity resources for years 2026-2031. The RFI closed on October 24, 2023 and confirmed that no existing capacity resources could help meet the Company’s capacity needs being addressed in the 2023 IRP Update. For potential new or planned projects, the Company would need additional information, including pricing, from the respondents to determine viability, cost-effectiveness, and deliverability of each potential project. See the Company’s response to part (a) for transmission considerations for potential new or planned projects.\nThe REDACTED BESS plus solar project utilizes existing transmission interconnection infrastructure, and the Company’s transmission screening analyses indicate that the project can deliver up to 200 MW of energy to the transmission system through the summer of 2029. Once prior planned transmission projects are completed by the summer of 2029, the project could deliver up to 415 MW to the grid. For potential new or planned projects in the RFI, the Company would need additional information, including pricing, from the respondents to determine viability, cost-effectiveness, and deliverability of each potential project. See the Company’s response to part (a) for transmission considerations for potential new or planned projects.", "attachment_filenames": "STF-JKA-6-5", "confidentiality_files": ""}, {"filing_api_id": 217231, "filing_description": "DKT 55378 STF-JKA-6 Data Request Responses", "filing_date": "1/26/2024", "staff": "JKA", "doc_id": "STF-JKA-6-6", "is_protective_disclosure": "yes", "question": "Regarding the Company’s Supplemental filing regarding the RFI, specifically the files: “TS_ResponseDataScrubbed_ForRFISummary.xlsx” and “TS_AllResponses_RawDataTranslatedToExcel”:\nSTF-JKA-4-10 sought a summary of bid price terms for each bid received, and any evaluations/comparisons of the bid prices. If the Company has not provided such a summary of bid price terms, and any evaluation/comparisons/economic evaluations please provide such summaries and evaluations. If this has already been provided, please identify where.  If this does not exist, and the Company cannot create it for this response, please explain why not. Also, other documentation the Company provided regarding each individual bid potentially has this information, however, there are a large number of undefined terms, which a summary necessary.\nPlease explain why the Company did not provide a discussion of the economic evaluation of the bids in the report provided as a Supplemental filing, entitled, “DOCKET NO. 55378 2023 REQUEST FOR INFORMATION FOR CAPACITY RESOURCES – SUMMARY OF RESULTS.”  If the economic evaluation was discussed, please identify where and provide or where the economic evaluation results may be found.\nIt appears that there are a number of projects from REDACTED REDACTED.  Please provide an analysis that compares the price of the RFI REDACTED ESS projects to the Company’s proposed BESS projects (Moody, Robins, and REDACTED). Provide the analysis in excel format with formulas intact.\nIt appears that there are a number of projects from REDACTED REDACTED. Please provide an analysis that compares the price of the RFI REDACTED REDACTED to the Company’s proposed BESS projects (Moody, Robins, and REDACTED). Provide the analysis in excel format with formulas intact.\nIt appears that there are a number of projects from REDACTED REDACTED for ESS projects. Please provide an analysis that compares the price of the RFI REDACTED REDACTED REDACTED ESS projects to the Company’s proposed BESS projects (Moody, Robins, and REDACTED). Provide the analysis in excel format with formulas intact.\nPlease provide cost and status of possible interconnection for these projects.\nPlease explain if the Company has investigated these projects outside of an RFP.  If not, please explain why not.\nPlease explain if the Company has ever entered into a PPA with these developers before.", "response": "Please refer to the Company’s response to STF-PIA-9-13(b).\nPlease see the Company’s response to STF-JKA-2-24(d). In addition, the Request for Information (“RFI”) conducted was not a Request for Proposals and therefore the submissions were not bids, pricing was not required or provided by all respondents, and no economic or transmission evaluation was performed for the responses provided in the RFI.\nPlease see the Company’s response to STF-JKA-6-6(b) above.\nPlease see the Company’s response to STF-JKA-6-6(b) above.\nPlease see the Company’s response to STF-JKA-6-6(b) above.\nPlease see the Company’s response to STF-JKA-6-6(b) above. The RFI was not an RFP and no interconnection studies were performed as a part of the RFI. Although the RFI did ask respondents to provide the available status or information related to interconnection, this information was optional.\nPlease see the Company’s response to STF-JKA-6-5 parts (a)-(c). No, the Company did not approach any of these possible projects.\nThe Company has not previously entered into a PPA with REDACTED, REDACTED, or REDACTED REDACTED. However, the Company has previously entered into PPAs with REDACTED, but this company is no longer the counterparty to those PPAs.", "attachment_filenames": "STF-JKA-6-6", "confidentiality_files": ""}, {"filing_api_id": 217231, "filing_description": "DKT 55378 STF-JKA-6 Data Request Responses", "filing_date": "1/26/2024", "staff": "JKA", "doc_id": "STF-JKA-6-7", "is_protective_disclosure": "yes", "question": "Refer to the Company’s 2023 IRP Testimony on pages 33 and 35 that discusses the remarketing of Santa Rosa and the Mississippi Power capacity prior to Georgia Power’s year of need. The Company noted that it is requesting regulatory asset treatment of its costs.\nPlease explain if the Company included this impact in the economic evaluation presented for the Santa Rosa project.  If not, why not?  If so, where?\nPlease explain who the counterparty is for the Mississippi Power sale, and provide a discussion of the terms and conditions of the sale. Please provide a copy of the agreements reached.\nPlease provide a narrative update as to the status of the Santa Rosa sale and whether a counterparty has been identified and terms reached.  Please provide a copy of the agreements reached.\nPlease confirm that the terms of the Santa Rosa contract spans January 2024 through December 2028, and that the Southern Company system doesn’t have a need until REDACTED REDACTED.\nPlease explain if GPC could have obtained capacity through the IIC from Southern Company in the REDACTED period, and that the Santa Rosa contract is only serving a resource need for the system in REDACTED.", "response": "The Company’s economic evaluation includes the benefits of remarketed capacity associated with the Mississippi Power Company Power Purchase Agreement (“PPA”) based on an already executed sale of capacity and energy to another regional electrical service provider. The Company did not assume this benefit for the Santa Rosa PPA in the economic evaluation as there is no executed contract currently in place. If additional capacity is remarketed from the Santa Rosa PPA, this would improve the economics of the Santa Rosa PPA assuming no other changes and remarketed capacity remains before the year of need. The Company did not explicitly reflect the regulatory asset treatment of its costs in the economic evaluation. However, the Company did consider the annual revenue requirement impact of the regulatory asset in its assessment of net impact to customers. Please see the Company’s response to STF-DEA-3-6 for this information.\nPlease see the Company’s response to STF-JKA-4-19(b) for the requested information.\nPlease see the Company’s response to STF-JKA-4-19(e) for the requested information.\nThe term of the Santa Rosa PPA, if approved by the Commission, begins on the first day of the month following Commission issuance of a certificate of public necessity and convenience for the PPA. If approved in accordance with the procedural and scheduling order of the 2023 IRP Update, the Santa Rosa PPA would become effective on May 1, 2024, and continue through December 31, 2028.\nThe Southern Company System is projected to have a capacity need by the winter of REDACTED. The Intercompany Interchange Contract (“IIC”) for the Southern Company System provides for coordinated planning between the Operating Companies and for the sharing of temporary surpluses and deficits of capacity. While the IIC affords participants the ability to rely on temporary surplus capacity on the System, each Operating Company is responsible for and expected to have adequate resources, including an appropriate level of reserves, to reliably serve its own load obligations. Any retail Operating Company that has excess reserves may decide at any point to retire some of the capacity or make wholesale sales predicated on some or all of that capacity provided that such Operating Company is maintaining adequate resources to reliably serve its own obligations. In either case (resource retirement or wholesale sale), the effect would be a reduction in the level of available capacity reserves on the System. Additionally, the other retail Operating Companies may experience increased economic development activity similar to what the Company is experiencing and may decide to not make their surpluses available to the Company while the economic development activity is being assessed.\nSee the Company’s response to part (d). Projected surplus capacity on the System is not guaranteed to be available to serve Georgia Power’s retail customers. The Santa Rosa PPA helps meet Georgia Power’s capacity needs for 2026-2028. For the benefit of customers, Southern Wholesale Energy, on behalf of Georgia Power, is attempting to remarket capacity associated with the Santa Rosa PPA for 2024-2025.", "attachment_filenames": "STF-JKA-6-7", "confidentiality_files": ""}, {"filing_api_id": 217231, "filing_description": "DKT 55378 STF-JKA-6 Data Request Responses", "filing_date": "1/26/2024", "staff": "JKA", "doc_id": "STF-JKA-6-8", "is_protective_disclosure": "no", "question": "In December, it was reported that Duke Energy disconnected the battery it had installed at Camp Lejeune, after lawmakers raised security concerns about the project.\nPlease explain what specific technology and equipment the Company is considering for the Moody and Robins projects.\nHas the Company conducted any investigation to determine if there are additional security concerns with BESS installations at these facilities? Please explain what investigation has been conducted.\nHas the Company had any communications with local officials at the Moody AFB and Robins AFB locations regarding these concerns?  Please provide a summary of the topics discussed and any information regarding security concerns.\nPlease provide a narrative explanation of the Company’s plans to mitigate physical and cybersecurity risks at these locations.", "response": "The Company is intending to use lithium iron phosphate (“LFP”) battery cells from tier 1 battery suppliers for the Robins and Moody projects. The BESS projects will incorporate equipment and technologies provided by reputable manufacturers.\nThe projects will adhere to the same cyber security protocols that the Company includes on all its projects. As part of the Company’s Technology Acquisition Process, Southern Company evaluates each new vendor’s security maturity in light of the inherent risk presented by the products and/or services they will provide the Company. Security concerns or shortfalls can then inform discussions regarding the need for compensating security controls, additional contractual obligations by the supplier, or (worst case) selection of alternate suppliers. Additionally, as specific technology solutions are integrated with the Company’s technology environments, they are reviewed for conformance with the Company’s technical requirements to reduce security risk while enabling desired business outcomes.\nTo date, no discussions have been held between the Company and local officials at Moody Air Force Base or Robins Air Force Bases regarding security concerns.\nThere is no direct communication link or physical tie between the proposed Company facilities and the military bases. These projects will adhere to the physical and cyber security protocols required of all Company facilities. All controls will meet the Company’s stringent communication and network requirements.\nThe Company prioritizes both physical and cyber security through layered defenses. The Company has established cyber security standards for generation facilities that specify the requirements for network architecture, physical access, electronic access, remote access, backups, system administration/updates, change management, transient cyber assets, and removable media.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217231, "filing_description": "DKT 55378 STF-JKA-6 Data Request Responses", "filing_date": "1/26/2024", "staff": "JKA", "doc_id": "STF-JKA-6-9", "is_protective_disclosure": "no", "question": "Please refer to the Technical Appendix document \"Technical Information Supporting the Proposal to Develop 178 MW of Battery Energy Storage Systems.....\" Figure 2.  This figure shows that in November 2023, procurement for certain equipment begins.  Has the Company started that procurement process?  If so, please indicate what has been done so far and the type of equipment being procured.", "response": "For the Robins and Moody Battery Energy Storage Systems (“BESS”) projects, the Company has started the procurement process. The Company sent out a Request for Proposal (“RFP”) to battery suppliers in November 2023 to determine a vendor for supply of the BESS equipment. Responses to the BESS RFP were received in December 2023, and the Company is evaluating proposals for BESS equipment procurement. A similar RFP was sent out for the Engineering, Procurement and Construction (“EPC”) scope in November 2023 to determine a contractor for these projects with responses anticipated in February 2024. The procurement scope under the EPC contract will include equipment not provided by the BESS vendor. The Company has also begun design and procurement discussions to determine additional equipment needed for interconnecting the BESS to the existing project level substation.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216531, "filing_description": "DKT 55378 - STF-JKA-1 Data Request Responses", "filing_date": "11/30/2023", "staff": "JKA", "doc_id": "STF-JKA-1-1", "is_protective_disclosure": "yes", "question": "See the file - TS Economic Analysis of Capacity Resources.xlsx, and the tab - Cost Inputs.\nProvide a description of how each row in the tab was derived.  If different approaches were used for the different resources evaluated, please provide separate explanations.\nProvide all workpapers, electronically with all formulae intact, showing the derivation of each cost input line and value.  Do not include any workpapers with pasted values.  If additional source workpapers were used, please provide those, and identify the spreadsheets that were used for each input so a full calculation trail exists.  If data was taken from another model, provide the output from the other model so that the calculation trail can be followed.", "response": "The costs on each row were pulled from the SAM workpapers provided to Commission Staff on October 27, 2023.\nAll resources have an associated SAM workpaper except for the Mississippi Power Company (“MPC”) Power Purchase Agreement (“PPA”) resource. For the MPC PPA, the capacity costs row contains formulas that multiply the capacity costs, size, and number of months to determine the annual costs. Also, for the MPC PPA, the additional sum row multiplies $3/kW-yr times the capacity of the PPA to determine the annual costs.\nPlease see the table below for the list of workpapers that support each cost input row. The data was pulled from the “SAM” models provided to Commission Staff on October 27th, 2023.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216531, "filing_description": "DKT 55378 - STF-JKA-1 Data Request Responses", "filing_date": "11/30/2023", "staff": "JKA", "doc_id": "STF-JKA-1-2", "is_protective_disclosure": "no", "question": "See the file - TS Economic Analysis of Capacity Resources.xlsx, and the tab – Energy Benefits.\nProvide a description of how each row in the tab was derived.  If different approaches were used for the different resources evaluated, please provide separate explanations.\nProvide all workpapers, electronically with all formulae intact, showing the derivation of each Cost and Benefit line and value.  Do not include any workpapers with pasted values.  If additional source workpapers were used, please provide those, and identify the spreadsheets that were used for each input so a full calculation trail exists.  If data was taken from another model, provide the output from the other model so that the calculation trail can be followed.  If any avoided cost analyses or Genval analyses were used in the evaluation, please provide such analyses.", "response": "To produce the results on each row in the tab, the Company utilized the Aurora production costs model using the avoided energy costs approach. For the Mississippi Power Company (“MPC”) Power Purchase Agreement (“PPA”), the Company did not use the Aurora model. Rather, the Company assumed zero production costs savings or energy benefits consistent with the structure of the PPA. Please see Technical Appendix Economic Analysis of Capacity Resources for more information.\nThe Aurora workpapers and model data were provided to Commission Staff on or before October 30, 2023.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216531, "filing_description": "DKT 55378 - STF-JKA-1 Data Request Responses", "filing_date": "11/30/2023", "staff": "JKA", "doc_id": "STF-JKA-1-3", "is_protective_disclosure": "yes", "question": "See the file – TS Economic Analysis of Capacity Resources.xlsx, and the tab – Transmission.\nExplain the process the Company went through to identify the capital investments for these projects.  Provide information separate for the REDACTED and the Yates units.\nProvide all workpapers, spreadsheets that were developed to create the capital investments values.  Provide this electronically with all formulae intact.\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.", "response": "The process used by the Company to identify the capital investments for the projects included in the 2023 IRP Update is described in Technical Appendix Transmission Screening Analyses and consistent with the approach used in prior Georgia Power Integrated Resource Plans (“IRPs”). The Company completed power flow analyses using Power System Simulator for Engineering (“PSSE”) to evaluate the need for transmission system improvements associated with each resource decision. Screening analyses consisted of N-1-G contingency criteria consistent with North American Electric Reliability Corporation (“NERC”) TPL-001-5 requirements. The Company’s analyses identify the need for potential improvements required to mitigate the identified reliability challenges. The capital costs represent the projected cost of these improvements.\nAs outlined in Technical Appendix Transmission Screening Analyses, scenario A1 reflects the results for the Mississippi Power Company (“MPC”) Power Purchase Agreement (“PPA”) and Santa Rosa PPA. Plant Scherer Unit 3 was also evaluated in Scenario A1. The Company did not identify any required capital projects to support the MPC PPA, Santa Rosa PPA, or extension of Plant Scherer Unit 3.\nScenario B reflects the impact of the proposed Plant Yates units. The process assumes the results for Plant Yates Units 8-10 are incremental to the results in Scenarios A1 and A2. During the screening analysis it was determined that 600 MW of the Yates CTs can be accommodated until improvements are completed in the summer of 2028. Upon completion of the improvements, the full output of the units can be accommodated.\nA previous screening analysis identified transmission system issues that required improvements to support REDACTED REDACTED REDACTED. Given the long-lead time nature of the necessary transmission system improvements, REDACTED REDACTED REDACTED in the screening analysis for the other resource evaluations.\nThe PSSE model information was provided to Commission Staff on October 31, 2023. Please see “TS Economic Analysis of Capacity Resources.xlsx” for information on how these capital costs are reflected in the economic analysis.\nREDACTED REDACTED is currently operating. Therefore, transmission capacity continues to be preserved to support ongoing operations. Transmission screening analysis indicated that REDACTED REDACTED REDACTED REDACTED REDACTED can be accommodated through the planning horizon.\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.\nRobins and Moody Battery Energy Storage System (“BESS”) are utilizing the point of interconnection and associated transmission system capacity available to the adjacent solar facilities. These facilities had been previously designated. The output of the combined BESS and solar system is limited to the transmission system capacity of the current solar interconnection.\nThe MPC PPA consists of extensions of existing units. Screening analysis indicated that these extensions can be accommodated during the PPA time period with no directly assignable projects. Similarly, screening analysis of the Santa Rosa PPA did not identify any attributable projects.\nTransmission screening analysis for REDACTED Solar + BESS identified local area constraints driven by the addition of the prior-queued resources. Therefore, two transmission projects were already identified for completion in 2026 in the area. The completion of these projects allows for the delivery of up to 200 MWs. This amount increases to 415 MW as additional prior planned projects reach completion in 2029.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216531, "filing_description": "DKT 55378 - STF-JKA-1 Data Request Responses", "filing_date": "11/30/2023", "staff": "JKA", "doc_id": "STF-JKA-1-4", "is_protective_disclosure": "yes", "question": "See the file – TS Economic Analysis of Capacity Resources.xlsx, and the tab – Term Equalization.\nFor each capacity value between cells G4 and BC16 that are pasted in, provide workpapers used to derive the pasted values.\nRow 2 of the tab shows capacity need years and shows that a need exists in 2027.  Does that represent 2 years advancement of the need year or 3?  If it represents 2 years explain why that was used as opposed to 3 years given the Company latest position is that the need year has advanced by 3 years compared to the 2022 IRP.\nCell J20 contains a pasted value of REDACTED. Please provide all workpapers used to derive that value, electronically with all formulae intact.  Also, explain why REDACTED REDACTED costs were used for the Marginal cost of capacity.  Also, please confirm that value includes both capacity and energy value.\nExplain why in the case of REDACTED, capacity value exists in REDACTED, not REDACTED, and then again beginning in REDACTED and after.  Why doesn’t it exist in REDACTED?\nExplain why capacity value for Yates 8-10 REDACTED REDACTED?\nExplain why capacity value for REDACTED BESS +Solar REDACTED.\nExplain what the Cost of Equalization is assumed to represent.", "response": "Please see TS STF-JKA-1-4 Attachment. This attached is redacted in its entirety to preserve working formulae.\nThe Company has a need in the winter of 2025/2026 or a 3-year advancement from the 2022 IRP. The need in winter 2025/2026 is 175 MW which grows to 1,875 MW in the winter 2026/2027. Given the relatively small winter of 2025/2026 need, the Company’s economic ranking analysis assumed the first year for term equalization costs would be winter 2026/2027 to establish a relative economic ranking of resource options.\nPlease see cell F2 in the “YatesCT” tab of the “TS SAM ('23) - 7.0.1 YatesCT Final.xlsm” workpaper provided to Commission Staff on October 27, 2023. A combustion turbine resource continues to represent the lowest repeatable fixed costs option or capacity resource to meet peak demands. Plant Yates Units 8-10 represent the most recent information on the costs of a new combustion turbine. Therefore, it was used to represent the marginal costs of capacity.\nThe value in cell J20 is only the fixed costs and does not include energy value. Energy value is reflected on row 21 and included in the net cost of capacity on row 22 of the same spreadsheet and tab.\nThe value in 2030 is not for capacity value of the resource. Rather, it represents term equalization capacity and is used to impute a capacity cost to the resource to reflect periods when REDACTED REDACTED cannot provide reliable capacity. This is considered for the summer of 2030 as the transmission system upgrades will not be in place by the summer of 2030 for this option. In calendar year 2030, the Company’s capacity constraint switches from winter to summer due to the timing of PPA expirations. REDACTED REDACTED  REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED. Please see TS STF-JKA-1-4 Attachment for more information.\nThe values in 2027 and 2028 are not for capacity value of the resource. Rather, they represent term equalization capacity and are used to impute a capacity cost to the resource to reflect periods when the proposed Plant Yates Units 8-10 cannot provide full output. Transmission system upgrades will not be completed until May of 2028. Until these upgrades are completed, Plant Yates Units 8-10 will be limited to 600 MW during peak conditions. An additional capacity cost is imputed to the resource to reflect the resource limitations. Please see TS STF-JKA-1-4 Attachment for more information.\nThe value in 2030 is not for capacity value of the resource. Rather, it represents term equalization capacity and is used to impute a capacity cost to the resource during the summer of 2030, which is the constraining season for that year. REDACTED BESS + Solar is assumed to provide 100% ELCC in the winter and 50% ELCC in the summer. Please see TS STF-JKA-1-4 Attachment for more information.\nPlease see section 3.5 of Technical Appendix Economic Analysis of Capacity Resources.", "attachment_filenames": "PD STF-JKA-1-4 Attachment.docx", "confidentiality_files": ""}, {"filing_api_id": 216531, "filing_description": "DKT 55378 - STF-JKA-1 Data Request Responses", "filing_date": "11/30/2023", "staff": "JKA", "doc_id": "STF-JKA-1-5", "is_protective_disclosure": "yes", "question": "See the file – TS Economic Analysis of Capacity Resources.xlsx, and the tab – Annual Economics.\nFor Additional Benefits that are pasted in at rows 19, 41, 64, and 174, please provide all workpapers used to derive those values and provide that electronically, with all formulae intact.\nExplain how the years for which additional benefits were included was decided.", "response": "Please see “REDACTED REDACTED REDACTED REDACTED” workpaper provided to Commission Staff on October 27, 2023, for the values rows 19 and 41. On the REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED are on row 80.\nThe formulas are intact for the values on row 64. These values represent the benefit associated with the sale of 500 MW to a regional electrical service provider for January 1, 2024, through September 30, 2025.\nPlease see “REDACTED REDACTED REDACTED REDACTED” workpaper provided to Commission Staff on October 27, 2023, for the values in row 174. On the REDACTED tab, the benefits associated with the production tax credit (“PTC”) are on row 40.\nThe additional benefits for REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED. Therefore, the benefits are reflected over those years.\nThe additional benefits for the Mississippi Power Company (“MPC”) Power Purchase Agreement (“PPA”) are for the years consistent with the wholesale capacity sale.\nThe additional benefits for REDACTED are associated with PTCs. Per the Inflation Reduction Act, this benefit lasts for 10 years.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216833, "filing_description": "DKT 55378 STF-JKA-3 Data Request Responses", "filing_date": "12/20/2023", "staff": "JKA", "doc_id": "STF-JKA-3-1", "is_protective_disclosure": "no", "question": "Provide the following assumptions expected to occur in actual operations for Yates 8-10.  Please provide these assumptions by year, by unit in an excel spreadsheet:\nRamp rate assumptions\nmin up and down time\nstart costs\nheat rate\nmaintenance rate\nFOR rate", "response": "Please see the response to STF-JKA-3-2. The assumptions used in the economic evaluation are generally expected to occur in actual operations unless otherwise noted in STF-JKA-3-2. Please see STF-JKA-3-7 for more information on why modeling Plant Yates Units 8-10 heat rate on oil operation may not reflect expected operations.", "attachment_filenames": "STF-JKA-3-10; PD STF-JKA-3-10 Attachment.xlsx; STF-JKA-3-11; PD STF-JKA-3-11 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216833, "filing_description": "DKT 55378 STF-JKA-3 Data Request Responses", "filing_date": "12/20/2023", "staff": "JKA", "doc_id": "STF-JKA-3-10", "is_protective_disclosure": "no", "question": "It appears that in the B2023 Aurora database (B2023_Final_GPC_IRP_update.apz), the Yates CT 8-10 units are mapped to a fuel price proxy “Yates CT 8-10_Marginal_Fuel_B23_MG0_DEPS_202209”. Please provide a B2024 database fuel price proxy that can be used as a fuel price proxy assumption for the Santa Rosa contract.", "response": "The Company assumes the last sentence in the question was simply a copy and paste error. Therefore, the Company assumes the question is seeking the fuel price proxy assumption for Plant Yates Units 8-10 and not Santa Rosa as requested in STF-JKA-3-9.\nThe “Yates CT 8-10_Marginal_Fuel_B23_MG0_DEPS_202209” fuel price proxy was created using a combination of Wilson Unit 1A oil prices in winter months (January, February, December) and Yates Units 6-7 gas prices in non-winter months. The B2024 fuel price proxies needed to recreate Plant Yates Units 8-10 oil/gas fuel prices are identified below:\nmn_Wilson 1A_Marginal_Fuel_B24_MG0_DEPS_202309_v2 (January, February, December)\nmn_Yates 6_Marginal_Fuel_B24_MG0_DEPS_202309_v2 (March – November)\nFor convenience, Plant Yates Units 8-10 B2024 oil/gas prices are provided in TS STF-JKA-3-10 Attachment.", "attachment_filenames": "STF-JKA-3-10; PD STF-JKA-3-10 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216833, "filing_description": "DKT 55378 STF-JKA-3 Data Request Responses", "filing_date": "12/20/2023", "staff": "JKA", "doc_id": "STF-JKA-3-11", "is_protective_disclosure": "yes", "question": "Refer to Aurora mix study (B2024 GPC IRP MG0 - P95.apz) and the modeling of change set “New Resource Availability – MG0” that includes the “new GPC PPA” resource.\nPlease provide the workpapers deriving the “SOCO Time Series Annual” table, “NEW_GPC_PPA_Capacity_Price” time series of REDACTED REDACTED in 2027 and REDACTED REDACTED in 2028. Please reconcile the derivation in to the provided costs included in the “TS Economic Analysis of Capacity Resources.xlsx.”\nRefer to the VOM $/MWh input mapped to “SOCO Time Series Monthly” table, “REDACTED REDACTED REDACTED” time series.  Please explain how the Company derived this energy price and how the Company determined it was a reasonable proxy for the REDACTED REDACTED.", "response": "Please see TS STF-JKA-3-11 Attachment for the derivation of the “NEW_GPC_PPA_Capacity_Price” time series. The derivation uses the same $/kW-month pricing included in the “TS Economic Analysis of Capacity Resources.xlsx.”\nThe “NEW GPC PPA Energy Price” time series is derived from the REDACTED REDACTED REDACTED, which serve as a proxy for the REDACTED. The time series is a REDACTED REDACTED REDACTED REDACTED REDACTED. Please see TS STF-JKA-2-7 Attachment for the B23 MG0 Aurora files and TS STF-JKA-2-6 Attachment A for the REDACTED REDACTED REDACTED REDACTED.", "attachment_filenames": "STF-JKA-3-11; PD STF-JKA-3-11 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216833, "filing_description": "DKT 55378 STF-JKA-3 Data Request Responses", "filing_date": "12/20/2023", "staff": "JKA", "doc_id": "STF-JKA-3-12", "is_protective_disclosure": "yes", "question": "Regarding the Company’s Battery modeling Aurora:\nPlease explain what ELCC study the Company is relying on in modeling the reliable capacity for new BESS projects as proposed (Robins, Moody, REDACTED) and what reliable capacity/capacity contribution is assumed. Provide a copy of any study that was conducted.\nPlease explain what ELCC study the Company is relying on modeling generic BESS in the Mix Study and what reliable capacity/capacity contribution is assumed.  Provide a copy of any study that was conducted.\nPlease explain if the ELCC studies relied on consider degradation, what degradation is assumed, and how that impacts the reliable capacity/capacity contribution as modeled.", "response": "The Company is using the BESS ELCC values referenced in part (b) and STF-JKA-2-11 or 100% for the aggregate facility consisting of both the solar and BESS components. The capacity contribution of Robins and Moody are adjusted to account for the point of interconnection (“POI”) limits associated with transmission system limitations. This adjustment subtracts the POI limit by the existing solar resource’s current capacity value to ensure that the combined facility (existing solar and incremental BESS) capacity value does not exceed the POI limit. Therefore, the Robins and Moody proposed BESS resources are only assigned the incremental capacity value, but the overall aggregate facility (consisting of both the existing solar and incremental BESS components) equates to 100% ELCC. Please see STF-JKA-1-4 Attachment for these calculations, which are on rows 54 and below on the Robins and Moody tabs. Since REDACTED is a new incremental resource for both the solar and BESS additions, the paired resource will receive a capacity credit of 200 MW.\nThe workpaper detailing the development of the generic BESS ELCC values used in the Resource Mix Study was provided with the response to STF-JKA-2-11. The first 3 GW of 4-hour BESS penetration are expected to have average capacity values of 100% in both the winter and summer seasons.\nThe ELCC studies do not consider degradation. The Company’s economic analysis assumes augmentation costs for BESS resources. These maintenance capital investments preserve the BESS nominal capacity, mitigating degradation.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216833, "filing_description": "DKT 55378 STF-JKA-3 Data Request Responses", "filing_date": "12/20/2023", "staff": "JKA", "doc_id": "STF-JKA-3-13", "is_protective_disclosure": "no", "question": "Refer to the Load and Resource Balance presented in “TS 2023 IRP Update Models and Workpapers.zip\\Main Document\\Figures 4, 5, 6, & 9 - Capacity Needs Data for B22, B23, and 2023 IRP Update.xlsx”\nPlease explain if these tables reflect the ongoing Hydro modernization projects.  If not, explain why not and provide the anticipated revisions.\nPlease explain if these tables reflect the Company’s current expected online date for the BESS demonstration projects Mossy Branch and McGrau Ford.  If not, please explain why not.", "response": "All Georgia Power hydroelectric generating units are included in the “Existing Capability” tables for the 2022 IRP, Budget 2023, and 2023 IRP Update. For units approved for hydro modernization projects, Georgia Power’s planning assumptions do not project hydro unit capacity values to change because unit capacity changes for IRP ratings are not final until the modernized equipment is procured, installed, and tested. Unit capacities will be updated, as available, for resource planning purposes in the assumptions for IRP modeling following the finalization of these values.\nWhile there have been no changes to unit capacity assumptions from the 2022 IRP to the 2023 IRP Update, unit availability assumptions have been updated for near-term unit outages for hydro modernization project work and for the following units that are offline indefinitely due to equipment that has become inoperable until repairs or replacements can be completed as part of the Company’s future Hydro Modernization projects:\nGoat Rock Unit 5 offline indefinitely,\nMorgan Falls Unit 4 offline indefinitely, and\nOliver Unit 4 offline until after modernization; currently assumed to be available in 2029.\nThese tables reflect the currently expected commercial operation of the McGrau Ford BESS project by the end of 2026, accounting for capacity from this project starting in the winter of 2026/2027. While the Mossy Branch demonstration project is currently expected to be online in 2nd Quarter 2024, Georgia Power’s planning assumptions do not include any capacity until the winter of 2026/2027, following the completion of testing.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216833, "filing_description": "DKT 55378 STF-JKA-3 Data Request Responses", "filing_date": "12/20/2023", "staff": "JKA", "doc_id": "STF-JKA-3-14", "is_protective_disclosure": "no", "question": "Regarding the setup of the Resource Mix study Aurora runs.\nWhy did the Company decide to leave out from modeling the resources the Company proposes to acquire to satisfy short term requirements?\nWhen the Company conducts IRPs, does it always leave out of the Resource Mix study proposed resources from the modeling? For example, why in past IRPs did the Company include as locked in resources solar capacity even those that solar capacity resource were only proposed resources at the time the Resource Mix study was performed.", "response": "The MPC PPA was the only proposed resource allowed to be selected in the Resource Mix Study. The MPC PPA negotiations were near final when the modeling was being conducted, and the MPC resources are already included in the model as pool resources making it easy to implement this assumption. The other proposed resources will be included in future modeling, if approved in this docket.\nNo, the Company doesn’t always leave out proposed resources in the Resource Mix Study modeling. The Company has included proposed resources in the Resource Mix Study modeling in past IRPs. For example, in the 2022 GPC IRP, the Company included the proposed RFP resources totaling over 2,350 MW in the mix study. In that case, an RFP process pursuant to Commission RFP Rules to address the 2025-2028 capacity needs had been conducted. Regarding the Company’s inclusion of proposed solar resources in past IRPs, solar resources have little to no winter reliable capacity value (0% ELCC), and therefore would not influence a capacity resource decision. While there isn’t a capacity need impact, the proposed solar would impact the avoided energy costs used to make demand and supply side decisions, so the Company determined it was important to include the proposed solar resources. For the 2023 IRP Update, the generic CT and battery resources serve as appropriate proxies for many of the proposed resources as it relates to the impact to avoided energy costs.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216833, "filing_description": "DKT 55378 STF-JKA-3 Data Request Responses", "filing_date": "12/20/2023", "staff": "JKA", "doc_id": "STF-JKA-3-15", "is_protective_disclosure": "no", "question": "Please see the last bullet on page 13 of PD Resource Mix Study.docx, which concerns capacity needs in 2027.\nPlease try to explain in more detail why this had to be done, as the Company’s explanation requires clarification.\nHow can the Company model a purchase agreement with Mississippi Power for just one year. What happens in the remaining years.\nIf the Mississippi Power PPA is acquired, how would the modeling of the Mississippi Power resources be different than they are modeled today. Please explain.\nIn any modeling performed for the IRP, did the Company model the Mississippi Power PPA per the proposed new contract terms? If so, please identify the inputs used to model the Mississippi Power PPA contract terms.", "response": "As stated in response to STF-JKA-2-2, the Company included the Mississippi Power PPA (“MPC PPA”) as an option in the Resource Mix Study. The capacity need for the Company is 1,875 MW in Winter 2026/2027. While the Company did not have to offer the MPC PPA, given the magnitude of the capacity need and to demonstrate the extraordinary value of the MPC PPA, it was offered as a selection option to help reduce the capacity need if economic to do so. As shown in the Resource Mix Study, it was an economic option and helped reduce the capacity need to be met with other resource options.\nThe Resource Mix Study is used to determine a roadmap for capacity resource additions once a capacity need has been identified. Because the System does not have a capacity need until Winter 2026/2027, the MPC PPA is modeled to reflect it being selected at the time of the capacity need. While this won’t capture the full 5-year cost of the MPC PPA, it will capture the market rate of capacity in the years 2027 and 2028 to allow generic capacity resource options to compete alongside it.\nWith the execution of the MPA PPA, the resource ledgers for Mississippi Power and Georgia Power will be appropriately adjusted to reflect the capacity that is purchased from Mississippi Power. This also includes updates to assumed unit unavailability dates for a few Mississippi Power units that were originally assumed to retire earlier but are now needed to support the MPC PPA. For modeling purposes, the Mississippi Power units will continue to be modeled as they are today in economic dispatch as Mississippi Power resources and the modeled pool energy accounting will incorporate energy sales associated with the MPC PPA.\nThe Resource Mix Study models the capacity and energy costs of the MPC PPA per the executed PPA provided in the Technical Appendix.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216833, "filing_description": "DKT 55378 STF-JKA-3 Data Request Responses", "filing_date": "12/20/2023", "staff": "JKA", "doc_id": "STF-JKA-3-16", "is_protective_disclosure": "no", "question": "With regard to solar and battery storage resources, please provide a reconciliation of the requirements of the 2022 IRP Commission Order to where the same specific resources were modeled in the 2023 IRP Aurora database to be able to match up the corresponding resources.", "response": "The reconciliation below is between the 2023 IRP Update Aurora database as submitted and the descriptions provided in the Main Document of the 2023 IRP Update filing.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216833, "filing_description": "DKT 55378 STF-JKA-3 Data Request Responses", "filing_date": "12/20/2023", "staff": "JKA", "doc_id": "STF-JKA-3-2", "is_protective_disclosure": "no", "question": "Provide the following assumptions as modeled in the economic evaluation (B2023_Final_GPC_IRP_update.apz ) for Yates 8-10.  Please provide these assumptions by year, by unit in an excel spreadsheet.  To the extent that the modeling does not reflect expected operations, please explain.\nRamp rate assumptions\nmin up and down time\nstart costs\nheat rate\nmaintenance rate\nFOR rate", "response": "Unless otherwise noted below, all modeling assumptions used in the economic evaluation for Plant Yates Units 8-10 are based on the best available information at the time of the analysis. This information is generally expected to match operations.\nPlease see TS STF-JKA-3-2 Attachment for ramp rate assumptions as modeled in the economic evaluation.\nPlease see TS STF-JKA-3-2 Attachment for min up and down time assumptions as modeled in the economic evaluation.\nPlease see TS STF-JKA-3-2 Attachment for start cost assumptions as modeled in the economic evaluation.\nPlease see TS STF-JKA-3-2 Attachment for heat rate assumptions as modeled in the economic evaluation. Please see STF-JKA-3-7 that addresses why Plant Yates Units 8-10 oil heat rate modeling may not reflect expected operations.\nPlease see TS STF-JKA-3-2 Attachment for maintenance rate assumptions as modeled in the economic evaluation.\nPlease see TS STF-JKA-3-2 Attachment for FOR assumptions as modeled in the economic evaluation.", "attachment_filenames": "STF-JKA-3-2; PD STF-JKA-3-2 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216833, "filing_description": "DKT 55378 STF-JKA-3 Data Request Responses", "filing_date": "12/20/2023", "staff": "JKA", "doc_id": "STF-JKA-3-3", "is_protective_disclosure": "no", "question": "Provide the following assumptions expected to occur in actual operations for the Santa Rosa PPA. Please provide these assumptions by year, by unit in an excel spreadsheet.\nRamp rate assumptions\nmin up and down time\nstart costs\nheat rate\nmaintenance rate\nFOR rate", "response": "Please see the response to STF-JKA-3-4. Unless otherwise noted in STF-JKA-3-4, the assumptions used in the economic evaluation are based on the terms of the PPA and are generally expected to occur in actual operations.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216833, "filing_description": "DKT 55378 STF-JKA-3 Data Request Responses", "filing_date": "12/20/2023", "staff": "JKA", "doc_id": "STF-JKA-3-5", "is_protective_disclosure": "yes", "question": "Provide the following assumptions that have occurred in actual operations for the REDACTED REDACTED. Please provide these assumptions by year, by unit in an excel spreadsheet.\nRamp rate assumptions\nmin up and down time\nstart costs\nheat rate\nmaintenance rate\nFOR rate", "response": "Please see the response to STF-JKA-3-6. The assumptions used in the economic evaluation are generally expected to match actual operations unless otherwise noted in STF-JKA-3-6.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216833, "filing_description": "DKT 55378 STF-JKA-3 Data Request Responses", "filing_date": "12/20/2023", "staff": "JKA", "doc_id": "STF-JKA-3-6", "is_protective_disclosure": "yes", "question": "Provide the following assumptions as modeled in the economic evaluation (B2023_Final_GPC_IRP_update.apz) for the REDACTED units. Please provide these assumptions by year, by unit in an excel spreadsheet. To the extent that the modeling does not reflect expected operations, please explain.\nRamp rate assumptions\nmin up and down time\nstart costs\nheat rate\nmaintenance rate\nFOR rate", "response": "Unless otherwise noted below, all modeling assumptions used in the economic evaluation for the REDACTED REDACTED are generally expected to match operations if the units are not retired.\nPlease see TS STF-JKA-3-6 Attachment for ramp rate assumptions as modeled in the economic evaluation.\nPlease see TS STF-JKA-3-6 Attachment for min up and down time assumptions as modeled in the economic evaluation.\nPlease see TS STF-JKA-3-6 Attachment for start cost assumptions as modeled in the economic evaluation.\nPlease see TS STF-JKA-3-6 Attachment for heat rate assumptions as modeled in the economic evaluation. The heat rate assumptions in the economic evaluation may be slightly different than operational results due to various conditions occurring during operations. Southern Company Services (“SCS”) Fleet Operations regularly evaluates unit heat rate curves and updates economic dispatch as needed. Modeling inputs are updated as part of the annual planning scenario process so there is often a lag in modeling inputs and real time operations. Any differences are not anticipated to be material.\nPlease see TS STF-JKA-3-6 Attachment for maintenance rate assumptions as modeled in the economic evaluation. REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED. This reduces the need to explicitly model planned or maintenance related outages in the economic evaluation.\nPlease see TS STF-JKA-3-6 Attachment for FOR assumptions as modeled in the economic evaluation. The forced outage rates used in the economic evaluation are input as monthly values as opposed to an expected annual forced outage rate. This is done for modeling purposes to spread forced outage events over the year. The aggregate of the monthly forced outage events is equal to the expected annual amount. During real time operations, forced outages may not occur at the same monthly distribution.", "attachment_filenames": "STF-JKA-3-6; PD STF-JKA-3-6 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216833, "filing_description": "DKT 55378 STF-JKA-3 Data Request Responses", "filing_date": "12/20/2023", "staff": "JKA", "doc_id": "STF-JKA-3-7", "is_protective_disclosure": "yes", "question": "It appears the Company’s modeling in Aurora for the generic “CT with SCR” resource is different than the modeling for Yates 8 – 10.\nFor each input assumption that is modeled differently in Aurora for those resources, please compare and contrast and explain the modeling difference.\nAs an example, it appears that the Company is modeling a 50% minimum capacity assumption for the “CT with SCR” in Aurora, and a different assumption for Yates 8-10.    Please be sure to explain this difference. Please see STF-JKA-3-6 Attachment A for rate ramp assumptions as modeled in the economic evaluation.", "response": "The assumptions for the generic CT with SCR resource and Plant Yates Units 8-10 are based off the same generic B2024 Technology Application Standards (“TAS”). However, there are a few differences in the way the generic CT with SCR and Yates CTs were modeled in the economic analysis.\nFuel Source:\nGeneric CT with SCR – oil primary, operates on oil year-round.\nYates 8-10 CTs – dual fuel, with oil operation in January, February, and December and natural gas operation in all other months. Please see STF-JKA-2-22(c) for more information on this assumption.\nHeat Rate:\nGeneric CT with SCR – modeled with seasonal heat rates based on oil operation. The winter oil heat rate was REDACTED Btu/kWh, spring oil heat rate was REDACTED Btu/kWh, and summer oil heat rate was REDACTED Btu/kWh.\nYates 8-10 CTs – modeled with seasonal heat rates based on mode of operation. The winter oil heat rate was REDACTED Btu/kWh, spring natural gas heat rate was REDACTED Btu/kWh, and summer natural gas heat rate was REDACTED Btu/kWh. The expected winter oil heat is REDACTED Btu/kWh, consistent with the generic CT with SCR. The higher winter oil heat rate used for Yates CTs was based on preliminary engineering analysis. Subsequent analysis revealed that REDACTED Btu/kWh is the expected value at this time. This does not impact the economic analysis results as Plant Yates Units 8-10 are not expected to provide any energy value when dispatching on oil.\nMinimum Capacity:\nBoth the generic CT with SCR and Yates CTs were modeled with a 50% minimum capacity assumption. The minimum capacity in Aurora can be input in the resource table as well as the heat rate definition table. The generic CT with SCR was entered in the resource table, and the Yates CTs were entered in the heat rate definition table.\nFuel Prices:\nGeneric CT with SCR – modeled with a generic oil price year-round.\nYates 8-10 CTs – modeled with site specific fuel pricing using Plant Yates Units 6-7 for delivered natural gas and Plant Wilson for cost to operate on oil as a proxy.\nMaintenance Rate:\nGeneric CT with SCR – modeled with a 3.84% annual rate. This equates to two weeks of planned outages per year.\nPlant Yates Units 8-10 – modeled with a monthly 9% maintenance rate, input as a forced outage, in March, April, May, October, and November. This equates to two weeks of planned outages per year.\nAs stated in the “Minimum Capacity” section of part (a) of this response, both the generic CT with SCR and Plant Yates Units 8-10 were modeled with a 50% minimum capacity assumption. The minimum capacity in Aurora can be input in the resource table as well as the heat rate definition table. The generic CT with SCR was entered in the resource table, and the Plant Yates Units 8-10 were entered in the heat rate definition table.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216833, "filing_description": "DKT 55378 STF-JKA-3 Data Request Responses", "filing_date": "12/20/2023", "staff": "JKA", "doc_id": "STF-JKA-3-8", "is_protective_disclosure": "yes", "question": "Refer to Aurora mix study (B2024 GPC IRP MG0 - P95.apz).  Please explain the Company’s maximum CC build constraint of REDACTED REDACTED REDACTED REDACTED REDACTED.\nHow was it derived and how did the Company determine it was reasonable?\nHow is it different than what was assumed in the 2022 IRP?  What has changed?", "response": "Please refer to the Company’s response to STF-JKA-2-14 (e) regarding pipeline infrastructure challenges. Given the challenges facing the pipeline infrastructure industry, the Company applied a limit on new combined cycles (“CCs”) in the model. The Company assumed natural gas firm transportation (“FT”) used for existing units would be available to use for new CCs as the existing units either retired or power purchase agreement (“PPA”) expired. Beyond this FT, based on recent industry experience and its own judgement, the Company assumed an additional REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED. Please note that new CCs were allowed to be selected beginning in 2030. While this constraint may limit new CCs selection in some years, overall, there is enough FT between existing FT becoming available and the new FT to add approximately REDACTED by 2050.\nIn the 2022 IRP, there wasn’t a limit applied to new CCs in the expansion plan; however, the Company reviewed each plan and compared against the existing FT that was projected to become available due to unit retirements and PPA expirations to ensure the CC build was reasonable. Beginning in 2023, when including the increased loads associated with the significant economic development that also has a high load factor, CCs were selected in large quantities in the expansion plans. When doing the FT comparison, there was more CC selected than what could be served with the existing FT portfolio. This prompted the Company to begin including a constraint in the model to limit CCs (see response to subpart a).", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216833, "filing_description": "DKT 55378 STF-JKA-3 Data Request Responses", "filing_date": "12/20/2023", "staff": "JKA", "doc_id": "STF-JKA-3-9", "is_protective_disclosure": "no", "question": "It appears that in the B2023 Aurora database (B2023_Final_GPC_IRP_update.apz), the Santa Rosa contract is modelled and is mapped to a fuel price proxy “mn_Smith 3_Marginal_Fuel_B23_MG0_DEPS_202209”. Please provide a B2024 database fuel price proxy that can be used as a fuel price proxy assumption for the Santa Rosa contract.", "response": "Smith 3 was used as a fuel price proxy for the Santa Rosa contract in the B2023 economic analysis. In the B2024 database, the fuel price proxy below can be used in the absence of Smith 3:\n“mn_Wash Co Cogen 1_Marginal_Fuel_B24_MG0_DEPS_202309_v2.”", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-1", "is_protective_disclosure": "no", "question": "Regarding the Aurora Database used in the 2023 IRP Update.\nPlease confirm that the Economic Evaluations described in the document, TS Economic Analysis of Capacity Resources.docx, relied on B2023 database assumptions. If not, please identify the vintage of assumptions used by case.\nPlease confirm that the Resource Mix Study relied on B2024 assumptions. If not, please identify the vintage of assumptions used by case.\nPlease explain why the Company did not use consistent databases for all the analyses that were performed.\nPlease provide a list of all input assumption differences that exist between the B2023 and B2024 data. For any input assumptions that are different between the two versions that specifically impact the avoided cost curves and resource addition selection, please identify those.", "response": "Yes, the Company’s economic ranking analysis used B2023 database assumptions for production costs modeling. This impacts the determination of energy benefits but does not impact the other analysis components.\nThe Resource Mix Study used 2023 IRP Update assumptions. While the 2023 IRP Update utilizes many of the B2024 assumptions, such as fuel price inputs, capacity updates, financial inputs, and technology cost and performance assumptions, there are some deviations from the B2024 assumptions. The following assumptions vary from the B2024 assumptions:\nLoads used in the Resource Mix Study reflect the 2023 IRP Update Load Forecast.\nCTs and storage were eligible to be selected as early as 2027 in the Resource Mix Study due to an earlier capacity need.\nThe Mississippi Power Company (“Mississippi Power”) Power Purchase Agreement (“PPA”) was offered as a selectable option in the generic expansion plan in the Resource Mix Study but not B2024. Some of the other Operating Company unit extensions, which are reflected in B2024, were not reflected in the Resource Mix Study to prevent double counting capacity associated with unit extensions and the Mississippi Power PPA.\nThe Company’s economic ranking analysis did rely on B2023 data for production cost modeling while the Resource Mix Study used 2023 IRP Update assumptions as described in subpart (b). For the economic ranking analysis, B2023 data were the only data available for the scenarios at the time that analysis was being completed. Importantly, the economic ranking analysis used a consistent set of data when determining the cost and benefits of each capacity option. Given that the economic ranking analysis assessed the costs and benefits of each capacity option to establish a relative ranking, this set of assumptions represents a reasonable and consistent view of each capacity option evaluated using the same set of assumptions.\nAdditionally, the Company’s Economic Evaluation determines the relative cost of each capacity option. These are specific resource options with specific costs and benefits applicable to actionable resource decisions. The Resource Mix Study expansion analysis provides a conceptual roadmap of generic repeatable resource expansion opportunities, which are not the same as actionable opportunities to meet near term capacity needs.\nThe planning databases for B2023 and for the 2023 IRP Update include updates to all major underlying planning assumptions, including load forecasts, fuel forecasts, existing unit assumptions, and new generation technology costs and performance. There are too many changes between databases to list individually. A “database compare” using Aurora can be used to identify all of the differences between the databases. In general, each of these underlying planning assumptions impact the avoided energy cost and resource addition selection. The Company has not conducted an analysis of each individual assumption change to determine its impact to the avoided energy costs or resource addition selection.", "attachment_filenames": "STF-JKA-2-19; PD STF-JKA-2-19 Attachment G.pdf; PD STF-JKA-2-19 Attachment I.pdf; PD STF-JKA-2-19 Attachment H.pdf; PD STF-JKA-2-19 Attachment L.pdf; PD STF-JKA-2-19 Attachment A.pdf; PD STF-JKA-2-19 Attachment K.pdf; PD STF-JKA-2-19 Attachment O.pdf; PD STF-JKA-2-19 Attachment J.pdf; PD STF-JKA-2-19 Attachment N.pdf; PD STF-JKA-2-19 Attachment F.pdf; PD STF-JKA-2-19 Attachment M.pdf; PD STF-JKA-2-19 Attachment D.docx; PD STF-JKA-2-19 Attachment C.docx; PD STF-JKA-2-19 Attachment E.docx; PD STF-JKA-2-19 Attachment B.docx; STF-JKA-2-16; PD STF-JKA-2-16 Attachment.docx; STF-JKA-2-14; STF-JKA-2-14 Attachment B.pdf; STF-JKA-2-14 Attachment C.pdf; PD STF-JKA-2-14 Attachment D.docx; PD STF-JKA-2-14 Attachment A.docx; STF-JKA-2-12; PD STF-JKA-2-12 Attachment A.xlsx; PD STF-JKA-2-12 Attachment B.xlsx; STF-JKA-2-12 Attachment I.pdf; PD STF-JKA-2-12 Attachment C.xlsx; PD STF-JKA-2-12 Attachment E.xlsx; PD STF-JKA-2-12 Attachment D.xlsx; PD STF-JKA-2-12 Attachment H.xlsx; PD STF-JKA-2-12 Attachment F G J K L and M.docx; STF-JKA-2-11; STF-JKA-2-11 Attachment F.xlsx; PD STF-JKA-2-11 Attachments A-E and G-R.docx; STF-JKA-2-10; STF-JKA-2-10 Attachment D.xlsx; PD STF-JKA-2-10 Attachment B.xlsx; PD STF-JKA-2-10 Attachments A & C.docx", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-10", "is_protective_disclosure": "no", "question": "Regarding load data (Section 2.4)\nSince it is historic data (not generally considered confidential) provide by retail operating company and the System data from 2013 to 2022 and the analysis performed to derive the diversity percentages on a ten-year average.\nFor Georgia and the System provide the projected peak demands and show how the peak demands were derived for the forecast period.\nProvide all derivations of the future load forecast (peak demand and energy) for each future electricity consumption scenario.  Provide all workpapers, electronically, with all formulae intact, showing how the load forecasts were derived separately based on the gas and CO2 view, including the Alt 1 and Alt 2 views.", "response": "See TS STF-JKA-2-10 Attachment A for the diversity percentage calculations.\nThe projected peak demands for Georgia Power Company and the System are provided in “TS GPC and System IRP Summary Data.xlsx,” which was filed in the Resource Mix Study in the Technical Appendix to the 2023 IRP Update on October 27, 2023. System peak demands within the Resource Mix Study are derived based on the sum of each retail operating company’s non-coincident peak demand multiplied by the diversity percentages calculated in STF-JKA-2-10 Attachment A. The non-coincident peak demands are included in the Aurora database files, which were previously provided to the Commission Staff on October 30, 2023, following the 2023 IRP Update filing on October 27, 2023.\nThe analyses in the Resource Mix Study supporting the 2023 IRP Update used four views of future load growth: (1) the 2023 IRP Update Load Forecast, (2) the 2023 IRP Update Load Forecast with an adjustment for high fuel prices, (3) the 2023 IRP Update Load Forecast with adjustments for a moderate amount of CO2 pressure (“Alt 1”), and (4) the 2023 IRP Update Load Forecast with adjustments for a higher amount of CO2 pressure (“Alt 2”). The monthly peak demand forecast for each of these scenarios can be found in TS STF-JKA-2-10 Attachment B, and the calculations of the energy totals for each scenario can be found in TS STF-JKA-2-10 Attachment C. Details of the construction of these views are provided below.\n2023 IRP Update Load Forecast: The 2023 IRP Update Load Forecast view of electricity consumption in each of the System’s jurisdictions is based chiefly on state-level forecasts of overall economic activity that the retail operating companies purchase from economic forecasting consultants. This is supplemented by information regarding larger customers that might enter or exit during the modeling horizon.\n2023 IRP Update Load Forecast with high fuel price adjustments: This view is an adjustment to the 2023 IRP Update Load Forecast based on comparing the southeastern United States load growth in two cases from the 2023 Annual Energy Outlook produced by the United States Energy Information Administration. The cases compared are the Reference case and the Low Oil and Gas Supply case. The percent difference in the load growth between these two cases is used to adjust the 2023 IRP Update Load Forecast view. The calculation of the percent difference is shown in STF-JKA-2-10 Attachment D.\nAlt 1: This view is an adjustment to the 2023 IRP Update Load Forecast view that reflects two opposing forces associated with a moderate amount of pressure on the Company’s CO2 emissions. Pressure on CO2 emissions is expected to decrease load growth to the extent that CO2 pressure is associated with additional end-use efficiency improvements and conservation chiefly due to higher electricity cost. In the analyses, the additional cost associated with a moderate amount of CO2 pressure is provided by the $20+ CO2 fee. Pressure on CO2 emissions is expected to increase load growth to the extent that CO2 pressure is associated with additional electrification of transportation. The timing and magnitude of these two opposing impacts of end-use efficiency and electrification result in lower net loads in the near term and higher net loads in the long term. The Company adopts state-level estimates of moderate vehicle electrification produced by the Electric Power Research Institute (“EPRI”).\nAlt 2: This view is an adjustment to the 2023 IRP Update Load Forecast View that reflects two opposing forces associated with a higher amount of pressure on the Company's CO2 emissions. Pressure on CO2 emissions is expected to decrease load growth to the extent that CO2 pressure is associated with additional end-use efficiency improvements and conservation chiefly due to higher electricity cost. In the analyses, the additional cost associated with a higher amount of CO2 pressure is provided by the $50+ CO2 fee. Pressure on CO2 emissions is expected to increase load growth to the extent that CO2 pressure is associated with additional electrification of transportation. The timing and magnitude of these two opposing impacts of end-use efficiency and electrification result in lower net loads in the near term and higher net loads in the long term. The Company adopts state-level estimates of higher vehicle electrification produced by EPRI.", "attachment_filenames": "STF-JKA-2-10; STF-JKA-2-10 Attachment D.xlsx; PD STF-JKA-2-10 Attachment B.xlsx; PD STF-JKA-2-10 Attachments A & C.docx", "confidentiality_files": ""}, {"filing_api_id": 216666, "filing_description": "STF-JKA-2 Data Request Responses Filing", "filing_date": "12/7/2023", "staff": "JKA", "doc_id": "STF-JKA-2-11", "is_protective_disclosure": "no", "question": "Please provide workpapers, electronically, detailing the development of all generic unit input assumptions for all resources used in AURORA (and described in Table 2 of the 2023 IRP Resource Mix Study), including:\nCapacity Winter MWs.  Provide engineering documentation and other workpapers, electronically, that this was sourced from.  Provide documentation of how capacity for each resource was derated for other months.\nAverage Heat Rate – Provide engineering documentation and other workpapers, electronically, for the determination of average heat rate values starting from the input/output equation for each resource.\nICE/ELCC Factors – Provide all workpapers, electronically, used in the development of the ICE/ELCC factors for all resources modeled in the IRP Resource Mix Study.\nCapital expenditures and revenue requirements.  Please supply all models that were used to develop capital revenue requirements and any spreadsheets used to prepare the data for input into the Aurora model for all candidate expansion plan units.\nVariable O&M – Provide all workpapers, electronically, used to create the assumptions for each resource.\nRecurring Fixed Cost and any other fixed costs modeled - Provide all workpapers, electronically, used to create the assumptions for each resource.  Provide all workpapers, electronically, use to create the assumptions, and show separate development of assumptions for Fixed O&M, Maintenance Capital, and Natural Gas Firm Transportation, etc.\nRound Trip Efficiency – Provide all workpapers, electronically, used in the development of the efficiency factors for all storage resources modeled in the IRP Resource Mix Study.\nFixed Capacity Factors – Provide all workpapers, electronically, used in the development of the solar shapes (annual 8760 production profiles) for all solar
