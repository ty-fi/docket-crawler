ff": "DEA", "doc_id": "STF-DEA-2-1", "is_protective_disclosure": "yes", "question": "Referring to Informal Data Request 11, Attachment A, External Additions Tab:\nFor each of lines 3 through 38, what is the source of the Certainty provided in Column E?  For each line item please provide a description of the approach and identify for those less than 100% when in the process of providing service that the certainty will increase to 100%.\nFor each of lines 3 through 38, what is the source of the Load provided in Column F and the Load Factor in Column G?\nHow did Georgia Power develop the growth in demand shown in each line of the External Additions? For example, did Georgia Power assume an average growth for each, or has each potential load addition provided the forecasted demand, or did Georgia Power use some other method?\nIs GPC using the Certainty provided in Column E of the Informal Data Request 11 Attachment A external Additions Tab to generate Peak Demand Need summarized in the Attachment STF-244-12-a or is a 100% expectation utilized or some other approach?  Please explain the rationale behind the source of the projection.", "response": "The source of the certainty provided in column E is the informed judgment of Georgia Power’s Customer Choice department. There are four buckets of certainty described as follows:\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.\nIn addition to these four buckets, there are projects in the REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.\nCustomers provide the load in Column F. This information is gathered by Georgia Power’s Customer Choice department and communicated to the Load Forecasting team. The load factor found in Column G is provided by Georgia Power’s Customer Choice department.\nEach customer provides its projected load, as well as a load ramp-up schedule according to their needs. With this ramp-up of projected loads, the Company developed the growth in demand shown in each line of the External Additions. This information is gathered by Georgia Power’s Customer Choice department and communicated to the Load Forecasting team.\nGeorgia Power did not use the Certainty provided in Column E of the Informal Data Request 11 Attachment A, External Additions tab, to generate the Peak Demand Need summarized in STF-244-12-a. Rather, the peak demand in STF-244-12-a is based on the Budget 2023 Load and Energy Forecast. When Budget 2023 was completed in August 2022, the new model used in the 2023 IRP Update did not exist.\nWhen Budget 2023 was prepared, there were only three projects large enough to include as an external adjustment to the forecast. The Company used its experience and reasonable judgment to create an informed opinion of each customer’s projected load and certainty to determine the proper forecast adjustment.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216789, "filing_description": "DKT 55378 STF-DEA-2 Data Request Responses", "filing_date": "12/18/2023", "staff": "DEA", "doc_id": "STF-DEA-2-1", "is_protective_disclosure": "yes", "question": "Refer to the file titled “External Load Sorted.”\nHas Georgia Power assumed that all REDACTED shown in Cell C48 will be included in the 2023 IRP update?\nIt appears that some of the loads shown have not submitted an RFS. Where are all these projects in the process of commitment to taking services from Georgia Power?\nPlease clarify the contents of each column with column headers and provide a note for the column header if necessary.\nFor Column I, answer the following:\nDoes “RFS” refer to a “Request for Service?”\nIs an RFS required for all “outside the primary territory” loads that may be served?\nPlease provide a narrative description of the RFS process.\nPlease identify the point at which GPC determines that a new load needs to be included in the load forecast used in the IRP.", "response": "The REDACTED represents the announced load from June 2023 and is not entirely used in the 2023 IRP Update. The 2023 IRP Update includes the most recent announced loads from August 2023. Announced load in the 2023 IRP Update is REDACTED. This number can be found in the “Model” tab of “TS 2023.10.11 Load Realization Model.xlsx,” which was provided with the 2023 IRP Update filing on October 27, 2023. The total is the sum of the “Max Load” column (Column CM).\nIndividual project commitments in the form of a request for service (“RFS”) do not directly determine the projected load in the forecasting process. The announced load serves as the starting point for estimating the level of load the Company may need to serve in the future. This initial number is refined based on the probability that the project will select the state of Georgia and Georgia Power as its ultimate electric service supplier, along with other adjustments for uncertainties.\nThe file titled “External Load Sorted” was not created by Georgia Power. The Company cannot properly label data that it did not directly produce.\nPlease refer to responses to subparts (i) – (iv) below.\nYes – “RFS” stands for “Request for Service.”\nAn RFS is required for large load customers eligible for a choice of supplier under the Georgia Territorial Electric Service Act, including but not limited to customers located outside the Company’s assigned territory.\nGeorgia Power will typically provide an RFS with a proposal for service. The proposal will outline the type of service Georgia Power proposes to provide, rate options and cost projections, as well as other offerings from Georgia Power such as outdoor lighting or renewable program options. A proposal for service is developed after meeting with the customer to determine their needs and expectations. In some cases, customers choose to sign an RFS without an official proposal.\nOnce the Georgia Department of Economic Development is contacted by a potential customer and due diligence is performed to identify potential sites, this information is communicated to the Georgia Power Customer Choice department, and the projects are added to the tracking list and included in the model.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216789, "filing_description": "DKT 55378 STF-DEA-2 Data Request Responses", "filing_date": "12/18/2023", "staff": "DEA", "doc_id": "STF-DEA-2-2", "is_protective_disclosure": "no", "question": "Refer to the file titled Attachment STF-244-12-a.\nPlease provide the spreadsheet that builds up by customer segment plus the new loads to result in the Peak Demand shown in line 6. Provide the spreadsheet with all formulas and references intact.\nAre all the New Load Additions assumed to be 100% probable in the GPC Base Load vs Capability Tab or is there some probability of completion assumed in the Peak Demand for such loads?\nPlease provide sufficient detail to understand GPC’s derivation of the new planning peak with regard to the new load additions and whether the residential, commercial and other customer segments also differ from the 2022 IRP.\nRelative to the GPC Base Load vs Capability, is the only change in the table associated with Peak Demand in row 6 or has GPC included other modifications?  If additional modifications are made, please identify each and describe the changes and why they are necessary.\nPlease provide sufficient detail to understand how the addition of large external or internal loads contributes to peak requirement? How is the likelihood of a load coming online factored into the peak energy requirement?", "response": "Please refer to TS STF-DEA-2-2 Attachment A. The attachment contains the Budget 2023 Load and Energy Forecast (“Budget 2023”) winter peak loads by class, including the external adjustments to the commercial class for new large customers that together result in the total Peak Demand in line 6 of the file titled Attachment STF-244-12-a.\nBudget 2023 did not use a probabilistic approach like the one used in the 2023 IRP Update.\nPlease refer to the response in part (a) above. In Budget 2023, the new large loads for which the forecast was adjusted were all external adjustments for the Commercial customer class. There were no external adjustments made to the forecast for the Residential, Industrial, Governmental Lighting, or MARTA customer classes.\nIn addition to peak demand forecast updates, unit assumption updates that occurred between Budget 2022 and Budget 2023 have been included in Attachment STF-244-12-a, such as capacity updates and updates resulting from the 2022 IRP Final Order. A list of unit additions and capacity changes is provided in STF-DEA-2-2 Attachment B.\nPlease refer to part (a) above. For Budget 2023, the assumed likelihood of a load coming online was 100%. The model used in the 2023 IRP Update was not yet developed when Budget 2023 was developed.", "attachment_filenames": "STF-DEA-2-2; PD STF-DEA-2-2 Attachment A.xlsx; STF-DEA-2-2 Attachment B.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216789, "filing_description": "DKT 55378 STF-DEA-2 Data Request Responses", "filing_date": "12/18/2023", "staff": "DEA", "doc_id": "STF-DEA-2-4", "is_protective_disclosure": "yes", "question": "Refer to file titled “Informal Data Request 11 Attachment A TS.”\nIt appears all projects, even those with certainty less than 100% appear to reach full load during the forecast horizon. Please explain how the certainty figures (column E on Tab External Additions) should be interpreted. Is the certainty value referring to the likelihood the load interconnects?\nIf not, what is the correct interpretation?\nIf yes, why do these loads continue to grow to full capacity post 2027?\nHow are the certainty figures (column E on Tab External Additions) determined?\nAre all projects listed in this sheet assumed to be completed eventually?\nHow does the certainty figure impact the future load beyond 2027?\nPlease provide context and the methodology used to determine the differing growth rates used for various loads, especially those with certainty less than 100%.\nIt appears certainty values are only applied to 2027. How does the certainty value, and the subsequent growth rates of external loads affect load in years post 2027?\nPlease provide the expected peak energy requirements by year of all the external loads listed in this sheet. Please provide the expected peak energy requirements in an excel spreadsheet that clearly shows how the likelihood of the load coming online is factored into the peak energy requirements.", "response": "The certainty figures in Column E on the External Additions tab assess the likelihood that a customer will be served by Georgia Power (as compared to another electric service provider). The year-by-year announced load in columns H to AI is the announced load provided by the customer. The Company then adjusted the announced load down according to the assessed certainty, load realization, project completion, and timing risks. These elements of risk are evaluated via Monte Carlo simulation.\nThese risks, and a description of the methodology and assumptions are provided in Section 1.5 of the Load and Energy Forecast document in the 2023 IRP Update Technical Appendix.\nPlease refer to the Company’s response to STF-DEA-2-1(a). The Company relied on informed judgment within the Company to develop key assumptions for the load sensitivity models.\nNo. The Company assumes a REDACTED probability that projects will not be completed. For example, projects may fail due to unfavorable economic conditions or financial problems. This risk is evaluated as part of the Monte Carlo simulation model that the Company uses to create and evaluate a range of possible loads to serve.\nAs discussed in part (a) above, the certainty figure evaluates the likelihood of a new large load customer being served by Georgia Power. It is a binary outcome that affects all years of future loads. In the Company’s modeling of large customers, 100,000 combinations are drawn to estimate the range of load outcomes. When certainty is evaluated, it is expected that the project will be served by the Company in a number of combinations driven by the certainty percentage. For example, if a project has a certainty of 25%, then when a simulation is run with 100,000 draws it means that the project will be served by Georgia Power in about 25,000 of the 100,000 cases when evaluating for certainty.\nThe year-by-year announced loads and growth in columns H to AI are provided directly to Georgia Power by the individual customers behind each project. How that certainty impacts the expected load is discussed in part (d) above.\nCertainty is applied to all years of future load as discussed in part (d) above.\nThe peak and energy requirements are calculated at a portfolio level. The certainty in column E of the file “Informal Data Request 11 Attachment A TS” is only one of the inputs needed for the load modeling. The likelihood and uncertainties are factored in via the methodology described in Section 1.5 of the recently filed Load and Energy Forecast document in the 2023 IRP Update Technical Appendix (a Monte Carlo simulation model).\nThe process to determine the peak requirements starts with the Monte Carlo simulation model. The output of this model gives the equivalent average customer load in MWs to serve each year. These MWs are then converted into hourly energy requirements that ultimately are used to determine the peak demand of the portfolio.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216789, "filing_description": "DKT 55378 STF-DEA-2 Data Request Responses", "filing_date": "12/18/2023", "staff": "DEA", "doc_id": "STF-DEA-2-5", "is_protective_disclosure": "yes", "question": "What has GPCs experience with large loads historically, particularly with respect to large loads with multiple potential sites and their resulting selection of GPC over other sites?  For example, GPC experiences about 50% of the projected loads becoming a reality?  Has GPC experienced significant delays in completion dates for such projects?", "response": "The size and volume of the new large loads currently considering Georgia is unprecedented. As a result, the Company does not have sufficient prior experience with loads this large with multiple sites to draw upon. Project delays are a source of risk that is quantified in the Company’s model, which assumes a range of delays of up to REDACTED from the customer’s communicated start of operations.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216789, "filing_description": "DKT 55378 STF-DEA-2 Data Request Responses", "filing_date": "12/18/2023", "staff": "DEA", "doc_id": "STF-DEA-2-6", "is_protective_disclosure": "no", "question": "How did GPC project new large loads in the 2022 IRP?  Are any of the loads identified in the 2023 update included in the 2022 IRP?  If yes please explain.", "response": "Historically, the Company has used an external adjustment to the Load and Energy Forecast to account for the addition of a large new load customer (e.g., Elba Island in the 2016 and 2019 Integrated Resource Plan (“IRP”)). However, at the time that the Load and Energy Forecast used in the 2022 IRP was developed, no large new loads were identified that required an external forecast adjustment.\nNone of the large loads included in the 2023 IRP Update were included in the 2022 IRP.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216789, "filing_description": "DKT 55378 STF-DEA-2 Data Request Responses", "filing_date": "12/18/2023", "staff": "DEA", "doc_id": "STF-DEA-2-7", "is_protective_disclosure": "no", "question": "Relative to Customer Choice additions, what commitments are required of Customer Choice customers if Georgia Power agrees to serve?", "response": "Customers eligible for a choice of supplier under the Georgia Territorial Electric Service Act are required to sign a request for services (“RFS”) and execute appropriate contracts based on the type of service and rate selected by the customer.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216789, "filing_description": "DKT 55378 STF-DEA-2 Data Request Responses", "filing_date": "12/18/2023", "staff": "DEA", "doc_id": "STF-DEA-2-8", "is_protective_disclosure": "no", "question": "Relative to Customer Choice loads, are these customers served under standard rates? If yes, what current tariff is used to serve these loads?", "response": "Customer choice loads are served under one of Georgia Power’s standard rates for which they qualify that have been approved by the Georgia Public Service Commission. If the customer does not qualify for a marginal-based tariff, the customer choice load will be served under a non-marginal or embedded tariff such as Power & Light or Time of Use. If the customer qualifies for a marginal-based tariff, the customer choice load will likely be served under the Real Time Pricing or the Time of Use – Supplier Choice tariffs.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216789, "filing_description": "DKT 55378 STF-DEA-2 Data Request Responses", "filing_date": "12/18/2023", "staff": "DEA", "doc_id": "STF-DEA-2-9", "is_protective_disclosure": "no", "question": "Relative to Customer Choice loads, are any investments to serve such customers a cost charged to that customer or are other customers responsible for system improvements to serve a new customer choice customer?", "response": "Investments to serve customer choice loads are assigned to each project and included in the customer choice offer. There are two types of costs that may be included in customer choice offers: local and upstream. Local costs are assigned directly to the customer choice project and may include both transmission and distribution investments where the customer choice project receives sole benefit. Upstream costs are allocated to each customer choice project based upon that project’s marginal use of the system over the life of the project. Upstream costs include investments that provide system benefit to other customers in addition to the customer choice project. The Company prepares each customer choice offer to fully recover both local and allocated upstream costs required to serve the customer choice load over the life of the project.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216861, "filing_description": "DKT 55378 STF-DEA-3 Data Request Responses", "filing_date": "12/21/2023", "staff": "DEA", "doc_id": "STF-DEA-3-1", "is_protective_disclosure": "no", "question": "The company currently reports on its website that there are 2,366,818 residential customers and indicates in the 2023 IRP update that it has plans to include an additional 25,000 customers in its Thermostat Control program to reduce peak; with this addition the Company will have 50,000 customers in the program for 2024 and remains at that level.\nDo you agree that this is approximately 2.1% of all residential customers?\nHow many customers in total could be offered this program?\nWhy is the Company not proposing to increase as much as possible in the short run to address growth in peak since, as indicated in Attachment C of the Load Forecast Update,  the program now passes the TRC test?", "response": "a. \tYes. 50,000 customers would equate to approximately 2.1% of 2,366,818.\nb. \tWhile all eligible residential customers could be offered the program, the Company is requesting to expand the program cap from 25,000 to 50,000 customers, as shown on page 23 of the IRP Update filing.\nc. \tThe Company believes doubling the existing TSTAT DR program over the remainder of the DSM cycle reflects an aggressive but achievable expansion of the program.", "attachment_filenames": "STF-DEA-3-12; STF-DEA-3-12 Attachment A.xlsx; STF-DEA-3-12 Attachment B.xlsx; STF-DEA-3-13; STF-DEA-3-13 Attachment.docx; STF-DEA-3-16; PD STF-DEA-3-16 Attachment.xlsx; STF-DEA-3-18; PD STF-DEA-3-18 Attachment.xlsx; STF-DEA-3-19; PD STF-DEA-3-19 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216861, "filing_description": "DKT 55378 STF-DEA-3 Data Request Responses", "filing_date": "12/21/2023", "staff": "DEA", "doc_id": "STF-DEA-3-10", "is_protective_disclosure": "no", "question": "Please provide a backcast for each of the equations utilized in the load forecast in the previous question, including a comparison of each backcast to actuals for each year of the backcast. Essentially, provide an in-sample analysis of each equation.", "response": "Georgia Power reviews backcasts in the forecasting process but does not save them separately, as they are readily accessible in E-Views.\nThe instructions for creating/viewing backcasts in E-views are as follows:\nOpen a model in E-views (e.g., choose any of the E-views models already provided by the Company).\nGo to “View” and choose “Actual-Fitted Residual.” then choose your option for viewing (table or graph) in the drop-down box.\nIf “Actual-Fitted-Residual Table” is chosen from the drop-down box, the following will be displayed:\nIf “Actual-Fitted-Residual Graph” is chosen from the drop-down box, the following will be displayed:", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216861, "filing_description": "DKT 55378 STF-DEA-3 Data Request Responses", "filing_date": "12/21/2023", "staff": "DEA", "doc_id": "STF-DEA-3-11", "is_protective_disclosure": "no", "question": "Please provide all the economic parameters utilized in the models used by Georgia Power to complete its forecast including historic values since 2000 and projected values for the forecast period.", "response": "The data requested were provided with the filing of the 2023 IRP Update in file “TS 2_2023 IRP Update Load Forecast_FC_Inputs_May.xlsx.” The historical and forecasted economic variables can be found in the following tabs: B24, Monthly Econ, IP, GSP.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216861, "filing_description": "DKT 55378 STF-DEA-3 Data Request Responses", "filing_date": "12/21/2023", "staff": "DEA", "doc_id": "STF-DEA-3-12", "is_protective_disclosure": "no", "question": "Please provide since 2000, a matrix showing the error of each energy and peak forecast by sector.  This matrix should include the error of the 2000 forecast for each year (2001, 2002, 2003, etc.) through the end of the period of the forecast and for each forecast since 2000.  Please provide the difference (positive or negative) and the percentage error of each.", "response": "Georgia Power does not track forecast errors for every forecast by class for every year since 2000. However, each IRP since 2000 contains similar information for the most recent 4-6 years of history and the 4-5 most recent forecasts. A comparison with actuals and weather normal actuals are included.\nPlease refer to STF-DEA-3-12 Attachment A for information on energy forecasts by class. Peak forecast information is presented in STF-DEA-3-12 Attachment B. Total peak is presented until the 2019 IRP. The 2022 IRP contains information on both Summer and Winter Peaks.\nPlease note that these tables were pulled directly from the Forecasting Technical Appendix in each IRP from 2001 through 2022.", "attachment_filenames": "STF-DEA-3-12; STF-DEA-3-12 Attachment A.xlsx; STF-DEA-3-12 Attachment B.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216861, "filing_description": "DKT 55378 STF-DEA-3 Data Request Responses", "filing_date": "12/21/2023", "staff": "DEA", "doc_id": "STF-DEA-3-13", "is_protective_disclosure": "no", "question": "Please provide documentation for the Peak Metrix Model including a description of the key parameters in the modeling, sources of historical information and projected information.  Please describe how the energy forecasts are used for the peak projections.", "response": "Please see STF-DEA-3-13 Attachment for a description of the Metric Peak Demand models, the data needed to run them, and how the energy forecasts are used. The description in this attachment was taken from Section 6 of the Load and Energy Forecast Technical Appendix found in the 2022 IRP filing.", "attachment_filenames": "STF-DEA-3-13; STF-DEA-3-13 Attachment.docx", "confidentiality_files": ""}, {"filing_api_id": 216861, "filing_description": "DKT 55378 STF-DEA-3 Data Request Responses", "filing_date": "12/21/2023", "staff": "DEA", "doc_id": "STF-DEA-3-14", "is_protective_disclosure": "no", "question": "Please provide documentation for the @Risk model utilized and describe how the quarterly load is ultimately calculated.", "response": "The maker of @Risk software has created a guide that explains the basics of using @Risk. It can be accessed using the following link: @RISK-Getting-Started-Guide.pdf (palisade.com). It begins with an explanation of a Monte Carlo Simulation on page 3. Section 3 discusses how to create and run a model, including ways to choose the proper distribution. Additional documentation is available for different topics, if needed, but this introductory guide is a good reference to begin working with @Risk.\nWith respect to quarterly loads, please see the Company’s response to TS STF-DEA-1-15.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216861, "filing_description": "DKT 55378 STF-DEA-3 Data Request Responses", "filing_date": "12/21/2023", "staff": "DEA", "doc_id": "STF-DEA-3-15", "is_protective_disclosure": "no", "question": "For the @Risk tool, please develop peak projections for each scenario below:\nAssume all the low values occur for the three parameters modeled, and show the MW forecast and the probability of forecast expectation.\nAssume all the mid values for the three parameters modeled, and show the MW forecast and the probability of forecast expectation.\nAssume all the high values for the three parameters modeled, and show the MW forecast and the probability of forecast expectation.", "response": "The Company has not previously created any of the three requested scenarios. As a result, the information is unavailable.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216861, "filing_description": "DKT 55378 STF-DEA-3 Data Request Responses", "filing_date": "12/21/2023", "staff": "DEA", "doc_id": "STF-DEA-3-16", "is_protective_disclosure": "no", "question": "Please identify whether the shift between the short and long-term models requires external adjustments and if yes, identify what approach is used and provide the before and after adjustment data.", "response": "Yes, the shift between short and long-term models requires smoothing. TS STF-DEA-3-16 Attachment outlines the smoothing process for the Residential, Commercial, and Industrial classes. The steps are as follows:\nAfter running the long-term LoadMAP model, its results are calibrated to the short-term model.\nThe process then smooths the transition to the long-term forecast at the conclusion of the short-term forecast period (2028), ensuring a seamless progression from short-term to long-term projections.\nFor the year 2028, the smoothed energy figure is derived by averaging the growth rates of 2027 and 2029. This adjusted growth rate is applied to the energy value of 2027 to calculate the smoothed energy for 2028.\nSubsequent to the calculation, the total smoothed value for the year is allocated based on housing type (residential) or segment (commercial and industrial) and monthly distribution:\nMonthly distribution percentages are ascertained from the distribution data of the preceding year (2027).\nHousing type or Segment allocation percentages are likewise derived from the distribution of the prior year (2027).\nUsing these percentages, the total smoothed value is distributed evenly across each month and housing type or segment for the year 2028.\nAfter smoothing in 2028, projections for 2029 and subsequent years are re-calculated from this adjusted base.", "attachment_filenames": "STF-DEA-3-16; PD STF-DEA-3-16 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216861, "filing_description": "DKT 55378 STF-DEA-3 Data Request Responses", "filing_date": "12/21/2023", "staff": "DEA", "doc_id": "STF-DEA-3-17", "is_protective_disclosure": "no", "question": "Please provide a written summary of the structure of your load forecast model, explaining the following:\nThe construction/structure of the model and any structural assumptions made in the model (random drift, fixed effects, transformations of variables, etc.)\nThe key drivers for load growth in the non-customer choice portion of load.\nThe time period of the data underlying the model and the extent to which they vary.", "response": "The load forecast model is formulated as a linear regression using Ordinary Least Squares (“OLS”) estimation. The model aims to predict the load (Yt​) at time t based on a set of predictor variables (X1t​,X2t​,…,Xkt​). The general form of the model is expressed as: Yt​=β0​+β1​X1t​+β2​X2t​+…+βk​Xkt​+ϵt​ where β0​ is the intercept, β1​,β2​,…,βk​ are the estimated coefficients, and ϵt​ represents the error term.\nThe model relies on key assumptions inherent in OLS regression:\nLinearity: The relationship between the load and predictor variables is assumed to be linear.\nNo endogeneity: There should be no relationship between the errors and the independent variables.\nNormality and homoscedasticity: The error term is normally distributed and should have equal variance.\nNo autocorrelation: Residuals are assumed to be uncorrelated.\nThe key drivers for load growth in the non-customer choice portion of load is the energy sales forecast.\nThe time period of the data underlying the model is:", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216861, "filing_description": "DKT 55378 STF-DEA-3 Data Request Responses", "filing_date": "12/21/2023", "staff": "DEA", "doc_id": "STF-DEA-3-18", "is_protective_disclosure": "no", "question": "Refer to the 2023 IRP Update, Page 1 of the Update Load and Energy Forecast, Section 1.0 Executive Summary Overview, stating that Large load projects where Georgia Power was selected in 2022 represented almost 2,200 MW.  For each customer that makes up the 2,200 MW please identify the customer, customer’s load (MW) and whether the customer is located inside Georgia Power service territory or outside service territory.", "response": "Please refer to TS STF-DEA-3-18 Attachment for the information requested about the large load projects that selected Georgia Power in 2022.", "attachment_filenames": "STF-DEA-3-18; PD STF-DEA-3-18 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216861, "filing_description": "DKT 55378 STF-DEA-3 Data Request Responses", "filing_date": "12/21/2023", "staff": "DEA", "doc_id": "STF-DEA-3-19", "is_protective_disclosure": "no", "question": "Please provide the Large load projects where Georgia Power was selected in 2023 to date For each customer that selected Georgia Power please identify the customer’s load (MW) and whether the customer is located inside Georgia Power service territory or outside service territory.", "response": "Please refer to TS STF-DEA-3-19 Attachment for the information requested about the large load projects that have selected Georgia Power in 2023.", "attachment_filenames": "STF-DEA-3-19; PD STF-DEA-3-19 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216861, "filing_description": "DKT 55378 STF-DEA-3 Data Request Responses", "filing_date": "12/21/2023", "staff": "DEA", "doc_id": "STF-DEA-3-2", "is_protective_disclosure": "no", "question": "How is the cost of electricity incorporated into the energy and peak forecasts by customer class?", "response": "The cost of electricity is incorporated into the energy forecasts as an input to the long-term LoadMap models for the residential, commercial, and industrial classes. The energy forecasts are a key driver of the peak demand model.", "attachment_filenames": "STF-DEA-3-20; PD STF-DEA-3-20 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216861, "filing_description": "DKT 55378 STF-DEA-3 Data Request Responses", "filing_date": "12/21/2023", "staff": "DEA", "doc_id": "STF-DEA-3-20", "is_protective_disclosure": "no", "question": "For each new large customer in the Company’s response to STF-DEA-1-2 please identify whether the customer is located inside Georgia Power service territory or outside service territory.", "response": "Please refer to TS STF-DEA-3-20 Attachment for information on whether each new large customer in the response to STF-DEA-1-2 is located inside or outside the Georgia Power service territory.", "attachment_filenames": "STF-DEA-3-20; PD STF-DEA-3-20 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216861, "filing_description": "DKT 55378 STF-DEA-3 Data Request Responses", "filing_date": "12/21/2023", "staff": "DEA", "doc_id": "STF-DEA-3-3", "is_protective_disclosure": "no", "question": "How does price of elasticity get addressed in the various load forecasting models utilized by Georgia Power?", "response": "Please refer to STF-DEA-3-2.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216861, "filing_description": "DKT 55378 STF-DEA-3 Data Request Responses", "filing_date": "12/21/2023", "staff": "DEA", "doc_id": "STF-DEA-3-4", "is_protective_disclosure": "no", "question": "Please provide monthly historical average electricity prices by customer class from 1990 through YTD 2023 in spreadsheet format.", "response": "Monthly historical average electricity prices by customer class from 1990 through year-to-date 2023 are provided in STF-DEA-3-4 Attachment. Please note that these are average total prices that include base revenue and fuel. The data provided in this attachment are consistent with what is used in the Company’s forecast models and reflect certain adjustments, such as customer reclassifications or customer refunds.", "attachment_filenames": "STF-DEA-3-4; STF-DEA-3-4 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216861, "filing_description": "DKT 55378 STF-DEA-3 Data Request Responses", "filing_date": "12/21/2023", "staff": "DEA", "doc_id": "STF-DEA-3-5", "is_protective_disclosure": "no", "question": "Please provide anticipated price increases as a result of the expected January 1, 2024 approved increase and other base and fuel increases over the coming years to reflect the inclusion of Vogtle Unit 4 in rate base going forward.", "response": "Georgia Power continues to implement the 2022 Base Rate Case Order approved in Docket No. 44280, with an expected increase for January 2024 of 1.9% for the average retail customer, which translates to $3.54 per month for the typical residential customer using an average of 1,000 kWh/month.\nPer Commission approval of the Stipulation in Georgia Power’s Application to Adjust Rates to Include Reasonable and Prudent Plant Vogtle Units 3 and 4 Costs in Docket No. 29849, the base rate change will result in an increase of approximately 5% for the average retail customer, which translates to $8.95 per month for a typical residential customer using an average of 1,000 kWh/month. This base rate change will occur the month following the commercial operation date (“COD”) of Plant Vogtle Unit 4. Based on the current schedule, rates would change April 1, 2024.\nNo other rate changes from Vogtle Unit 4 are expected at this time.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216861, "filing_description": "DKT 55378 STF-DEA-3 Data Request Responses", "filing_date": "12/21/2023", "staff": "DEA", "doc_id": "STF-DEA-3-6", "is_protective_disclosure": "no", "question": "Provide a forecast of upcoming price increases as a result of the inclusion of Plant Vogtle Units 3 and 4 into rate base as well as the new load acquisitions necessary to serve major new load growth.", "response": "Per Commission approval of the Stipulation in Georgia Power’s Application to Adjust Rates to Include Reasonable and Prudent Plant Vogtle Units 3 and 4 Costs in Docket No. 29849, the base rate change will result in an increase of approximately 5% for the average retail customer, which translates to $8.95 per month for a typical residential customer using an average of 1,000 kWh/month. This base rate change will occur the month following the commercial operation date (“COD”) of Plant Vogtle Unit 4. Based on the current schedule, rates would change April 1, 2024.\nAll else being equal, the Company expects that the projected revenues associated with incremental load from known new customer projects, which necessitate the additional capacity requested in the 2023 IRP Update, will fully offset the costs of those resources requested in the 2023 IRP Update and put downward pressure on overall retail rates. Please note, the projected revenues provided are preliminary estimates at this point in time and may differ from future revenues. See TS STF-DEA-3-6 Attachments A-I for additional information.", "attachment_filenames": "STF-DEA-3-6; PD STF-DEA-3-6 Attachment A.xlsx; PD STF-DEA-3-6 Attachment H.xlsx; PD STF-DEA-3-6 Attachment I.xlsx; PD STF-DEA-3-6 Attachments B-G.docx", "confidentiality_files": ""}, {"filing_api_id": 216861, "filing_description": "DKT 55378 STF-DEA-3 Data Request Responses", "filing_date": "12/21/2023", "staff": "DEA", "doc_id": "STF-DEA-3-7", "is_protective_disclosure": "no", "question": "Please provide a process map showing how each of the load forecasting steps relates and how the overall energy and peak forecasts develop including identifying the models utilized.", "response": "Please see STF-DEA-3-7 Attachment for the requested load forecasting process map.", "attachment_filenames": "STF-DEA-3-7; STF-DEA-3-7 Attachment.pdf", "confidentiality_files": ""}, {"filing_api_id": 216861, "filing_description": "DKT 55378 STF-DEA-3 Data Request Responses", "filing_date": "12/21/2023", "staff": "DEA", "doc_id": "STF-DEA-3-8", "is_protective_disclosure": "no", "question": "Please provide documentation for the LoadMap model including a description of the key parameters in the modeling and model interactions, and sources of historic information and projected information.", "response": "Please refer to the Company’s response to STF-DEA-1-20.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216861, "filing_description": "DKT 55378 STF-DEA-3 Data Request Responses", "filing_date": "12/21/2023", "staff": "DEA", "doc_id": "STF-DEA-3-9", "is_protective_disclosure": "no", "question": "Please provide each regression equation utilized to complete the short-term energy forecast and show the alternative models not selected with rationale for rejection. For each equation/model, provide summary statistics (mean, median, min, max, std. deviation, variance, R2, etc).", "response": "Please refer to the following attachments for the requested information:\nTS STF-DEA-3-9 Attachment A: Residential use per customer and customer models\nTS STF-DEA-3-9 Attachment B: Commercial use per customer and customer models\nTS STF-DEA-3-9 Attachment C: Industrial energy and customer models\nTS STF-DEA-3-9 Attachment D: MARTA energy models\nTS STF-DEA-3-9 Attachment E: Governmental Lighting energy and customer models\nThe Company uses a systematic approach in determining which forecast models to select. A number of different criteria are utilized to identify the best performing model, including:\nVariable Coefficients: Models with variables exhibiting an incorrect sign on their coefficients are eliminated from consideration, ensuring consistency with the expected relationships.\nAdjusted R-squared: Models with relatively low adjusted R-squared values are excluded.\nGrowth Rates: Models with unreasonable growth rates for the dependent variable (e.g. customers, energy sales, use per customer) are omitted from consideration.\nInsignificant Variables: Models containing variables deemed statistically insignificant are excluded, emphasizing the importance of including only meaningful predictors.\nStatistical Tests: Models with inferior overall statistical performance are eliminated, employing various tests to assess the goodness of fit and model validity. Tests include, but are not limited to tests for heteroskedasticity, serial correlation, and unit roots. Other tests (e.g., for outliers, structural breaks, etc.) are used when needed.\nThe selection of the best model is based on a comprehensive evaluation considering the criteria above. This multi-step process is aimed at ensuring that the chosen model not only demonstrates favorable statistical properties but is also aligned with theoretical expectations and captures the essential features of the data.", "attachment_filenames": "STF-DEA-3-9; PD STF-DEA-3-9 Attachments A-E.docx", "confidentiality_files": ""}, {"filing_api_id": 216656, "filing_description": "DKT 55378 STF-DEA-1 Data Request Responses", "filing_date": "12/7/2023", "staff": "DEA", "doc_id": "STF-DEA-1-1", "is_protective_disclosure": "no", "question": "Refer to the 2023 IRP Update, Page 1 of the Update Load and Energy Forecast, Section 1.0 Executive Summary Overview, stating that Large load projects where Georgia Power was selected in 2022 represented almost 2,200 MW.  Please provide the list of all potential large load projects in which Georgia Power was considered and identify for each the ultimate decision (other utility, other state, not being constructed) where Georgia Power was not selected.", "response": "See TS STF-DEA-1-1 Attachment A for the list of customer choice projects in which Georgia Power was considered in 2022 as referenced in the 2023 IRP Update, Page 1 of the Load and Energy Forecast. For projects that located in Georgia but did not select Georgia Power, the selected utility is listed.\nSee TS STF-DEA-1-1 Attachment B for the list of economic development projects that considered but did not locate in Georgia in 2022 as well as the state the project selected, if known.", "attachment_filenames": "STF-DEA-1-1; PD STF-DEA-1-1 Attachment A.xlsx; PD STF-DEA-1-1 Attachment B.xlsx; STF-DEA-1-10; PD STF-DEA-1-10 Attachment A.xlsx; PD-STF-DEA-1-10 Attachment B.xlsx; STF-DEA-1-11; STF-DEA-1-13; PD STF-DEA-1-13 Attachment.xlsx; STF-DEA-1-15; PD STF-DEA-1-15 Attachment.xlsx; STF-DEA-1-16", "confidentiality_files": ""}, {"filing_api_id": 216656, "filing_description": "DKT 55378 STF-DEA-1 Data Request Responses", "filing_date": "12/7/2023", "staff": "DEA", "doc_id": "STF-DEA-1-10", "is_protective_disclosure": "no", "question": "Refer to the Trade Secret 2023 IRP Update Load and Energy Forecast, p. 2, Figure 1.0-1, summarizing the large load customers selecting Georgia Power by year.\nPlease identify each customer/project included in the total values by year. Separately identify the customers/projects included in the “Won” category and the “Projected Wins” for Jan-Aug 2023.\nFor each customer/project identified in response to part (a), please provide details including location, facility type (datacenter, factory, etc.), peak load, summer coincident peak load, winter coincident peak load, annual energy consumption.\nFor each customer/project identified in response to part (a) that is already online, please provide the actual annual peak load, annual summer coincident peak load, annual winter coincident peak load, annual energy consumption.\nIdentify any customers/projects included in Figure 2 that have cancelled their projects, modified expected size or in-service date, or otherwise will not be served by the Company.\nPlease identify which customers were included in the 2022 IRP load forecast, which were included in the Budget 2023 load forecast, and which are included in the 2023 IRP Update load forecast.", "response": "Please refer to TS STF-DEA-1-10 Attachment A. This file separately identifies each customer/project summarized in Figure 1.0-1 in the Trade Secret 2023 IRP Update Load and Energy Forecast.\nPlease refer to TS STF-DEA-1-10 Attachment A for the requested information location and facility type. Figure 1.0-1 is customer reported data. Customers do not report information on annual peak load, coincident summer and winter peak loads, and annual energy consumption. Therefore, this information is not available.\nGeorgia Power does not track individual projects once they are online. As a result, information on annual peak load, coincident summer and winter peak loads, and annual energy consumption are not available.\nThe Company does not explicitly track projects that were considered “wins” but were subsequently cancelled. Once cancelled, a customer choice project is filed with other withdrawn projects that also include projects that were not committed to the Company or state. Similarly, projects that modify their projected loads or start dates are not tracked separately. These get updated in a spreadsheet, but no record is kept with respect to the changes over time. As a result, the data requested are not available.\nPlease see TS STF-DEA-1-10 Attachment B for a list of customers included in Figure 1.0-1 and whether they are included in the 2022 IRP Load Forecast, the Budget 2023 Load Forecast, and the 2023 IRP Update Load Forecast.", "attachment_filenames": "STF-DEA-1-10; PD STF-DEA-1-10 Attachment A.xlsx; PD-STF-DEA-1-10 Attachment B.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216656, "filing_description": "DKT 55378 STF-DEA-1 Data Request Responses", "filing_date": "12/7/2023", "staff": "DEA", "doc_id": "STF-DEA-1-11", "is_protective_disclosure": "yes", "question": "Refer to TS 2023.10.11 Load Realization Model.xlsx and “TS 2023.10.11 Model Sheet Description.docx”. The description document states that Column F is the “Probability that the customer has chosen Georgia as the site of the project. xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx   x\nxxxxxxxxxxxxx.” However, in the Load Realization Model there are xxx     xx with x     x in Column F. Please reconcile this discrepancy.", "response": "The statement “Probability that the customer has chosen Georgia as the site of the project. REDACTED REDACTED REDACTED REDACTED REDACTED” is incorrect. TS 2023.10.11 Model Sheet Description.docx was carried over from Informal Data Request 1-12, which referred to the July 2023 sensitivity model. In that version of the model (i.e., the July 2023 sensitivity), all probabilities in Column F were REDACTED. The August version of the Load Realization Model that was filed with the 2023 IRP Update included projects with a confirmed state selection (REDACTED probability of selecting Georgia) and those in the process of selecting a state (REDACTED probability of selecting Georgia).", "attachment_filenames": "STF-DEA-1-11", "confidentiality_files": ""}, {"filing_api_id": 216656, "filing_description": "DKT 55378 STF-DEA-1 Data Request Responses", "filing_date": "12/7/2023", "staff": "DEA", "doc_id": "STF-DEA-1-12", "is_protective_disclosure": "no", "question": "Refer to TS 2023.10.11 Load Realization Model.xlsx, ‘Model’ tab. Column G includes the likelihood of choosing GPC as a power provider.  How did the Company determine the values for each potential project? Provide all documentation and analysis supporting the selection these values.", "response": "The probability that a customer will choose Georgia Power as its electric service provider referenced in Column G in the “Model” tab of TS 2023.10.11 Load Realization Model.xlsx was developed using the experience and judgment of Georgia Power’s Customer Choice department. Members of this team work most closely with potential customers, and their interactions with customers enables them to assess the probability that a project may choose Georgia Power as its electric service provider.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216656, "filing_description": "DKT 55378 STF-DEA-1 Data Request Responses", "filing_date": "12/7/2023", "staff": "DEA", "doc_id": "STF-DEA-1-13", "is_protective_disclosure": "yes", "question": "Refer to TS 2023.10.11 Load Realization Model.xlsx, ‘Model’ tab. Column H is the probability that project will materialize. “TS 2023.10.11 Model Sheet Description.docx” states that REDACTED REDACTED REDACTED REDACTED REDACTED\nPlease provide all analysis and documentation supporting the REDACTED assumption.\nIs this value consistent with GPC’s historical experience with contracted projects?", "response": "Please refer to TS STF-DEA-1-13 Attachment for the analysis and documentation supporting the probability assumption that a project will materialize.\nYes. The value is consistent with GPC’s historical experience with contracted projects. The Company reviewed the status of REDACTED Customer Choice projects won between 2019 and 2023. Out of this total, REDACTED failed to materialize. This translates to a success rate of REDACTED. This was rounded to REDACTED in the 2023 IRP Update.", "attachment_filenames": "STF-DEA-1-13; PD STF-DEA-1-13 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216656, "filing_description": "DKT 55378 STF-DEA-1 Data Request Responses", "filing_date": "12/7/2023", "staff": "DEA", "doc_id": "STF-DEA-1-14", "is_protective_disclosure": "no", "question": "Refer to TS 2023.10.11 Load Realization Model.xlsx, ‘Model’ tab. Column J provides announced load.\nIs this value the project’s announced annual peak load.\nDoes GPC collect information on summer coincident or winter coincident peak load? If so, provide that data for each project.", "response": "No. The announced load is the maximum value of the ramp-up information provided by the potential customer.\nNo. The new large customer projects are forecasted as a portfolio. The Company does not forecast coincident peak loads for individual projects.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216656, "filing_description": "DKT 55378 STF-DEA-1 Data Request Responses", "filing_date": "12/7/2023", "staff": "DEA", "doc_id": "STF-DEA-1-15", "is_protective_disclosure": "yes", "question": "Refer to TS 2023.10.11 Load Realization Model.xlsx, ‘Model’ tab. Columns K through CL include xxxxxxxxxxxxxxxxxx load.\nWhat is the source of these values? Is it developed by GPC or provided by the customer?\nProvide all workpapers supporting these assumptions. Workpapers should be provided in electronic spreadsheet format with formulas intact and all source data included.", "response": "The annual load/ramp-up data are provided by the customer. If the customer also provides an expected Commercial Operation Date (“COD”), the COD is rounded up to the nearest REDACTED, and the initial load is assumed to materialize at the rounded-up COD. If an expected COD is not specified, the initial load is assumed to materialize at the end of the REDACTED. Linear interpolation is then used to create the REDACTED load. A simple illustration is provided in the “Example” tab of “TS-STF-DEA-1-15 Attachment.”\nPlease refer to “TS-STF-DEA-1-15 Attachment.xlsx” for workpapers supporting the calculations of REDACTED loads.", "attachment_filenames": "STF-DEA-1-15; PD STF-DEA-1-15 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216656, "filing_description": "DKT 55378 STF-DEA-1 Data Request Responses", "filing_date": "12/7/2023", "staff": "DEA", "doc_id": "STF-DEA-1-16", "is_protective_disclosure": "yes", "question": "Refer to TS 2023.10.11 Load Realization Model.xlsx, ‘Model’ tab. Column CW includes the “Success Indicator.” “TS 2023.10.11 Model Sheet Description.docx” states that it is an “xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx.”\nPlease confirm that the values are reversed, and that the description should read “…succeeded (1) or failed (0) …\nbinary 1 or 0.  Is there a threshold percentage above which a projectis assumed to have succeeded                                  ?", "response": "REDACTED REDACTED REDACTED REDACTED REDACTED\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED\tREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED", "attachment_filenames": "STF-DEA-1-16", "confidentiality_files": ""}, {"filing_api_id": 216656, "filing_description": "DKT 55378 STF-DEA-1 Data Request Responses", "filing_date": "12/7/2023", "staff": "DEA", "doc_id": "STF-DEA-1-17", "is_protective_disclosure": "no", "question": "Refer to TS 2023.10.11 Load Realization Model.xlsx, ‘Assumptions’ tab.\nExplain how the low, medium, and high probabilities in columns G-I were determined.\nExplain how the Ramp-Up Delay assumptions in columns J-L were determined.", "response": "Please refer to the Company’s responses to STF-DEA-1-7 and STF-DEA-1-8.\nPlease refer to the Company’s response to STF-DEA-1-9.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216656, "filing_description": "DKT 55378 STF-DEA-1 Data Request Responses", "filing_date": "12/7/2023", "staff": "DEA", "doc_id": "STF-DEA-1-18", "is_protective_disclosure": "no", "question": "Please refer to the file \"TS Technical Appendix Figures and Data.\" For the tab titled \"TS – Forecasts,” describe how the values from C3:C254 are calculated and the source for the data.", "response": "The forecasted numbers in the file “TS Technical Appendix Figures and Data,” tab titled “TS Forecasts,” cells C3:C254 are the Residential customer forecasts from the Budget 2023 load and energy forecast.\nThe Budget 2023 Residential customer forecast is developed using an econometric annual change model with the Annual Change in Customers as the dependent variable. Independent variables include the Annual Change in Georgia Housing Stock, the Unemployment Rate in Georgia, and the Federal Home Loan Mortgage Corporation 30-year Commitment Rate.\nThe model is estimated using Eviews software. The model uses the forecasts of the independent variables to calculate the expected annual change in Residential customers. These annual change numbers are then shaped to get from annual to monthly values, which are used to grow the customers beginning with the last historical data point.\nThe source of the historical Annual Change in Customers is internal Georgia Power Residential customer data. The history and forecasts for the three independent variables come from S&P Global (formerly IHS Markit).", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216656, "filing_description": "DKT 55378 STF-DEA-1 Data Request Responses", "filing_date": "12/7/2023", "staff": "DEA", "doc_id": "STF-DEA-1-19", "is_protective_disclosure": "no", "question": "Please refer to the folder titles \"ST Models\" (all TS files).  For all EViews files (those in .wf1 format), provide a version in Excel spreadsheet format (.xlsx)", "response": "Georgia Power does not use Excel to produce its short-term forecasts. As a result, the Company does not have the models in Excel spreadsheet format. The Eviews models were included in the “ST Models” folder provided with the 2023 IRP Update. Commission Staff and its consultants will need Eviews software to view the provided information.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216656, "filing_description": "DKT 55378 STF-DEA-1 Data Request Responses", "filing_date": "12/7/2023", "staff": "DEA", "doc_id": "STF-DEA-1-2", "is_protective_disclosure": "no", "question": "Refer to the 2023 IRP Update, Main Document, p. 3, stating that “each new large customer must pass financial and economic screening requirements, including the Ratepayer Impact Measure (‘RI’”) test.”\nPlease provide the RIM test results for each new large customer included in the updated load forecast.\nProvide workpapers for each RIM test conducted. Workpapers should be provided in electronic spreadsheet format with formulas intact.", "response": "RIM statements are listed below for new large customers included in the updated load forecast with active offers and offers that have been accepted by the customer.\nTS STF-DEA-1-2 Attachment A.pdf\nTS STF-DEA-1-2 Attachment B.pdf\nTS STF-DEA-1-2 Attachment C.pdf\nTS STF-DEA-1-2 Attachment D.pdf\nTS STF-DEA-1-2 Attachment E.pdf\nTS STF-DEA-1-2 Attachment F.pdf\nTS STF-DEA-1-2 Attachment G.pdf\nTS STF-DEA-1-2 Attachment H.pdf\nTS STF-DEA-1-2 Attachment I.pdf\nTS STF-DEA-1-2 Attachment J.pdf\nTS STF-DEA-1-2 Attachment K.pdf\nTS STF-DEA-1-2 Attachment L.pdf\nTS STF-DEA-1-2 Attachment M.pdf\nTS STF-DEA-1-2 Attachment N.pdf\nTS STF-DEA-1-2 Attachment O.pdf\nWorkpapers for each RIM statement provided in subsection (a) are attached and listed below. Each PRICEM model contains the respective offers that were developed in that particulate vintage of PRICEM.\nTS_PRICEM_B2021_MG0_6_24_2021 STF-DEA-1-2.xlsm\nTS_PRICEM_B2022_MG0_06-01-2022 STF-DEA-1-2.xlsm\nTS_PRICEM_B2023_MG0_06-12-2023 STF-DEA-1-2.xlsm\nTS_PRICEM_B2023_MG0_XX-XX-2023 05-11-23 STF-DEA-1-2.xlsm\nTS_PRICEM_B2023_MG0_XX-XX-2023 05-15-23 STF-DEA-1-2.xlsm", "attachment_filenames": "STF-DEA-1-2; PD STF-DEA-1-2 Attachments A-O and PRICEM models.docx; STF-DEA-1-20; STF-DEA-1-20 Attachment.docx", "confidentiality_files": ""}, {"filing_api_id": 216656, "filing_description": "DKT 55378 STF-DEA-1 Data Request Responses", "filing_date": "12/7/2023", "staff": "DEA", "doc_id": "STF-DEA-1-20", "is_protective_disclosure": "no", "question": "Please refer to the folder titled \"LT Models.\" Describe the source of all \"LoadMAP\" data. For any future values, describe how these values were predicted.", "response": "Please see STF-DEA-1-20 Attachment for a description of the LoadMap models and the data needed to run them. The description in this attachment is an excerpt taken from Section 5 of the Load and Energy Forecast Technical Appendix found in the 2022 IRP filing in Docket No. 44160.\nPlease note that the LoadMap models require an extensive amount of input variables. Most of these variables, for both historical and future periods, are obtained from Applied Energy Group (“AEG”). This data comes from AEG’s proprietary models. Other sources of data are described in STF-DEA-1-20 Attachment.", "attachment_filenames": "STF-DEA-1-20; STF-DEA-1-20 Attachment.docx", "confidentiality_files": ""}, {"filing_api_id": 216656, "filing_description": "DKT 55378 STF-DEA-1 Data Request Responses", "filing_date": "12/7/2023", "staff": "DEA", "doc_id": "STF-DEA-1-3", "is_protective_disclosure": "no", "question": "Refer to the 2023 IRP Update, Main Document, p. 9, stating: “In January 2023, following the significant increase in economic development projects during 2022, the Company developed a forecasting model to capture the uncertainties related to such projects.”  Is this forecasting model the “Load Realization Model” provided with the filing? If not, please provide the model.", "response": "No, this is not the Load Realization Model provided with the filing. The January model is an early version of the model that was provided with the Company’s October 27, 2023 filing. The January version is provided together with other load forecast sensitivities and workpapers in response to STF-DEA-1-4.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216656, "filing_description": "DKT 55378 STF-DEA-1 Data Request Responses", "filing_date": "12/7/2023", "staff": "DEA", "doc_id": "STF-DEA-1-4", "is_protective_disclosure": "no", "question": "Refer to the 2023 IRP Update, Main Document, p. 9, stating: “The load forecast sensitivities developed in late June 2023 identified considerable increases in projected load and the corresponding capacity need by the end of 2026 for the winter of 2026/2027.”\nPlease describe these load forecast sensitivities referenced in this passage.\nProvide all sensitivity forecasts, including workpapers, developed by the Company.", "response": "Georgia Power only ran one sensitivity in June 2023. The plural in “sensitivities” refers to the multiple probabilities/potential outcomes included within in a single run.\nPlease refer to the following attachments:\nTS STF-DEA-1-4 Attachment A.xlsx is the January 2023 sensitivity.\nTS STF-DEA-1-4 Attachment B.xlsx is the March 2023 sensitivity.\nTS STF-DEA-1-4 Attachment C.xlsx is the June 2023 sensitivity.\nTS STF-DEA-1-4 Attachment D.xlsx is the July 2023 sensitivity.\nPlease note that the August Sensitivity was already provided with the 2023 IRP Update filing: TS 2023.10.11 Load Realization Model.xlsx\nNote that these files contain working models. The @Risk software package is necessary to view the models. Without the @Risk Excel add-in, calculation results are displayed as “#NAME?.”", "attachment_filenames": "STF-DEA-1-4; PD STF-DEA-1-4 Attachments A-D.docx", "confidentiality_files": ""}, {"filing_api_id": 216656, "filing_description": "DKT 55378 STF-DEA-1 Data Request Responses", "filing_date": "12/7/2023", "staff": "DEA", "doc_id": "STF-DEA-1-5", "is_protective_disclosure": "no", "question": "Refer to the 2023 IRP Update Load and Energy Forecast, p. 3, noting that the analysis of the economic development loads use a P95 load value.\nPlease explain why GPC decided on a P95 load value rather than a P50 or other level. How does GPC incorporate risk of over-supply in the decision-making?\nPlease provide the P50 and P75 forecast of economic development loads.\nPlease provide an updated load forecast and annual capacity balancing using the P50 and P75 values provided in response to part (b).", "response": "Georgia Power selected a P95 load value in response to the unprecedented pace of economic development in the state of Georgia and because the Company has seen more increases in large projects interested in the state over the last several months than decreases. The P95 value establishes an upper limit for potential large load outcomes, offering a heightened level of load realization that is expected to benefit all customers and additional capacity resources to accommodate potential load increases in the ongoing economic development pipeline. Considering the uncertainty surrounding future growth, the Company opted for the P95 load value to ensure sufficient capacity to meet the anticipated loads and continue to support economic development in Georgia  and to benefit all customers.\nRegarding the risk of over-supply, the Company consistently takes measures to sell any capacity above the target reserve margin in the wholesale market. For instance, the power purchase agreement (“PPA”) with Mississippi Power Company has already been sold to another regional supplier for 2024 and 2025 since those years are prior to the Company’s year of need as identified in the 2023 IRP Update.\nPlease refer to TS STF-DEA-1-5 Attachment A for the P50 forecast of economic development loads. Georgia Power has not created a P75 forecast of economic development loads; therefore, one cannot be provided.\nPlease refer to STF-DEA-1-5 Attachment B for the P50 load forecast and annual capacity balancing. A P75 load forecast and annual capacity balancing cannot be provided since Georgia Power did not create a P75 forecast of economic development loads.", "attachment_filenames": "STF-DEA-1-5; PD STF-DEA-1-5 Attachment A.xlsx; STF-DEA-1-5 Attachment B.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216656, "filing_description": "DKT 55378 STF-DEA-1 Data Request Responses", "filing_date": "12/7/2023", "staff": "DEA", "doc_id": "STF-DEA-1-6", "is_protective_disclosure": "no", "question": "The Company’s filing notes that several of the new large load customers are data centers. Please identify which, if any, of the data centers are involved in cryptocurrency mining or operations. Provide a cross-reference to the projects listed in the load realization model.", "response": "In the Load Realization Model provided with the 2023 IRP Update, there is just one project that is involved in cryptocurrency mining or operations. The project is listed in Row 7 (Project Index #3; GPC Index #10) of the “Model” tab in the Load Realization Model.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216656, "filing_description": "DKT 55378 STF-DEA-1 Data Request Responses", "filing_date": "12/7/2023", "staff": "DEA", "doc_id": "STF-DEA-1-7", "is_protective_disclosure": "no", "question": "Refer to Pp 18 of the 2023 IRP Update Load and Energy Forecast, Table 1.5.1.7-1 Specifications of Triangular Distributions for Metered & Announced. Please provide the sources for the low, mid and high success values and why these are considered representative?", "response": "As discussed in the 2023 IRP Update filing, the new large load projects that are considering Georgia Power as their electric supplier are unprecedented both in the number of projects and the size of the loads being proposed. Since Georgia Power has not experienced this sort of growth before, there is no historical data that can serve as a guide for the forecast. As a result, the Company relied on informed judgment within the Company to develop key assumptions such as the Low, Mid, and High specifications found in Table 1.5.1.7-1.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216656, "filing_description": "DKT 55378 STF-DEA-1 Data Request Responses", "filing_date": "12/7/2023", "staff": "DEA", "doc_id": "STF-DEA-1-8", "is_protective_disclosure": "no", "question": "Refer to the Trade Secret 2023 IRP Update Load and Energy Forecast, p. 18, Table 1.5.1.7-1, providing the Low, Mid, and High metered vs. announced loads.\nProvide all workpapers and analysis supporting the values used in the analysis. Workpapers should be provided in electronic spreadsheet format with formulas intact and all source data included. Also provide any sensitivities tested by the Company.\nAre these values consistent with the Company’s historical experience with contracted large load projects? If so, provide supporting details and documentation.", "response": "The new large load projects that are considering Georgia Power as their electric supplier are unprecedented both in the number of projects and the size of the loads being proposed. Since Georgia Power has not experienced this sort of growth before, there is no historical data that can serve as a guide for the forecast. As a result, the Company relied on informed judgment within the Company to develop key assumptions such as the Low, Mid, and High specifications found in Table 1.5.1.7-1.\nThe Company has little historical experience with contracted large loads of the size, volume, and industry segments that are considering Georgia Power. The Company relied instead on informed judgment.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216656, "filing_description": "DKT 55378 STF-DEA-1 Data Request Responses", "filing_date": "12/7/2023", "staff": "DEA", "doc_id": "STF-DEA-1-9", "is_protective_disclosure": "no", "question": "Refer to the Trade Secret 2023 IRP Update Load and Energy Forecast, p. 18, Table 1.5.1.8-1, providing the Low, Mid, and High values for delays in project in-service.\nProvide all workpapers and analysis supporting the values used in the analysis. Workpapers should be provided in electronic spreadsheet format with formulas intact and all source data included. Also provide any sensitivities tested by the Company.\nAre these values consistent with the Company’s historical experience with contracted large load projects? If so, provide supporting details and documentation.", "response": "The new large load projects that are considering Georgia Power as their electric supplier are unprecedented both in the number of projects and the size of the loads being proposed. Since Georgia Power has not experienced this sort of growth before, there is no historical data that can serve as a guide for the forecast. As a result, the Company relied on informed judgment within the Company to develop key assumptions such as the Low, Mid, and High specifications for delays found in Table 1.5.1.8-1.\nThe Company has little historical experience with contracted large loads in the size, volume, and industry segments that are considering Georgia Power. The Company relied instead on informed judgment.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217322, "filing_description": "DKT 55378 STF-DEA-8 Supplemental Data Request Responses", "filing_date": "2/5/2024", "staff": "DEA", "doc_id": "STF-DEA-8-7", "is_protective_disclosure": "no", "question": "Please refer to the Company’s Transmission Screening Analysis.\nDid the Company consider any cases in the screening analysis which assumed battery charging? If so, please identify the cases and provide the results. If not, please explain why not.\nDoes the Company consider any cases containing battery charging as part of its standard transmission planning? If so, please identify the process that this occurs under.", "response": "Please refer to the Company’s response to STF-DEA-4-15.\nBattery charging studies were not performed as part of the transmission screens filed in the initial IRP Update filing and transmission supplemental filing because for the three sites studied, the BESS is charged by solar only behind the same point of interconnection.\nThe Company conducts battery charging studies during the initial designation studies as well as once in-service embedded in the Company’s annual Transmission Planning processes.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217322, "filing_description": "DKT 55378 STF-DEA-8 Supplemental Data Request Responses", "filing_date": "2/5/2024", "staff": "DEA", "doc_id": "STF-DEA-8-9", "is_protective_disclosure": "no", "question": "Please refer to the Company’s response to STF-JKA-2-21 a .\nWhere in the Company’s procedures is the Native Load Request (Designation) study process defined? Please provide the material which defines the process.\nWhen does the Company expect to conclude the formal study for the Santa Rosa PPA?\nProvide any results and reports associated with Native Load Requests over the past five (5) years. Were screens performed for any of these requests? If so, what was the outcome of these screens?\nFor all of the resources being pursued in the 2023 IRP Update, please indicate which would need to have a Native Load Request (Design) study performed.", "response": "The Company’s procedures associated with Native Load Requests are available on the Southern Company OASIS website under the “Business Practices, Waivers, and Exemptions” folder within the “Business Practices” subfolder.\nThe formal study for the Santa Rosa PPA should be completed by March 2024.\nA list of Designated Network Resources is available on the Southern Company OASIS website under the “Transmission Service Request (TSR)” folder within the “Designated Network Resources (DNR)” subfolder.\nThe listing of completed studies, Completed Studies, for the last five years is located on the Southern Company Oasis website under the “Studies” folder within the “Transmission Studies” subfolder.  If any resources shown on the Completed Studies document were designated, those resources would be placed on the previously provided Designated Network Resource list.  The following screen captures can assist with correlating designation studies in the completed studies list to resources listed in the designated network resource list:\nFrom the completed studies list, the facilities listed in the designation study shown in the last row can be found on the designated network resource under “Independent Power Producers.”\nFor the facilities shown in the previous screen capture, the designated facilities are listed by facility name (see highlighted items) under the “Independent Power Producers” section of the Designated Network Resource list.\nAll resources being pursued in the 2023 IRP Update would need to have a designation study performed with the exception of those facilities being extended or that do not have an incremental change in output. For example, the resources supplying the Mississippi Power PPA did not require a designation study because those units are already on the system providing power to customers and are simply proposed to be extended in service under the terms of the PPA.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217426, "filing_description": "DKT 55378 STF-DEA-3-6 Supplemental Data Request Response", "filing_date": "2/9/2024", "staff": "DEA", "doc_id": "STF-DEA-3-6", "is_protective_disclosure": "no", "question": "Provide a forecast of upcoming price increases as a result of the inclusion of Plant Vogtle Units 3 and 4 into rate base as well as the new load acquisitions necessary to serve major new load growth.", "response": "Per Commission approval of the Stipulation in Georgia Power’s Application to Adjust Rates to Include Reasonable and Prudent Plant Vogtle Units 3 and 4 Costs in Docket No. 29849, the base rate change will result in an increase of approximately 5% for the average retail customer, which translates to $8.95 per month for a typical residential customer using an average of 1,000 kWh/month. This base rate change will occur the month following the commercial operation date (“COD”) of Plant Vogtle Unit 4. Based on the current schedule, rates would change April 1, 2024.\nAll else being equal, the Company expects that the projected revenues associated with incremental load from known new customer projects, which necessitate the additional capacity requested in the 2023 IRP Update, will fully offset the costs of those resources requested in the 2023 IRP Update and put downward pressure on overall retail rates. Please note, the projected revenues provided are preliminary estimates at this point in time and may differ from future revenues. See TS STF-DEA-3-6 Attachments A-I for additional information.\nJanuary 12, 2024 Supplemental Filing Update: In accordance with the Agreement for Engineering, Procurement, and Construction between Georgia Power Company and a consortium of Mitsubishi Power Americas, Inc. and Black & Veatch Construction, Inc., with an effective date of January 12, 2024, and provided as TS STF-JKA-2-19 Supplemental Attachment P, Georgia Power reflects the latest cost and construction schedule for the proposed Plant Yates combustion turbines (“CTs”). Details are provided in TS STF-DEA-3-6 Supplemental Attachment G and are incorporated in row 16 for Plant Yates Units 8-10 on the “Estimated Inc Rev Req” worksheet in TS STF-DEA-3-6 Supplemental Attachment A.\nFebruary 9, 2024 Supplemental Filing Update: The Company is providing all values on the “Estimated Net Impact” worksheet for public disclosure in PD STF-DEA-3-6 Supplemental 2-9-24 Attachment A.", "attachment_filenames": "PD STF-DEA-3-6 Supplemental 2-9-24 Attachment A.xlsx; PD STF-DEA-3-6 Supplemental 2-9-24 Attachment I.xlsx", "confidentiality_files": ""}, {"filing_api_id": 219952, "filing_description": "STF-DEA-10 Data Request Responses", "filing_date": "9/16/2024", "staff": "DEA", "doc_id": "STF-DEA-10-1", "is_protective_disclosure": "yes", "question": "Regarding the McGrau Ford Phase 2 project, please provide detailed information on the transmission planning case scenarios where thermal loading issues were observed on the REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED?\nSpecifically, under which transmission planning case scenarios, years, and generation dispatch scenarios were these thermal loading issues identified?\nWere these scenarios modeled under different load growth assumptions, varying levels of renewable integration, or other system stress factors?\nPlease include a description of the input parameters, assumptions, and any sensitivity analyses performed.", "response": "a.\tREDACTED REDACTED REDACTED REDACTED REDACTED\nScenario: REDACTED\nYear(s): REDACTED\nBESS Mode: REDACTED\nREDACTED REDACTED REDACTED REDACTED\nScenario: REDACTED\nYear(s): REDACTED\nBESS Mode: REDACTED\nb.\tThis study was performed utilizing the v1C planning model assumptions.\nc. \tTransmission planning analysis consistent with TPL-001-5 was utilized for the Battery Energy Storage Systems (BESS) evaluation.", "attachment_filenames": "STF-DEA-10-1", "confidentiality_files": ""}, {"filing_api_id": 219952, "filing_description": "STF-DEA-10 Data Request Responses", "filing_date": "9/16/2024", "staff": "DEA", "doc_id": "STF-DEA-10-2", "is_protective_disclosure": "no", "question": "Regarding the McGrau Ford Phase 2 project, were any operational changes considered or implemented that could prevent thermal loading issues on the affected lines?\nIf so, please provide a detailed description of these operational changes, including but not limited to changes in dispatch or load-shedding strategies.\nWere these operational changes modeled in the planning studies as possible solutions to the thermal loading issues, and if so, what were the outcomes?\nWere any operational changes ruled out? If so, please provide the rationale for their exclusion.", "response": "No, given the timing of the required projects, no operational changes were considered or implemented to prevent the thermal loading issues.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 219952, "filing_description": "STF-DEA-10 Data Request Responses", "filing_date": "9/16/2024", "staff": "DEA", "doc_id": "STF-DEA-10-3", "is_protective_disclosure": "yes", "question": "Please provide a table summarizing the contingencies, MW dispatch, and percent loading for the REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED thermal loading issues for the McGrau Ford Phase 2 project?", "response": "The table below summarizes the information requested.", "attachment_filenames": "STF-DEA-10-3", "confidentiality_files": ""}, {"filing_api_id": 219952, "filing_description": "STF-DEA-10 Data Request Responses", "filing_date": "9/16/2024", "staff": "DEA", "doc_id": "STF-DEA-10-4", "is_protective_disclosure": "yes", "question": "Regarding the McGrau Ford Phase 2 project, what is the megawatt impact of the project in relation to the overloaded lines?", "response": "The table below showcases the delta change on the overstressed facilities.", "attachment_filenames": "STF-DEA-10-4", "confidentiality_files": ""}, {"filing_api_id": 219952, "filing_description": "STF-DEA-10 Data Request Responses", "filing_date": "9/16/2024", "staff": "DEA", "doc_id": "STF-DEA-10-5", "is_protective_disclosure": "yes", "question": "For all Battery Energy Storage System (BESS) projects, were charging modes tested during the planning studies?\nIf so, please describe the testing methodology, including the scenarios and assumptions used for charging modes.\nWere different charging profiles (e.g., time-of-day, seasonal variations) considered, and how did these affect the thermal loading and overall system reliability?", "response": "Charging modes were evaluated for both the McGrau Ford Phase II and Hammond BESS projects.\nESR Evaluation Criteria:\n100% discharge in REDACTED and REDACTED cases\n100% charge in REDACTED and REDACTED cases (min req. \ncharge within REDACTED)\n100% charge in REDACTED cases (min req. charge within REDACTED)\nCharging profiles are varied based on seasonal requirements as shown above.", "attachment_filenames": "STF-DEA-10-5", "confidentiality_files": ""}, {"filing_api_id": 219952, "filing_description": "STF-DEA-10 Data Request Responses", "filing_date": "9/16/2024", "staff": "DEA", "doc_id"
