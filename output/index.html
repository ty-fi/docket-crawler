 greater than or equal to 10 MW of nameplate capacity will qualify for the program.\nCustomers with resiliency needs or otherwise wanting on-site generation may be interested in taking service through the DCL-1 tariff. Qualifying customers that enter a program agreement with the Company will be enrolled subject to Commission approval of the resource under the resource certification process.\nThe proposed tariffs will be available prior to Georgia Power’s direct hearings.\nThe resiliency benefit is realized during times of electric service outage: the colocated DER will be used to provide participating customers with electric energy to support their operations.\nThe payment of a participating customer will be calculated as the total cost of the distributed energy resource (“DER”) less 75% of the net present value to the system over the life of the DER. The system value realized from a DER will be unique to that asset and determined on a case-by-case basis. Variables that could impact the system value include asset type, emission profile, fuel source, etc.\nThe design of the program incorporates feedback from customers and lessons learned implementing the DER Customer Program Pilot approved in the 2022 IRP. Please see STF-PIA-4-1 Attachment A for more information on customers contacted regarding DERs.  There has been preliminary outreach with several large customers on DER programs proposed in the IRP update, but since tariffs have not been filed, these were general in nature.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216697, "filing_description": "DKT 55378 STF-PIA-4 Data Request Responses", "filing_date": "12/11/2023", "staff": "PIA", "doc_id": "STF-PIA-4-3", "is_protective_disclosure": "no", "question": "Please refer to the IRP Update Main document p. 22 regarding the DER Customer Owned Program.\na. \tDescribe which commercial and industrial customers would qualify for the program.\nb. \tWhen would the proposed tariff for this program be available?\nc. \tWill only newly installed DER technologies be eligible? If so, why? If not, will there be a device age limit to which a customer’s DER will be eligible?\nd. \tDescribe if there has been any current outreach to potential customers. If there is interest in the program, please provide the number of customers with interest in the program, the size of each customer’s load, and any feedback that the Company has received from these customers.\ne. \tWill the customer still have independent control (the customer can override) over the DER equipment?\nf. \tDescribe Georgia Power’s proposed calculation for the credit that will be received by the customer for the capacity and energy value.\ng. \tPlease provide an example of how a participating customer’s credit will be calculated.", "response": "a. \tLarge commercial and industrial customers deploying distributed energy resources (“DER”) with nameplate capacity of at least 1 MW and less than 10 MW will qualify for the program. Customers may aggregate DERs at multiple accounts to meet the 1 MW minimum requirement, provided that each account’s DER is 250 kW or greater.\nb. \tThe proposed tariff will be available prior to Georgia Power’s direct hearings.\nc. \tOnly new DERs will be eligible for participation to ensure these DERs meet the DER Customer Owned Program’s certification, permitting, interconnection, and maintenance requirements.\nd. \tThe design of the program incorporates feedback from customers and lessons learned from implementing the Company’s DER Customer Program Pilot approved by the Commission in the 2022 IRP. Please see STF-PIA-4-1 Attachment A for more information on customers contacted regarding DERs.\ne. \tNo. During the contract period, Georgia Power will have sole operational control of the DER.\nThe payment to a participating customer will be calculated as 75% of the levelized net present value to the system over the contract period. The system value realized from a DER will be unique to that asset and determined on a case-by-case basis. Variables that could impact the system value include asset type, emission profile, fuel source, etc.\ng. \tSee STF-PIA-4-3 Attachment for an illustrative example.", "attachment_filenames": "STF-PIA-4-3; STF-PIA-4-3 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216697, "filing_description": "DKT 55378 STF-PIA-4 Data Request Responses", "filing_date": "12/11/2023", "staff": "PIA", "doc_id": "STF-PIA-4-4", "is_protective_disclosure": "no", "question": "Please refer to the IRP Update Main document p. 23 regarding the Curtailable Load Program.\nDescribe which commercial and industrial customers would qualify for the program.\nWhen would the proposed tariff for this program be available?\nPlease describe what amount of time Georgia Power would consider a “long-term commitment” from qualifying commercial and industrial customers for this program.\nExplain how and when the Curtailable Load Program will be dispatched.\nExplain how longer-term contracts, when compared to DPEC, will ensure resource availability.\nExplain the results of the DPEC program during Winter Storm Elliot. Specifically, provide how many customers were notified to reduce their load and how many participating customers reduced their load and the amount of the load reduction.\nDescribe how the value of the load reduction will be calculated.\nPlease provide an example of how this value will be calculated.\nDescribe the “greater benefits” that the Curtailable Load Program will provide to the system and how the benefits will be valued.\nPlease provide all differences between the proposed Curtailable Load Program and the DPEC program.\nDescribe if there has been any current outreach to potential customers. If there is interest in the program, please provide the number of customers with interest in the program, the size of each customer’s load, and any feedback that the Company has received from these customers.", "response": "Customer applicability will be outlined in the tariff.\nThe proposed tariff will be available prior to Georgia Power’s direct hearings.\nThe contract duration will be outlined in the tariff and associated customer agreement.\nThe Company will dispatch the Curtailable Load Program for system reliability purposes during periods of extreme supply and demand conditions.\nCurrent Demand Plus Energy Credit (“DPEC”) contracts are only one year, so the Company does not have a guarantee that demand reduction will be available in future years when the Company has a capacity need. With a longer-term contract, the Company can contractually guarantee resource availability in future years and plan accordingly.\nAll 47 DPEC accounts were notified to interrupt on 12/24/2022, of which 45 accounts provided some or all of their interruptible DPEC load requirements over the duration of the event. The amount of load reduced during the eight-hour event was, on average, 99 megawatts (“MW”) with a maximum reduction in a 30-minute period of 108 MW.\nThe load reduction value derivation will be outlined in the tariff.\nThe load reduction value derivation will be outlined in the tariff.\nThe structure of the Curtailable Load Program will reduce uncertainty about future resource availability. Demonstration requirements and updated compliance incentives will mitigate performance variability.\nPlease reference the Company’s Direct Testimony of Grubb, Valle, Evans, and Bush, filed on December 4, 2023 at page 47, lines 11-21.\nThere has been preliminary outreach with several large customers on distributed energy resource (“DER”) and demand response (“DR”) programs proposed in the 2023 IRP Update, but since tariffs have not yet been filed, these were general in nature.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216697, "filing_description": "DKT 55378 STF-PIA-4 Data Request Responses", "filing_date": "12/11/2023", "staff": "PIA", "doc_id": "STF-PIA-4-5", "is_protective_disclosure": "no", "question": "Please explain why the Proposed DER and Demand Response Programs were not considered in Technical Appendix 9: Economic Analysis of Capacity Resources.", "response": "The economic value of the proposed DER and demand response programs are based on the structure of the tariff designs. Specifically, these programs assume a credit or payment based on the system value the programs provide. This establishes the economic merit of the program without the need for an inclusion in the Economic Analysis of Capacity Resources. Additionally, participation in these programs is optional; participating customers pay or are compensated for the resources pursuant to the terms in the respective tariff. Conversely, the options considered in the Economic Analysis of Capacity Resources are not based on optional customer participation, and all customers will incur those costs upon approval. Finally, the DER and curtailable load programs will have costs and benefits unique for each participant which differs from the resources in the economic analysis.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216697, "filing_description": "DKT 55378 STF-PIA-4 Data Request Responses", "filing_date": "12/11/2023", "staff": "PIA", "doc_id": "STF-PIA-4-6", "is_protective_disclosure": "no", "question": "Please explain how and when the Proposed DER and Demand Response Programs will be dispatched.", "response": "The distributed energy resource (“DER”) programs proposed in the Company’s 2023 IRP Update will be dispatched for system use for both economic and reliability purposes, maximizing their value to all customers. The participating DER assets will also operate in the event of a local outage to provide resiliency to the participating customer. The Demand Response Programs will only be dispatched for reliability needs during periods in which the Company is experiencing extreme supply and demand conditions.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216697, "filing_description": "DKT 55378 STF-PIA-4 Data Request Responses", "filing_date": "12/11/2023", "staff": "PIA", "doc_id": "STF-PIA-4-7", "is_protective_disclosure": "no", "question": "In the Main Document, p. 14, Georgia Power is assuming that projects from the DG Renewable RFPs provide a 5% winter capacity equivalence.  What technology is Georgia Power assuming for this calculation (fixed vs. tracking percentage)?", "response": "To calculate the winter capacity equivalence, the Company assumed single-axis tracking as the technology for the DG Renewable RFPs.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216697, "filing_description": "DKT 55378 STF-PIA-4 Data Request Responses", "filing_date": "12/11/2023", "staff": "PIA", "doc_id": "STF-PIA-4-8", "is_protective_disclosure": "no", "question": "In the Main Document, p. 14, Georgia Power is assuming the same winter capacity equivalence for projects from the DG Renewable RFPs as projects from the Utility Scale Renewable RFPs. Please explain why both (DG and Utility Scale) resources are assumed to have the same winter capacity equivalence. Were batteries assumed to be procured in the upcoming CARES RFP and factored into the capacity value? If not, please explain why. Please explain why the utility scale resources that can be paired with energy storage are not assumed to have higher capacity equivalence.", "response": "For both the Distributed Generation (“DG”) and Utility Scale solar resources, the Company assumed a single-axis tracking technology would be used. Since Effective Load Carrying Capability (“ELCC”) simulations utilize the same nominal capacities and technology for DG and Utility Scale, the capacity values are the same. The ELCC is determined by performing reliability simulations in the SERVM model. Technologies that use the same technology receive the same ELCC, regardless of the size of the facility or their interconnection level (i.e. transmission or distribution level). Differences in the interconnection level are accounted for in energy losses; not in the ELCC.\nRenewable resources paired with energy storage is a proposed resource option in the CARES 2023 Utility Scale RFP. As currently proposed, the evaluation of renewable projects paired with energy storage bid into the CARES 2023 Utility Scale RFP will receive greater capacity equivalence than a bid for the renewable resource alone. The greater capacity equivalence of the renewable paired with energy storage results in an increase in avoided capacity benefits.  Without knowing the results of the CARES 2023 Utility Scale RFP, the Company does not assume bids will have storage included with the resources as the RFP does not require them and there would be no basis for an assumption on how many such resources may be successful bids.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216697, "filing_description": "DKT 55378 STF-PIA-4 Data Request Responses", "filing_date": "12/11/2023", "staff": "PIA", "doc_id": "STF-PIA-4-9", "is_protective_disclosure": "yes", "question": "How did Georgia Power consider potential funding opportunities from the Inflation Reduction Act (“IRA”) that would increase Company spending on infrastructure and/or generation assets for the IRP Update filing?  Please describe how the IRA’s Domestic Content Bonus Credit and Energy Community Bonus Credit were considered in resource selection.", "response": "The Company considered Inflation Reduction Act (“IRA”) benefits in the 2023 IRP Update filing such as the Investment Tax Credits (“ITC”) and Production Tax Credits (“PTC”) for the applicable technologies. The Company included ITC benefits for battery energy storage systems (“BESS”), PTC benefits for solar and, wind, and the 10-year clean electricity PTC for nuclear as part of the Company’s Resource Study Mix. Please see TS Technical Appendix 8 TS Resource Mix Study for more information on the modeling of these benefits in the Resource Mix Study. For BESS, the Resource Mix Study assumes a 40% ITC assuming BESS will qualify for the base tax credit with bonuses for labor and either the domestic content or energy community bonus credit.\nThe Company identified projects at Robins BESS, Moody BESS, and REDACTED Solar plus BESS that incorporate the benefits of the IRA. These benefits are reflected in the Company’s Economic Analysis. Please see TS Technical Appendix 9 TS Economic Analysis for more information. The BESS projects all assume utilization of the ITC. The BESS projects also assumed that augmentations performed in later project years will qualify for the domestic content bonus credit.  The solar component of the REDACTED Solar plus BESS project is assumed to generate PTCs. For the BESS and solar projects, the Company assumes the ability to earn the base credit plus the labor bonus credit. The Company will continue to look for opportunities to also leverage the domestic content or energy community bonus credits to bring further IRA benefits to customers where sensible. Please reference the Company’s response to STF-JKA-2-19 part (f) for further detail and the SAM files provided to the Commission Staff on October 27, 2023 to see the application of the tax benefits of the IRA mentioned above in the asset worksheets.\nThe Company will continue to evaluate and optimize opportunities related to the IRA that provide benefits to customers.", "attachment_filenames": "STF-PIA-4-9", "confidentiality_files": ""}, {"filing_api_id": 216721, "filing_description": "DKT 55378 STF-PIA-5 Data Request Responses", "filing_date": "12/13/2023", "staff": "PIA", "doc_id": "STF-PIA-5-1", "is_protective_disclosure": "no", "question": "Please identify any changes in assumptions since the 2022 IRP related to capacity at Georgia Power’s hydroelectric generating units (HGUs).", "response": "For resource-specific assumptions for the hydroelectric generating units from the 2022 IRP and from this 2023 IRP Update, please see the “2022 IRP - Winter” and “2023 IRP Update - Winter” worksheets in the “Figures 4, 5, 6, & 9 – Capacity Needs Data for B22, B23, and 2023 IRP Update.xlsx” file located in the “Main Document” folder of the “TS 2023 IRP Update Models and Workpapers,” which were previously provided to the Commission Staff on October 27, 2023 with the 2023 IRP Update filing.\nWhile there have been no changes to unit capacity assumptions, unit availability assumptions have been updated for near-term unit outages for hydro modernization project work and for the following units that are offline indefinitely due to equipment that has become inoperable until repairs or replacements can be completed as part of the Company’s future Hydro Modernization projects:\nGoat Rock Unit 5 offline indefinitely,\nMorgan Falls Unit 4 offline indefinitely, and\nOliver Unit 4 offline until after modernization; currently assumed to be available in 2029.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216721, "filing_description": "DKT 55378 STF-PIA-5 Data Request Responses", "filing_date": "12/13/2023", "staff": "PIA", "doc_id": "STF-PIA-5-10", "is_protective_disclosure": "no", "question": "Provide a copy of winning proposals, scopes of work, or work orders associated with all turbine-related modernization at the HGUs.", "response": "Please see the following attachments to the Company’s response to STF-PIA-5-8, as applicable:", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216721, "filing_description": "DKT 55378 STF-PIA-5 Data Request Responses", "filing_date": "12/13/2023", "staff": "PIA", "doc_id": "STF-PIA-5-2", "is_protective_disclosure": "no", "question": "Does Georgia Power project HGU capacity to increase through 2031? If so, please identify the generating capacity increases by unit and year.", "response": "No, Georgia Power’s planning assumptions do not project hydro unit capacity values to change through 2031 because unit capacity changes for IRP ratings are not final until the modernized equipment is procured, in place and tested, as described in the response to STF-PIA-24-21 in Docket No. 42310.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216721, "filing_description": "DKT 55378 STF-PIA-5 Data Request Responses", "filing_date": "12/13/2023", "staff": "PIA", "doc_id": "STF-PIA-5-3", "is_protective_disclosure": "no", "question": "Refer to the Company’s responses to STF-PIA-14-13 and STF-PIA-24-21 in Docket No. 42310. Please identify how these expected capacity increases, resulting from the Commission-approved hydro modernization projects, are reflected in the IRP Update filing. If these capacity increases are not included in the Company’s IRP Update, please explain why they are not.", "response": "The unit capacities provided in the responses to STF-PIA-14-13 and STF-PIA-24-21 in Docket No. 42310 are nameplate capacity estimates from turbine manufacturers. The resource planning capacities are dependent on equipment upgrades being in place and tested before determining the final values, which were not available for any hydro modernization units for the 2023 IRP Update. Therefore, no hydro unit capacity changes are projected in the Company’s planning assumptions for the 2023 IRP Update.\nUnit capacities will be updated, as available, for resource planning purposes in the assumptions for IRP modeling following the finalization of these values.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216721, "filing_description": "DKT 55378 STF-PIA-5 Data Request Responses", "filing_date": "12/13/2023", "staff": "PIA", "doc_id": "STF-PIA-5-4", "is_protective_disclosure": "no", "question": "Refer to the Company’s responses to STF-PIA-24-21 in Docket No. 42310.  The Company states, “Please note these are expected capacities from the turbine manufacturers. For Integrated Resource Plan (\"IRP\") purposes, hydro capacity will be the average simulated generation during eight (8) consecutive hours occurring on five (5) consecutive weekdays using the average water inflows from historic data.” Please describe in detail and provide supporting documentation as to how the “expected capabilities from the turbine manufacturers” is incorporated into the average simulated generation.", "response": "As described in the responses to STF-PIA-14-13 and STF-PIA-24-21 in Docket No. 42310, the nameplate capacities are estimates from turbine manufacturers.  The resource planning capacities are based on actual unit-specific data once the upgraded equipment is in place and tested, as well as site-specific river flow data, and does not directly use the turbine manufacturer estimates in the calculations.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216721, "filing_description": "DKT 55378 STF-PIA-5 Data Request Responses", "filing_date": "12/13/2023", "staff": "PIA", "doc_id": "STF-PIA-5-5", "is_protective_disclosure": "no", "question": "Please provide a copy of any memos, correspondence, spreadsheets or reports that mention or include projected HGU capacity, in, or after, calendar year 2020.", "response": "Please see STF-PIA-5-5 Attachments A through G for the FERC license amendment applications and final orders, as applicable.\nPlease see STF-PIA-5-5 Attachments H through O for a summary of the hydro plant capacities modeled for the Intercompany Interchange Contract (“IIC”), as well as the updated modeling files based on unit-specific data for Plant Terrora following the completion of hydro modernization and applicable testing completed in May 2023. While these values were not finalized and available for the IRP modeling assumptions for the 2023 IRP Update, the Plant Terrora planning capacities will be updated based on these IIC values in Georgia Power’s resource planning assumptions for Budget 2025 IRP modeling.\nPlease see STF-PIA-5-5 Attachments P through T for applicable DOE grant application materials.\nPlease also see the responses to STF-PIA-5-6 and 5-8 for information from the turbine procurement process.", "attachment_filenames": "STF-PIA-5-5; STF-PIA-5-5 Attachment A.pdf; STF-PIA-5-5 Attachment B.pdf; STF-PIA-5-5 Attachment C.pdf; STF-PIA-5-5 Attachment D.docx; STF-PIA-5-5 Attachment E.pdf; STF-PIA-5-5 Attachment F.pdf; STF-PIA-5-5 Attachment G.pdf; STF-PIA-5-5 Attachment H.xlsx; STF-PIA-5-5 Attachment I.xlsx; STF-PIA-5-5 Attachment J.xlsx; STF-PIA-5-5 Attachment K.xlsx; STF-PIA-5-5 Attachment L.xlsx; STF-PIA-5-5 Attachment M.xlsx; STF-PIA-5-5 Attachment N.xlsx; STF-PIA-5-5 Attachment O.xlsx; STF-PIA-5-5 Attachment P.pdf; STF-PIA-5-5 Attachment Q.pdf; STF-PIA-5-5 Attachment R.pdf; STF-PIA-5-5 Attachment S.pdf; STF-PIA-5-5 Attachment T.pdf", "confidentiality_files": ""}, {"filing_api_id": 216721, "filing_description": "DKT 55378 STF-PIA-5 Data Request Responses", "filing_date": "12/13/2023", "staff": "PIA", "doc_id": "STF-PIA-5-6", "is_protective_disclosure": "no", "question": "Provide a copy of all Requests for Proposals associated with hydroelectric turbine modernization issued in calendar years 2019-2023.", "response": "Please see TS STF-PIA-5-6 Attachments A through K.", "attachment_filenames": "STF-PIA-5-6; PD STF-PIA-5-6 Attachments A-K.docx", "confidentiality_files": ""}, {"filing_api_id": 216721, "filing_description": "DKT 55378 STF-PIA-5 Data Request Responses", "filing_date": "12/13/2023", "staff": "PIA", "doc_id": "STF-PIA-5-7", "is_protective_disclosure": "no", "question": "Provide a copy of all work orders associated with hydroelectric turbine modernization issued in calendar years 2019-2023.", "response": "Work orders are not currently used for turbine projects, which have been completed under firm price contracts. See response to STF-PIA-5-10 for turbine contracts for the hydro modernization projects that have been awarded at the time of this response.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216721, "filing_description": "DKT 55378 STF-PIA-5 Data Request Responses", "filing_date": "12/13/2023", "staff": "PIA", "doc_id": "STF-PIA-5-8", "is_protective_disclosure": "no", "question": "Provide a copy of all technical specifications for turbines, including nameplate capacity, provided to Georgia Power by turbine manufacturers associated with hydroelectric fleet modernization approved in the 2022 and 2019 IRPs.", "response": "Please see TS STF-PIA-5-8 Attachments A through AC.", "attachment_filenames": "STF-PIA-5-8; PD STF-PIA-5-8 Attachments A-AC.docx", "confidentiality_files": ""}, {"filing_api_id": 216721, "filing_description": "DKT 55378 STF-PIA-5 Data Request Responses", "filing_date": "12/13/2023", "staff": "PIA", "doc_id": "STF-PIA-5-9", "is_protective_disclosure": "no", "question": "Provide a copy of all technical specifications for turbines, including nameplate capacity, provided to Georgia Power by construction contractors associated with hydroelectric fleet modernization approved in the 2022 and 2019 IRPs.", "response": "Please see response to STF-PIA-5-8 for turbine technical specifications provided to Georgia Power. Turbine vendors are also responsible for installation; therefore, there are not separate proposals or technical specifications from a construction contractor.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216737, "filing_description": "DKT 55378 STF-PIA-6 Data Request Responses", "filing_date": "12/14/2023", "staff": "PIA", "doc_id": "STF-PIA-6-1", "is_protective_disclosure": "no", "question": "Provide both the peak demand and energy forecast by year from the Company’s Budget 2023 forecast. In addition:\nProvide by total company, and show broken down into all load categories (residential, commercial, industrial, etc.).\nIn the case of the demand forecast, provide both coincident and non-coincident peaks.\nRefer to the Company’s response to Q1.1 of the Informal Set 1, that mentions that external adjustments to the energy and peak forecasts were made for the 1,100 and 1,200 MW load increase. For each individual load project, separately show how the load forecast (peak demand and energy forecasts) was created by adding the individual external adjustments.\nFor each year, provide the hour of the coincident peak, and for each load category, provide the hour of the non-coincident peak.", "response": "The Budget 2023 energy forecast and peak demand forecast are included in TS STF-PIA-6-1 Attachment. The energy forecast is in the “Energy” tab. The coincident peak demand forecast is in the “Peak – Coincident” tab, while the non coincident peaks are provided in the “Peak – Non Coincident” tab.\nPlease refer to the “Peak-Coincident” and “Peak – Non Coincident” tabs in TS STF-PIA-6-1 Attachment.\nPlease refer to the “Energy,” “Peak – Coincident,” and “Peak – Non Coincident” tabs in TS STF-PIA-6-1 Attachment.\nThe expected data center loads (MW) by project can be found in the “Peak – Coincident” tab in columns L-O. The totals in column O match the referenced 1,100 and 1,200 MW load increases. To calculate coincident and non-coincident peaks, these totals are converted to an hourly frequency using an existing data center load shape. The data center load numbers included in the “Peak – Coincident” and “Peak – Non Coincident” tabs do not match the expected loads in column O since they include losses.\nPlease refer to the “Peak – Coincident” and “Peak – Non Coincident” tabs in TS STF-PIA-6-1 Attachment for the date and time of the coincident and non-coincident peaks.", "attachment_filenames": "STF-PIA-6-1; PD STF-PIA-6-1 Attachment.xlsx; STF-PIA-6-10; PD STF-PIA-6-10 Attachment.docx; STF-PIA-6-11; STF-PIA-6-12; STF-PIA-6-13; PD STF-PIA-6-13 Attachment.xlsx; STF-PIA-6-14; STF-PIA-6-14 Attachment.xlsx; STF-PIA-6-15; STF-PIA-6-15 Attachment A.xlsx; STF-PIA-6-15 Attachment B.xlsx; STF-PIA-6-15 Attachment C.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216737, "filing_description": "DKT 55378 STF-PIA-6 Data Request Responses", "filing_date": "12/14/2023", "staff": "PIA", "doc_id": "STF-PIA-6-10", "is_protective_disclosure": "yes", "question": "Refer to Informal Data Request 11 Attachment A TS Worksheet “External Additions”.\nProvide a copy of the Service Agreement for REDACTED REDACTED REDACTED REDACTED.", "response": "Please see TS STF-PIA-6-10 Attachment for the Service Agreement for REDACTED REDACTED. Note that Service Agreements for REDACTED REDACTED and REDACTED do not currently exist.", "attachment_filenames": "STF-PIA-6-10; PD STF-PIA-6-10 Attachment.docx", "confidentiality_files": ""}, {"filing_api_id": 216737, "filing_description": "DKT 55378 STF-PIA-6 Data Request Responses", "filing_date": "12/14/2023", "staff": "PIA", "doc_id": "STF-PIA-6-11", "is_protective_disclosure": "yes", "question": "Refer to Informal Data Request 11 Attachment A TS Worksheet “External Additions”.\nPlease provide information or evidence why the Company believes the load from the following entities will reach the levels and timing presented in “External Additions”.", "response": "The Company meets frequently with customers to understand their energy needs and to evaluate the timing, ramp-up, and viability of projects.  Customers have an interest in providing Georgia Power with accurate project assumptions and information to help inform    the equipment   needed to meet the customer’s energy needs and the Company’s economic evaluations. These discussions are reflected in the load profiles captured in Informal Data Request 11 Attachment A TS Worksheet “External Additions.”", "attachment_filenames": "STF-PIA-6-11", "confidentiality_files": ""}, {"filing_api_id": 216737, "filing_description": "DKT 55378 STF-PIA-6 Data Request Responses", "filing_date": "12/14/2023", "staff": "PIA", "doc_id": "STF-PIA-6-12", "is_protective_disclosure": "yes", "question": "Refer to Informal Data Request 12 Attachment A TS.xlsx.\nHow did the Company determine the probability (Column G) that the customer will choose GPC as the power provider? Provide a description and supporting workpapers with all formula intact.", "response": "The probability that the customer will choose Georgia Power as its power provider is determined using the informed judgement of Georgia Power personnel based on the state of the negotiations with potential customers. There are 4 categories of uncertainty, described as follows:\nREDACTED: customer has selected Georgia Power.\nREDACTED: high likelihood that the customer will select Georgia Power based upon the status of negotiations and all available information.\nREDACTED: medium likelihood that the customer will select Georgia Power based upon the status of negotiations and all available information.\nREDACTED: low likelihood that the customer will select Georgia Power based upon the status of negotiations and all available information.", "attachment_filenames": "STF-PIA-6-12", "confidentiality_files": ""}, {"filing_api_id": 216737, "filing_description": "DKT 55378 STF-PIA-6 Data Request Responses", "filing_date": "12/14/2023", "staff": "PIA", "doc_id": "STF-PIA-6-13", "is_protective_disclosure": "yes", "question": "Refer to Informal Data Request 12 Attachment A TS.xlsx.\nHow did the Company determine the probability of REDACTED (Column H) that a project will materialize after the customer signs a contract with GPC? Provide a description and supporting workpapers with all formula intact.", "response": "This question was initially an informal data request. The following response addresses the question as it was answered at the time of posting, with an update provided at the end of the response.\nMany projects have a lead-in (i.e., the time between contract signing and when the initial load occurs on the system) of at least a couple years. The Company estimates that there is still a REDACTED probability that a project may fail after contract signing due to circumstances such as economic downturns, financial distress, a shift in business strategies, etc. In other words, won contracts have a REDACTED - REDACTED = REDACTED chance of eventually materializing.\nThis REDACTED chance of failure is estimated by Georgia Power based on the tracking of historical projects that were won by the Company but that failed to come online. The Company has been tracking these Customer Choice projects since 2019. Since then, REDACTED projects have been won by Georgia Power. Of these projects, REDACTED have been completed and came online, REDACTED projects did not materialize, and REDACTED project is still uncertain. The following table summarizes these results:\nThe details behind this summary table can be found in TS STF-PIA-6-13 Attachment.\nUPDATE: A similar Data Request was asked previously. Please refer to STF-DEA-1-13 for the updated response. STF-DEA-1-13 contains the latest available information. The data in the updated response still supports using REDACTED as the probability that a project will materialize after a customer signs a contract with GPC.", "attachment_filenames": "STF-PIA-6-13; PD STF-PIA-6-13 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216737, "filing_description": "DKT 55378 STF-PIA-6 Data Request Responses", "filing_date": "12/14/2023", "staff": "PIA", "doc_id": "STF-PIA-6-14", "is_protective_disclosure": "no", "question": "See the Company’s response to Q4 of the 1st set of Informal Requests. Despite the Company’s answer to that question, in a recent meeting with the Company, the Company indicated that Southern Company’s wholesale market group in Birmingham keeps records of what generating units are owned by independent power suppliers, or other wholesale market players that have been sold to other wholesale entities in the past and keeps track of some market intelligence. For certain, the Company could provide some information about Southern Power units, and contracts with suppliers to Southern Company affiliates that will expire in the next few years. Please provide as much information as possible, and state the owners, details about the type of resource, details about how the capacity is currently contracted for, MWs, and expiration date of the current contract.", "response": "Please see STF-PIA-6-14 Attachment.\nThe Company does not have non-public information regarding Southern Power units. The Company relies on access via public sources for information on Southern Power units as it does for all other wholesale power entities.", "attachment_filenames": "STF-PIA-6-14; STF-PIA-6-14 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216737, "filing_description": "DKT 55378 STF-PIA-6 Data Request Responses", "filing_date": "12/14/2023", "staff": "PIA", "doc_id": "STF-PIA-6-15", "is_protective_disclosure": "no", "question": "See the Company’s responses to Informal Set 1 questions. For any responses containing load and capability tables that were previously provided that contained pasted in values, please provide an amended response and provide the requested table without pasted in values.", "response": "Please see STF-PIA-6-15 Attachments A through C.\nPlease note these are all dated forecasts, and the forecast in STF-PIA-6-15 Attachment C was not a formal forecast of any sort but was instead an estimate of how the forecast may vary from the previous year. For the latest load and capability tables, see the “Figures 4, 5, 6, & 9 - Capacity Needs Data for B22, B23, and 2023 IRP Update.xlsx” file in the “Main Document” folder of the “TS 2023 IRP Update Models and Workpapers,” which were previously provided to Commission Staff on October 27, 2023.", "attachment_filenames": "STF-PIA-6-15; STF-PIA-6-15 Attachment A.xlsx; STF-PIA-6-15 Attachment B.xlsx; STF-PIA-6-15 Attachment C.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216737, "filing_description": "DKT 55378 STF-PIA-6 Data Request Responses", "filing_date": "12/14/2023", "staff": "PIA", "doc_id": "STF-PIA-6-16", "is_protective_disclosure": "no", "question": "See the Company’s response to Informal Set 1 Question 6. Please provide a description of the case performed and any output results for the “currently performing expansion plan analyses” when they are completed, reviewed and finalized, which the Company expects “over the next few weeks.”", "response": "Please see the Aurora model files for the moderate gas, zero-dollar carbon (“MG0”) case in the “8 TS Resource Mix Study” folder located in the “TS Technical Appendix” folder of the “TS 2023 IRP Update Models and Workpapers,” which were previously provided to the Commission Staff on October 30, 2023, with the 2023 IRP Update filing.\nAdditionally, see the Aurora model files for the six planning scenarios in the “2 TS Resource Mix Study” folder of the “TS 2023 IRP Update Supplemental Filing 12-4-23 Models & Workpapers,” which were previously provided to the Commission Staff on December 5, 2023.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216737, "filing_description": "DKT 55378 STF-PIA-6 Data Request Responses", "filing_date": "12/14/2023", "staff": "PIA", "doc_id": "STF-PIA-6-2", "is_protective_disclosure": "no", "question": "Provide both the peak demand and energy forecast by year from the Company’s most recent July 2023 forecast:\nProvide by total company, and show broken down into all load categories (residential, commercial, industrial, etc.).\nIn the case of the demand forecast, provide both coincident and non-coincident peaks.\nFor each individual load project externally added to create the July 2023 load forecast (peak demand and energy forecasts), separately show how the load forecast was created by adding the individual external adjustments.\nFor each year, provide the hour of the coincident peak, and for each load category, provide the hour of the non-coincident peak.", "response": "This question was initially an informal data request. The following response addresses the question as it was answered at the time of posting, with an update provided at the end of the response.\nGeorgia Power only does one Budget forecast per year. The Company has created sensitivities to determine how much the existing forecast will be impacted by the growth in large new customers that are looking to develop projects in the state of Georgia. The Company is currently developing Budget 2024, including the latest new large customer sensitivity, and will provide it as part of Georgia Power’s upcoming 2023 IRP Update currently scheduled by the Company to be filed in September/October 2023. For this data request, the July customer sensitivity will be added to the existing Budget 2023 forecast.\nThe Budget 2023 energy and peak forecasts, adjusted for the expected impact of new large commercial and industrial customers, are included in TS STF-PIA-6-2 Attachment A. The energy forecast is in the “Energy” tab. The energy forecast adjustments, by customer, are included in the “Projects – Energy” tab.\nThe coincident peak forecast including adjustments for new large customers is included TS STF-PIA-6-2 Attachment A in the “Peak – Coincident” tab, while non coincident peaks, adjusted for new large customers, are provided in the “Peak - Non Coincident” tab. The peak forecast adjustments, by project, are included in the “Projects – Peak” tab.\nEach individual project and its expected energy impact is in TS STF-PIA-6-2 Attachment A, “Projects – Energy” Tab. The net forecast adjustments, calculated by subtracting the adjustments for data centers used in Budget 2023 from the estimated energy impacts of the July customer sensitivity, are added to the Budget 2023 energy forecast in the “Energy” tab.\nSimilarly, the net forecasted adjustments for peak are found in the Projects – Peak tab of TS STF-PIA-6-2 Attachment A.\nAs discussed in part (c) of the Company’s response to STF-PIA-6-1, the adjustments do not flow through directly to the coincident and non-coincident peaks. For coincident and non-coincident peaks, the totals are converted to an hourly frequency using an existing data center load shape for commercial and an existing industrial load shape. The commercial and industrial forecast adjustments included in the “Peak – Coincident” and “Peak – Non Coincident” tabs do not match the net forecast adjustments in the Projects – Peak tab since these include losses.\nPlease refer to the “Peak – Coincident” and “Peak - Non Coincident” tabs in TS STF-PIA-6-2 Attachment A for the date and time of the coincident and non-coincident peaks.\nUPDATE:\nTS STF-PIA-6-2 Attachment B contains the same information requested in parts a – d for the 2023 IRP Update Load and Energy Forecast. The TS STF-PIA-6-2 Attachment B spreadsheet is organized the same way as TS STF-PIA-6-2 Attachment A for easy reference.", "attachment_filenames": "STF-PIA-6-2; PD STF-PIA-6-2 Attachment A.xlsx; PD STF-PIA-6-2 Attachment B.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216737, "filing_description": "DKT 55378 STF-PIA-6 Data Request Responses", "filing_date": "12/14/2023", "staff": "PIA", "doc_id": "STF-PIA-6-3", "is_protective_disclosure": "no", "question": "Explain updates or changes from the Budget 2022 included in the Budget 2023 forecast and July 2023 forecast (model inputs, assumptions, regression, end-use considerations, EV load, etc.)", "response": "This question was initially an informal data request. The following response addresses the question as it was answered at the time of posting, with an update provided at the end of the response.\nPlease note that Georgia Power only does one Budget forecast per year, so the only official forecasts currently available for comparison are Budget 2022 and Budget 2023. The Company is currently developing Budget 2024, which includes the latest new large customer sensitivity, and will provide it to the Commission once it is completed.\nBudget 2022 is the forecast that was used in the 2022 IRP, the assumptions for which were included in the 2022 IRP Load and Energy Forecast found in Technical Appendix Volume 1. Georgia Power’s Budget 2023 forecast used the same methodologies employed in the 2022 IRP. The underlying base forecast was prepared using updated economic outlooks for the United States and Georgia and an updated energy price forecast. The market profiles for class end uses were unchanged between the Budget 2022 and Budget 2023 forecasts. The economic forecast continues to provide a description of the economy for the next 20 years and includes many elements of the economy such as gross product, population, employment, commercial building square footage, and industrial production. The economic and demographic forecasts for Budget 2023 were obtained from S&P Global (formerly IHS Markit), a national provider of economic data and forecasts.\nConsistent with the approach taken in the 2022 IRP, the models used to produce both the short- and long-term Budget 2023 energy forecasts include a variety of economic and demographic variables as drivers of energy use. Weather, income, employment, historical load data, and industry standards for electrical equipment are among the variables used in the forecasting models. “Normal” weather is defined as the average of Cooling Degree Hours (“CDH”) and Heating Degree Hours (“HDH”) from 1980-2021.\nThe Budget 2023 short-term energy projections for residential, commercial, industrial and MARTA are based on linear regression models. The governmental lighting forecast is developed using information from Georgia Power field personnel. Except for governmental lighting and MARTA, the long-term forecast models are end-use models. As in Budget 2022, Budget 2023 uses the Load Management Analysis and Planning (“LoadMAP”) model to produce the long-term residential, commercial, and industrial forecasts. The MARTA long-term forecast uses the linear regression model developed for the short-term forecast, while the governmental lighting long-term forecast is based on information from Georgia Power field personnel.\nThe short- and long-term models forecast organic growth based on historical trends, including net customer additions; historic adoption of energy efficiency and the future effect of existing energy efficiency standards; changes in economic conditions and demographics; and trends that develop over time that are part of the Company’s historical data, which gets propagated throughout the forecast.\nThe results of the short-term and long-term models are integrated into a unified forecast. In Budget 2023, the short-term forecast results were used for the years 2023 through 2026 and the long-term results were used for 2027 to 2042. Budget 2023 uses hourly peak demand forecasting models to predict Georgia Power’s weather-normal peak demands.\nWith respect to the usual forecast adjustments included in each forecast, Budget 2023 includes: an updated forecast of electric vehicles from EPRI; an updated Behind-The-Meter Solar forecast from the Georgia Power Renewables Team; updated RTP prices, an updated DSM forecast, and an updated forecast of cogeneration activity from Georgia Power personnel.\nAs a result of the unprecedented growth in the development of new businesses across the state, Budget 2023 included three large data center projects. These projects were handled as external adjustments to the commercial energy and peak load forecasts.\nUPDATE: Since this question was originally asked as an informal data request, the Company has completed the 2023 IRP Update Load and Energy Forecast. A discussion of the 2023 IRP Update Load and Energy Forecast was provided along with the official filing in the Technical Appendix. The Technical Appendix includes a discussion of the forecast methodology, as well as a comparison of the 2023 IRP Update Load and Energy Forecast to Budget 2022 and Budget 2023.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216737, "filing_description": "DKT 55378 STF-PIA-6 Data Request Responses", "filing_date": "12/14/2023", "staff": "PIA", "doc_id": "STF-PIA-6-4", "is_protective_disclosure": "no", "question": "Aside from the individually identified new customer load growth opportunities that is expected to add thousands of MWs of new peak demand to the System, does the Company’s underlying load forecast model already include economic development and load growth assumptions?\nExplain how underlying load forecast model may have accounted for economic development already. Be specific to explain this separately for each of the load forecasts, that is for the B2022, B2023, and July 2023 load forecasts. Identify specific numeric quantities so that a comparison can be made between the three forecasts.\nExplain how underlying load forecast model may have accounted for general load growth already. Be specific to explain this separately for each of the load forecasts, that is for the B2022, B2023, and July 2023 load forecasts. Identify specific numeric quantities so that a comparison can be made between the three forecasts.\nHas the Company added economic development and load growth assumptions for specific customers on top of the development and growth assumed by the load forecast model? If not, please explain how the Company avoided double counting the thousands of MWs of new customer load that has been recently identified.", "response": "Note: As described in the Company’s response to STF-PIA-6-2, the Company did not develop a July 2023 forecast. In July of 2023, the Company developed a sensitivity to its B2023 forecast to account for how the existing forecast will be impacted by the growth in large new customers that are looking to develop projects in the state of Georgia.\nThe Company’s underlying load forecast captures the trends in historical economic development activity via its short- and long-term energy forecasts. The short-term energy forecast is based on econometric models that quantify the relationship between historical sales data and economic and demographic variables. The long-term energy forecast is based on end-use models that account for economic and other assumptions. Like the short-term models, the long-term end-use models capture historical growth in energy sales, including past economic development projects.\nThe Company’s energy forecasts are done at the class level: residential, commercial, industrial, governmental lighting, and MARTA. Growth for each customer class captures historical sales trends, including economic development projects, and the forecasted economic and demographic expectations in the Georgia Power service territory. Past economic development projects that have come on-line in recent years are embedded in historical sales. The models capture these developments and trends and extrapolate these at a class-level into the future. The impacts of past economic development projects on sales are not separately tracked, so a comparison of how much economic development is included in past forecasts is not available.\nAs explained in the Company’s response to question STF-PIA-2-4(a), the Company’s energy forecasts are done at the class level using historical sales. The models forecast past trends, which include past economic development projects, business closings, impacts of the economy, impacts of energy efficiency, etc. Historical sales are not broken out into growth from economic development, general load growth, or other factors. Therefore, a comparison of how much general load growth is in past forecasts is not available.\nGeorgia Power is seeing unprecedented growth in companies looking to expand in the state of Georgia. The expected load sizes (MW) of some of the announced expansions are well above anything the Company has seen before. From 2017-2021, Georgia Power’s Customer Choice program was selected to serve just over 150 MW, on average, in projects per year. In 2022, this total jumped to more than 2,000 MW. Year-to-date 2023, the Company has been selected to serve an additional 1,700 MW and is on track to surpass 2022’s total additions for the full year.\nThis growth greatly surpasses recent historical growth. To sufficiently address this growth, the Company must make external adjustments (i.e., adjustments to the baseline forecast)  to its commercial and industrial forecasts.\nThe Company takes steps to minimize the potential for double county of economic development load.\nFor example, it establishes thresholds to determine which new proposed loads should be considered as possible adjustments to the forecast. These thresholds are set by the expected annual average growth in the commercial and industrial forecasts, excluding any external adjustments. Commercial loads are expected to grow by an average of nearly 115 MW per year through 2027, while industrial loads are expected to grow by approximately 45 MW per year over the same period.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216737, "filing_description": "DKT 55378 STF-PIA-6 Data Request Responses", "filing_date": "12/14/2023", "staff": "PIA", "doc_id": "STF-PIA-6-5", "is_protective_disclosure": "no", "question": "Refer to Informal Data Request 6.\nPlease provide the analysis used by the Company that demonstrate that the customer choice offers pass the Rate Impact Measure test.", "response": "The Rate Impact Measure (“RIM”) test used by the Company for customer choice offers is conducted in the PRICEM model. This is the same analysis and model used by the company to calculate RIM for non-customer choice load expansions, captive new customers, and demand-side management programs.\nPRICEM is a spreadsheet-based marginal cost model designed by Southern Company Services to predict the change in revenue requirements and other effects attributable to changes in loads and/or revenues. Data inputs are consistent with inputs to AURORA and as such are taken from: (1) revenue requirements stream from Standard Analysis Model (“SAM”); (2) marginal energy costs from AURORA; and (3) technology cost assumptions.\nThe RIM test is a net present value calculation of the total benefits and total costs over the life of the project. As with demand-side management (“DSM”) and other analyses, a RIM calculation result above zero is considered passing.\nPlease refer to the Company’s response to STF-DEA-1-2 for examples of RIM test results and PRICEM models.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216737, "filing_description": "DKT 55378 STF-PIA-6 Data Request Responses", "filing_date": "12/14/2023", "staff": "PIA", "doc_id": "STF-PIA-6-6", "is_protective_disclosure": "no", "question": "Refer to Informal Data Request 11 Attachment A TS Worksheet “External Additions”.\nFor each entity, provide the physical address.", "response": "Please see TS STF-PIA-6-6 Attachment, column C for the requested information.", "attachment_filenames": "STF-PIA-6-6; PD STF-PIA-6-6 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216737, "filing_description": "DKT 55378 STF-PIA-6 Data Request Responses", "filing_date": "12/14/2023", "staff": "PIA", "doc_id": "STF-PIA-6-7", "is_protective_disclosure": "no", "question": "Refer to Informal Data Request 11 Attachment A TS Worksheet “External Additions”.\nFor each entity, identify whether the site is located inside or outside Georgia Power’s service territory.", "response": "Please see TS STF-PIA-6-6 Attachment, column D for the requested information.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216737, "filing_description": "DKT 55378 STF-PIA-6 Data Request Responses", "filing_date": "12/14/2023", "staff": "PIA", "doc_id": "STF-PIA-6-8", "is_protective_disclosure": "no", "question": "Refer to Informal Data Request 11 Attachment A TS Worksheet “External Additions”.\nHow does each entity control their site? Purchase / ownership, lease, option to purchase, option to lease or another arrangement?", "response": "Please see TS STF-PIA-6-6 Attachment, column E for the requested information.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216737, "filing_description": "DKT 55378 STF-PIA-6 Data Request Responses", "filing_date": "12/14/2023", "staff": "PIA", "doc_id": "STF-PIA-6-9", "is_protective_disclosure": "no", "question": "Refer to Informal Data Request 11 Attachment A TS Worksheet “External Additions”.\nIdentify whether the entity has signed a Service Agreement with Georgia Power for electric service and the date the Service Agreement was signed.", "response": "Please see TS STF-PIA-6-6 Attachment, column F for the requested information.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216644, "filing_description": "DKT 55378 STF-PIA-3 Data Request Responses", "filing_date": "12/6/2023", "staff": "PIA", "doc_id": "STF-PIA-3-1", "is_protective_disclosure": "no", "question": "Please provide the historical performance of the Thermostat DR program for the period of 2020-2023 including the total number of events, the dates of the events, the total summer maximum peak reduction, the total winter maximum peak reduction, the average summer peak reduction, the average winter peak reduction, and the maximum and average level of Georgia Power customer participation for Summer and Winter.", "response": "Response on following page.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216644, "filing_description": "DKT 55378 STF-PIA-3 Data Request Responses", "filing_date": "12/6/2023", "staff": "PIA", "doc_id": "STF-PIA-3-2", "is_protective_disclosure": "no", "question": "Please provide the monthly historical customer participation for the Thermostat DR program for the period of 2020-2023, with a breakdown of BYOT participants and New – Rebated thermostats that entered the program each year.", "response": "", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216644, "filing_description": "DKT 55378 STF-PIA-3 Data Request Responses", "filing_date": "12/6/2023", "staff": "PIA", "doc_id": "STF-PIA-3-3", "is_protective_disclosure": "no", "question": "Please describe how the Company plans to maintain participation in the Thermostat Demand Response program at 50,000 customers given that customers are able to withdraw from the program at any time and the Company is able to remove customers for excessive opting out of curtailment events.", "response": "Georgia Power will work with the program implementer to maintain participation at 50,000 devices through managing device enrollments to maintain goal, in-app notifications to customers from their thermostat provider, enrollment emails to all-electric customers, program promotion on Georgia Power websites, and the yearly retention incentive provided to customers.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216644, "filing_description": "DKT 55378 STF-PIA-3 Data Request Responses", "filing_date": "12/6/2023", "staff": "PIA", "doc_id": "STF-PIA-3-4", "is_protective_disclosure": "no", "question": "Please provide any modeling that the Company has conducted, or had conducted on its behalf, to identify the total potential demand savings from this program. The modeling could include, but not be limited to, the following areas of research:\nAn analysis of the total size of the market for homes in the Company’s service area that are eligible to participate in the program.  Please provide any modeling conducted to support the response.\nThe annual technical, economic, and achievable kW savings that could be realized by this program.\nThe percentage of total potential demand savings and total potential participation that is captured by the proposed 50,000 participants.\nDoes the Company believe that there is potential for even greater demand savings beyond the proposed 50,000 participants? If so, why not propose a larger increase in customer participation?\nWhat is the annual current sales estimate for thermostats in the Georgia Power service territory categorized by whether or not the thermostat is potentially eligible for this program?\nWhat is the estimated current number of residential customers with eligible thermostats, whether or not those costumers participate in the program?", "response": "For this 2023 IRP Update Filing, the Company consulted the program implementer, DSM program design contractor, and Company experts to determine the number of participants to propose while maintaining cost effectiveness of the program. The Company did not perform any additional analysis on the potential demand savings of the program beyond what was included in the Company’s 2022 IRP and DSM Certification Filings in Docket Nos. 44160 and 44161.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216644, "filing_description": "DKT 55378 STF-PIA-3 Data Request Responses", "filing_date": "12/6/2023", "staff": "PIA", "doc_id": "STF-PIA-3-5", "is_protective_disclosure": "no", "question": "The Company states that the Thermostat DR program shows a positive TRC value, which is reflected in the updated filing.\nPlease provide an electronic copy of the benefit/cost model used to calculate the TRC test for the expanded program, including all inputs for the TRC calculation and all outputs.\nPlease describe the changes to the program or otherwise that resulted in the change of TRC results.\nDoes the TRC test results include any kWh savings or only kW savings?", "response": "Please refer to TS STF-PIA-3-5 Attachment.\nThe following changes resulted in the new TRC results:\nAvoided costs were updated to reflect a more recent capacity price forecast.\nParticipation was updated to assume 50,000 participants.\nParticipation turnover was updated to assume a 15% annual turnover rate.\nDelivery costs, administration costs, marketing costs, and evaluation costs were updated to reflect an updated contract with the implementor to provide 50,000 participants.\nThe TRC test results do not include any kWh savings, only kW demand savings.", "attachment_filenames": "STF-PIA-3-5; PD STF-PIA-3-5 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216644, "filing_description": "DKT 55378 STF-PIA-3 Data Request Responses", "filing_date": "12/6/2023", "staff": "PIA", "doc_id": "STF-PIA-3-6", "is_protective_disclosure": "no", "question": "Please provide the most recent samples of information provided to program participants regarding how the curtailment events work and the notifications participants receive when events are scheduled to occur.", "response": "Welcome to TEMP Check email:\nFlex Hours Are Happening (customer notification prior to event):\nCustomer gets notification within 24 hours of a regularly scheduled event and has the option to opt-out.\nCritical Event Flex Hours Are Happening (customer notification prior to event):\nCustomer gets notification prior to a critical event and has the option to opt-out. Critical event scheduled with 75 minutes notice.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216644, "filing_description": "DKT 55378 STF-PIA-3 Data Request Responses", "filing_date": "12/6/2023", "staff": "PIA", "doc_id": "STF-PIA-3-7", "is_protective_disclosure": "no", "question": "For 2024, the proposed Program Plans show an increase for Program Evaluation Spending from the approved 2022 IRP DSM Program Plans from $72,168 to $93,819, respectively.  Please provide a justification for the proposed increase to evaluate this program.", "response": "Georgia Power will make a good faith effort to recruit new participants as soon as the Company receives approval of its request to expand the Residential Thermostat Demand Response Program so the participant’s experience in the program and resulting savings can be collected to inform future program needs. The additional evaluation budget will be used to assess new participants and appropriately assign participants/customers into treatment and control groups, review program data, survey new participants, analyze survey responses, collect and analyze metering data, and calculate gross savings.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217562, "filing_description": "DKT 55378 STF-PIA-9-13 Supplemental Data Request Response", "filing_date": "2/15/2024", "staff": "PIA", "doc_id": "STF-PIA-9-13", "is_protective_disclosure": "no", "question": "Please refer to the Company’s “2023 Request for Information for Capacity Resources – Summary of Results” and provide the following information:\nSubmitted individual responses.\nPricing summaries.\nAnalysis comparing pricing to costs of the Company’s projects.\nInternal presentations (Georgia Power, Southern Company) discussing RFI responses.", "response": "Please refer to the file “TS_Zip_AllResponses_(XML+PDFs).zip,” which was provided to Commission Staff as part of the Company’s Supplemental filing to the 2023 IRP Update made on December 4, 2023.\nPricing information from respondents was optional. The Company did not perform any additional pricing summaries on the responses. Please refer to the following files, which were provided to Commission Staff as part of the Company’s Supplemental filing to the 2023 IRP Update made on December 4, 2023:\n“TS_Zip_AllResponses (XML+PDFs).zip,” “TS_AllResponses_RawDataTranslatedToExcel.xlsx,” “TS_ResponseDataScrubbed_ForRFISummary.xlsx”\nPlease see the Company’s response to STF-PIA-9-13(b).\nPlease refer to files TS STF-PIA-9-13 Attachment A and TS STF-PIA-9-13 Attachment B. Please note that the information included in TS STF-PIA-9-13 Attachment B was provided as a preliminary internal glance on October 26, 2023 – two days after the RFI closed – and was subject to change after a more detailed review of responses had been conducted.\nFebruary 15, 2024 Supplemental Response\nThe Company is providing PD STF-PIA-9-13 Attachment A and PD STF-PIA-9-13 Attachment B with selected redactions.", "attachment_filenames": "PD STF-PIA-9-13 Supplemental Attachment A.pdf; PD STF-PIA-9-13 Supplemental Attachment B.pdf", "confidentiality_files": ""}, {"filing_api_id": 217638, "filing_description": "DKT 55378 STF-PIA-11 Data Request Responses", "filing_date": "2/19/2024", "staff": "PIA", "doc_id": "STF-PIA-11-1", "is_protective_disclosure": "no", "question": "How would the base revenues (excluding fuel revenues) from external high load customers (primarily data centers) be reflected in the Company’s cost of service studies? Specifically, how would base revenues from external high load customers be allocated among the different customer classes? Using the Company’s most recent cost of service (Docket 44280 Evans Exhibit “LPE-1 and LPE-2.xlsx), describe how these external high load base revenues would be allocated in “Revenues From Sales” (Line No. 33 and columns 4 – 11) among the eight different customer classes.", "response": "The base revenues from high load projects would be reflected in the rate and corresponding rate group under which the customers take service. The Company anticipates that these high load customers will take service from a rate within the Marginal Rate Group (Docket 44280 Evans Exhibit “Exhibit____(LPE-1).pdf”, Schedule 1.00, Page 2, Line 33, column 11). However, the customer may select any rate for which they meet the applicability requirements.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217638, "filing_description": "DKT 55378 STF-PIA-11 Data Request Responses", "filing_date": "2/19/2024", "staff": "PIA", "doc_id": "STF-PIA-11-2", "is_protective_disclosure": "yes", "question": "How would the capital investment to construct Moody, Robins and REDACTED BESS projects and Yates CTs be reflected in the Company’s cost of service studies? Specifically, how would capital investment to construct Moody, Robins and REDACTED BESS projects and Yates CTs be allocated among the different customer classes? Using the Company’s most recent cost of service (Docket 44280 Evans Exhibit “LPE-1 and LPE-2.xlsx), describe how capital investment would be allocated in “Gross Plant”, “Accumulated Depreciation and “Net Electric Plant” (Line No. 1, 2 and 5 and columns 4 – 11) among the eight different customer classes.", "response": "Capital investments to construct Moody, Robins, and REDACTED BESS projects and Yates CTs will be reflected in the Company’s cost of service studies as shown below with references to the corresponding allocators as indicated by the notes contained within the schedule in Docket 44280 Evans Exhibit “Exhibit____(LPE-1).pdf.”", "attachment_filenames": "STF-PIA-11-2", "confidentiality_files": ""}, {"filing_api_id": 217638, "filing_description": "DKT 55378 STF-PIA-11 Data Request Responses", "filing_date": "2/19/2024", "staff": "PIA", "doc_id": "STF-PIA-11-3", "is_protective_disclosure": "yes", "question": "How would O&M (excluding O&M recovered under FCR rates) of Moody, Robins, and REDACTED BESS projects and Yates CTs be reflected in the Company’s cost of service studies? Specifically, how would the Moody, Robins, and REDACTED BESS projects and Yates CTs O&M be allocated among the different customer classes? Using the Company’s most recent cost of service (Docket 44280 Evans Exhibit “LPE-1 and LPE-2.xlsx), describe how O&M would be allocated in “Operations & Maintenance” (Line No. 36 and columns 4 – 11) among the eight different customer classes.", "response": "O&M (excluding O&M recovered under FCR rates) of Moody, Robins, and REDACTED BESS projects and Yates CTs will be reflected in the Company’s cost of service studies as shown below with references to the corresponding allocators as indicated by the notes contained within the schedule in Docket 44280 Evans Exhibit “Exhibit____(LPE-1).pdf.”", "attachment_filenames": "STF-PIA-11-3", "confidentiality_files": ""}, {"filing_api_id": 217638, "filing_description": "DKT 55378 STF-PIA-11 Data Request Responses", "filing_date": "2/19/2024", "staff": "PIA", "doc_id": "STF-PIA-11-4", "is_protective_disclosure": "no", "question": "The Company has asserted it would collect enough revenue from external high load customers to put downward pressure on other customers’ rates. How would this be reflected in the Company’s cost of service studies? What adjustments, if any, would the Company make to the cost of service study to ensure other customers’ rates are reduced? Using the Company’s most recent cost of service (Docket 44280 Evans Exhibit “LPE-1 and LPE-2.xlsx), identify any adjustments that would be made to rate base, revenues and expenses (Lines 1 – 46 and columns 4 – 11) to reflect downward pressure on other customers’ rates.", "response": "No adjustments to the Company’s cost of service study are contemplated at this time. The cost of service study will show revenues and the associated costs to serve for rates and rate groups. The decision to increase or decrease specific rates is a policy decision for the Georgia Public Service Commission.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217666, "filing_description": "DKT 55378 STF-PIA-12 Data Request Responses", "filing_date": "2/22/2024", "staff": "PIA", "doc_id": "STF-PIA-12-1", "is_protective_disclosure": "yes", "question": "For each resource listed in Figure 8 on page 26 if the 2023 IRP Update Main Document, please provide the following data in an excel spreadsheet:\nProjections of monthly generation for every year in which they are available, or at the highest level of granularity if monthly generation is not available.\nThe capacity factor at which the Company anticipates each resource will operate in every year for which data is available.", "response": "Monthly generation for the Figure 8 resources: Robins, Moody, REDACTED, Santa Rosa, and Yates is available and provided in the TS STF-PIA-12-1 Attachment. The resource labeled “Other BESS” should result in similar generation outcomes as Robins, Moody, and REDACTED, but since no additional projects have been identified there are no specific generation projections available for that resource at this time. Because no specific resources have been named to serve the MPC PPA, no projection of monthly generation has been forecasted. Generation for the Distributed Energy Resource (“DER”) and Flex program resources will depend on the specific assets and associated fuel sources and the level of customer participation. Demand Response programs do not provide generation. As stated in the direct testimony filed on December 4, 2023, the Company is no longer pursuing the potential acquisition of additional ownership interests in an existing generation asset within the Southern Company footprint.; therefore, no estimated monthly generation is provided for that resource.\nAnnual capacity factors for the Figure 8 resources: Robins, Moody, REDACTED, Santa Rosa, and Yates are available and are provided in the TS STF-PIA-12-1 Attachment. Please see the response to part (a) above regarding the capacity factors for the other Figure 8 resources.", "attachment_filenames": "STF-PIA-12-1; PD STF-PIA-12-1 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217666, "filing_description": "DKT 55378 STF-PIA-12 Data Request Responses", "filing_date": "2/22/2024", "staff": "PIA", "doc_id": "STF-PIA-12-2", "is_protective_disclosure": "no", "question": "For each of the six scenarios in the TS Resource Mix Study (MG0, LG0, HG0, MG20, MG50, and EL), please provide the following an Excel spreadsheet:\nAnnual generation from each resource in each year from 2024-2043. Please provide data separately for the Southern Company as a whole and for GPC only and include both existing resources and new builds.\nThe capacity factor at which the Company anticipates each resource will operate in every year from 2024-2043. Please provide data separately for the Southern Company as a whole and for GPC only, and include both existing resources and new builds.", "response": "Annual generation from each existing resource as well as each system expansion resource has been provided in each scenario’s respective Aurora output file. Please refer to column labeled “Generation_MWh” in the Resource-Year report of the output files. The Aurora software has the capability to export this report to Excel. New build resources in the expansion plans for each scenario are assigned at the system level only and have not been allocated to Georgia Power and therefore cannot be separately provided.\nAnnual capacity factor for each existing resource as well as each system expansion resource has been provided in each scenario’s respective Aurora output file. Please refer to column labeled “Capacity_Factor” in the Resource-Year report of the output files. The Aurora software has the capability to export this report to Excel. New build resources in the expansion plans for each scenario are assigned at the system level only and have not been allocated to Georgia Power and therefore cannot be separately provided.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217720, "filing_description": "DKT 55378 STF-PIA-13 Data Request Responses", "filing_date": "2/26/2024", "staff": "PIA", "doc_id": "STF-PIA-13-1", "is_protective_disclosure": "no", "question": "It appears the company analyzed several capacity expansion scenarios associated with serving this new anticipated customer load. Why did the company choose scenario MG0 (Mid-Gas and Zero Carbon) as its primary case?\nPlease provide additional quantitative detail on the main differences between input assumptions used in these scenarios.\nDoes MG0 align with gas price and utilized carbon cost assumptions in the last approved IRP?  If not, why?\nDid each scenario allow all resource options to be freely selected or are any resources “forced in” to the model?\nWhich scenario does the company believe best reflects scope of requirements included in the new EPA Source Performance standards (commonly referred to as EPA 111 b and d)?", "response": "The Company’s moderate gas view is based on the “Reference View” in the Annual Energy Outlook produced by the United States Energy Information Administration. This view of future natural gas prices is widely cited and publicly available. The Company’s Lower CO2 pressure view reflects what current law requires regarding CO2 emissions, with the assumption of some increasing stringency of requirements over time through the periodic review of regulations under the Clean Air Act, and the indirect pressure applied by the tax incentives available under the Inflation Reduction Act (“IRA”). The Company believes that its MG0 scenario (Moderate gas view, Lower CO2 pressure view) is appropriate for its base case as it reflects (1) a moderate fuel price forecast, and allows for consideration of higher and lower prices in the other scenarios, and (2) what current law requires with respect to CO2 emissions in the near term, and allows for consideration of moderate and higher pressures on CO2 emissions given the uncertainty with stringency, timing, and form of CO2 pressure.\nThe Company creates scenarios to aid in understanding some forms of uncertainty. Key uncertainties affecting planning include future environmental pressure—especially regarding carbon-dioxide, cost and performance of future generating technologies, future load growth, and the evolution of natural gas prices.\nThere are four main areas that involve input differences between scenarios: CO2 pressure, technology cost and performance, load growth, and fuel prices. Quantitative information for each assumption difference between scenarios can be found within the Supplemental Update Aurora files, provided December 4, 2023. The list below includes where to find specific input assumption details:\nCarbon pressure assumptions can be found within various tables and change sets.\nEmission price assumptions can be found in the Emission Price tables, labeled according to their associated scenario.\nThe last year CC without CCS is available can be found in the New Resources table.\nCT capacity factor constraint assumptions can be found within the change set “B2024 Final IRP – CT Capacity Factor Constraint.”\nTechnology cost and performance assumptions differ between scenarios based off the IRA end date assumption. These differences can be found within the New Resources table by utilizing the “Var Cost Mod1” column for production tax credit (“PTC”) assumption differences and utilizing the “Fix Cost Mod1 and Mod2” columns for investment tax credit (“ITC”) assumption differences.\nLoad assumptions are found in the Time Series Hourly tables, labeled according to their associated scenario.\nFuel price assumptions can be found in the Fuels tables, labeled according to their associated scenario.\nYes, the methodology used to develop the MG0 scenario, and specifically the gas and carbon cost assumptions, is consistent with the last approved IRP. The Company updated its gas price forecast using the EIA AEO 2023 information, and there is no carbon emissions cost assumption for the MG0 scenario in either the last approved IRP or this 2023 IRP Update.\nNo generic expansion resource options are forced into the model.\nBecause the rules are not yet final, it is still unclear what the revised guidelines that the U.S. Environmental Protection Agency (“EPA”) has proposed under section 111 of the Clean Air Act will require. For existing sources, state environmental authorities, including Georgia Environmental Protection Division (“EPD”), will each write their state’s plans for implementing the 111(d) rules, and these plans must then be submittal for approval by EPA. Under the proposed rule, this process may take up to three years. In the meantime, the Company continues to use the four views of future CO2 pressure considered in this IRP Update to capture a range of possible outcomes and has not identified a specific view as reflective of the proposed EPA 111(b) and 111(d) rules.", "attachment_filenames": "STF-PIA-13-11; STF-PIA-13-14; STF-PIA-13-14 Attachment.xlsx; STF-PIA-13-17; STF-PIA-13-17 Attachment A.pptx; STF-PIA-13-17 Attachment B.xlsx; STF-PIA-13-17 Attachment C.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217720, "filing_description": "DKT 55378 STF-PIA-13 Data Request Responses", "filing_date": "2/26/2024", "staff": "PIA", "doc_id": "STF-PIA-13-10", "is_protective_disclosure": "no", "question": "Is the proposed customer DER co-location program open to carbon-free electricity resources (such as solar+batteries or generators that run on carbon-free fuels)? What does “firm fuel dispatchable” resource mean in this context?", "response": "The Distributed Energy Resource (“DER”) Co-location program is eligible to carbon-free electricity resources, provided the resources meet the program requirements. Dispatchable refers to the resource being available on demand. Firm fuel indicates that the resource’s fuel source can be physically or contractually guaranteed.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217720, "filing_description": "DKT 55378 STF-PIA-13 Data Request Responses", "filing_date": "2/26/2024", "staff": "PIA", "doc_id": "STF-PIA-13-11", "is_protective_disclosure": "yes", "question": "How long does the company believe it takes to construct new utility-scale battery energy storage resources?  Is the timeline longer, shorter or approximately the same as constructing a new CT? Please provide answers to these questions for sites that do and do not require transmission upgrades to serve these generation facilities.", "response": "New generic battery resources in the Resource Mix Study utilize a REDACTED construction/spend curve. This timeline is shorter than the REDACTED construction/spend curve utilized for the generic combustion turbine (“CT”) resources in the Resource Mix Study. It is worth noting that the accel
