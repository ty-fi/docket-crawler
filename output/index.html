<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Georgia PSC Docket 55378 — Staff Data Requests</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.4/styles/ag-grid.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.4/styles/ag-theme-quartz.css"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --color-bg:       #f8f9fb;
    --color-surface:  #ffffff;
    --color-border:   #e2e6ea;
    --color-text:     #1a2332;
    --color-muted:    #6b7a8d;
    --color-accent:   #1d4ed8;
    --color-row-hover:#f0f4ff;
    --color-selected: #e8effe;

    --badge-DEA: #2563eb; --badge-DEA-bg: #dbeafe;
    --badge-GS:  #059669; --badge-GS-bg:  #d1fae5;
    --badge-JKA: #7c3aed; --badge-JKA-bg: #ede9fe;
    --badge-LA:  #d97706; --badge-LA-bg:  #fef3c7;
    --badge-PIA: #dc2626; --badge-PIA-bg: #fee2e2;

    --panel-width: 480px;
    --header-height: 64px;
  }

  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--color-bg); color: var(--color-text); }

  /* ── Header ── */
  header {
    height: var(--header-height);
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .header-title {
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .header-title h1 { font-size: 15px; font-weight: 700; color: var(--color-text); letter-spacing: -.2px; }
  .header-title span { font-size: 11px; color: var(--color-muted); margin-top: 1px; }

  .search-wrap {
    flex: 1;
    max-width: 400px;
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--color-muted);
    pointer-events: none;
  }
  #quickFilter {
    width: 100%;
    padding: 7px 12px 7px 34px;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    font-size: 13px;
    background: var(--color-bg);
    color: var(--color-text);
    outline: none;
    transition: border-color .15s;
  }
  #quickFilter:focus { border-color: var(--color-accent); background: #fff; }

  .staff-filters { display: flex; gap: 6px; }
  .staff-btn {
    padding: 4px 10px;
    border-radius: 20px;
    border: 1.5px solid transparent;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s, border-color .15s;
    background: transparent;
  }
  .staff-btn.active { border-color: currentColor; }
  .staff-btn:not(.active) { opacity: .4; }
  .staff-btn[data-staff="DEA"] { color: var(--badge-DEA); background: var(--badge-DEA-bg); }
  .staff-btn[data-staff="GS"]  { color: var(--badge-GS);  background: var(--badge-GS-bg);  }
  .staff-btn[data-staff="JKA"] { color: var(--badge-JKA); background: var(--badge-JKA-bg); }
  .staff-btn[data-staff="LA"]  { color: var(--badge-LA);  background: var(--badge-LA-bg);  }
  .staff-btn[data-staff="PIA"] { color: var(--badge-PIA); background: var(--badge-PIA-bg); }

  .record-count { font-size: 12px; color: var(--color-muted); white-space: nowrap; margin-left: auto; }

  /* ── Main layout ── */
  .main {
    display: flex;
    height: calc(100vh - var(--header-height));
    overflow: hidden;
  }

  .grid-wrap {
    flex: 1;
    min-width: 0;
    padding: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  #myGrid {
    flex: 1;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--color-border);
  }

  /* ── Detail panel ── */
  .detail-panel {
    width: 0;
    flex-shrink: 0;
    background: var(--color-surface);
    border-left: 1px solid var(--color-border);
    overflow: hidden;
    transition: width .2s ease;
    display: flex;
    flex-direction: column;
  }
  .detail-panel.open {
    width: var(--panel-width);
  }
  .detail-inner {
    width: var(--panel-width);
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .detail-header {
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--color-border);
    display: flex;
    align-items: flex-start;
    gap: 10px;
    flex-shrink: 0;
  }
  .detail-meta { flex: 1; min-width: 0; }
  .detail-doc-id { font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
  .detail-sub { font-size: 12px; color: var(--color-muted); margin-top: 3px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .detail-close {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--color-muted);
    padding: 4px;
    border-radius: 4px;
    line-height: 0;
    flex-shrink: 0;
  }
  .detail-close:hover { background: var(--color-bg); color: var(--color-text); }

  .detail-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .qa-section { display: flex; flex-direction: column; gap: 8px; }
  .qa-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: var(--color-muted);
  }
  .qa-text {
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--color-text);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .qa-text.question {
    background: #f6f8ff;
    border-left: 3px solid var(--color-accent);
    padding: 12px 14px;
    border-radius: 0 6px 6px 0;
  }
  .qa-text.response {
    background: #f9fafb;
    border-left: 3px solid #94a3b8;
    padding: 12px 14px;
    border-radius: 0 6px 6px 0;
  }

  .attachments-list { display: flex; flex-direction: column; gap: 4px; }
  .attachment-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--color-muted);
    padding: 5px 8px;
    background: var(--color-bg);
    border-radius: 4px;
  }
  .attachment-item svg { flex-shrink: 0; }

  /* ── AG Grid overrides ── */
  .ag-theme-quartz {
    --ag-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --ag-font-size: 13px;
    --ag-row-hover-color: var(--color-row-hover);
    --ag-selected-row-background-color: var(--color-selected);
    --ag-header-background-color: #f1f4f8;
    --ag-border-color: var(--color-border);
    --ag-cell-horizontal-padding: 12px;
  }
  .ag-row { cursor: pointer; }

  /* Staff badge */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .3px;
  }
  .badge-DEA { color: var(--badge-DEA); background: var(--badge-DEA-bg); }
  .badge-GS  { color: var(--badge-GS);  background: var(--badge-GS-bg);  }
  .badge-JKA { color: var(--badge-JKA); background: var(--badge-JKA-bg); }
  .badge-LA  { color: var(--badge-LA);  background: var(--badge-LA-bg);  }
  .badge-PIA { color: var(--badge-PIA); background: var(--badge-PIA-bg); }

  /* PD tag */
  .pd-tag {
    display: inline-block;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .4px;
    color: #92400e;
    background: #fef3c7;
    border: 1px solid #fcd34d;
  }

  .clip-icon { color: #94a3b8; font-size: 14px; }

  .preview {
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    white-space: normal;
    color: var(--color-text);
    line-height: 1.5;
  }
  .preview-muted { color: var(--color-muted); }
</style>
</head>

  <div class="header-title">
    <h1>Georgia PSC Docket 55378</h1>
    <span>Staff Data Request Responses — Georgia Power Company</span>

  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="quickFilter" placeholder="Search questions and responses…" autocomplete="off">
  </div>

  <div class="staff-filters" id="staffFilters"></div>

  <div class="record-count" id="recordCount"></div>
</header>

<div class="main">
  <div class="grid-wrap">
    <div id="myGrid" class="ag-theme-quartz"></div>

</div>

<script>
const RAW_DATA = [{"filing_api_id": 217006, "filing_description": "DKT 55378 STF-DEA-5 Data Request Responses", "filing_date": "1/10/2024", "staff": "DEA", "doc_id": "STF-DEA-5-1", "is_protective_disclosure": "no", "question": "Referring to the short-term energy forecast, please describe the threshold values used to identify large load customers that are beyond what could reasonably be calculated as organic growth and provide the historical data and methodology used to develop the threshold values. Also describe how these thresholds are implemented for both commercial and industrial models for the forecast of load.", "response": "The Company has established thresholds for commercial and industrial customers at 115 and 45 MW, respectively. The purpose behind these specific thresholds is to ensure that we accurately account for the large load customers through external adjustments without duplicating what is already included in the short-term baseline forecasts for these customer categories.\nThese thresholds are developed based on the annual average growth forecast for the commercial and industrial customer classes over the 2023 to 2027 period. If a customer’s anticipated load increase is greater than the growth projected for their entire class, the project is classified as an external adjustment due to its magnitude, which our current short-term forecasting methods cannot accommodate. Projects below the identified thresholds, however, are considered part of the organic growth included in the Company’s baseline forecast.\nIt is important to note that in calculating this growth, the Company has intentionally omitted the energy efficiency factor. This exclusion helps us to present a clearer picture of actual organic growth, as energy efficiency tends to reduce overall growth figures. Please refer to STF-DEA-5-1 Attachment for how the thresholds are calculated.", "attachment_filenames": "STF-DEA-5-1; PD STF-DEA-5-1 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217006, "filing_description": "DKT 55378 STF-DEA-5 Data Request Responses", "filing_date": "1/10/2024", "staff": "DEA", "doc_id": "STF-DEA-5-2", "is_protective_disclosure": "no", "question": "Please refer to the LoadMAP IND (Uncalibrated) model.\nFor the tab titled \"Control Panel,\" describe the variables and how the \"Incentive Levels\" in cells Y2:Z6 are intended to affect the model.\nFor the tab titled \"Saturations,\" please describe why the saturation levels might change over time. Generally, these changes are identified in the Miscellaneous and Solar PV Technologies.\nFor the tab titled \"UECs & EUIs,\" please describe why some do not have minimum and maximum lifetime data.\nFor the tab titled \"Utilization,\" describe how the data-set elasticities are determined.\nFor the tab titled \"Equipment Results,\"\nDescribe how these results are used in the ultimate peak and energy forecasts.\nConfirm that the total winter peak load for each sector in each year would be a sum of all sectoral winter peak demands provided in this spreadsheet. If not, explain why.\nFor all calibrated LoadMAP models, please describe the units associated with the baseline forecast results for peak demand.", "response": "The “Control Panel” tab can be used to be used to review selected inputs and results. In the lower part of the tab, the following information is available for review: base-year usage (kWh); purchase shares; and relative energy use.\nIncentive levels affect the level of achievability possible during the calculation of savings in the Technical, Economic, Achievable Potential (“TEAPot”) study, which the baseline model feeds into. The incentive levels do not affect the baseline calculations or purchase decisions.\nSaturations may change over time when new direct sampled data (direct surveys of Georgia customers) or regional/national data becomes available (e.g. the US Energy Information Administration’s Annual Energy Outlook) and is trended between such data points. For the specific identified technologies; however, the projection of “Solar PV” was provided by Georgia Power’s load forecasting department, and the “Miscellaneous” technology growth is a standing assumption brought forward from the two previous iterations of LoadMAP modeling for Georgia Power (in 2020 and 2016 respectively). This modest load growth continues to appear to track well to actual loads.\nThis question appears to refer to rows 641-1167, which are specially aggregated data labels derived from the technologies above. They serve a function in the downstream TEAPot model to aggregate certain unit loads for savings calculations but are not discrete technologies in themselves, and do not affect the baseline forecast.\nAEG often starts with a set of elasticities developed by Electric Power Research Institute (“EPRI”) for use in end-use modeling; however, these can be adjusted to align with real-world load responses as observed. While starting points for elasticities can be suggested by coefficients used in econometric modeling by the client utility, there is usually some trial and manual adjustment that takes place before elasticities are deemed reasonable. Calibration factors always receive an elasticity of 100% to ensure that they are applied fully.\ni. \tThese results are the model output of energy loads, peak impact, and unit counts at the technology and segment level. The total sector forecast is the sum of these items. Please note that Georgia Power’s peak forecast is developed in the Metrix Peak Demand model. The demand numbers from the LoadMAP models may be used in the evaluation of energy efficiency programs.\nii. \tConfirmed, the total winter peak is the sum of all sectoral winter peaks provided in the “Equipment Results” tab.\nSummer and Winter peak data on the “Equipment Results” tab is in megawatts (MW). The Avg. Replacement Summer and Winter Demand rows are in kW per market normalization unit by sector (Residential: Households, Commercial: sq.ft, Industrial: Employees).", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217006, "filing_description": "DKT 55378 STF-DEA-5 Data Request Responses", "filing_date": "1/10/2024", "staff": "DEA", "doc_id": "STF-DEA-5-3", "is_protective_disclosure": "no", "question": "Please refer to the large Load Realization Model\nOn the \"Assumptions\" tab,\nDescribe the extent to which historical data was used to determine the Low/Mid/High probabilities in columns G:I. Please name specific Class/Segment combinations and refer to a source where applicable.\nDescribe why Cryptocurrency and Datacenter load is more likely to materialize than the other industrial segments.", "response": "The Company has limited historical experience with large contracted loads across the various industry segments that are considering Georgia Power. Consequently, the company relied on informed judgment to establish key assumptions, including the Low, Mid, and High percentages shown in columns G to I. These percentages reflect the ratio between actual metered load and the announced load.\nColumns G:I on the “Assumptions” tab of the Load Realization Model represent the ratio (in %) between actual metered load and announced load. Due to the continuous operation of their equipment, Cryptocurrency and Datacenters are expected to use most of their connected load. Consequently, their percentage is higher than that of other segments included in the model. In contrast, industrial segments, which do not operate their connected load simultaneously, are assigned a lower percentage.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217006, "filing_description": "DKT 55378 STF-DEA-5 Data Request Responses", "filing_date": "1/10/2024", "staff": "DEA", "doc_id": "STF-DEA-5-4", "is_protective_disclosure": "no", "question": "Please provide a description of each variable used in the regressions that develop the energy and peak forecasts – include the short name from the model and then describe the variable and data source.", "response": "Please refer to STF-DEA-5-4 Attachment for the requested information.", "attachment_filenames": "STF-DEA-5-4; STF-DEA-5-4 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217006, "filing_description": "DKT 55378 STF-DEA-5 Data Request Responses", "filing_date": "1/10/2024", "staff": "DEA", "doc_id": "STF-DEA-5-5", "is_protective_disclosure": "no", "question": "Please provide Georgia Power’s forecasting groups model selection procedures in a document – this process of assessing the intuitive economic and statistical fit as described in the December 6, 2023 technical session.", "response": "Please refer to STF-DEA-3-9 for the requested information.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217006, "filing_description": "DKT 55378 STF-DEA-5 Data Request Responses", "filing_date": "1/10/2024", "staff": "DEA", "doc_id": "STF-DEA-5-6", "is_protective_disclosure": "no", "question": "Please provide the methodology and workpapers used to document and demonstrate that the commercial and industrial models already in use address only “organic” growth but not growth from large customer choice loads.", "response": "No workpapers are available to demonstrate that the baseline portion of the forecast exclusively addresses organic growth. In this context, ‘organic growth’ refers to the natural expansion of the Company’s existing operations. The Company’s baseline forecast models are specifically designed to project and forecast this organic growth, relying on a statistical analysis of past trends and relationships. Notably, there is no historical data accounting for growth from new lines of business or large customer choice loads, as there is no precedent for such loads in the historical records.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217006, "filing_description": "DKT 55378 STF-DEA-5 Data Request Responses", "filing_date": "1/10/2024", "staff": "DEA", "doc_id": "STF-DEA-5-7", "is_protective_disclosure": "no", "question": "Please provide the efficiency trends and assumptions used to develop each customer usage included in the LoadMap models for the forecast period.", "response": "Please refer to the LoadMap models. The efficiency trends are created/derived by the replacement of existing equipment with the new equipment on the “Tech Data” tab. The “Tech Data” tab identifies when equipment leaves the market and then is replaced with the new standard equipment and its usage. An example is in the residential LoadMap “Tech Data” tab. Lines 2 and 3 show the new standard 15 SEER Central AC replacing the old SEER 14 standard.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217006, "filing_description": "DKT 55378 STF-DEA-5 Data Request Responses", "filing_date": "1/10/2024", "staff": "DEA", "doc_id": "STF-DEA-5-8", "is_protective_disclosure": "no", "question": "Please provide historic and forecasted electricity price by customer class used in the models and describe the assumptions about known rate increases or potential increases to add plant to rate base in the forecast prices.", "response": "Historic prices by class through November 2023 were previously provided in STF-DEA-3-4.\nThe retail prices are contained within the LoadMap models. They are shown as real 2016 prices. The Company’s Financial Planning group provides base price escalators that have estimated known and projected increases. Ordered as part of the most recently approved base rate case (Docket No. 44280), the Company is under a three-year Alternate Rate Plan (“ARP”) structure that has served Georgia and our customers well since 1995. The current ARP period spans years 2023-2025, the base rate increases for these periods is reasonably known. Beyond this three-year ARP window, the Company assumes base rate recovery of prudently incurred investments and expenses that are necessary to continue providing clean, safe, reliable, and affordable energy to Georgia Power’s 2.8 million customers. At the time the base rate escalators were developed, the assumption was that the longer-term base rate increases would be in-line with inflation (2-3%, annually on average). Additionally, fuel costs are also incorporated into prices. Future fuel prices are estimated within the Aurora production cost model.\nForecasted prices by class are provided in STF-DEA-5-8 Attachment. Since the LoadMap models are annual, STF-DEA-5-8 Attachment includes both monthly and annual price data by class.\nAfter the Company completed the 2023 IRP Update Load and Energy Forecast, a discrepancy was discovered that had a minor impact on the overall forecast results. The discrepancy was found in the prices used in the commercial and industrial LoadMAP models, which impacted the energy and peak forecast results. The impact on commercial and industrial sales in 2030 was +138 GWh or 0.1% of total retail sales. The impact on peak was just +26 MW in 2030. By 2043, the impact on peak is +76 MW, or just 0.2% of winter peak.\nGiven the minimal impact on the forecast, no changes were made to the 2023 IRP Update Load and Energy Forecast.", "attachment_filenames": "STF-DEA-5-8; PD STF-DEA-5-8 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217006, "filing_description": "DKT 55378 STF-DEA-5 Data Request Responses", "filing_date": "1/10/2024", "staff": "DEA", "doc_id": "STF-DEA-5-9", "is_protective_disclosure": "no", "question": "Please provide the report cited during the December 6, 2023 technical session relative to the elasticity to electric pricing in the short and long term of 0.1% and 1.5% respectively.", "response": "The report referenced during the December 6, 2023 technical meeting comes from the U.S. Energy Information Administration. The report can be found using the following link: Price Elasticity for Energy Use in Buildings in the United States (eia.gov).", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217055, "filing_description": "DKT 55378 Supplemental Data Request Response STF-DEA-3-6", "filing_date": "1/12/2024", "staff": "DEA", "doc_id": "STF-DEA-3-6", "is_protective_disclosure": "no", "question": "Provide a forecast of upcoming price increases as a result of the inclusion of Plant Vogtle Units 3 and 4 into rate base as well as the new load acquisitions necessary to serve major new load growth.", "response": "Per Commission approval of the Stipulation in Georgia Power’s Application to Adjust Rates to Include Reasonable and Prudent Plant Vogtle Units 3 and 4 Costs in Docket No. 29849, the base rate change will result in an increase of approximately 5% for the average retail customer, which translates to $8.95 per month for a typical residential customer using an average of 1,000 kWh/month. This base rate change will occur the month following the commercial operation date (“COD”) of Plant Vogtle Unit 4. Based on the current schedule, rates would change April 1, 2024.\nAll else being equal, the Company expects that the projected revenues associated with incremental load from known new customer projects, which necessitate the additional capacity requested in the 2023 IRP Update, will fully offset the costs of those resources requested in the 2023 IRP Update and put downward pressure on overall retail rates. Please note, the projected revenues provided are preliminary estimates at this point in time and may differ from future revenues. See TS STF-DEA-3-6 Attachments A-I for additional information.\nJanuary 12, 2024 Supplemental Filing Update: In accordance with the Agreement for Engineering, Procurement, and Construction between Georgia Power Company and a consortium of Mitsubishi Power Americas, Inc. and Black & Veatch Construction, Inc., with an effective date of January 12, 2024, and provided as TS STF-JKA-2-19 Supplemental Attachment P, Georgia Power reflects the latest cost and construction schedule for the proposed Plant Yates combustion turbines (“CTs”). Details are provided in TS STF-DEA-3-6 Supplemental Attachment G and are incorporated in row 16 for Plant Yates Units 8-10 on the “Estimated Inc Rev Req” worksheet in TS STF-DEA-3-6 Supplemental Attachment A.", "attachment_filenames": "PD STF-DEA-3-6 Supplemental Attachment A.xlsx; PD STF-DEA-3-6 Supplemental Attachment G.docx", "confidentiality_files": ""}, {"filing_api_id": 217091, "filing_description": "DKT 55378 STF-DEA-6 Data Request Responses", "filing_date": "1/17/2024", "staff": "DEA", "doc_id": "STF-DEA-6-1", "is_protective_disclosure": "no", "question": "Attachment A provided in response to Question 1-1 DEA provides a list of customer choice customers with kW associated.  During the technical session on December 6, 2023 Georgia Power Staff noted that a “threshold” had been established for commercial and industrial customers that were considered to not be “organic” growth in the standard load forecasting approaches.  The thresholds noted were “GP set a threshold of 45 MW for Industrial and 150 MW for commercial customers who would be in the customer choice group and be additive to the structured models so these are not organic”.\nAre these the correct thresholds based on our notes from the session?\nPlease comment on each of the customer addition opportunities listed in this response that are lower than the threshold amount and indicate why they are noted as customer choice?\nIf the thresholds were set after 2022, please indicate what statistics are captured in the “historical analysis” noted during the technical session as the approach used to establish the distributions and success factors utilized in the 2023 LF update.\nAttachment A to the response to Question 1-1 DEA is entitled Customer Choice projects and Attachment B is titled Economic Development which contains all the projects not locating in GP service territory – what is the difference between the two groupings and how is the data used in the development of the Customer Choice Model?", "response": "No. The thresholds used were 45 MW for the Industrial class and 115 MW for the Commercial class.\nThe threshold amount used for the external adjustment to the forecast does not define customer choice opportunities. As defined by the Georgia Territorial Electric Service Act, a project is eligible to be considered customer choice if the connected load is above 900 kW, and not located in an exclusively assigned territory, or if the project locates in specific overlapping corridors or territories.\nSince the load growth that is occurring is based on unprecedented economic growth in the state, the Company based its thresholds on the latest forecast rather than on historical data. The methodology used to develop these thresholds is discussed in the Company’s response to STF-DEA-5-1.\nEconomic Development refers to potential customers who are considering locating in Georgia. Some projects may initially consider Georgia and elect to locate in another state and never progress to the point at which they can be considered for customer choice. After the potential customer selects Georgia, the project’s location and size determines whether or not the project is eligible to be considered customer choice.\nRefer to Section 1.5 of the Load and Energy Forecast Technical Appendix of the 2023 Integrated Resource Plan Update for a discussion on how this data is used in the Load Realization Model.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217091, "filing_description": "DKT 55378 STF-DEA-6 Data Request Responses", "filing_date": "1/17/2024", "staff": "DEA", "doc_id": "STF-DEA-6-2", "is_protective_disclosure": "no", "question": "On page 54 of the GPC testimony it states “The Company only extends competitive offers to eligible customers that pass financial and economic screening requirements, including the RIM test.“  Please identify the financial and economic screening requirements other than the RIM test that are used in assessing eligible customers?  Please provide the associated analyses with all equations intact.", "response": "Refer to part C of the Company’s response to STF-LA-1-18 for financial and economic screening requirements other than the RIM test.\nRefer to STF-LA-1-15 for associated RIM results and supporting analyses.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217091, "filing_description": "DKT 55378 STF-DEA-6 Data Request Responses", "filing_date": "1/17/2024", "staff": "DEA", "doc_id": "STF-DEA-6-3", "is_protective_disclosure": "no", "question": "Please refer to the most recent Load Realization Model submitted by the Company, on the “Model” Tab. For each project, provide the following:\nProject Name\nProject Location\nProject Location in relation to GPC territory (outside or inside)", "response": "Please refer to TS STF-DEA-6-3 Attachment for the requested information.", "attachment_filenames": "STF-DEA-6-3; PD STF-DEA-6-3 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217091, "filing_description": "DKT 55378 STF-DEA-6 Data Request Responses", "filing_date": "1/17/2024", "staff": "DEA", "doc_id": "STF-DEA-6-4", "is_protective_disclosure": "no", "question": "Please refer to the most recent Load Realization Model submitted by the Company, on the \"Correlation\" and \"Matrix Choices\" tabs.\nExplain why the correlation matrix only includes 0 and 1 values, and no correlations between those two values.\nExplain why the company assumes a Triangular distribution of Random Variation. Defend this choice with historical data. If data is not available, explain how this decision was made.\nExplain why the Triangular Random Variation correlation assumption was \"Independent across segments, perfect within.\" Explain why the other options were not appropriate.\nGiven a \"perfect within segments\" assumption for the Triangular Random Variation, explain how to interpret this assumption. Does this suggest that if Project A in Segment X were to materialize at a certain % of load, then the likelihood that Project B within Segment X would materialize is perfectly correlated with that of Project A?\nExplain why the Bernoulli Random Variation correlation assumption was \"Independent\". Explain why the other options were not appropriate.", "response": "In the absence of historical data, it is common practice to assume either perfect correlation or no correlation between variables to ensure that the correlation matrix is valid mathematically. The Company has reasonably assumed zero correlation for binary events that determine if a customer will become a Georgia Power customer. For load realization, the Company assumed perfect correlation within the same business segments and zero correlation across segments.\nThe Triangular distribution is chosen because it provides a simple yet powerful approach for estimating outcomes when dealing with a range of variables. This distribution requires only three points: the lowest, highest, and most likely outcomes. Please refer to Section 1.5.3 on page 21 of the 2023 IRP Update Load and Energy Forecast Technical Appendix for more details.\nWe assume “Independent across segments, perfect within” because economic or market conditions that affect load realization tend to impact companies within the same industry segment similarly. In contrast, companies in different segments are less likely to be similarly affected by these conditions. It is unlikely that the load realization of two companies will be similar merely because they are within the same Class, which is either Commercial or Industrial and very broad.\nThe assumption of ‘perfect within segments’ suggests that if Project A within a given segment reaches the nth percentile of Project A’s load distribution, then Project B within the same segment will also reach the nth percentile of Project B’s load distribution.\nThe ‘Independent’ assumption for the Bernoulli Random Variation is appropriate because it reflects the individual nature of customer decisions, such as choosing a state, selecting an electric service provider, or deciding whether or not to follow through with a service request for economic or financial conditions. These decisions are customer-specific and should have zero correlation.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217135, "filing_description": "DKT 55378 STF-DEA-7 Data Request Responses", "filing_date": "1/22/2024", "staff": "DEA", "doc_id": "STF-DEA-7-1", "is_protective_disclosure": "yes", "question": "For each external load project listed below identify whether the project is located inside or outside the Company’s service territory. If the load is outside the Company’s service territory, identify the entity (EMC or city) that is responsible for that territory.", "response": "Please refer to TS STF-DEA-7-1 Attachment for the requested information.", "attachment_filenames": "STF-DEA-7-1; PD STF-DEA-7-1 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217222, "filing_description": "DKT 55378 STF-DEA-8 Data Request Responses", "filing_date": "1/26/2024", "staff": "DEA", "doc_id": "STF-DEA-8-1", "is_protective_disclosure": "no", "question": "Please refer to the Company’s Transmission Screening Analysis Overview, the Company’s November 27, 2023 Transmission Planning Analysis Overview, and the Company’s Annual Transmission Update Report in Docket No. 44160.\nIs the screening process followed to evaluate resource options in the 2023 IRP Update filing defined in the Annual Transmission Update Report, the Guidelines for Planning Transmission System Facility Improvements, or any other Commission-approved filing? If so, please indicate where.", "response": "The Transmission Planning processes are outlined in Sections A, B, and D-1 of the 2022 Georgia Power Integrated Resource Plan (“IRP”) Technical Appendix Volume 3 (Docket No. 44160).  In the Annual Transmission Update Report associated with Docket No. 44160, the Transmission Planning processes are outlined in Sections II and III. The transmission screening process utilized in the 2023 IRP Update filing is consistent with the processes outlined in Technical Appendix Volume 3 and the Annual Transmission Update Report.", "attachment_filenames": "STF-DEA-8-10; STF-DEA-8-12; PD STF-DEA-8-12 Attachments A-E.docx", "confidentiality_files": ""}, {"filing_api_id": 217222, "filing_description": "DKT 55378 STF-DEA-8 Data Request Responses", "filing_date": "1/26/2024", "staff": "DEA", "doc_id": "STF-DEA-8-10", "is_protective_disclosure": "yes", "question": "Please refer to the Company’s Annual Transmission Update Report in Docket No. 44160 Appendix C – Strategic Projects – REDACTED – REDACTED.\nFor the cases reflected in Table 17, what assumptions were contained regarding generation at Yates?", "response": "The Company’s Annual Transmission Updated Report associated with Docket No. 44160 is the 2022 Georgia Integrated Transmission System (“ITS”) Ten-Year Plan (2023 – 2032). Table 17 refers to the transmission facilities that are impacted by the increased generation at Plant Franklin with the outage of the REDACTED – REDACTED. At the time the 2022 GA ITS Ten-Year Plan was completed, there was no additional generation at Yates included in the Transmission Planning cases. Tables 15 and 16 note the generation assumptions utilized in the 2022 GA ITS Ten-Year Plan.\nThe REDACTED – REDACTED line is embedded in the 2023 v2 load flow base cases utilized in the 2023 IRP Update transmission screens.", "attachment_filenames": "STF-DEA-8-10", "confidentiality_files": ""}, {"filing_api_id": 217222, "filing_description": "DKT 55378 STF-DEA-8 Data Request Responses", "filing_date": "1/26/2024", "staff": "DEA", "doc_id": "STF-DEA-8-11", "is_protective_disclosure": "no", "question": "It is our understanding that, if approved, the Company would expect to have the portfolio of transmission upgrades needed to allow Plant Yates to operate at full output in service by the summer of 2028.\nPlease provide technical support for this conclusion, including but not limited to indicative project phasing and timelines of equivalent projects.", "response": "Please refer to the Company’s response to STF-DEA-4-1.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217222, "filing_description": "DKT 55378 STF-DEA-8 Data Request Responses", "filing_date": "1/26/2024", "staff": "DEA", "doc_id": "STF-DEA-8-12", "is_protective_disclosure": "no", "question": "If not provided earlier, please provide the contingency files associated with the power flow cases.", "response": "Please refer to the following trade secret attachments:\nTS STF-DEA-8-12 Attachment A – Unit Out Mon file.mon\nTS STF-DEA-8-12 Attachment B – Unit Out Con file.con\nTS STF-DEA-8-12 Attachment C – No Unit Out Mon file.mon\nTS STF-DEA-8-12 Attachment D – No Unit Out Con file.con\nTS STF-DEA-8-12 Attachment E – Sub file.sub", "attachment_filenames": "STF-DEA-8-12; PD STF-DEA-8-12 Attachments A-E.docx", "confidentiality_files": ""}, {"filing_api_id": 217222, "filing_description": "DKT 55378 STF-DEA-8 Data Request Responses", "filing_date": "1/26/2024", "staff": "DEA", "doc_id": "STF-DEA-8-2", "is_protective_disclosure": "yes", "question": "Please refer to the Company’s Transmission Screening Analysis Overview, the Company’s November 27, 2023 Transmission Planning Analysis Overview, and the Company’s Annual Transmission Update Report in Docket No. 44160.\nFor each screen scenario, did the Company review all combinations of planning years 2024-2033, seasons (Summer Peak, Dusk Shoulder, Off-Peak, Daylight Shoulder), and generator out/area max? If not, indicate which analyses were omitted for which scenarios and the justification.", "response": "Yes, the Company evaluated Summer Peak, Dusk Shoulder, Off-Peak, Daylight Shoulder seasons for years 2024 – 2033 utilizing the Unit Out Scenarios shown in Table 1 and Area Max Scenarios shown in Table 2 below. Note that area max scenarios are not evaluated for Off-Peak load levels. Tables 1 and 2 will be redacted in their entirety for the Public Disclosure version of the response.\nTable 1: Unit Out Scenarios\nTable 2: Area Max Scenarios", "attachment_filenames": "STF-DEA-8-2", "confidentiality_files": ""}, {"filing_api_id": 217222, "filing_description": "DKT 55378 STF-DEA-8 Data Request Responses", "filing_date": "1/26/2024", "staff": "DEA", "doc_id": "STF-DEA-8-3", "is_protective_disclosure": "no", "question": "Please refer to the Company’s Transmission Screening Analysis Overview, the Company’s November 27, 2023 Transmission Planning Analysis Overview, and the Company’s Annual Transmission Update Report in Docket No. 44160.\nWhy was Scenario A1 chosen over Scenario A2 as the basis for Scenario B if it was determined that Lindsay Hill could not be considered as a capacity resource option ahead of 2029?", "response": "Lindsay Hill did not have a material impact on the results for Scenario B. Therefore, selecting Scenario A1 vs. Scenario A2 was not impactful to the results.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217222, "filing_description": "DKT 55378 STF-DEA-8 Data Request Responses", "filing_date": "1/26/2024", "staff": "DEA", "doc_id": "STF-DEA-8-4", "is_protective_disclosure": "no", "question": "Please refer to the Company’s Transmission Screening Analysis Overview, the Company’s November 27, 2023 Transmission Planning Analysis Overview, and the Company’s Annual Transmission Update Report in Docket No. 44160.\nFor each screen scenario, did the Company review all combinations of planning years 2024-2033, seasons (Summer Peak, Dusk Shoulder, Off-Peak, Daylight Shoulder), and generator out/area max? If not, indicate which analyses were omitted for which scenarios and the justification.", "response": "Please refer to Company’s response to STF-DEA-8-2.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217222, "filing_description": "DKT 55378 STF-DEA-8 Data Request Responses", "filing_date": "1/26/2024", "staff": "DEA", "doc_id": "STF-DEA-8-5", "is_protective_disclosure": "no", "question": "Please refer to the Company’s Transmission Screening Analysis Overview, the Company’s November 27, 2023 Transmission Planning Analysis Overview, and the Company’s Annual Transmission Update Report in Docket No. 44160.\nPlease refer to Section II.A Generation of the Transmission Planning Analysis Overview. Was the dispatch program utilized to commit and adjust generation for the screen cases? If so, were any modifications made to the program for the 2023 IRP Update screening?", "response": "Yes, the dispatch program was utilized to commit and adjust generation for the screening cases. Modifications made to the dispatch program allowed the units being extended in the screening assumptions to be available for dispatch in the load flow cases.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217222, "filing_description": "DKT 55378 STF-DEA-8 Data Request Responses", "filing_date": "1/26/2024", "staff": "DEA", "doc_id": "STF-DEA-8-6", "is_protective_disclosure": "no", "question": "Please refer to the Company’s Transmission Screening Analysis Overview, the Company’s November 27, 2023 Transmission Planning Analysis Overview, and the Company’s Annual Transmission Update Report in Docket No. 44160.\nPlease refer to footnote 2 in the Transmission Screening Analysis Overview. Does the Company expect to modify the parameters of the Robins and Moody Air Force Base resources in the dispatch program as a result of the BESS additions?", "response": "No, the Company does not expect to modify the parameter of the Robins and Moody Air Force Base resources in the dispatch program because of the BESS additions.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217222, "filing_description": "DKT 55378 STF-DEA-8 Data Request Responses", "filing_date": "1/26/2024", "staff": "DEA", "doc_id": "STF-DEA-8-7", "is_protective_disclosure": "no", "question": "Please refer to the Company’s Transmission Screening Analysis.\nDid the Company consider any cases in the screening analysis which assumed battery charging? If so, please identify the cases and provide the results. If not, please explain why not.\nDoes the Company consider any cases containing battery charging as part of its standard transmission planning? If so, please identify the process that this occurs under.", "response": "Please refer to the Company’s response to STF-DEA-4-15.\nThe Company conducts battery charging studies during the initial designation studies as well as once in-service embedded in the Company’s annual Transmission Planning processes.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217222, "filing_description": "DKT 55378 STF-DEA-8 Data Request Responses", "filing_date": "1/26/2024", "staff": "DEA", "doc_id": "STF-DEA-8-8", "is_protective_disclosure": "no", "question": "Please refer to the Company’s response to STF-JKA-1-3 e.\nProvide the Company’s criteria for determining that the MPC PPA extensions can be accommodated with no “directly assignable projects”. Provide the Company’s criteria for determining that the analysis of the Santa Rosa PPA did not identify any “attributable” projects.\nDid the Company observe any violations in the cases used to screen the MPC PPA extensions and the Santa Rosa PPA? If so, please indicate why each violation was not considered to necessitate a project assignable or attributable to the resources, respectively. For example, were alternative dispatches or operating guides applied?", "response": "Please refer to Company’s response to STF-DEA-8-1.\nAny violations observed in the cases used to screen the MPC PPA extensions and the Santa Rosa PPA were alleviated by use of operating guides or redispatch; thus, no projects were needed to accommodate these PPAs.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217222, "filing_description": "DKT 55378 STF-DEA-8 Data Request Responses", "filing_date": "1/26/2024", "staff": "DEA", "doc_id": "STF-DEA-8-9", "is_protective_disclosure": "no", "question": "Please refer to the Company’s response to STF-JKA-2-21 a .\nWhere in the Company’s procedures is the Native Load Request (Designation) study process defined? Please provide the material which defines the process.\nWhen does the Company expect to conclude the formal study for the Santa Rosa PPA?\nProvide any results and reports associated with Native Load Requests over the past five (5) years. Were screens performed for any of these requests? If so, what was the outcome of these screens?\nFor all of the resources being pursued in the 2023 IRP Update, please indicate which would need to have a Native Load Request (Design) study performed.", "response": "The Company’s procedures associated with Native Load Requests are available on the Southern Company OASIS website under the “Business Practices, Waivers, and Exemptions” folder within the “Business Practices” subfolder.\nThe formal study for the Santa Rosa PPA should be completed by March 2024.\nA list of Designated Network Resources is available on the Southern Company OASIS website under the “Transmission Service Request (TSR)” folder within the “Designated Network Resources (DNR)” subfolder.\nAll resources being pursued in the 2023 IRP Update would need to have a designation study performed with the exception of those facilities being extended or that do not have an incremental change in output. For example, the resources supplying the Mississippi Power PPA did not require a designation study because those units are already on the system providing power to customers and are simply proposed to be extended in service under the terms of the PPA.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217239, "filing_description": "DKT 55378 STF-DEA-9 Data Request Responses", "filing_date": "1/29/2024", "staff": "DEA", "doc_id": "STF-DEA-9-1", "is_protective_disclosure": "no", "question": "Please refer to the Company’s response to STF-PIA-4-9, stating that “The Company will continue to look for opportunities to also leverage the domestic content or energy community bonus credits to bring further IRA benefits to customers where sensible.”\nDo the battery storage sites at Robins and Moody qualify for the energy community tax credit 10% adder?\nDo the battery storage sites at Robins and Moody qualify for the energy domestic content 10% adder?\nIs the new prosed solar plus BESS facility eligible for the energy community tax credit 10% adder?\nIs the new prosed solar plus BESS facility eligible for the energy domestic content 10% adder?\nHas the Company evaluated the feasibility and economics of energy storage sites located in energy communities in Georgia? If so, please provide the results of any analysis, including workpapers if applicable.", "response": "Please see the Company’s response to STF-JKA-2-19(f).\nPlease see the Company’s response to STF-JKA-2-19(f).\nPlease see the Company’s response to STF-JKA-2-19(f).\nPlease see the Company’s response to STF-JKA-2-19(f).\nPlease see the Company’s response to STF-PIA-9-10.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217239, "filing_description": "DKT 55378 STF-DEA-9 Data Request Responses", "filing_date": "1/29/2024", "staff": "DEA", "doc_id": "STF-DEA-9-2", "is_protective_disclosure": "no", "question": "Please refer to the December 4 Supplemental Filing (2023 Request For Information For Capacity Resources – Summary Of Results), stating that “There is not enough time for an RFP to be conducted, resources to be constructed following certification, and transmission projects to be identified and completed to allow delivery by the end of calendar years 2025, 2026 or 2027.”\nTable 0-3-2 states that more than 2,700 MW of resources responding to the RFI are expected to be available by the end of 2027. Please provide a detailed explanation of the timeline issues that prevent these resources from being procured and placed in service prior to the end of 2027.\nWhy did the Company seek information on new capacity resources in the RFI if it had determined that there is insufficient time to procure a new resource?", "response": "The potential capacity shown in Table 2-3-2 did not include any existing operating assets, and only included new or planned projects. Please also see the Company’s responses to STF-JKA-4-2, STF-JKA-4-10(e), and STF-JKA-6-5.\nAs described in Section 1.1 (Purpose and Scope) of the RFI Summary filed as part of the Company’s Supplemental Filing on December 4, 2023, the purpose was “to gather market information regarding the availability of existing and planned Capacity Resources for the capacity need identified for years 2026 through 2028, the timeframe being addressed in the Company’s 2023 IRP Update, as well as for years 2029 through 2031, the time period to be addressed in the Company’s 2029-2031 All-Source Request for Proposals (“RFP”). The primary objective of the RFI was to provide Georgia Power with current market information on the size, cost, technology, availability, risk, and operational and technical attributes of any reliable resource that can meet the firmness and dispatchability requirements, as defined in the RFI, including, but not limited to: (i) Standalone Energy Storage System (“ESS”) with grid charging capability; (ii) ESS with a Renewable Resource  with grid charging capability; or (iii) thermal generation (e.g. natural gas, oil fired) (each a “Capacity Resource” and collectively, “Resource Types”).”\nThe RFI gathered information from the market that indicated that there were no existing resources available for the need years addressed in this IRP Update and gathered valuable information to help the Company prepare and understand potential market offerings for the forthcoming 2029-2031 All-Source RFP, which will likely include new projects given the amount of capacity this RFP will seek to procure.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217239, "filing_description": "DKT 55378 STF-DEA-9 Data Request Responses", "filing_date": "1/29/2024", "staff": "DEA", "doc_id": "STF-DEA-9-3", "is_protective_disclosure": "no", "question": "Please refer to the December 4 Supplemental Filing (2023 Request For Information For Capacity Resources – Summary Of Results), section 2.3, stating that “the RFI participants were primarily interested in a PPA option for ESS with a Renewable Resource, with grid charging capability.” If the developer interest in PPA is stronger than BOTs, why is the Company pursuing company ownership only? Will this limit the competitiveness of procurements?", "response": "As indicated in the “Commission Approval of Proposed Resources” section of the 2023 IRP Update Main Document filed on October 27, 2023, and in Section 2.3 of the “Request for Information Summary” filed on December 4, 2023, there is not enough time to complete the Request for Proposals (“RFP”) process and construct new generation and transmission resources to meet the Company’s accelerated capacity needs in 2026-2028. Georgia Power is requesting approval of Company-owned battery energy storage systems (“BESS”) as part of a comprehensive portfolio of resources that can meet the capacity needs identified in the 2023 IRP Update.\nSee the Company’s responses to STF-JKA-2-17, STF-JKA-4-1, STF-JKA-4-2, STF-JKA-4-3, STF-JKA-4-10(e), STF-JKA-4-11(f)-(g), and STF-JKA-6-5 for additional information regarding the amount of time required to complete the RFP process, the continued need for the RFPs approved in the 2022 IRP, and the development of Company-owned BESS.\nAs stated in the Company’s Direct Testimony filed on December 4, 2023 and at the Direct Hearings on January 16-17, 2024, the Company is fully supportive of the Commission’s RFP process. The proposed Company-owned resources included in the 2023 IRP Update request are separate and apart from the Company’s open and upcoming RFPs and should not impact the competitiveness of power purchase agreement (“PPA”) bids compared to build own transfer (“BOT”) bids in a future Company RFP.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217239, "filing_description": "DKT 55378 STF-DEA-9 Data Request Responses", "filing_date": "1/29/2024", "staff": "DEA", "doc_id": "STF-DEA-9-4", "is_protective_disclosure": "no", "question": "Please refer to the December 4 Supplemental Filing (2023 Request For Information For Capacity Resources – Summary Of Results).\nProvide full copies of the RFI responses received by the Company.\nProvide any documents or memos summarizing the RFI responses.\nProvide all pricing information received in the RFI responses.\nProvide any analysis conducted by or for the Company comparing pricing of the RFI resources to cost of the Company-owned projects proposed in the 2023 IRP Update.\nProvide internal Georgia Power Company, memos, or other related documents addressing RFI responses.\nProvide internal Southern Company, memos, or other related documents addressing RFI responses.", "response": "Please refer to the Company’s response to STF-PIA-9-13(a).\nPlease refer to the Company’s response to STF-PIA-9-13(b).\nPlease refer to the Company’s response to STF-PIA-9-13(b).\nPlease refer to the Company’s response to STF-PIA-9-13(b).\nPlease refer to the Company’s response to STF-PIA-9-13(d).\nPlease refer to the Company’s response to STF-PIA-9-13(d).", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217239, "filing_description": "DKT 55378 STF-DEA-9 Data Request Responses", "filing_date": "1/29/2024", "staff": "DEA", "doc_id": "STF-DEA-9-5", "is_protective_disclosure": "no", "question": "Please refer to the Company’s Direct Testimony, p. 35, lines 22-26, stating that the Robins and Moody BESS projects “can be charged by the Company’s largest owned solar resources located adjacent to each site but may have opportunities to be charged by the grid depending on the availability of firm transmission capacity.”\nPlease explain why firm transmission capacity would be needed to charge the battery from the grid.\nAre the Robins and Moody solar projects fully deliverable or is there curtailment? If the projects experience curtailment, please provide data detail curtailed hours and energy volumes.\nWill the battery and solar projects be able to simultaneously discharge to the grid at full capacity, if needed or economic? Or will the discharge be limited to the interconnection size of the solar facility.\nIf the battery is unable to charge from the grid, please explain what advantages there are of siting the facility at the Robins and Moody locations, since the battery’s operations will be more limited than a site where grid charging is feasible.", "response": "Firm transmission capacity is preferred when charging from the grid because it ensures that the battery can charge when needed to meet reliability needs.\nThe Robins and Moody solar projects are fully deliverable.\nThe discharge will be limited to the interconnection size of the solar facility.\nThe advantage of siting a battery at Robins and Moody is that these resources have known deliverability, and they are the best options to meet capacity needs in 2026 and 2027. Given the current system assumptions, the BESS and solar combination will receive a 100% Equivalent Load Carrying Capability “ELCC,” by only charging from the solar. The Company will investigate firm transmission deliverability service for charging in the future to expand the operational flexibility of the resource, but the immediate focus is identifying and deploying resources that can meet capacity needs in the 2026 and 2027.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217239, "filing_description": "DKT 55378 STF-DEA-9 Data Request Responses", "filing_date": "1/29/2024", "staff": "DEA", "doc_id": "STF-DEA-9-6", "is_protective_disclosure": "no", "question": "Please refer to the Company’s Direct Testimony, p. 36, lines 15-19, regarding the proposed BESS and Solar facility.\nWhat will be the total injection capability of the interconnection? Will both the BESS and Solar facilities be able to simultaneously discharge to the grid at full capacity, if needed or economic?\nWhat is the total expected accredited capacity value of the combined facility?", "response": "See Transmission Screening Analyses in the Technical Appendix. No, the BESS and the solar facility will not be able to simultaneously discharge to the grid at full capacity.\nThe BESS and Solar Facility will receive a 100% Equivalent Load Carrying Capability (“ELCC”) for the 200 MW of output.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217239, "filing_description": "DKT 55378 STF-DEA-9 Data Request Responses", "filing_date": "1/29/2024", "staff": "DEA", "doc_id": "STF-DEA-9-7", "is_protective_disclosure": "no", "question": "Please refer to Technical Appendix 4 (“Robins and Moody BESS”), stating: “For the proposed Robins and Moody BESS resources, the base assumption is that these projects will meet the PWA requirements and qualify for the 30% ITC benefit.” What is the foundation of this assumption? Provide any documentation regarding the tax credit qualification of the projects.", "response": "The Company expects to qualify for the Prevailing Wage and Apprenticeship (“PWA”) labor bonus, which would align with an Investment Tax Credit (“ITC”) of 30%. The Company issued a request for proposal (“RFP”) to battery suppliers and Engineering, Procurement, and Construction (“EPC”) companies to identify venders and contractors for BESS resources. The RFP requires contractors providing labor falling within the scope of prevailing wage or apprenticeship requirements under Public Law 117-169, enacted into law on August 16, 2022 (the Inflation Reduction Act), to comply with such requirements and price their proposals accordingly.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217239, "filing_description": "DKT 55378 STF-DEA-9 Data Request Responses", "filing_date": "1/29/2024", "staff": "DEA", "doc_id": "STF-DEA-9-8", "is_protective_disclosure": "no", "question": "Please refer to Technical Appendix 5 (“PD Technical Information Supporting the Proposal to Develop 200 MW BESS Co-located with 200 MW Solar”), stating that “The Company is seeking to acquire and construct an approximately 200 MW alternating current (“AC”) solar facility and an AC-coupled 200 MW/800 MWh BESS on a portion of the above-referenced property, which is under lease by Seller or its affiliates.”\nPlease explain further what the involvement of the Seller will be in the development, operation, and long-term ownership of the project.\nIs the Company simply acquiring land in the transaction, or are there power generation and/or transmission assets being purchased?", "response": "The Seller is the developer of the 200 MW BESS co-located with 200 MW solar facility. The Seller will also be responsible for constructing the facility. The Company will have long-term ownership of the 200 MW BESS co-located with 200 MW solar facility.\nThe Company will acquire rights to the land and a fully operational 200 MW BESS co-located with 200 MW solar facility once developed.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217239, "filing_description": "DKT 55378 STF-DEA-9 Data Request Responses", "filing_date": "1/29/2024", "staff": "DEA", "doc_id": "STF-DEA-9-9", "is_protective_disclosure": "yes", "question": "Please refer to Technical Appendix 5 (“PD Technical Information Supporting the Proposal to Develop 200 MW BESS Co-located with 200 MW Solar”).\nProvide all indicative pricing information received from the Seller supporting the cost estimate cited in the “Estimated Cost” section of this technical appendix.\nPlease provide a comparison of the cost of this project with the potential projects submitted in response to the RFI summarized in the Company’s supplemental filing.\nWhat level of tax credits (PTC and/or ITC) is the project expected to qualify for?  Is tax credit qualification risk borne by the Seller, the Company, or Georgia customers?", "response": "The Seller provided TS STF-DEA-9-9 Attachment to communicate indicative pricing information. REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.\nPlease see the Company’s response to STF-JKA-4-10(e).\nPlease see the Company’s response to STF-JKA-2-19 regarding project production and investment tax credits. REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.", "attachment_filenames": "STF-DEA-9-9; PD STF-DEA-9-9 Attachment.docx", "confidentiality_files": ""}, {"filing_api_id": 216945, "filing_description": "DKT 55378 STF-DEA-4 Data Request Responses", "filing_date": "1/4/2024", "staff": "DEA", "doc_id": "STF-DEA-4-1", "is_protective_disclosure": "no", "question": "For the proposed transmission upgrades identified in the screening analysis, please identify the case or cases (including whether the seasonal case was at normal dispatch or Area Max generation) that led to each transmission need.", "response": "Please refer to TS STF-DEA-4-1 Attachment.", "attachment_filenames": "STF-DEA-4-1; PD STF-DEA-4-1 Attachment.docx", "confidentiality_files": ""}, {"filing_api_id": 216945, "filing_description": "DKT 55378 STF-DEA-4 Data Request Responses", "filing_date": "1/4/2024", "staff": "DEA", "doc_id": "STF-DEA-4-10", "is_protective_disclosure": "no", "question": "Did Georgia Power assess and incorporate the clean energy requirements or preferences of each new load customer into the planning process? Please provide the data and correspondence that pertain to each new customer's explicit clean energy requirements or requests, as well as any clean energy options that were offered or negotiated.", "response": "Yes, the Company often discusses the benefits and eligibility criteria for potential new large load customers to participate in one or more of Georgia Power’s customer renewable programs, such as the Clean and Renewable Energy Subscription (“CARES”) Program, the Flex Renewable Energy Credit (“REC”) Program, the Retail REC Retirement (“R3”) Program, or other renewable program solutions as outlined on Georgia Power’s website.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216945, "filing_description": "DKT 55378 STF-DEA-4 Data Request Responses", "filing_date": "1/4/2024", "staff": "DEA", "doc_id": "STF-DEA-4-11", "is_protective_disclosure": "no", "question": "Was the application of dynamic line ratings considered as an alternative to permanent line upgrades, thereby allowing for a temporary thermal rating increase under certain contingencies? Detail any analysis carried out in this regard, including the technical and economic feasibility of utilizing dynamic line ratings within the existing infrastructure.", "response": "The Company only applied dynamic line ratings to thermal constraints identified in off-peak transmission planning cases.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216945, "filing_description": "DKT 55378 STF-DEA-4 Data Request Responses", "filing_date": "1/4/2024", "staff": "DEA", "doc_id": "STF-DEA-4-12", "is_protective_disclosure": "no", "question": "Regarding the upgrades presented on November 27, 2023, how did Georgia Power consider the load profile of the future load in their analysis? Was there a specific focus on facilities with operational flexibility for short activation periods, as opposed to their 'base' load levels? Please provide the load profile analysis and any assumptions regarding operational flexibility.", "response": "The Company incorporated committed loads at their contracted ramp rates into the v2 load flow bases cases utilized in the transmission screens filed in the 2023 Integrated Resource Plan (“IRP”) Update on October 27, 2023. Please refer to the Trade Secret load flow files provided to Commission Staff on October 31, 2023. For transmission planning purposes, the Company must consider the peak demand of the future load in its analysis. There was not a specific focus on facilities with operational flexibility for short activation periods for transmission planning purposes. Operational flexibility of the future load can be addressed through participation in the Company’s existing or proposed demand response (“DR”) programs.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216945, "filing_description": "DKT 55378 STF-DEA-4 Data Request Responses", "filing_date": "1/4/2024", "staff": "DEA", "doc_id": "STF-DEA-4-13", "is_protective_disclosure": "no", "question": "Did Georgia Power conduct any probability analysis or consider the likelihood of all future loads being online and operating at 100% of their requested MWs simultaneously, particularly during summer peak conditions? Submit any historical data from similar load customers that support this type of load profile assessment.", "response": "No, Georgia Power did not conduct any probability analysis or consider the likelihood of all future loads being online and operating at 100% of requested MWs simultaneously during summer peak conditions.\nThe Company does not track individual customer peak loads; therefore, the requested data does not exist.\nFor Transmission Planning analyses, large load customers are initially studied using the peak load ramp rates provided by the customer. Once the customer is online, the customer is analyzed in the annual transmission planning processes based on peak load levels provided through the load forecasting process. Please refer to the Transmission Planning study processes outlined in Technical Appendix Volume 3 of the 2022 Georgia Power Integrated Resource Plan (“IRP”) (Docket No. 44160).", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216945, "filing_description": "DKT 55378 STF-DEA-4 Data Request Responses", "filing_date": "1/4/2024", "staff": "DEA", "doc_id": "STF-DEA-4-14", "is_protective_disclosure": "no", "question": "In designing transmission solutions for the proposed new load, did Georgia Power consider and align with Southern Company's internal targets regarding clean energy? Please provide documentation that outlines how transmission solutions were designed to support these clean energy goals.", "response": "Georgia Power’s resource planning and transmission planning is conducted to meet the Company’s capacity and transmission needs in an efficient, reliable, and economical manner. The Company continues to demonstrate the prioritization of a flexible economic fleet transition through a well-balanced and diversified approach that aligns with the needs of customers, the necessity of maintaining a reliable electric system, and the timing and availability of advancements in the technology of generation resources.  However, specific clean energy targets did not impact the selection of transmission solutions. Georgia Power leveraged the generation assumptions included in the Company’s v2 load flow base cases along with the adjustments shared in the meeting with Commission Staff on November 27, 2023. Please refer to the Trade Secret load flow files provided to Commission Staff on October 31, 2023.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216945, "filing_description": "DKT 55378 STF-DEA-4 Data Request Responses", "filing_date": "1/4/2024", "staff": "DEA", "doc_id": "STF-DEA-4-15", "is_protective_disclosure": "no", "question": "In the preliminary results shared on November 27, 2023, did Georgia Power consider the role of transmission-level battery storage being online or charging during the studied scenarios? Supply the analysis or models that include transmission-level battery storage as a factor in maintaining system reliability and managing peak loads.", "response": "Yes, the Company considered transmission-level battery storage discharging in the studied scenarios. Please refer to the Trade Secret load flow files provided to Commission Staff on October 31, 2023.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216945, "filing_description": "DKT 55378 STF-DEA-4 Data Request Responses", "filing_date": "1/4/2024", "staff": "DEA", "doc_id": "STF-DEA-4-16", "is_protective_disclosure": "no", "question": "For the screening analysis, were any transmission upgrades from the separate “North-South” transmission study included, either in the base case or as a sensitivity?", "response": "No, transmission upgrades from the separate “North-South” transmission analyses were not included in the 2023 Integrated Resource Plan (“IRP”) Update transmission screens.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216945, "filing_description": "DKT 55378 STF-DEA-4 Data Request Responses", "filing_date": "1/4/2024", "staff": "DEA", "doc_id": "STF-DEA-4-2", "is_protective_disclosure": "no", "question": "In reference to the upgrades proposed in the results presented on November 27, 2023, please provide a detailed assessment of alternative solutions evaluated for their cost-effectiveness compared to the proposed upgrades or reconductoring. Include feasibility studies, comparative cost analysis, and potential benefits of each alternative.", "response": "Please refer to the transmission files provided to Commission Staff on October 31, 2023 for information supporting the findings presented on November 27, 2023.\nWith respect to project development and alternatives considered for projects, please refer to the Transmission Planning study and project development processes outlined in Technical Appendix Volume 3 of the 2022 Georgia Power Integrated Resource Plan (“IRP”) (Docket No. 44160). Due to the timing of the transmission screens, transmission planning focused on the use of operating guides, generation redispatch, and transmission line rebuilds/reconductors to alleviate identified constraints.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216945, "filing_description": "DKT 55378 STF-DEA-4 Data Request Responses", "filing_date": "1/4/2024", "staff": "DEA", "doc_id": "STF-DEA-4-3", "is_protective_disclosure": "no", "question": "With respect to the findings presented on November 27, 2023, was there an analysis on the feasibility and impact of bundling or reconductoring existing circuits for accommodating higher thermal ratings? Please provide the detailed findings and rationale for the chosen approach.", "response": "Please refer to the transmission files provided to Commission Staff on October 31, 2023 for information supporting the findings presented on November 27, 2023. With respect to project development and alternatives considered, please refer to the Transmission Planning study and project development processes outlined in Technical Appendix Volume 3 of the 2022 Georgia Power Integrated Resource Plan (“IRP”) (Docket No. 44160). Due to the timing of the transmission screens, transmission planning focused on the use of operating guides, generation redispatch, and transmission line rebuilds/reconductors to alleviate identified constraints.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216945, "filing_description": "DKT 55378 STF-DEA-4 Data Request Responses", "filing_date": "1/4/2024", "staff": "DEA", "doc_id": "STF-DEA-4-4", "is_protective_disclosure": "no", "question": "Did Georgia Power consider constructing additional 345 kV substations and transformers as an alternative means of energy provision from the bulk transmission system, as per the scenarios discussed on November 27, 2023? Provide all relevant studies, evaluations, and conclusions.", "response": "The Company did not consider constructing additional 345kV substations and transformers as an alternative means of energy provision from the bulk transmission system in the scenarios discussed on November 27, 2023.  The standard voltages utilized within the Georgia Integrated Transmission System are 500kV, 230kV, and 115kV.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216945, "filing_description": "DKT 55378 STF-DEA-4 Data Request Responses", "filing_date": "1/4/2024", "staff": "DEA", "doc_id": "STF-DEA-4-5", "is_protective_disclosure": "no", "question": "Please submit any analysis conducted by Georgia Power on higher future load scenarios, specifically in the context of the presentations and projections made on November 27, 2023, including system impact assessments and possible alternatives studied.", "response": "Transmission Planning analyses tied to higher future load scenarios will be filed with the Commission in January 2024 as part of the Transmission supplemental filing.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216945, "filing_description": "DKT 55378 STF-DEA-4 Data Request Responses", "filing_date": "1/4/2024", "staff": "DEA", "doc_id": "STF-DEA-4-6", "is_protective_disclosure": "no", "question": "In relation to the increased load projections presented on November 27, 2023, has Georgia Power identified additional transmission capital investments required for accommodating load additions outside its current geographic area? Provide detailed plans and justifications.", "response": "In the transmission screens filed with the 2023 Integrated Resource Plan (“IRP”) Update on October 27, 2023, the Company only considered the committed loads included in the v2 load flow base cases. Please refer to the Trade Secret load flow files provided to Commission Staff on October 31, 2023.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216945, "filing_description": "DKT 55378 STF-DEA-4 Data Request Responses", "filing_date": "1/4/2024", "staff": "DEA", "doc_id": "STF-DEA-4-7", "is_protective_disclosure": "no", "question": "For the load projections included in the November 27, 2023 presentation, the Georgia PSC requests copies of all relevant contracts signed, particularly those related to data centers and AI load centers.", "response": "Please see TS STF-DEA-4-7 Attachments A through N. The following provides a description of the types of contracts executed by customers and referenced in TS STF-DEA-4-7 Attachments A through N.\nRequest for Electric Service (“RFS”): An agreement a prospective customer completes and submits to Georgia Power when there is a choice of electric service provider, and they have chosen to be served by the Company.\nContract for Electric Service (“CE”): An agreement between Georgia Power and a customer that further outlines the terms and conditions under which electric service will be provided.\nCustomer Baseline Load (“CBL”) Agreement: An agreement for customers on Real Time Pricing (“RTP”) that defines a customer’s baseline usage level. The CBL is mutually agreed upon by the customer and Georgia Power and defines the portion of load that will be billed on an embedded tariff.\nMeter Totalization Terms and Conditions: An agreement that allows for the combination or totalization of readings from multiple electric meters at one premises into one for billing purposes.\nEngineering Letter Agreement to Proceed: Document signed by a captive load customer (10 MW or greater) that acknowledges Georgia Power will begin procuring necessary equipment to electrically serve the project.", "attachment_filenames": "STF-DEA-4-7; PD STF-DEA-4-7 Attachments A-N.docx", "confidentiality_files": ""}, {"filing_api_id": 216945, "filing_description": "DKT 55378 STF-DEA-4 Data Request Responses", "filing_date": "1/4/2024", "staff": "DEA", "doc_id": "STF-DEA-4-8", "is_protective_disclosure": "no", "question": "In reference to the preliminary results presented on November 27, 2023, provide detailed N-0, N-1, N-1-G, and other relevant power flow results, including data showing the MVA flow of overloaded transmission elements pre- and post-contingency.", "response": "Please refer to the Trade Secret load flow files provided to the Commission Staff on October 31, 2023.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216945, "filing_description": "DKT 55378 STF-DEA-4 Data Request Responses", "filing_date": "1/4/2024", "staff": "DEA", "doc_id": "STF-DEA-4-9", "is_protective_disclosure": "no", "question": "In the context of the preliminary results shared on November 27, 2023, please elaborate on whether Georgia Power evaluated the potential of localized battery storage solutions to mitigate peak loads. Were customers initiating new load requests required or incentivized to install peak-shaping battery storage or self-generating clean energy systems? Provide any studies or models that detail the impact of such localized solutions on the proposed load.", "response": "No, the Company did not evaluate the potential of localized battery storage solutions to mitigate peak loads in the transmission screens filed in the 2023 IRP Update on October 27, 2023. Please refer to the Trade Secret load flow files provided to Commission Staff on October 31, 2023. For transmission planning purposes, the Company must consider the peak demand of the future load in its analysis. There was not a specific focus on facilities to install peak-shaping battery storage or self-generating clean energy systems for transmission planning purposes.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216789, "filing_description": "DKT 55378 STF-DEA-2 Data Request Responses", "filing_date": "12/18/2023", "sta
