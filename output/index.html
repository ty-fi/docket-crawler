hat continues to demonstrate the prioritization of a flexible economic fleet transition through a well-balanced and diversified approach that aligns with the needs of customers, the necessity of maintaining a reliable electric system, and the timing and availability of advancements in the technology of generation resources. The proposed capacity plan in Georgia Power’s 2023 IRP Update continues the Company’s commitment to responsibly transitioning its generation fleet to more cost-effective natural gas and zero-carbon resources.\nAdditionally, the Resource Mix Study includes various carbon pressure scenarios, as submitted in the “2 TS Resource Mix Study” folder of the “TS 2023 IRP Update Supplemental Filing 12-4-23 Models & Workpapers,” which were previously provided to the Commission Staff on December 5, 2023. CTs and BESS are identified as economic resources across these scenarios, thus supporting the Company’s proposed capacity plan. See also the Company’s responses to STF-PIA-7-4 and STF-PIA-7-9 for additional descriptions of modeling assumptions related to environmental pressures.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216981, "filing_description": "DKT 55378 STF-PIA-7 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-7-9", "is_protective_disclosure": "no", "question": "Please explain the Company’s modeling of NOx and SOx compliance in Aurora, for all new supply-side resources proposed in the 2023 IRP Update:\nPlease describe the seasonal limitation of NOx and SOx emissions by state, by plant, by fuel in actual operation.\nPlease describe the seasonal limitation of NOx and SOx emissions by state, by plant, by fuel in modeling.\nPlease explain if the Company includes any seasonal pricing on NOx/SOx in order to reduce the operation of CT and CC fleet capacity.\nPlease provide all documentation, memos, industry reports, and workpapers describing these limitations, modeled or operational, and modeling choices to support these constraints.", "response": "Units located in Alabama, Georgia, and Mississippi are covered by multiple emission cap-and-trade compliance programs regulated by the U.S. Environmental Protection Agency (“EPA”):\nAlabama units are subject to the\nAcid Rain Program (“ARP”) SO2\nCross State Air Pollution Rule (“CSAPR”) Group 2 SO2\nCSAPR Annual NOx\nCSAPR Group 2 Seasonal NOx (Ozone)\nGeorgia units are subject to the\nARP SO2\nCSAPR Group 2 SO2\nCSAPR Annual NOx\nCSAPR Group 1 Seasonal NOx (Ozone)\nMississippi units are subject to the\nARP SO2\nCSAPR Group 2 Seasonal NOx (Ozone)\nThe Company reports quarterly emission figures by facility to the EPA, and annual compliance is demonstrated for each of the programs listed above each year when the EPA deducts the exact reported quantity of emission allowances for each reporting facility on March 1st (ARP SO2) and June 1st (CSAPR) for the prior year’s total annual emissions.\n\nThe 2022 Ozone transport rule had Alabama and Mississippi in Group 3. However, that rule has been stayed in Alabama by the 11th Circuit Court of Appeals and in Mississippi by the 5th Circuit Court of Appeals pending the outcome of litigation. Therefore, both states are currently subject to their previous ozone transport obligations, which puts them in Group 2. The ultimate outcome of both cases is unknown. The timeline for resolution is also unknown.\nIn making actual operational commitment and dispatch decisions, the incremental cost of each unit includes the value of the allowances associated with the programs above that must be retired as a result of committing and dispatching the unit.\nNew supply-side resources proposed in the 2023 IRP Update were evaluated using NOx and SOx allowance prices with no seasonal limitations. In modeling commitment and dispatch decisions, the incremental cost of each unit includes the value of the allowances associated with the programs above that would need to be retired as a result of committing and dispatching the unit.\nPlease refer to the Aurora workpapers and model data that were provided to Commission Staff on or before October 30, 2023, for specific allowance pricing assumptions. Please see STF-PIA-7-9 Attachment for the market information used as a basis for allowance pricing assumptions.\nYes, the Company includes seasonal pricing on NOx/SOx to economically commit and dispatch the CT and CC fleet capacity. As described in responses (a) and (b), allowance value is a component of incremental cost across the fleet that provides downward pressure on NOx and SOx emissions, although the impact on aggregate emissions at any particular unit or set of units is uncertain. Please refer to the Aurora workpapers and model data that were provided to Commission Staff on or before October 30, 2023, for specific allowance pricing assumptions.\nWith regard to modeling choices to support these constraints, please refer to the emission prices table in Aurora workpapers and model data provided to Commission Staff on or before October 30, 2023, for specific allowance pricing modeling assumptions. Please see STF-PIA-7-9 Attachment for the market information used as a basis for allowance pricing assumptions.\nAdditional information about these programs is available here:- Acid Rain Trading Program - 40 C.F.R. Part 72 and 73- CSAPR - 40 C.F.R. Part 97,", "attachment_filenames": "STF-PIA-7-9; STF-PIA-7-9 Attachment.pdf", "confidentiality_files": ""}, {"filing_api_id": 216985, "filing_description": "DKT 55378 STF-PIA-8 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-8-1", "is_protective_disclosure": "no", "question": "Has the Company evaluated the use of Battery Energy Storage Systems (BESS) to provide benefits to the transmission system and to provide capacity during peak demand periods? If so, please provide the studies, evaluation results, conclusions, and recommendations of the Company’s evaluation(s).", "response": "Please refer to the Company’s response to STF-DEA-4-15.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216985, "filing_description": "DKT 55378 STF-PIA-8 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-8-2", "is_protective_disclosure": "no", "question": "Provide a breakdown of the number of data centers currently within the Company’s portfolio, as of November 1, 2023, and those projected in the 2023 IRP Update. Please identify:\nThe number, if available, of Hyperscalers.\nThe number of Network and Internet exchange service providers\nThe number involved with data mining and crypto currency.", "response": "The Company currently has 62 data centers in its portfolio. The type of data center (i.e., hyperscaler, network and internet exchange service providers, data mining and cryptocurrency) is not available for these existing customers.\nOf the 51 large load customers included in the 2023 IRP Update forecast, 33 were data centers. These 33 data centers included 21 hyperscalers, 10 network and internet exchange service providers, and 2 data mining and cryptocurrency customers.\nAs of December 15, 2023, there were an additional 29 data center projects identified since the Company’s 2023 IRP Update forecast was finalized in September, including 4 hyperscalers, 24 network and internet exchange service providers, and 1 data mining and cryptocurrency.\nThe Company does not have a list of data centers in the pipeline specific to November 1, 2023.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216985, "filing_description": "DKT 55378 STF-PIA-8 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-8-3", "is_protective_disclosure": "no", "question": "What lines/circuits are projected to be overloaded with the introduction of new Data Centers? How is the Company addressing this issue and has the Company projected any future data center, industrial, or residential increases on load in their Transmission Planning upgrades?", "response": "The requested information will be available in the Company’s Transmission Supplemental Filing that will be made in January 2024 in Docket No. 55378 and in the 2023 Georgia ITS Ten-Year Plan that will be filed in February 2024 in Docket No. 44160. Please refer to the Transmission Planning study and project development processes outlined in Technical Appendix Volume 3 of the 2022 Georgia Power Integrated Resource Plan (Docket No. 44160).", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216985, "filing_description": "DKT 55378 STF-PIA-8 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-8-4", "is_protective_disclosure": "no", "question": "Has the Company coordinated with any Data Center customers to understand how the customer will coordinate rooftop PV, diesel generator backup, hydrogen, and BESS to serve as a resource during periods of peak demand?", "response": "As with any new large load customers interested in selecting Georgia Power to provide their electric service, the Company discusses with potential customers the various programs available for Distributed Energy Resource (“DER”) assets that can be used as a system resource. In addition, the Company often discusses the benefits and eligibility criteria for potential new large load customers to participate in one or more of Georgia Power’s customer renewable programs, such as the Clean and Renewable Energy Subscription (“CARES”) Program, the Flex Renewable Energy Credit (“REC”) Program, the Retail REC Retirement (“R3”) Program, or other renewable program solutions as outlined on Georgia Power’s website. For transmission planning purposes, the Company must consider the peak demand of the future load in its analysis.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216985, "filing_description": "DKT 55378 STF-PIA-8 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-8-5", "is_protective_disclosure": "no", "question": "Do the data centers on Georgia Power’s system, or expected to be on Georgia Power’s system going forward, have demand flexibility to provide support services, including load management, during periods of peak demand? If so, what demand flexibility do the data centers have and what is the duration of these systems? If multiple systems are in place will they run simultaneously or can they operate independent of each other?", "response": "The Company cannot speak for all data centers but believes a sizable portion of its prospective data center customers will install backup generation for resiliency during local outages. However, these backup generation resources are likely to be certified and permitted for emergency use only restricting them from running for system benefit. As such, the Company has existing distributed energy resources (“DER”) and demand response (“DR”) programs, and is proposing additional programs, which will incent these customers to install cleaner resources certified and permitted for non-emergency use and enable greater reliability benefits through participation in these programs.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216985, "filing_description": "DKT 55378 STF-PIA-8 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-8-6", "is_protective_disclosure": "no", "question": "Has the Company investigated grid and transmission stability of the large load data centers and reconnection times due to facility protection equipment, and how to mitigate risk that could impact a wider range of customers?\nProvide studies or analysis if available?\nIf no studies or analysis have been conducted, please provide reasoning for this?\nProvide data on the frequency that outages have occurred and are directly linked to load consumption from data centers.", "response": "The Company analyzes the impact of serving large loads in compliance with NERC Transmission Planning Reliability standards, which is consistent with the planning processes outlined in Technical Appendix Volume 3 of the 2022 Georgia Power Integrated Resource Plan (Docket 44160).\nThe requested studies/analyses are not available because large data centers requiring this level of service have not previously materialized on Georgia Power’s system.\nSee response in part (a).\nThe requested data are not available.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216985, "filing_description": "DKT 55378 STF-PIA-8 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-8-7", "is_protective_disclosure": "no", "question": "Has the Company compared the forecasted load of existing data center customers to the actual load of these customers to better understand the accuracy of load ramp forecasts for data centers? If so, please provide the study, results, and conclusions from the analysis.", "response": "No, the Company has not compared the forecasted load of existing data center customers to the actual load of these customers to better understand the accuracy of load ramp forecasts for data centers. Given how recently these large data centers have started expressing interest in the state, there is not any history to compare with the customer provided load ramp forecast.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216985, "filing_description": "DKT 55378 STF-PIA-8 Data Request Responses", "filing_date": "1/8/2024", "staff": "PIA", "doc_id": "STF-PIA-8-8", "is_protective_disclosure": "no", "question": "Does the Company have access to, or any knowledge of, the proposed data center power-use-effectiveness (PUE) rating and what margin of error has gone into Transmission Planning in these areas to assure adequate loading will be available?  Has the Company assessed proposed PUE ratings when negotiating with data center clients outside of Georgia Power’s immediate territory?", "response": "Yes, the Company has access to power-use-effectiveness (“PUE”) ratings of potential large load data center customers and assesses the PUE ratings for potential customers inside and outside of Georgia Power’s service territory. The PUE ratings vary by potential data center customer but are typically between 1.4 and 1.6. The PUE rating ensures enough transmission and distribution infrastructure is provided to cover the potential customer’s projected utility load and not just its projected critical server load. The Company analyzes the impact of serving large loads in compliance with NERC Transmission Planning Reliability standards, which is consistent with the planning processes outlined in Technical Appendix Volume 3 of Georgia Power’s 2022 Integrated Resource Plan (Docket No. 44160). For transmission planning purposes, the Company must consider the peak demand of the future load. Analyses are based on the proposed load ramp rates provided by the potential customer, which incorporate the PUE ratings, and then re-evaluated annually through processes noted in Technical Appendix Volume 3.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 220126, "filing_description": "DKT 55378 STF-PIA-18 Data Request Responses", "filing_date": "10/10/2024", "staff": "PIA", "doc_id": "STF-PIA-18-1", "is_protective_disclosure": "yes", "question": "Please refer to the Company’s Application for Certification, Figures 4, 7, 10, and 13; please provide a narrative description of the values found in the Estimated Annual Capital Additions column and how those values were calculated.", "response": "The estimated annual capital additions are predominantly for augmentation cycles. The augmentation is estimated by tracking the REDACTED REDACTED REDACTED and calculating the additional Megawatt-hours needed when the system degrades to REDACTED of its nameplate capacity. The amount of incremental energy storage added to the site (i.e. augmentation) will be enough to reenergize the site to REDACTED of the nameplate energy capacity. The site will eventually degrade back to REDACTED some years later, at which point an additional augmentation will be needed. The cost of augmentation was calculated by multiplying the amount of Megawatt-hours needed to bring the facility from REDACTED of its nameplate energy capacity by the forecasted price curves.\nSome relatively small capital costs are reflected in the first years of service for certain resources. These costs are associated with remaining construction-related activities that are expected to be incurred after each BESS resource is placed in service. Therefore, these costs are captured in the estimated annual capital additions column in the figures and associated modeling.\nThe calculations for the estimated annual capital additions can be found in the SAM files previously provided to Commission Staff on August 16, 2024.", "attachment_filenames": "STF-PIA-18-1; STF-PIA-18-10; STF-PIA-18-14; STF-PIA-18-15; STF-PIA-18-15 Attachment A.pdf; STF-PIA-18-15 Attachment B.pdf; STF-PIA-18-16; PD STF-PIA-18-16 Attachments A-B.docx", "confidentiality_files": ""}, {"filing_api_id": 220126, "filing_description": "DKT 55378 STF-PIA-18 Data Request Responses", "filing_date": "10/10/2024", "staff": "PIA", "doc_id": "STF-PIA-18-10", "is_protective_disclosure": "yes", "question": "Please refer to the Response to STF-PIA-17-5, noting that the Hammond and McGrau Ford projects “energy-capacity overbuild, which requires a different augmentation schedule from that of Robins and Moody BESS.”\nHow much are each of the projects overbuilt?\nPlease explain how the Company determines whether augmentation should be achieved by overbuild or through earlier augmentation investments, as with the Robins and Moody projects.  If the Company conducted any analysis to support its decision, please provide the results.", "response": "All sites require a slight overbuild to account for real and reactive power losses to ensure the BESS can meet Point of Interconnection (“POI”) requirements:\nRobins – REDACTED,\nMoody – REDACTED,\nMcGrau Phase II – REDACTED, and\nHammond – REDACTED.\nThe Company's approach to determining whether augmentation should be achieved through overbuild or earlier augmentation is guided primarily by strategic considerations rather than a specific quantitative analysis. One key consideration was the ability to alternate outage scheduling and portfolio diversification. Varied overbuild starting points can aid in the need for alternate outage schedules across the BESS portfolio.\nCompany ownership provides flexibility to adapt to changing storage needs, manage degradation, and optimize outage schedules. The Company can balance available tax incentives and declining BESS costs with system reliability and needs to adjust plans if the most appropriate periods for augmentation change. While the Company does not have a detailed financial analysis for this specific assumption, this strategy provides flexibility and diversification of the portfolio to ensure efficient and cost-effective storage solutions.", "attachment_filenames": "STF-PIA-18-10", "confidentiality_files": ""}, {"filing_api_id": 220126, "filing_description": "DKT 55378 STF-PIA-18 Data Request Responses", "filing_date": "10/10/2024", "staff": "PIA", "doc_id": "STF-PIA-18-11", "is_protective_disclosure": "no", "question": "Please provide the PSSE or other power flow modeling software solution settings that were used for the transmission study.\nPlease provide more detail around the design of the power flow solution settings that were used which produced the overloads seen with respect to McGrau Ford Phase II.\nPlease provide any IDV files, Python scripts, or solution setting screenshots that depict the exact solution settings utilized in the transmission analysis.\nPlease provide the version number of PSSE, TARA or other powerflow software that was utilized in this transmission analysis.\nWere transformers, switched shunts, phase shifters, reactive devices allowed to automatically adjust during the solution for both pre- and post- contingency?", "response": "The power flow settings that were used in PSSE are as follows: psspy.fnsl([0,2,0,1,1,0,0,0])\nThese files were provided to Commission Staff as workpapers with the Certification Application filing on August 16, 2024.\nThe software version number used was PSSE 35.6.2.\nSee response to subpart a. above.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 220126, "filing_description": "DKT 55378 STF-PIA-18 Data Request Responses", "filing_date": "10/10/2024", "staff": "PIA", "doc_id": "STF-PIA-18-12", "is_protective_disclosure": "no", "question": "Please provide the Normal and Emergency ratings utilized for the transmission study.\nSpecifically, please share the ratings used under N-0, and N-1 analysis.\nFor the overloaded lines observed in the McGrau Ford Phase II analysis, what were their MVA ratings for both Normal and Emergency? Which one is applicable to the N-1 analysis that is associated with the upgrades.", "response": "a. \tSouthern Company utilizes Rate 2 in the PSSE model for contingency analysis.\nb.\tRate 2 was utilized for the analysis.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 220126, "filing_description": "DKT 55378 STF-PIA-18 Data Request Responses", "filing_date": "10/10/2024", "staff": "PIA", "doc_id": "STF-PIA-18-13", "is_protective_disclosure": "no", "question": "Please share the raw post-contingency power flow results associated with the McGrau Ford Phase II BESS. Please share the raw, post-contingency loading as MVA values rather than percentages.", "response": "Please see the requested raw post-contingency power flow results below. Note: The MVA values can be calculated by multiplying the Rating (MVA) by the thermal loading percentages provided in the response to STF-DEA-10-3.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 220126, "filing_description": "DKT 55378 STF-PIA-18 Data Request Responses", "filing_date": "10/10/2024", "staff": "PIA", "doc_id": "STF-PIA-18-14", "is_protective_disclosure": "yes", "question": "Please explain why the McGrau Ford Phase II injection is studied at -133 MW in the charging scenarios (for all Off-Peak and Daylight Shoulder scenarios), and not as -265 MW. This is seen in REDACTED REDACTED REDACTED REDACTED REDACTED provided by Georgia Power.", "response": "For screening as a capacity resource, BESS must be able to fully charge in 4-hrs in Summer (or nameplate if greater than 4-hrs) and within 8-hrs in Winter. To optimize BESS performance, it is crucial to preserve a certain amount of grid charging capabilities according to the duration capabilities of the BESS, as well as understanding the timeframe between seasonal system load peaks. This concept ensures that the battery can recharge efficiently and be ready to discharge during periods of high demand.\nThe McGrau Ford Phase I project was designated at 265 MW charging; however, as a 2-hour BESS, only 132.5 MW are required for that system. Therefore, for the addition of the Phase II BESS as a 4-hour BESS, the current preservation methodology necessitates only an incremental 133 MW to cover the remaining portion required for both Phase I and Phase II of the McGrau Ford BESS projects. This strategic allocation helps ensure that the BESS can effectively meet its operational targets and support grid reliability.\nThe following summarizes the designations needed for both McGrau Ford Phases I and II:\nMcGrau Ford Phase I is a 265 MW/hr 2-hr battery (-132.5 MW required).\nMcGrau Ford Phase II is a 265 MW/hr 4-hr battery (-265 MW required).\nTotal Charging Capabilities Required: -397.5 MW", "attachment_filenames": "STF-PIA-18-14", "confidentiality_files": ""}, {"filing_api_id": 220126, "filing_description": "DKT 55378 STF-PIA-18 Data Request Responses", "filing_date": "10/10/2024", "staff": "PIA", "doc_id": "STF-PIA-18-15", "is_protective_disclosure": "no", "question": "Please provide the Designation Studies for Hammond and McGrau Ford Phase II.", "response": "Please see STF-PIA-18-15 Attachments A and B.", "attachment_filenames": "STF-PIA-18-15; STF-PIA-18-15 Attachment A.pdf; STF-PIA-18-15 Attachment B.pdf", "confidentiality_files": ""}, {"filing_api_id": 220126, "filing_description": "DKT 55378 STF-PIA-18 Data Request Responses", "filing_date": "10/10/2024", "staff": "PIA", "doc_id": "STF-PIA-18-16", "is_protective_disclosure": "no", "question": "What are the transformer sizes (MVA ratings) for each of the project substations?\nPlease provide detail on why the transformer sizes (MVA ratings) were chosen for each of the project substations, including any studies in support of transformer sizing.\nAre the transformers sized to accommodate potential future expansion or additional projects?", "response": "The newly procured Main Power Transformers (“MPT”) in the project level substations for Hammond and McGrau Ford Phase II are 166 MVA.\nThe McGrau Ford Phase II and Hammond MPTs were selected to align with the design of the McGrau Ford Phase I transformers, ensuring consistency, availability, and potential cost savings. The 166 MVA MPT specification and procurement discussions for McGrau Ford Phase I were well underway by the time the McGrau Ford Phase II and Hammond projects were selected as the final two sites to complete the 500 MW Company-owned BESS approved in the 2023 IRP Update. Therefore, this design was the only known available option for meeting the 230 kV requirements and project timelines. This standardization enables the sharing of spare parts among the BESS sites.\nFor studies supporting sizing, please see TS STF-PIA-18-16 Attachments A and B.\nThe MPT sizing study for McGrau Ford aligns with the current site configuration. A MPT sizing study for Hammond BESS determined that two MPTs could support a larger capacity than currently planned for the required 2026 COD. Therefore, the results of the study show that one MPT, as will be utilized for the Hammond BESS, is able to support the current capacity.\nNo. The MPTs were sized to allow for sharing of spare parts and to meet the 2026 COD dates. At McGrau Ford Phase II, additional expansion would require additional MPTs. The MPT at Hammond BESS does have additional headroom available to be utilized for potential future expansion.", "attachment_filenames": "STF-PIA-18-16; PD STF-PIA-18-16 Attachments A-B.docx", "confidentiality_files": ""}, {"filing_api_id": 220126, "filing_description": "DKT 55378 STF-PIA-18 Data Request Responses", "filing_date": "10/10/2024", "staff": "PIA", "doc_id": "STF-PIA-18-17", "is_protective_disclosure": "no", "question": "In the SIS reports for IC-1198 (Robins) and IC-1199 (Moody), Georgia Transmission Corporation (GTC) is identified as an Affected System, with potential Interconnection Upgrades identified.\nPlease share whether GTC has been contacted regarding the potential Network Upgrades identified in the SIS reports.\nPlease provide any study or analysis regarding the magnitude of costs associated with the Affected Systems.\nHow does the Company expect to meet the COD for Robins and Moody when according to the reports, the In-Service Date is not attainable?", "response": "Yes, the Company has contacted GTC.\nGeorgia Power’s estimated costs for upgrades associated with Affected System needs are included within the SIS reports for IC-1198 and IC-1199, provided in the response to STF-PIA-17-18.\nIn SIS reports, the attainability of project dates is based on expected standard timelines from initial Notice to Proceed. However, given the expedited timeframe of these BESS projects, the Company has begun engineering and procurement activities for the identified network upgrades, along with communicating with Affected Systems and GPC Transmission, and is confident the in-service date will be attainable for the Robins BESS and Moody BESS projects.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 220126, "filing_description": "DKT 55378 STF-PIA-18 Data Request Responses", "filing_date": "10/10/2024", "staff": "PIA", "doc_id": "STF-PIA-18-18", "is_protective_disclosure": "no", "question": "Regarding the Company’s SAM files, please provide an explanation for the assumption that BESS augmentations are eligible for the Base + Labor + Domestic Content ITC for years after the IRA is set to expire.", "response": "The Investment Tax Credit (“ITC”) benefits from the Inflation Reduction Act (“IRA”) are set to phase out at the later of either 2032 or when the nationwide electric sector reaches a 75% reduction in carbon emissions from 2022 levels. Given the current pace of carbon emission reductions, the Company has assumed that IRA incentives will extend through the augmentation periods for each BESS resource in the economic analysis.\nAdditionally, the Company has assumed that achieving domestic content requirements for augmentation is feasible. This assumption is primarily based on the expectation that U.S. solar and BESS supply chains will mature over time, thus providing opportunities to meet domestic content criteria and benefit from the associated ITC.\nThe Company will continue to monitor any changes in tax policy, battery performance, and augmentation costs, and adjust augmentation strategies accordingly to the benefit of customers.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 220126, "filing_description": "DKT 55378 STF-PIA-18 Data Request Responses", "filing_date": "10/10/2024", "staff": "PIA", "doc_id": "STF-PIA-18-2", "is_protective_disclosure": "no", "question": "Regarding the response to STF-PIA-17-11, please provide the calculations for Generation O&M and Power Delivery O&M for each project.", "response": "Please see TS STF-PIA-18-2 Attachment for the details of the Generation & Power Delivery O&M costs.  The Generation O&M estimate includes internal labor, levelized balance of system maintenance (i.e., transformer maintenance and other preventative maintenance activities) and fixed cost (i.e., utilities, office supplies, pest control, etc.). The Power Delivery O&M estimate is intended to cover preventative maintenance and repair related activities to maintain high voltage equipment.", "attachment_filenames": "STF-PIA-18-2; PD STF-PIA-18-2 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 220126, "filing_description": "DKT 55378 STF-PIA-18 Data Request Responses", "filing_date": "10/10/2024", "staff": "PIA", "doc_id": "STF-PIA-18-3", "is_protective_disclosure": "no", "question": "Please provide more detail regarding the CGJDA Fees for the Robins BESS project and explain how these fees were calculated.", "response": "The Central Georgia Joint Development Authority (“CGJDA”) fee is a flat amount that the Company will pay as an annual administrative fee to the Authority to administer the bond transaction. Note: there is no associated calculation for the annual administrative fee. Regarding the attachment included with the Company’s response to STF-PIA-17-11, the 2024 CGJDA fees are the sum of (1) a one-time bond issuance fee equal to one-eighth of 1% of the bond issuance amount, (2) the anticipated legal fees associated with executing the bond transaction, and (3) an annual administrative fee. The formula in cell D5 of the same attachment containing the CGJDA fees for 2024 should not include the last value, related to the annual administrative fee, as that is the value for 2027 annual administrative fee that was added to D5 in error.  The 2026 & 2046 CGJDA fees are prorated annual administrative fees based the expected COD of the project and the assumed end date of the project, respectively.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 220126, "filing_description": "DKT 55378 STF-PIA-18 Data Request Responses", "filing_date": "10/10/2024", "staff": "PIA", "doc_id": "STF-PIA-18-4", "is_protective_disclosure": "no", "question": "Please provide the basis for the assumed recycling costs of the batteries that will need to be disposed at end of life.", "response": "The estimated decommissioning & dismantlement costs provided in the Certification Application filing on August 16, 2024, represent the forecasted demolition costs associated with removing the BESS; however, no cost or credit is assumed for recycling of the battery modules due to uncertainty related to any potential future credits.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 220126, "filing_description": "DKT 55378 STF-PIA-18 Data Request Responses", "filing_date": "10/10/2024", "staff": "PIA", "doc_id": "STF-PIA-18-5", "is_protective_disclosure": "no", "question": "Please refer to the Company's Response to STF-PIA-17-6; What is meant by “assigned”? What is the basis for the assignments?", "response": "State Investment Tax Credits (“ITC”) were assigned to sites based on the project's county, using the Georgia Department of Community Affairs' (“DCA”) Job Tax Credit (“JTC”) ranking. This ranking is updated annually and can be accessed via the hyperlinks below. Since the rankings change yearly and credits are earned once projects reach commercial operations, the Company estimated credits by reviewing both 2023 and 2024 rankings, selecting the lower credit percentage if rankings differed. BESS projects earn credits as follows based on their tier. Tier 1 is 8%, Tier 2 is 5%, Tier 3 is 3%, and Tier 4 is 3%.\n2024_annual_ranking_memo_signed_updated_1-30-24.pdf (ga.gov)\n2023_rankings_memo_package_signed_updated_3-14-2023_1.pdf (ga.gov)", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 220126, "filing_description": "DKT 55378 STF-PIA-18 Data Request Responses", "filing_date": "10/10/2024", "staff": "PIA", "doc_id": "STF-PIA-18-6", "is_protective_disclosure": "yes", "question": "Please refer to the Company’s response to STF-PIA-15-12, for each of the five BESS projects.  Please be sure that the contingency responses below tie to the contingency the Company has disclosed for all these Projects.\nPlease provide a Project Execution Plan;\nPlease provide a detailed Division of Responsibility (DOR) between the Company and all counter parties, including sub-contractors, to those counter parties;\nPlease provide the Risk Register;\nPlease provide the allocated contingency;\nPlease provide the means and methods used to determine each contingency amount such as, but not limited to, any analyses (in native format such as Excel), both written and calculated, the source for the inputs of the analyses, the assigned risk for each input and how that assignment was determined, any source documents used to perform the analyses, and all other documents used to determine the contingency value.\nPlease provide a list of all major equipment procurements detailing the equipment, its cost, its expected delivery date, its expected ready for construction installation date.", "response": "The Company is still developing the Project Execution Plan for each site and is expected to be provided to Staff as part of the construction monitoring process.\nThe DOR Matrix delineating responsibility between the Engineering, Construction and Procurement (“EPC”) contractor, Battery supplier, and the Company can be found in the EPC Agreements provided as “TS Attachment A – McGrau Phase I EPC Agreement,” filed on August 9, 2024, and in the TS Technical Appendix as “01 TS Robins EPC Agreement,” “03 TS Moody EPC Agreement,” “05 TS Hammond EPC Agreement,” “07 TS McGrau Ford Phase II EPC Agreement,” filed on August 16, 2024.  Specifically, please refer to the following Exhibits in the EPC agreements for the requested information:\nMcGrau Ford Phase I BESS EPC Agreement, Exhibit W-EE-1\nRobins BESS EPC Agreement, Exhibit W-EE-1\nMoody BESS EPC Agreement, Exhibit Y-1\nHammond BESS EPC Agreement, Exhibit Y-1\nMcGrau Ford Phase II BESS EPC Agreement, Exhibit W-EE-1\nThe DOR matrix delineating responsibility between Georgia Power Company Power Delivery and the EPC Contactor can be found in:\nMcGrau Ford Phase I BESS EPC Agreement, Exhibit W-EE-2\nRobins BESS EPC Agreement, Exhibit W-EE-2\nMoody BESS EPC Agreement, Exhibit Y-2\nHammond BESS EPC Agreement, Exhibit Y-2\nMcGrau Ford Phase II BESS EPC Agreement, Exhibit W-EE-2\nPlease see TS STF-PIA-18-6 Attachments A & B. For each of the requested projects, the Company is providing the risk register spreadsheet tools that were used to inform the contingency percentages needed for the various parts of the projects.\nPlease see TS STF-PIA-18-6 Attachments C through G. These attachments contain copies of the Master Budget workpapers, previously provided to Staff with the BESS filings on August 9 and 16, 2024, with additional details for contingency on the “Project Summary (L2)” tabs.\nPlease see responses to subparts c. and d. above.\nAs explained in the Company’s prior response to STF PIA-15-12, the Company employed a multi-pronged analysis to develop contingency cost estimates for the BESS project portfolio. This analysis included a probabilistic assessment of potential project risks along with institutional operational expertise, knowledge, and insights. To that end, the Company relied on both of these quantitative and qualitative measures to estimate contingency for the BESS project portfolio.\nThe current BESS projects are classified as Class 2 estimates, as their detailed design is still being developed. The Association for the Advancement of Cost Engineering (AACE) defines Class 2 estimates with accuracy ranges of -5% to +20%, respectively, indicating relative precision but expected cost variations. As noted, the BESS projects were filed with a total contingency value quantified at approximately REDACTED of total project cost, which is consistent with AACE Industry ranges and serves as a buffer for project risks.\nWhile the risk values in the EPC, BESA, and Owner categories as identified in the risk matrix are not identical to the total contingency applied, those differences can be explained by the Company’s application of informed judgment (qualitative measures described above) to evaluate risks in the matrix to form its final contingency decision.\nApproximately, REDACTED contingency was applied to the BESA, approximately REDACTED to the EPC, and specific percentages were applied to subparts of the owner’s cost for each project considering the various factors evaluated in the risk register tool.\nImportantly, contingency is necessary and appropriate to account for inherent project-specific risks and uncertainties that develop over the course of a project’s development and construction lifecycle. As a project progresses through the construction phase, generally speaking, the number of risks to be considered are reduced.  Any project contingency amount not used for the project development and lowers the overall project cost to customers.\nPlease see the table below for details on major equipment procurements.", "attachment_filenames": "STF-PIA-18-6; PD STF-PIA-18-6 Attachments A-G.docx", "confidentiality_files": ""}, {"filing_api_id": 220126, "filing_description": "DKT 55378 STF-PIA-18 Data Request Responses", "filing_date": "10/10/2024", "staff": "PIA", "doc_id": "STF-PIA-18-7", "is_protective_disclosure": "no", "question": "Please refer to the Response to STF-PIA-17-1, regarding the screening process for potential storage sites. Provide any additional documentation of the results of the screening studies supporting the conclusions in Table 1.", "response": "The associated PSSE MUST files were provided to Commission Staff on October 1, 2024, in response to a request from Staff for this information.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 220126, "filing_description": "DKT 55378 STF-PIA-18 Data Request Responses", "filing_date": "10/10/2024", "staff": "PIA", "doc_id": "STF-PIA-18-8", "is_protective_disclosure": "yes", "question": "Please refer to the Response to STF-PIA-17-1, Table 1, regarding the screening results.\nPlease explain the difference between the “Initial MW Size” from the Preliminary Screen Request and the “MW Limit” value from the Preliminary Transmission Screen Results.  In instances where the values are different, how were the revised values determined?\nThe screening results for multiple sites note REDACTED REDACTED REDACTED REDACTED.  Please explain this conclusion further.  E.g. REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED? Provide supporting information for each instance.\nThe screening results for multiple sites note that REDACTED REDACTED out into the future.  Please explain this conclusion further.  E.g. REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED?  Provide supporting information for each instance.", "response": "The “Initial MW Size” was the amount of BESS capacity requested at each site for transmission screening. The PSSE MUST software was utilized for screening, and the “MW Limit” was the identified limit in the transfer analysis.\nThe PSSE MUST screen was conducted to assess the initial capabilities of a given BESS project location for a 2026 COD. The MUST analysis was utilized to evaluate both charging and discharging operation. Upon reviewing the results from this initial transmission screening, charging limitations were identified for each site under consideration. Consequently, when a note said that “charging pushed COD” out into the future, it had been determined that the site was not able to achieve a 11/2026 COD at the MW amount requested because transmission projects with long lead times would be required to accommodate, pushing the COD beyond 2026. Please see the Company’s response to STF-PIA-18-7.\nFor notes indicating that “discharging pushes COD” out into the future, screening analysis had indicated that discharging limitations at the MW output level requested could not be addressed for a 11/2026 COD. These limitations could not be addressed as transmission projects with long lead times would be required to accommodate, pushing the COD beyond 2026. Please see the Company’s response STF-PIA-18-7.", "attachment_filenames": "STF-PIA-18-8", "confidentiality_files": ""}, {"filing_api_id": 220126, "filing_description": "DKT 55378 STF-PIA-18 Data Request Responses", "filing_date": "10/10/2024", "staff": "PIA", "doc_id": "STF-PIA-18-9", "is_protective_disclosure": "yes", "question": "Please refer to the Response to STF-PIA-17-1, Table 1, regarding the screening results for the Hammond site.\nThe value analyzed in the Preliminary Transmission Screen Results for the Hammond site REDACTED REDACTED REDACTED REDACTED REDACTED.  Please describe the steps or analysis between the conclusion detailed in Table 1 and the determination that the smaller project size would be feasible.\nDoes the conclusion of the screening study indicate that REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED?", "response": "Hammond was screened in the fall of 2023 for potential siting of BESS in 2026. A screening analysis utilizing the PSSE MUST software was performed and at 250 MW, the 2026 date was determined not to be feasible. As focus shifted to McGrau Ford Phase II and it was determined that an additional 265 MW 4-hour battery was feasible in the fall 2026 timeframe, Hammond was restudied at the 57.5 MW amount (the remaining amount needed to fulfill the 500 MW BESS target) and that amount could be accommodated in the timeframe requested with no identified transmission projects (beyond those required for interconnection).\nThe screening analysis that was performed for Hammond at 250 MW indicated that the requested MW amount could not be accommodated in the 2026 timeframe due to required transmission projects. The ability to add additional storage capacity is dependent on the current 10-year planning projects in the pipeline and the timeframe requested. The study performed in spring 2024 was only intended to determine whether 57.5 MW could be accommodated in the timeframe requested of a 2026 COD. Additional BESS amounts were not studied as part of that request and the ability to add will be dependent on the 10-year plan at the time and the timeframe requested.", "attachment_filenames": "STF-PIA-18-9", "confidentiality_files": ""}, {"filing_api_id": 220163, "filing_description": "DKT 55378 STF-PIA-16-4 Data Request Response PD", "filing_date": "10/11/2024", "staff": "PIA", "doc_id": "STF-PIA-16-4", "is_protective_disclosure": "no", "question": "Please list any projects where the Company considered, approached, or pursued a facility outside of its service territory, but later determined that it was ineligible under the Territorial Act? Please specify why the project was ineligible under the Territorial Act.", "response": "Below are examples of projects the Company initially pursued but later determined to be ineligible for choice of electric service provider under the large load exception of the Territorial Act. The Company does not track projects outside of its service territory that were initially considered but later determined to be ineligible for choice of electric service provider.\nREDACTED: Georgia Power worked with two data centers (first REDACTED REDACTED and then REDACTED) to evaluate service to a premises in Lithia Springs. In evaluating the project, Georgia Power learned that the local electric membership corporation (“EMC”), in whose territory the premise was located, had already installed a padmount transformer with a permanent meter at the premises. As such, Georgia Power considered the premises to be already served, and communicated to the prospective customer that Georgia Power was not able to provide electric service.\nREDACTED: A potential customer was developing a facility in Georgia Power’s service territory, but an EMC had corridor rights associated with the premises. Initially, the developer thought the premises would have an initial connected load over 900 kW. However, once the Company received the panel schedules for the facility, it determined the initial connected load would not exceed 900 kW and the EMC should serve the premises due to the aforementioned corridor rights.\nREDACTED REDACTED: This project related to the development of a logistics center within an EMC’s service territory. The developer of the project contacted Georgia Power to provide electric service to the premises and communicated that the load would be over 900 kW. However, upon examination, the panel schedules did not verify connected load of 900 kW or greater. Therefore, Georgia Power communicated to the developer that the EMC had the right to serve the premises.\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED: Representatives from REDACTED contacted Georgia Power to discuss service to an elevated water tank being installed to provided water to industrial customers. After reviewing the territory maps and panel schedules, Georgia Power determined the premises, which was in EMC service territory, did not meet the 900kW threshold of the large load exception to the Territorial Act. Therefore, Georgia Power determined the premises was not eligible for a choice of electric service provider and communicated this to REDACTED.", "attachment_filenames": "DKT 55378 STF-PIA-16-4 PD", "confidentiality_files": ""}, {"filing_api_id": 220094, "filing_description": "STF-PIA-16 Data Request Responses", "filing_date": "10/4/2024", "staff": "PIA", "doc_id": "STF-PIA-16-1", "is_protective_disclosure": "no", "question": "Please provide documentation of the process by which the Company determines large load projects greater than 900 kW as defined in the Georgia Territorial Act both inside and outside of the Georgia Power Service Territory. Please provide site-specific analysis that the Company has completed to determine the Territorial Act eligibility of sites.", "response": "The Company utilizes information provided by the customer to determine whether a project will have a connected load greater than 900 kilowatts (“kW”) as defined in the Georgia Electric Service Territorial Act. For projects with a connected load clearly over 900 kW, a Customer Intake Form is used. Please see TS-STF-PIA-16-1 Attachments A and B for Customer Intake Form examples.\nFor customers with an estimated connected load closer to 900 kW, the Company requests a “panel schedule,” which lists all expected connected loads at the premises. Please see TS-STF-PIA-16-1 Attachments C, D, and E for panel schedule examples.\nGeorgia Power uses the same procedure to analyze the connected load of a premise, whether inside or outside Georgia Power’s Service Territory.", "attachment_filenames": "STF-PIA-16-1; PD STF-PIA-16-1 Attachments A-E.docx", "confidentiality_files": ""}, {"filing_api_id": 220094, "filing_description": "STF-PIA-16 Data Request Responses", "filing_date": "10/4/2024", "staff": "PIA", "doc_id": "STF-PIA-16-2", "is_protective_disclosure": "no", "question": "Please identify how the Company determines a project is eligible as a large load inside or outside of its service territory for projects that may have multiple customers (tenants or users)?", "response": "When a project expects to include multiple end use customers, where each customer will have a separate electric service account, the connected load for each customer is evaluated separately, such that each customer’s premises must have a connected load of 900 kW. A common example is a shopping center that includes a large grocery store with a connected load over 900 kW, along with numerous smaller stores, each with a separate customer account and a connected load under 900 kW. The grocery store would be eligible for a choice of suppliers, but the smaller stores could only be served by the electric service provider in whose service territory the shopping center and each store resides.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 220094, "filing_description": "STF-PIA-16 Data Request Responses", "filing_date": "10/4/2024", "staff": "PIA", "doc_id": "STF-PIA-16-3", "is_protective_disclosure": "no", "question": "How does the Company verify throughout the development of a site that a project is eligible based on the size requirements of the Territorial Act?", "response": "Throughout the development of a project, the Company relies on the information provided by the customer (referenced in the response to STF-PIA-16-1), including any changes or updates to the estimated connected load. Once a project is complete and the customer is operating at its initial full operation, another electric service provider wishing to challenge the selected provider’s right to serve the customer pursuant to the large load exception may request a load count with the selected provider to verify the project meets the 900 kW connected load requirement of the Territorial Act.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 220094, "filing_description": "STF-PIA-16 Data Request Responses", "filing_date": "10/4/2024", "staff": "PIA", "doc_id": "STF-PIA-16-4", "is_protective_disclosure": "no", "question": "Please list any projects where the Company considered, approached, or pursued a facility outside of its service territory, but later determined that it was ineligible under the Territorial Act?  Please specify why the project was ineligible under the Territorial Act.", "response": "DELAYED:  Due to the impact of Hurricane Helene on Georgia Power’s territory and Company personnel being on storm duty to repair damage, Staff and the Company have agreed that the response to this question will be filed by Friday, October 11, 2024.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 220094, "filing_description": "STF-PIA-16 Data Request Responses", "filing_date": "10/4/2024", "staff": "PIA", "doc_id": "STF-PIA-16-5", "is_protective_disclosure": "no", "question": "Considering that some facilities may open below their full electric capacity, how would the Company assess the eligibility a project as a large load with a staggered or delayed timeline?", "response": "Per the Territorial Act, a premises must have a connected load of 900 kW or greater at the time of initial full operation to qualify as a large load that is eligible for a choice of electric service provider. For eligible premises with a staggered, phased, or delayed timeframe, consistent with Commission precedent, the Company considers initial full operation to be when the final phase is complete.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 220386, "filing_description": "STF-PIA-19 Data Request Responses", "filing_date": "11/12/2024", "staff": "PIA", "doc_id": "STF-PIA-19-1", "is_protective_disclosure": "no", "question": "Please describe and explain in further detail the technical review process (known as preliminary vetting stage)?", "response": "The technical review process, also known as the preliminary vetting stage, involves a capacity review, transmission study, engineering design, timeline review, and economic analysis. Once these steps are complete, Company management evaluates the projects prior to extending a contract for electric service.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 220386, "filing_description": "STF-PIA-19 Data Request Responses", "filing_date": "11/12/2024", "staff": "PIA", "doc_id": "STF-PIA-19-2", "is_protective_disclosure": "no", "question": "Please provide a version of the Microsoft Excel spreadsheet attachment which the Company files with the large load report, with an additional tab for “projects added” (which includes the MW capacity)? Please also include this in future Large Load Economic Development reports going forward.", "response": "Please see TS STF-PIA-19-2 Attachment. Please note that column Z of the attachment provided with the large load report identified whether the projects were new to the list.", "attachment_filenames": "STF-PIA-19-2; PD STF-PIA-19-2 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 220386, "filing_description": "STF-PIA-19 Data Request Responses", "filing_date": "11/12/2024", "staff": "PIA", "doc_id": "STF-PIA-19-3", "is_protective_disclosure": "no", "question": "What is the minimum load, in megawatts, to be considered a large load customer?", "response": "As further described in STF-DEA-5-1, for purposes of the Company’s large load economic development tracking and forecasting, the Company considers “large load customers” to be commercial customers at 115 MW and industrial customers at 45 MW, respectively. For purposes of the large load exception to the Georgia Territorial Electric Service Act, please see the requirements of O.C.G.A. § 46-3-8.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 220386, "filing_description": "STF-PIA-19 Data Request Responses", "filing_date": "11/12/2024", "staff": "PIA", "doc_id": "STF-PIA-19-4", "is_protective_disclosure": "no", "question": "Is there a penalty for canceling a project when there is a contract for service in place?  If yes, how is the penalty established? For example, is there a volumetric (-dollars per MW) fee anticipated or a standard fee?", "response": "There is currently no penalty for a customer cancelling or terminating a Contract for Electric Service with Georgia Power. However, a customer who breaches a contract by terminating before the end of an agreed-upon term may be liable for, and Georgia Power may pursue, damages arising from or related to the customer’s breach. This may include, without limitation, unpaid Real Time Pricing Customer Baseline Load charges, Time of Use – Supplier Choice Monthly Access Charges, Power and Light contract minimum Billing Demand charges, and Excess Facilities charges for any remaining portion of the term, in each case as specified in the contract.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 220386, "filing_description": "STF-PIA-19 Data Request Responses", "filing_date": "11/12/2024", "staff": "PIA", "doc_id": "STF-PIA-19-5", "is_protective_disclosure": "no", "question": "Please refer to “TS Large Load Economic Development Report Q2 2024 – Attachment.xlsx”. Worksheet = “Main”. For each project at the Project Stage “Contract for Electric Service” provide the actual or projected base revenues, RTP base revenues, fuel revenues, RTP fuel revenues and sales (MWhs) for each year 2024 – 2037. Please provide information in an unprotected Excel worksheet.", "response": "Please see TS STF-PIA-19-5 Attachment, which includes the Company’s approximate projected base revenues, real time pricing (“RTP”) base revenues, and megawatt-hour (“MWh”) sales for each year 2024 – 2032.  The company has a 10-year plan for revenues. Pricing projections beyond 2032 are unavailable, as the revenue and price projections cover only the next ten-year period\nThe projections are base customer base load (“CBL”) revenues with ECCR and base RTP revenues. There are no future estimates of fuel (base or RTP) revenues at this time. The actual billing data for 2024 includes the base RTP and RTP fuel portions of the revenue.\nThe latest estimate of the customer’s ramp and level of contracted capacity have been used to make these estimates. They may vary from the information provided in the second quarter report.", "attachment_filenames": "STF-PIA-19-5; PD STF-PIA-19-5 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216538, "filing_description": "DKT 55378 - STF-PIA-1 Data Request Responses", "filing_date": "12/1/2023", "staff": "PIA", "doc_id": "STF-PIA-1-1", "is_protective_disclosure": "no", "question": "Refer to presentation “Capacity Needs – September 12, 2023” slide 10.\nFor the values in column (3) and column (4), “Budget 2024 P50” and “Budget 2024 P95”, respectively, provide the calculation of those values. Provide the load to be served (MW) and the capacity available to serve the load used to calculate the values. For new load (MW), please differentiate between load expected in Georgia Power’s service territory and load outside Georgia Power service territory. Please provide this information (including the load split in and outside Georgia Power’s Service territory) in the same format as the file TS July Estimated Winter Needs Table.xlsx, and provide this electronically with all formula intact.", "response": "Please refer to STF-PIA-1-1 Attachments A and B to see how the referenced tables were developed, as well as the load to be served and the capacity available to serve the load used to calculate the values. Georgia Power has not developed a forecast that excludes projected economic development load (new load) outside its exclusive service territory. Rather, the forecast provided in the 2023 IRP Update filing appropriately reflects projected economic development load the Company anticipates serving. Refer to the “Georgia Power Territorial Base Case Load vs. Existing Capability Table” provided in the Resource Mix Study within the Technical Appendix to the 2023 IRP Update filing for the latest load and capacity information.", "attachment_filenames": "STF-PIA-1-1 Attachment A.xlsx; STF-PIA-1-1 Attachment B.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216540, "filing_description": "DKT 55378 - STF-PIA-2 Data Request Responses", "filing_date": "12/1/2023", "staff": "PIA", "doc_id": "STF-PIA-2-1", "is_protective_disclosure": "no", "question": "Figure 3 Main Document Page 10. Provide Georgia Power’s actual or projected winter peak demand from customers outside service territory for following winter time periods: 2020/2021, 2021/2022, 2022/2023, 2023/2024, 2024/2025, 2025/2026, 2026/2027, 2027/2028, 2028/2029, 2029/2030, 2030/2031.", "response": "Georgia Power does not differentiate between or track existing customers by whether they are located inside or outside the Company’s service territory. Georgia Power has not developed a forecast that excludes projected economic development load outside its exclusive service territory. Rather, the forecast provided in the 2023 IRP Update filing appropriately reflects projected economic development load the Company anticipates serving.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216540, "filing_description": "DKT 55378 - STF-PIA-2 Data Request Responses", "filing_date": "12/1/2023", "staff": "PIA", "doc_id": "STF-PIA-2-2", "is_protective_disclosure": "no", "question": "For each winter time period identify the total number of customers outside service territory.", "response": "Please refer to STF-PIA-2-2 Attachment.xlsx for the total number of new large load customers outside Georgia Power’s service territory for each specified winter period. The Company does not separately track customers located outside Georgia Power’s service territory once they are online. As a result, data for the historical winter periods of 2020/2021, 2021/2022 and 2022/2023 are not available.", "attachment_filenames": "STF-PIA-2-2 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216540, "filing_description": "DKT 55378 - STF-PIA-2 Data Request Responses", "filing_date": "12/1/2023", "staff": "PIA", "doc_id": "STF-PIA-2-3", "is_protective_disclosure": "no", "question": "For each winter time period identify each customer outside service territory with a load greater than 10 MW and the customers’ peak winter demand (MW). Provide a brief description of these customers’ business and the approximate number of employees at the site receiving electric service. Please provide information in an unprotected Excel file.", "response": "Please refer to TS STF-PIA-2-3 Attachment. Each of the projects listed in the attachment has an announced load greater than 10 MW. Please note that Georgia Power’s new large load customers are modeled using a portfolio approach. As a result, the peak demand of individual customers does not exist.", "attachment_filenames": "PD STF-PIA-2-3 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216540, "filing_description": "DKT 55378 - STF-PIA-2 Data Request Responses", "filing_date": "12/1/2023", "staff": "PIA", "doc_id": "STF-PIA-2-4", "is_protective_disclosure": "no", "question": "Figure 4 Main Document Page 11. Provide the calculation of the values in Figure 4. Provide peak demand and capacity to serve load used to calculate the values in Figure 4.", "response": "Please see the “Figure 4” worksheet in the “Figures 4, 5, 6, & 9 – Capacity Needs Data for B22, B23, and 2023 IRP Update.xlsx” file located in the “Main Document” folder of the “TS 2023 IRP Update Models and Workpapers,” which were previously provided to the Commission Staff on October 27, 2023, with the 2023 IRP Update filing.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216697, "filing_description": "DKT 55378 STF-PIA-4 Data Request Responses", "filing_date": "12/11/2023", "staff": "PIA", "doc_id": "STF-PIA-4-1", "is_protective_disclosure": "no", "question": "In the Main Document, page (“p”) 14, Georgia Power Company (“Georgia Power” or “Company”) estimates that its Distributed Energy Resource (“DER”) Customer Program Pilot will provide approximately 150 MW of capacity in the capacity plan by the end of 2027. Please provide the estimated breakdown of customer generators for this program (size per installation, generator type, fuel type). Please provide all Georgia Power communications with interested customers for the DER Customer Program Pilot.", "response": "The size and type of generators to be deployed under the DER Customer Program will vary depending on a customer’s needs. The Company has not subscribed the full capacity available under the DER Customer Program Pilot. Therefore, for purposes of evaluating the Company’s capacity needs and developing the Company’s 2023 IRP Update, the Company assumed each project is comprised of a 5 MW Tier 4 Final diesel generator system.\nPlease see the table below for Georgia Power’s communications with interested customers for the DER Customer Program Pilot.", "attachment_filenames": "STF-PIA-4-1; PD STF-PIA-4-1 Attachment A.xlsx; PD STF-PIA-4-1 Attachment F, G.docx; PD STF-PIA-4-1 Attachment H.docx; STF-PIA-4-1 Attachment B.pdf; STF-PIA-4-1 Attachment C.docx; STF-PIA-4-1 Attachment D.pptx; STF-PIA-4-1 Attachment E.pptx; STF-PIA-4-13; STF-PIA-4-13 Attachment.xlsx; STF-PIA-4-15; PD STF-PIA-4-15 Attachment A-H.docx", "confidentiality_files": ""}, {"filing_api_id": 216697, "filing_description": "DKT 55378 STF-PIA-4 Data Request Responses", "filing_date": "12/11/2023", "staff": "PIA", "doc_id": "STF-PIA-4-10", "is_protective_disclosure": "no", "question": "How did Georgia Power consider potential funding opportunities from the IRA that would increase customer spending on behind the meter generation assets and battery storage in the IRP Update filing?", "response": "Georgia Power did not explicitly consider the potential funding opportunities from the Inflation Reduction Act (“IRA”) on behind the meter generating assets such as solar or battery storage in the 2023 IRP Update filing.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216697, "filing_description": "DKT 55378 STF-PIA-4 Data Request Responses", "filing_date": "12/11/2023", "staff": "PIA", "doc_id": "STF-PIA-4-11", "is_protective_disclosure": "no", "question": "How did Georgia Power consider potential funding opportunities from the IRA that would increase customer spending on electric transportation readiness and infrastructure in the IRP Update filing?", "response": "The Electric Power Research Institute (“EPRI”) produces High, Medium, and Low electric vehicle (“EV”) Market share scenarios each year. These scenarios are guided in part by external studies produced by outside researchers. The July 2023 Revision to the EPRI forecast includes at least one external study that considers EV incentives provided by the Inflation Reduction Act (“IRA”) as part of the impact of a “supportive policy environment.”\nGeorgia Power’s forecast of electric vehicles utilizes EPRI’s Medium scenario for the state of Georgia. To the extent that the impacts of the IRA are incorporated into EPRI’s Medium scenario, then it is implicitly considered in the 2023 IRP Update. However, the Company did not make any explicit adjustments based on the expected impacts of the IRA on electric transportation readiness and infrastructure.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216697, "filing_description": "DKT 55378 STF-PIA-4 Data Request Responses", "filing_date": "12/11/2023", "staff": "PIA", "doc_id": "STF-PIA-4-12", "is_protective_disclosure": "no", "question": "How did Georgia Power attempt to maximize funding opportunities available from the IRA in the 2023 IRP Update?  How were the different funding sources used to determine where spending would result in the most cost-effective solution for Georgia Power’s projected capacity shortfall?", "response": "Please refer to the Company’s responses to STF-PIA-4-9, 10, and 11, for further detail on how the Company considered funding opportunities available from the Inflation Reduction Act (“IRA”) for this filing. Please see Technical Appendix 9 Economic Analysis of Capacity Resources for the Company’s analysis of cost-effective solutions to meet projected capacity shortfalls, which includes benefits associated with the IRA for applicable technologies. The Company will continue to assess opportunities to leverage the funding opportunities from the IRA and from other similar incentives, if any, for the benefit of customers.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216697, "filing_description": "DKT 55378 STF-PIA-4 Data Request Responses", "filing_date": "12/11/2023", "staff": "PIA", "doc_id": "STF-PIA-4-13", "is_protective_disclosure": "no", "question": "Please refer to the 2023 IRP Update Main Document p. 1, please provide the calculation for the Company’s load growth projection of 6,600 megawatts (“MW”).", "response": "Please see STF-PIA-4-13 Attachment for the Company’s load growth projection of 6,600 MW between 2024 and 2031 as projected in the 2023 IRP Update Load and Energy Forecast.", "attachment_filenames": "STF-PIA-4-13; STF-PIA-4-13 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216697, "filing_description": "DKT 55378 STF-PIA-4 Data Request Responses", "filing_date": "12/11/2023", "staff": "PIA", "doc_id": "STF-PIA-4-14", "is_protective_disclosure": "no", "question": "Please refer to the 2023 IRP Update Main Document, Figure 6 on p. 19, please provide all assumptions, for each Year, that were used in determining the amount of Additional Owned Capacity to Maintain 70% Ownership Minimum MW.", "response": "Please see the “Figure 6” worksheet in the “Figures 4, 5, 6, & 9 – Capacity Needs Data for B22, B23, and 2023 IRP Update.xlsx” file located in the “Main Document” folder of the “TS 2023 IRP Update Models and Workpapers,” which were previously provided to the Commission Staff on October 27, 2023, with the 2023 IRP Update filing.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216697, "filing_description": "DKT 55378 STF-PIA-4 Data Request Responses", "filing_date": "12/11/2023", "staff": "PIA", "doc_id": "STF-PIA-4-15", "is_protective_disclosure": "yes", "question": "Please refer to the IRP Update Main document p. 20 and Technical Appendix 5 regarding the proposed 200 MW of BESS co-located with 200 MW of new solar facility.\nHow and when did the Company first become aware of this project?\nDid the Company consider other solar projects and locations? If so, what other projects were considered by the Company prior to the decision to move forward with the proposed project?\nWas the proposed project ever considered by the Company as a standalone solar facility? If not, why?\nExplain why the Company is proposing a solar plus battery project versus a standalone solar facility.\nWhy was the proposed facility location selected by the Company to include as part of the IRP Update.  Please describe in detail why this project was selected.\nExplain how available transmission capacity could create opportunities for grid charging of the BESS.\nProvide all workpapers and analysis to support the proposed facility size and design including battery type and tracking type.\nProvide the current “Purchase Agreement” and all other current documents between Georgia Power and the Seller.\nDescribe in detail what REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.\nProvide all documentation supporting the Company’s environmental due diligence of the project.\nProvide the lease agreement for the property for the solar and BESS facilities.\nProvide all workpapers and documentation for the interconnection of this facility.\nDoes the estimated overnight cost include all interconnection costs?\nDescribe the usage of the proposed BESS. Will the number of cycles and state of charge be limited on a daily, monthly or yearly basis?", "response": "The Company first became aware of this project in 2017 when the first interconnection requests were submitted, which later resulted in an executed Large Generator Interconnection Agreement in 2019.\nYes, the Company has considered deploying BESS at other solar locations – both Company-owned locations and third-party-owned facilities. Examples include the BESS Resources at Robins and Moody. The Company continues to actively pursue additional projects and anticipates bringing executed term sheets or agreements to the Commission for approval when available.\nFor the purposes of this 2023 IRP Update, the project was not considered as a standalone solar facility. The 2023 IRP Update is seeking to meet capacity needs, which requires the storage component. Additionally, the executed Large Generator Interconnection Agreement for this facility provides for a storage plus solar facility.\nThe Company proposed a BESS plus solar project rather than a standalone solar project because it is identifying resources that will meet an increased and accelerated capacity need as discussed in the 2023 IRP Update.\nThe Company has identified a capacity need as early as 2026 and will need resources that can achieve commercial operation on an accelerated timeline. As such, BESS plus solar projects in the mid-to-late-stage of development provide a great opportunity given that the land rights have been secured by the developer, a Large Generator Interconnection Agreement has been executed, and the interconnection facilities are in-service.\nPlease see Technical Appendix 10 Transmission Screening Analyses.\nThe developer began work on this project in 2017 when it submitted interconnection requests and subsequently executed a Large Generator Interconnection Agreement based on the land rights it secured at that time. The Company is performing due diligence on the developer’s work, but specific battery and solar manufacturers have not been selected.\nThe Company is currently negotiating an Asset Purchase Agreement with an EPC Term Sheet. When a final version of the Asset Purchase Agreement is finalized and executed, the Company will file it with the Commission for approval and certification.\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.\nPlease see TS STF-PIA-4-15 Attachments A, B, C, and D.\nPlease see TS STF-PIA-4-15 Attachments E, F, and G.\nPlease see TS STF-PIA-4-15 Attachment H and TS STF-JKA-2-19 Attachments K and L.\nYes, all known project specific incremental costs to fully deploy the BESS plus solar project are included.\nThe BESS will be utilized to support the system as it meets the daily energy and capacity needs. There are no operational limits unique to this BESS.\n*Reports analyze more property than required for the REDACTED BESS + Solar\n**Leases contain more land than required for the REDACTED BESS + Solar", "attachment_filenames": "STF-PIA-4-15; PD STF-PIA-4-15 Attachment A-H.docx", "confidentiality_files": ""}, {"filing_api_id": 216697, "filing_description": "DKT 55378 STF-PIA-4 Data Request Responses", "filing_date": "12/11/2023", "staff": "PIA", "doc_id": "STF-PIA-4-16", "is_protective_disclosure": "no", "question": "Please refer to the IRP Update Main document p. 20 regarding the 178 MW of BESS to be added to existing solar facilities at Robins and Moody Air Force Bases.\nPlease describe the decision-making process for selecting the solar facilities at Robins and Moody Air Force Bases as the location of the proposed storage devices. Provide all analysis conducted by the Company, or on its behalf, that supports these locations compared to locating BESS on other Company owned facilities at other military bases.\nPlease describe the process that the Company will have to go through to add BESS to current military projects.  Did the Company have to receive approval from the military for these additions? If so, were there other conditions required or agreed upon to locate the projects at Robins and Moody Air Force Bases? If so, please provide a complete list of such conditions.\nPlease explain the current 10% winter planning capacity attributed to the Robins and Moody Air Force Base solar sites when other solar resources assume a 5% winter capacity equivalence as found in the footnotes on p. 14.\nGeorgia Power states on page 20 that the “Company is also pursuing additional BESS opportunities at facilities that may have transmission capacity available as early as the winter of 2026/2027”. Specifically describe in detail how the Company is pursuing these opportunities. Is the Company only considering sites with Company owned facilities? Please describe any potential BESS locations that the Company has already identified and the status of those sites.", "response": "Due to timing and the need to achieve a 2026 Commercial Operation Date (“COD”), the Company focused on site locations where the battery energy storage systems (“BESS”) could utilize existing points of interconnection and associated transmission system capacity available to adjacent solar facilities. These facilities at Moody and Robins Air Force Bases had been previously designated as network resources. The facilities at Moody and Robins were also identified due to their size, collectively accounting for more than fifty percent of the Company-owned solar resources. In addition, BESS assets can be deployed more quickly at these sites compared to other Company-owned solar assets because they are not located directly on military property.\nThe Robins Solar Facility and Moody Solar Facility are located near the respective Air Force Bases but are not located directly on military land. Due to being located off-base, the Company did not have to receive approval from the military for these additions.\nThe 10% capacity contribution for Robins and Moody is higher than later solar additions due to timing of resource additions. Capacity contribution assignments are aligned with the sequence of renewable additions to the fleet. Robins and Moody were added to the system before additions from subsequent integrated resource plans (“IRP”) and request for proposals (“RFP”). This reflects the declining capacity contribution of solar resources as solar penetration on the system increases.\nThe Company is evaluating all options available to deploy BESS prior to November of 2027. That includes co-location of BESS at existing solar sites with facilities currently in a Power Purchase Agreement (“PPA”) with Georgia Power, co-location at Company-owned solar sites, and stand-alone BESS at Company-owned sites. The Company is currently in discussions with owners of PPA solar sites in the southern region of the state and is discussing the potential of adding Company-owned BESS to these facilities. If these negotiations are successful, the Company will bring these agreement(s) to the Commission for approval and certification.\nIn addition to co-location projects, the Company is also reviewing various substation and plant sites for stand-alone BESS capabilities that can achieve a 2027 COD. Once studies are finalized, the Company will bring any identified sites to the Commission for approval.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216697, "filing_description": "DKT 55378 STF-PIA-4 Data Request Responses", "filing_date": "12/11/2023", "staff": "PIA", "doc_id": "STF-PIA-4-2", "is_protective_disclosure": "no", "question": "Please refer to the IRP Update Main document p. 22 regarding the DER Colocation Program.\nDescribe which commercial and industrial customers would qualify for the program.\nPlease describe in detail how the Company will select customers for the program.\nWhen would the proposed tariff for this program be available?\nExplain how “resiliency benefits” will be quantified.\nPlease describe in detail how the price paid by the customer for the resiliency benefits provided by the DER will be determined.\nDescribe if there has been any recent outreach to potential customers. If there is interest in the program, please provide the number of customers with interest in the program, the size of each customer’s load, and any feedback that the Company has received from these customers.", "response": "Large commercial and industrial customers hosting resources
