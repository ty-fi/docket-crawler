d B. These attachments pull in the revenue requirements from the “Pre-COD” and “Post-COD” tabs of the SAM files for all generic technologies. The revenue requirements (found in Columns O through CG of the “Pre COD2” tab) are then multiplied by the annual escalation rate (found in Column E of the “Pre COD2” tab) to determine the PVRR for each potential in-service year. By using cell D1 in the “Summary” tab, the user can toggle between generic technology options and recalculate PVRRs for each potential in-service year.", "attachment_filenames": "STF-JKA-8-5; PD STF-JKA-8-5 Attachment A.xlsx; PD STF-JKA-8-5 Attachment B.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217672, "filing_description": "DKT 55378 STF-JKA-8 PD", "filing_date": "2/22/2024", "staff": "JKA", "doc_id": "STF-JKA-8-6", "is_protective_disclosure": "yes", "question": "Refer to “TS Resource Mix Study.docx” at page 13 regarding BESS, which states, “The Company’s view is that its costs will continue to decline into the middle of the planning horizon, before leveling off in real terms, meaning that it will become increasingly cost-effective throughout the study timeframe.”\nPlease confirm that figure 15 on page 10 is the only source of information the Company provided to allow Staff to evaluate the Company’s assumptions about costs declining into the middle of the planning horizon before leveling off.  In other words, the Company did not provide workpapers associated with that Figure in response to Staff’s request in JKA-2-9.  If other information has been provided for BESS, Utility PV, and/or Onshore Wind, related to the Company’s cost projections and related to escalation in costs, please identify where that information may be found.\nWhile the specific work product from BNEF may only be “accessible to BNEF clients,” Staff needs to see Georgia Power’s analysis that led to Aurora input modeling.  Please confirm or deny that the values found in Figure 10 are nothing more than values received from BNEF, without any further Georgia Power adjustment.  If the values have been adjusted (Deny), then Staff requests Georgia Power expedite delivery of all workpapers, electronically, with no pasted values, associated with developing Figure 10.\nThe prior question, part c requested workpapers to see how the PVRR values for costs were derived for all years as input into Aurora, and presumably those workpapers should show how the Company’s view of costs declining into the middle of the planning horizon were accounted for in developing the Aurora inputs. Please explain specifically how this can be seen in those workpapers, but if some other means was relied on for including the Company’s view of declining prices, please explain how it was done and provide the associated workpapers, electronically with all formulae intact, and no pasted-in values.", "response": "Correct; however, please see the Company’s responses to JKA-8-3, 8-4, and 8-5, which provide additional clarity on the nature of the escalation curves and how they are applied to the model.\nREDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED.\nThe workpapers and narrative provided in the Company’s response to STF-JKA-8-5 encapsulate how Present Value of Revenue Requirements (PVRR) for each technology were developed, extrapolated for multiple commercial operation dates (“CODs”) using a declining cost curve, and incorporated into Aurora.", "attachment_filenames": "STF-JKA-8-6", "confidentiality_files": ""}, {"filing_api_id": 217672, "filing_description": "DKT 55378 STF-JKA-8 PD", "filing_date": "2/22/2024", "staff": "JKA", "doc_id": "STF-JKA-8-7", "is_protective_disclosure": "yes", "question": "With regards to the Yates project:\nThe prior COD dates for Yates 8 -10 were assumed to be REDACTED REDACTED, respectively, and the new COD dates for Yates is assumed to be REDACTED REDACTED. Please explain all of the reasons for the delays in the COD dates from the initial filing.\nIs it possible that further delays of these projects could occur even before construction begins?\nIs it possible that further delays of these projects could occur after construction begins?\nThe Yates Units 9 can no longer be counted on for REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED REDACTED. Please explain how this impacts the Company’s plans for meeting reliability.", "response": "The commercial operation dates (“COD”) initially provided for the proposed Yates Units 8-10 were preliminary, as the Company was still negotiating the final agreements for the project. The revised and current CODs are based on the negotiated schedule to have Yates Unit 8 be online to meet Winter 2026/2027 needs as reflected in the executed engineering, procurement, and construction (“EPC”) Contract for the project.\nYes, delays are possible for any construction project. However, the Company does not anticipate delays and has taken appropriate measures to minimize the potential for delays including negotiating and executing an EPC Contract that includes guaranteed dates and REDACTED REDACTED.\nYes, delays are possible for any construction project. However, the Company does not anticipate delays and has taken appropriate measures to minimize the potential for delays including negotiating and executing an EPC contract that includes guaranteed dates and REDACTED REDACTED.\nPlease see STF-JKA-2-2 Supplemental Attachment B for a calculation of the Company’s capacity needs with the new assumed CODs for Yates Units 8-10. The Company’s remaining Winter 2026/2027 capacity need can be satisfied with the additional BESS resources from the proposed 1,000 MW portfolio that have yet to be identified, as well as through the proposed distributed energy resources (“DER”) and demand response (“DR”) programs.", "attachment_filenames": "STF-JKA-8-7", "confidentiality_files": ""}, {"filing_api_id": 217672, "filing_description": "DKT 55378 STF-JKA-8 PD", "filing_date": "2/22/2024", "staff": "JKA", "doc_id": "STF-JKA-8-8", "is_protective_disclosure": "yes", "question": "Refer to the costs associated with Yates 8 – 10.\nIn a comparison of Overnight costs for the units between the initial (“TS SAM ('23) - 7.0.1 YatesCT Final.xlsm”) and updated filings “TS SAM ('23) - 7.0.1 YatesCT 012024.xlsm,” the costs have gone up REDACTED comparing just overnight costs of the units, and REDACTED when new tie line costs and a gas lateral cost is accounted for. Explain the components that have increased in cost that account for the REDACTED increase since the initial filing.\nExplain why tie lines and a gas lateral was not included in the original economic evaluation, and why it is now being included.\nExplain how the tie line and lateral investments will change the way in which the Yates units will be able to be operated. For example, explain how the gas lateral investment will allow gas to be used at different times than previously expected when the initial filing was made.\nGiven that the Company previously assumed there would be a significant transmission investment associated with Yates REDACTED REDACTED, why didn’t that cover any tieline expense REDACTED?  Please explain the difference in the purpose of the investments.", "response": "The Overnight Costs included in the Company’s initial filing were based on preliminary estimates. The Company updated the Yates Units 8-10 costs once the engineering, procurement, and construction (“EPC”) contract was finalized and executed. The updated Yates Units 8-10 estimate is based on revised pricing of the units and estimates for the transmission tie lines and gas lateral.\nThe Company’s initial filing did include estimates for the tie lines and gas lateral in the economic evaluation. As the additional information became available with the execution of the EPC contract and the supplemental filing, the Company updated the granularity of the analysis to include more detailed costs for the tie lines and gas lateral components in specific separate tabs in the SAM file.\nThe addition of the gas lateral and tie lines as discrete asset sheets in the updated SAM file do not represent a change in operation as compared to the initial filing. Rather, the costs associated with those assets have been disaggregated from the unit asset sheets in the updated SAM file to provide a more detailed view of the costs for these components. This change in the presentation of the financial analysis supporting the construction of Plant Yates Units 8-10 is in no way reflective of a change in the operating characteristics of the plant since the gas lateral and the tie lines have always been included as assumed project components.\nThe transmission costs are separated between interconnection and delivery according to the cause of the cost. The identified transmission investment (REDACTED REDACTED) is required to accommodate the delivery of energy on the bulk transmission system. In contrast, the tie lines connect the units to the bulk transmission system, and the associated cost has been included in the estimate for Yates Units 8-10 as an interconnection cost, and were included in the initial filing.", "attachment_filenames": "STF-JKA-8-8", "confidentiality_files": ""}, {"filing_api_id": 217672, "filing_description": "DKT 55378 STF-JKA-8 PD", "filing_date": "2/22/2024", "staff": "JKA", "doc_id": "STF-JKA-8-9", "is_protective_disclosure": "no", "question": "Refer to the Yates documents provided with the Supplemental filing on 1/12/24\nSee document TD5 associated with JKA-2-19 Supplemental Attachment P at pdf page 61 of 61. Please discuss the reason the Company is including an SCR system and explain all requirements that necessitated the SCR system be included in the design.  Also, explain whether the Company could build the CTs without the SCR system.\nWhat is the overnight cost of the Yates project and what percentage of that cost is for the SCR system?\nDoes Georgia Power or Southern Company own any CTs that have been built with SCRs?  If so please state which projects.\nWhat forced outage rate increases have been accounted for given that Yates will be constructed with an SCR system?\nPlease explain the competitive bid selection processes that were used to select Black and Veatch and Mitsubishi for Yates, if any were used.  If no competitive bidding process was used please explain why not.", "response": "The Company is including an SCR system to comply with county-specific emissions requirements Ga. Comp. R & Regs. 391-3-1-.02(2)(nnn), NOx Emissions from Large Stationary Gas Turbines (“Ga Rule (nnn)”), and federal emissions requirements in 40 CFR Part 60 Subpart KKKK, Standards of Performance for Stational Combustion Turbines (“NSPS 4K”). Ga Rule (nnn) requires that certain combustion turbines (“CTs”) constructed after April 1, 2000 in Coweta County have NOx emissions lower than 6 ppm, corrected to 15% oxygen, during the period May 1 through September 30 each year, while NSPS 4K requires that certain CTs constructed after February 18, 2005 anywhere in the United States have NOx emissions lower than 15 ppm, corrected to 15% oxygen, year round. Without an SCR, the CTs would not be able to meet these emissions requirements and would therefore not be permitted for construction.\nThe overnight cost of the project is not available as the EPC contract price includes escalation and is not broken out. The contract does not break out the percent of price for the SCR system so a breakdown is not presently available.\nNo CTs in the Georgia Power fleet have SCRs.\nThe forced outage rate modeled for the Yates CTs are consistent with the Budget 2024 Technology Application Standards (“TAS”) model, which includes an SCR. Please see the Company’s response to STF-JKA-3-2 for Plant Yates Units 8-10 equivalent forced outage rates (“EFOR”) assumptions.\nGeorgia Power did not use a competitive bid selection process as there was insufficient time to go through the process and meet the revised load forecasts in the 2023 IRP Update. However, the SCS team responsible for the proposed Yates Units 8-10, previously worked with Black & Veatch and Mitsubishi on a project for Alabama Power Company that successfully came in on time and under budget. SCS and Alabama Power conducted a competitive bid process in advance of the Alabama Power project from which Black and Veatch and Mitsubishi were selected.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217329, "filing_description": "DKT 55378 STF-JKA-7 Data Request Responses", "filing_date": "2/5/2024", "staff": "JKA", "doc_id": "STF-JKA-7-1", "is_protective_disclosure": "no", "question": "Comparing the 2022 IRP to the 2023 IRP Update and the Georgia Power specific Reserve Margin Load and Resource Table provided in, “Georgia Power Territorial Base Case Load vs. Existing Capability Table.xlsx”:\nPlease explain how the Company determines a short-term RM and a long-term reserve margin.  Explain what period the short-term applies and how it is derived.\nPlease explain what the company utilized as the short-term RM in the 2022 IRP, and over what period it was assumed, and the derivation of that reserve margin.\nPlease explain what the company utilized as the short-term RM in the 2023 IRP Update, and over what period it was assumed, and the derivation of that reserve margin.\nTo the extent that answers b and c are not identical, please explain all changes in the Company’s approach to setting a short-term and long-term Reserve Margin.", "response": "The Georgia Power short-term reserve margin (“RM”) is determined from historical load diversity factors. See the Company’s response to STF-JKA-6-1, part (f) for the diversity factor calculations. The short-term RM applies to studies inside of a three-year window. The long-term RM has not been updated since the 2022 Integrated Resource Plan (“IRP”) as referenced in the Company’s response to STF-JKA-6-1, part (e).\nSee the Company’s response to STF-JKA-6-1, part (d) for details regarding the Georgia Power 2022 IRP short-term RM. The short-term period assumed for the 2022 IRP was 2023-2025.\nSee the Company’s response to STF-JKA-6-1, part (d) for details regarding the Georgia Power 2023 IRP Update short-term RM. The short-term period assumed for the 2023 IRP Update is 2024-2026.\nSee the Company’s response to STF-JKA-6-1, part (d) for details regarding the differences between the Georgia Power short-term RMs between the 2022 IRP and 2023 IRP Update.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217329, "filing_description": "DKT 55378 STF-JKA-7 Data Request Responses", "filing_date": "2/5/2024", "staff": "JKA", "doc_id": "STF-JKA-7-2", "is_protective_disclosure": "no", "question": "Comparing the 2022 IRP to the 2023 IRP Update and the Southern Company specific Reserve Margin enforced in the Aurora Mix Study runs.\nPlease explain how the Company determines a short-term RM and a long-term reserve margin.  Explain what period the short-term applies and how it is derived.\nPlease explain what the company utilized as the short-term RM in the 2022 IRP, and over what period it was assumed, and the derivation of that reserve margin.\nPlease explain what the company utilized as the short-term RM in the 2023 IRP Update, and over what period it was assumed, and the derivation of that reserve margin.\nTo the extent that answers b and c are not identical, please explain all changes in the Company’s approach to setting a short-term and long-term Reserve Margin.", "response": "See Georgia Power’s 2022 Integrated Resource Plan (“IRP”) Docket No. 44160 Technical Appendix Vol 1., Section 1 – Reserve Margin Study. The long-term reserve margin (“RM”) applies to studies looking out four or more years. The short-term RM applies to studies inside of a three-year window.\nSee Georgia Power’s 2022 IRP Docket No. 44160, Main Document page 1-2. See pages 58 & 60 of the Reserve Margin Study referenced in part (a) of this response for derivation details.\nSee Note E in file “Georgia Power Territorial Base Case Load vs. Existing Capability Table.xlsx” referenced in STF-JKA-7-1. The same Reserve Margin Study submitted in the 2022 IRP was used to derive the Southern Company short-term RM in the 2023 IRP Update.\nThe Southern Company short-term and long-term RMs are the same across the 2022 IRP and 2023 IRP Update filings.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217329, "filing_description": "DKT 55378 STF-JKA-7 Data Request Responses", "filing_date": "2/5/2024", "staff": "JKA", "doc_id": "STF-JKA-7-3", "is_protective_disclosure": "no", "question": "Refer to row 16, and footnote E of “Georgia Power Territorial Base Case Load vs. Existing Capability Table.xlsx.”\nPlease provide all workpapers and calculations supporting the derived diversity adjustment captured in the analysis translating the 26% Southern Company reserve margin to a GPC specific reserve margin.\nProvide the specific year of analysis, the GPC Non-Coincident peak and the GPC coincident peak for that year.", "response": "All calculations to determine the diversity factor that was used in the 2023 IRP Update to determine the Georgia Power-specific target reserve margin are provided in TS JKA-2-10 Attachment A. The calculations that detail how the Georgia Power target reserve margin was derived from the diversity factor and 26% Southern Company target reserve margin are provided in TS JKA-6-1 Attachment B.\nThe diversity factor is calculated based on using a 10-year historical forecast (2013 – 2022) of the Southern Company operating companies’ non-coincident peaks. The Georgia Power non-coincident peaks and coincident peaks for the 10-year period are provided in STF-JKA-7-3 Attachment.", "attachment_filenames": "STF-JKA-7-3; STF-JKA-7-3 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217329, "filing_description": "DKT 55378 STF-JKA-7 Data Request Responses", "filing_date": "2/5/2024", "staff": "JKA", "doc_id": "STF-JKA-7-4", "is_protective_disclosure": "no", "question": "Please reconcile the GPC column in the Auora mix study load input table, “Loads_B24_MG0_P95_v1” as adjusted by the change set, “B2024 Final IRP – Diversified Loads – MG0 P95” to the peak load forecast provided in “Georgia Power Territorial Base Case Load vs. Existing Capability Table.xlsx”\nIdentify the peak hour for each year in the aurora data base that matches to the peak in the Georgia Power, “Georgia Power Territorial Base Case Load vs. Existing Capability Table.xlsx”\nFor year 2030, it appears the non-coincident peak value in Aurora is 21,255 MW and the coincident peak is 21,075 (to SOCOnoSPC).  Please reconcile to the provided 21,326 value.", "response": "See STF-JKA-7-4 Attachment for the hour that corresponds with the Georgia Power Winter peak loads that are found in the Load and Resource balance table.\nThe Resource Mix Study identifies the capacity resources needed to meet the aggregate retail operating companies’ needs. The system peak demand forecasts are derived by summing each retail operating companies’ non-coincident peaks (“NCPs”) and then applying a load diversity factor. This process is carried out by applying the diversified peak load change set used within the Aurora model. When this change set file is activated within Aurora, hourly loads that correspond to the System (SOCOnoSPC) peak hour will be adjusted so that the sum of the retail operating companies will equal the winter diversified system peak demand. In year 2030, the System winter peak occurs on January 24 at hour 8. The retail operating companies’ loads in that same hour are adjusted proportionally to sum to the winter diversified system peak. In this case, the Company NCP of 21,326 MW corresponds with the System peak, so it is adjusted from 21,326 MW to 21,075 MW. This change set only applies to hours where the sum of the retail operating companies’ NCPs exceeds the system diversified peak demand, which was January 24 at hour 8. In hour 9 on the same day, the Company’s forecasted load is 21,225 MW. This value was not adjusted because the sum of each retail operating companies’ load did not exceed the System diversified peak in that hour. Therefore, due to the adjustment to the Company’s NCP that coincided with the system diversified peak demand and no other hours, it appears that 21,225 MW is the Company’s NCP, but that is only because of adjustments being made in some hours and no other adjustments are necessary. In 2030, the Resource Mix Study builds to the system diversified peak on January 24 hour 8 because that is the hour when the aggregate retail operating companies experience the peak demand.", "attachment_filenames": "STF-JKA-7-4; STF-JKA-7-4 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217329, "filing_description": "DKT 55378 STF-JKA-7 Data Request Responses", "filing_date": "2/5/2024", "staff": "JKA", "doc_id": "STF-JKA-7-5", "is_protective_disclosure": "no", "question": "Please refer to the file TS_PRICEM_B2021_MG0_6_24_2021 STF-DEA-1-2.xlsm provided in the response to Staff Data Request DEA 1-2. Please provide the following information.\nOn the Reports Tab in row 46 please explain the purpose of the line items in cell F46 and H46.\nPlease provide an explanation of the components of these calculations.\nPlease refer to the Tab Calc cell BL 92.  This calculation includes a difference between two NPV amounts.  Please explain what these NPV amounts are intended to represent.   Please also explain the purpose of multiplier (1+H56)^31 used in the formula in this cell.\nPlease refer to the Tab Calc cell AE92, BJ92 and BK 92.  Please explain the purpose of this calculation and what each of these cells represents.", "response": "The purpose of these calculations is to ensure that the Company is using the Economic Carrying Cost (“ECC”) to evaluate the Customer costs during the assumed project life. In a long-term economic analysis where project and asset lives differ, the ECC is appropriate rather than the Declining Revenue Requirement (“DRR”) .\nReports Tab F46 is the DRR to ECC True Up for combustion turbine (“CT”) Capacity. The formula includes a sum of all capacity types, several of which are not used in this example.  \n\nReports Tab H46 is the DRR to ECC True Up for Bulk Transmission.\nThese calculations convert the DRR stream to an ECC by calculating the difference between the net present value (“NPV”) of the ECC stream over 30 years and the NPV of the DRR stream over 30 years.\nThis cell calculates the DRR to ECC True Up for CT Capacity. The two NPV amounts are the NPV of the ECC and the NPV of the DRR streams. Multiplier (1+H56)^31 intends to convert the NPV from year 1 dollars to year 31 dollars as year 31 is where the true up is incorporated on the RIM report and included in the NPV calculation.\nIn the RIM analysis the customer’s load is removed at the end of the assumed project life, resulting in available capacity. Cell AE92 is the resulting capacity benefit in the final year in terms of the Build Cost (real terms). Cell BJ92 then converts this capacity benefit in the final year (Cell AE92) to a DRR. Cell BK92 is the summation of the last year’s DRR cost (Cell AP92) plus the DRR for the capacity benefit (Cell BJ92) to the customer in the final year.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217043, "filing_description": "DKT 55378 STF-LA-2 Data Request Responses", "filing_date": "1/12/2024", "staff": "LA", "doc_id": "STF-LA-2-1", "is_protective_disclosure": "no", "question": "Track Record on Battery Energy Storage Systems (“BESS”).  For each BESS that the Company has in service or expects to have in service by December 31, 2023, please provide the following information:\nName of the BESS.\nLocation of the BESS.\nCost of the BESS, in total and by account.\nCapacity of the BESS.\nDepreciation period and depreciation rates being used for the BESS.\nPerformance of the BESS to date (MW stored and discharged by day and hour from the date of commercial operation through the most recent date available).", "response": "UGA Solar Battery.\n2435 Milledge Ave, Athens GA 31704.\nSee STF-LA-2-1 Attachment for the project cost as of November 30, 2023.\n9 kW/23.3kWh System.\nSee STF-LA-2-1 Attachment for the depreciation rates as approved in the 2022 Base Rate Case.\nThe data available demonstrates a charge of 2,319 kWh and discharge of 1,838 kWh from Oct 2018 to Sept 2019.", "attachment_filenames": "STF-LA-2-1; STF-LA-2-1 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217043, "filing_description": "DKT 55378 STF-LA-2 Data Request Responses", "filing_date": "1/12/2024", "staff": "LA", "doc_id": "STF-LA-2-2", "is_protective_disclosure": "no", "question": "For each BESS for which cost has been included in the Company’s revenue requirement in Docket No. 44280, please provide the following information: Amounts of rate base and operating expense for each BESS that has been reflected in the Company’s revenue requirement for each year, 2024, 2025 and 2026 from Docket No. 44280.  Please show amounts by account.", "response": "Please see STF-LA-2-2 Attachment. The Company provided the rate base and operating expenses for years 2023, 2024, and 2025 in the 2022 base rate case in Docket No. 44280.", "attachment_filenames": "STF-LA-2-2; STF-LA-2-2 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 217043, "filing_description": "DKT 55378 STF-LA-2 Data Request Responses", "filing_date": "1/12/2024", "staff": "LA", "doc_id": "STF-LA-2-3", "is_protective_disclosure": "no", "question": "Track Record on Microgrids. For each microgrid that the Company has in service or expects to have in service by December 31, 2023, please provide the following information:\nName of the microgrid.\nLocation of the microgrid.\nCost of the microgrid, in total and by account.\nAnnual operating costs of the microgrid in total and by account.\nA description of whether the microgrid is dedicated to a particular customer or location.\nDepreciation period and depreciation rates being used for the microgrid.\nA listing of the dates and times to date when the microgrid was used to supply power to the microgrid area during what would have otherwise been power outages to the microgrid area.", "response": "Tech Square Microgrid.\n755 Williams St NW Atlanta GA 30308.\nSee STF-LA-2-1 Attachment for the project cost as of November 30, 2023.\n$200,000.\nThe Tech Square Microgrid can feed the Georgia Tech High Performance Computing Center at Databank or tie into the distribution network.\nSee STF-LA-2-1 Attachment for the depreciation rates as approved in the 2022 Base Rate Case.\nThe fuel cell at the Tech Square Microgrid continuously provides power to the customer, but the microgrid has not needed to island the customer load because of system events. There are also two utilities at this site, so the microgrid would swap between utilities if there was an outage.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 217043, "filing_description": "DKT 55378 STF-LA-2 Data Request Responses", "filing_date": "1/12/2024", "staff": "LA", "doc_id": "STF-LA-2-4", "is_protective_disclosure": "no", "question": "For each microgrid for which cost has been included in the Company’s revenue requirement in Docket No. 44280, please provide the following information: Amounts of rate base and operating expense for each microgrid that has been reflected in the Company’s revenue requirement for each year, 2024, 2025 and 2026 from Docket No. 44280.  Please show amounts by account.", "response": "Please see STF-LA-2-4 Attachment. The Company provided the rate base and operating expenses for years 2023, 2024, and 2025 in the 2022 base rate case in Docket No. 44280.", "attachment_filenames": "STF-LA-2-4; STF-LA-2-4 Attachment.xlsx", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-1", "is_protective_disclosure": "no", "question": "Refer to the Company’s Direct Testimony that was filed on December 4, 2023.  On page 14 of the panel’s testimony, which discusses GPC’s forecast modeling for large load projects, the Company states: “The Company also classifies projects as Industrial or Commercial and segments projects based on specific business categories such as warehouse, battery manufacturing, cryptocurrency, data center, chemical processing, and solar panel manufacturing, thus further refining the data used to inform its forecast.\nPlease explain fully and in detail how each of the business categories listed above factors into the Company’s modeling for large load projects.\nIdentify the amount of new load that the Company is expecting in each category.\nShow the amount of additional revenue, by year, that the Company is expecting in total and by category.", "response": "The categories referenced are used to determine correlation assumptions for the Monte Carlo simulation. The Company assumed independent correlations across segments and perfect correlation for customers within the same segment.\nGeorgia Power models expected loads using a portfolio approach. As a result, the Company does not have expected loads by category.\nPlease refer to STF-DEA-3-6 for information on total additional revenue by year. This information is not available by category.", "attachment_filenames": "STF-LA-1-15; PD STF-LA-1-15 Attachments A-P and PRICEM models.docx", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-10", "is_protective_disclosure": "no", "question": "Distributed Energy Resource (“DER”).  As it relates to tariff DCL-1, on page 43 (lines 1-5) of the Company Direct Testimony, the panel states: “The participating customer’s payment will be calculated as the total cost of the asset less 75% of the net present system value over the life of the asset.  This structure (1) ensures all customers will see a benefit based on the discounted system value credited, (2) mitigates the bad debt risk to non-participants, and (3) ensures that participating customers receive resilience benefits.”\nHow is the discounted system value derived?  Show detailed calculations.\nWhat are the amounts of bad debt risk in each year? Show in detail how those amounts were calculated/estimated.\nHow will participating customers’ payments mitigate the bad debt risk to non-participants?  Explain fully.\nWhat is meant by the term “resilience benefits?”  Identify, quantify and explain fully each type of expected resilience benefits.\nHow will the Company ensure that participating customers receive resilience benefits?  Explain fully.", "response": "The discounted system value was determined using a shared savings model similar to that used to determine DSM incentive levels. We believe the 75% will ensure participating customers receive sufficient incentive to participate in the program while delivering value to non-participating customers.\nThe Company did not estimate any bad debt risk associated with the program.\nCustomers will be required to pay for their portion of the asset upfront or over a period of up to 5 years in accordance with the Company’s credit policy. At all times the Company will own the asset and the ability to realize the capacity and energy value it provides to the system.\nResilience benefits are the ability of the participating customer to continue receiving electric service during a local outage. The value of this resiliency is customer, asset, and location specific. The participating customer will need to quantify the resiliency benefit for their operation.\nDuring a local outage, the Company will provide resilience service to the participating customers through  the on-site DER. The DER will be monitored at the Company’s Operations Center. In addition, the Company will provide preventative maintenance to ensure the DER is appropriately maintained and capable of responding for system or resiliency benefit.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-11", "is_protective_disclosure": "no", "question": "Refer to page 50 (lines 1-5) of the Company’s Direct Testimony.  Please provide all analysis performed by the Company that led GPC to conclude that it does not expect customer rates to increase pursuant to the Company’s 2023 IRP update.\nIdentify, quantify and explain all additional revenues that the Company anticipates from the additional growth beyond the level reflected in to the Company’s 2023 IRP.\nIdentify, quantify and explain all additional plant investment that the Company anticipates will be needed to address the additional growth beyond the level reflected in to the Company’s 2023 IRP.\nIdentify, quantify and explain all additional operating expenses that the Company anticipates will be needed to address the additional growth beyond the level reflected in to the Company’s 2023 IRP.\nIdentify and provide all costs of service forecasts for 2024, 2025 and 2026 related to additional growth beyond the level reflected in to the Company’s 2023 IRP.", "response": "Please see the Company’s response to STF-DEA-3-6 for analysis supporting the Company’s testimony that “[a]ll else being equal, considering the expected load growth and cost of the solutions proposed in this 2023 IRP Update, the Company does not expect customer rates to increase.” Please also see the Company’s response to STF-DEA-1-2 for Ratepayer Impact Measure (“RIM”) test results and analyses.\nThe Company interprets subparts (a) through (d) in this question to mean the additional growth beyond the level reflected in the Company’s currently approved 2022 Integrated Resource Plan (“IRP”) rather than “the additional growth beyond the level reflected in the Company’s 2023 IRP.” The Company does not have projections of growth beyond the level reflected in the load forecast contained in the Company’s 2023 IRP Update.\nPlease see the Company’s responses to STF-DEA-3-6 and STF-LA-1-13.\nPlease see the Company’s responses to STF-DEA-3-6 and STF-JKA-1-1. Specifically, the SAM files referenced in these responses contain estimates for additional plant investment related to the portfolio of resources proposed in the 2023 IRP Update to meet customers’ increasing energy needs.\nPlease see the Company’s responses to STF-DEA-3-6 and STF-LA-1-14.\nThe Company did not produce any cost-of-service forecasts related to the 2023 IRP Update.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-12", "is_protective_disclosure": "no", "question": "Has the Company estimated the impact on its 2023, 2024, 2025 or 2026 earnings from the additional growth beyond the level reflected in to the Company’s 2023 IRP?  If not, explain fully why not.  If so, please identify, explain and provide all calculations of expected earnings impacts related to that additional growth.", "response": "The Company interprets this question to mean the additional growth beyond the level reflected in the Company’s currently approved 2022 Integrated Resource Plan (“IRP”) rather than “the additional growth beyond the level reflected in the Company’s 2023 IRP.”\nThe Company has not calculated a full earnings impact associated with the additional load growth beyond the level reflected in the Company’s 2022 IRP. Please see the Company’s response to STF-DEA-3-6, which provides for a preliminary estimate of the projected retail revenues and projected revenue requirements for 2026 through 2028, reflecting the additional load growth and incremental capacity associated with the 2023 IRP Update. Please note that the projected retail revenues are only a preliminary estimate and may not fully materialize.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-13", "is_protective_disclosure": "no", "question": "Has the Company estimated the impact on its 2023, 2024, 2025 or 2026 utility operating revenue from the additional growth beyond the level reflected in to the Company’s 2023 IRP?  If not, explain fully why not.  If so, please identify, explain and provide all calculations of expected additional utility operating revenues in each year related to that additional growth.", "response": "The Company interprets this question to mean the additional growth beyond the level reflected in the Company’s currently approved 2022 Integrated Resource Plan (“IRP”) rather than “the additional growth beyond the level reflected in the Company’s 2023 IRP.”\nPlease see the Company’s responses to STF-LA-1-12 and STF-DEA-3-6.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-14", "is_protective_disclosure": "no", "question": "Has the Company estimated the impact on its 2023, 2024, 2025 or 2026 utility operating expenses from the additional growth beyond the level reflected in to the Company’s 2023 IRP?  If not, explain fully why not.  If so, please identify, explain and provide all calculations of expected additional utility operating expenses in each year related to that additional growth.", "response": "The Company interprets this question to mean the additional growth beyond the level reflected in the Company’s currently approved 2022 Integrated Resource Plan (“IRP”) rather than “the additional growth beyond the level reflected in the Company’s 2023 IRP.”\nPlease see the Company’s responses to STF-LA-1-12, STF-DEA-3-6, and STF-JKA-1-1. Specifically, the SAM files referenced in these responses contain estimates for additional operating expenses related to the portfolio of resources proposed in the 2023 IRP Update to meet customers’ increasing energy needs.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-15", "is_protective_disclosure": "no", "question": "Customer Impacts. Refer to pages 49-50 of the Company’s Direct Testimony. Refer to page 49, lines 17-18. Identify and provide all calculations of the Ratepayer Impact Measure (RIM) test related to the Company’s 2023 IRP update.", "response": "RIM statements for new large customers included in the updated load forecast for active offers and offers that have been accepted by the customer are provided and listed below.\nTS STF-LA-1-15 Attachment A.pdf\nTS STF-LA-1-15 Attachment B.pdf\nTS STF-LA-1-15 Attachment C.pdf\nTS STF-LA-1-15 Attachment D.pdf\nTS STF-LA-1-15 Attachment E.pdf\nTS STF-LA-1-15 Attachment F.pdf\nTS STF-LA-1-15 Attachment G.pdf\nTS STF-LA-1-15 Attachment H.pdf\nTS STF-LA-1-15 Attachment I.pdf\nTS STF-LA-1-15 Attachment J.pdf\nTS STF-LA-1-15 Attachment K.pdf\nTS STF-LA-1-15 Attachment L.pdf\nTS STF-LA-1-15 Attachment M.pdf\nTS STF-LA-1-15 Attachment N.pdf\nTS STF-LA-1-15 Attachment O.pdf\nTS STF-LA-1-15 Attachment P.pdf\nWorkpapers for each RIM statement listed above are also provided and listed below. Each PRICEM model contains the respective offers that were developed in that particular vintage of PRICEM.\nTS_PRICEM_B2021_MG0_6_24_2021 STF-LA-1-15.xlsm\nTS_PRICEM_B2022_MG0_06-01-2022 STF-LA-1-15.xlsm\nTS_PRICEM_B2023_MG0_06-12-2023 STF-LA-1-15.xlsm\nTS_PRICEM_B2023_MG0_06-12-2023 12-13-23 STF-LA-1-15.xlsm\nTS_PRICEM_B2023_MG0_XX-XX-2023 05-11-23 STF-LA-1-15.xlsm\nTS_PRICEM_B2023_MG0_XX-XX-2023 05-15-23 STF-LA-1-15.xlsm", "attachment_filenames": "STF-LA-1-15; PD STF-LA-1-15 Attachments A-P and PRICEM models.docx", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-16", "is_protective_disclosure": "no", "question": "Customer Impacts. Refer to pages 49-50 of the Company’s Direct Testimony. Refer to page 49, lines 22-25. Although the Company is not requesting a rate adjustment at this time for its 2023 IRP Update, please confirm that several of the requests being made in the 2023 IRP Update do have consequences for future rate increases.  If this cannot be confirmed, explain fully why not.", "response": "The costs associated with the incremental capacity requested in the 2023 IRP Update, including requests for regulatory asset treatment for certain costs, as well as the retail revenues from the additional load growth that is necessitating the need for this incremental capacity, will impact future rate adjustments for retail customers. Based on the Company’s preliminary estimates, all else being equal, the revenues from the additional load growth are expected to exceed the costs of the incremental capacity and put downward pressure on retail rates. Please see the Company’s response to STF-DEA-3-6 for additional information.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-17", "is_protective_disclosure": "no", "question": "Flex Capacity Framework.  Refer to page 51 (lines 21-28) of the Company’s Direct Testimony.\nFor each large customer that is being added that comprises the “rapid increases in load” identify, quantify and explain the anticipated annual kWh and kW demand and annual revenue expected from that customer.\nFor each large customer that is being added that comprises the “rapid increases in load” identify and explain whether that customer’s new and expanded operations are (1) located within GPC’s existing service territory or (2) are outside GPC’s service territory and resulted from GPC’s competing to serve load, as is permitted in Georgia.\nHow would the Flex Capacity framework (if approved by the Commission) (1) help the Company address rapid increases in load prior to the Company filing its 2025 IRP, and (2) continue to support economic growth in Georgia?  Explain fully.\nIdentify, quantify and explain in detail what developmental costs GPC expects to incur in each year, 2024, 2025 and 2026 that would otherwise be expensed, and identify the annual amounts expected for such developmental costs.\nIn what account does the Company normally record developmental costs?\nHow much developmental costs were incurred in each year 2022 and 2023?  Show those amounts in total for each year. Also show the amounts recorded in each account in each year for developmental costs.\nGiven that the Company already has an Annual Surveillance Reporting requirement and earnings sharing provisions, explain fully how permission to defer developmental costs into a regulatory asset under the proposed Flex Capacity framework would not result ultimately in ratepayers bearing most costs.", "response": "The “rapid increases in load” referenced on page 51 (lines 21-28) of the Company’s Direct Testimony within the Flex Capacity section are not identified because the criteria for the proposed Flex Capacity framework have not yet been met. Specifically, the Company has not produced an update to the 2023 IRP Update Load Forecast prior to the 2025 IRP that results in a 500 MW or greater capacity need prior to the winter of 2028/2029. The proposed Flex Capacity framework criteria are described in the Flex Capacity section of the 2023 IRP Update Main Document and in pages 50-52 of the Company’s Direct Testimony.\nPlease see the response to subpart (a).\nConsistent with the response to subpart (a), note that the criteria for the proposed Flex Capacity framework have not been met, so the Company has not identified “rapid increases in load” prior to the 2025 IRP beyond what is already included in the 2023 IRP Update Load Forecast. The Flex Capacity framework, if approved by the Commission, would help the Company address additional rapid increases in load prior to the 2025 IRP because, if approved, the Company would be authorized to undertake preliminary development activities for new-build resources or pursue execution of power purchase agreements (“PPAs”) or acquisitions for market resources, if available, and seek expedited certification of such resources from the Commission to meet new capacity needs arising before the winter of 2028/2029. Given the lead time to develop and construct resources, receiving authorization to develop new resources or execute agreements for new capacity and seek expedited certification under the Flex Capacity framework would allow the Company to quickly respond to additional potential customers and continue to support the economic growth of the state by providing additional capacity to timely meet the additional capacity needs.\nThe criteria for the proposed Flex Capacity framework have not been met, so the Company has not identified additional resources that would need to be developed in response to additional rapid increases in load.\nBased on the nature of the expenditures, the Company can record developmental costs to FERC accounts: 183 – Preliminary Survey & Investigation, 186 – Miscellaneous Deferred Debits, and/or 188 – Research, development, and demonstration expenditures.\nPlease see the response to subpart (d). The Company has not incurred any developmental costs in 2022 and 2023 related to the proposed Flex Capacity framework.\nThe 2023 IRP Update is the result of extraordinary and unprecedented circumstances not contemplated or considered in the 2022 base rate case, similar to the impacts of Tax Cuts and Jobs Act and the COVID pandemic within the prior 3-year Alternate Rate Plan periods, which resulted in regulatory deferral treatment approved by the Commission. The costs projected to be incurred in 2024 and 2025 associated with the incremental capacity requested in the 2023 IRP Update to meet capacity needs starting in Winter 2025/2026 are expected to be significant and necessary to meet the extraordinary future load growth and the Company’s obligation of providing reliable electric service to all of its retail customers. Therefore, the regulatory deferral requested in this 2023 IRP Update is appropriate and consistent with past practice.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-18", "is_protective_disclosure": "no", "question": "Recovery of Transmission Costs for Large Load Projects.  On page 54 (lines 7-11) of the Company’s Direct Testimony, the panel states: “Prior to making an offer to serve a customer choice opportunity, the Company analyzes the cost to serve the customer including the necessary transmission upgrades and investments needed to accommodate the load addition.  The Company only extends competitive offers to eligible customers that pass financial and economic screening requirements, including the RIM test.”\na. \tIdentify and provide the RIM test calculations made by the Company for each customer choice opportunity that is causing the growth in load beyond the 2023 IRP.\nb. \tPlease explain fully and show in detail exactly how the Company analyzes the cost to serve new customer choice opportunity customers (including the necessary transmission upgrades and investments needed to accommodate the load addition) prior to making an offer to serve a customer choice opportunity.\nc. \tIn addition to the RIM test, what are the financial and economic screening requirements used by the Company to determine whether customers meet eligibility requirements?  Explain fully.", "response": "RIM statements and the corresponding workpapers for new large load customers included in the updated load forecast for active offers and offers that have been accepted by the customer were submitted as part of the Company’s trade secret responses to STF-DEA-1-2 and STF-LA-1-15.\nTo calculate transmission upgrades and investments, the Company analyzes the impact of serving large loads in compliance with NERC Transmission Planning Reliability standards, which is consistent with the planning processes outlined in Technical Appendix Volume 3 of the 2022 Georgia Power Integrated Resource Plan (Docket 44160).\nIn addition to the eligibility requirements of the Georgia Territorial Electric Service Act, the prospective customer must meet the eligibility requirements of the tariff under which electric service is being offered. In addition to the RIM test, each offer considers the customer’s credit rating as related to the payment of direct and local costs.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-19", "is_protective_disclosure": "no", "question": "On page 56 (lines 10-14)) of the Company’s Direct Testimony, the panel states: “The Company expects that the projected revenues associated with incremental customer load will offset the costs of the resources requested in this filing and put downward pressure on overall retail rates as Georgia Power continues to provide clean, safe, reliable, and affordable power for its 2.7 million customers.”\nPlease provide all supporting documentation and calculations that supports the Company’s statement in the referenced section of the panel’s testimony shown in the above passage.", "response": "Please see the Company’s response to STF-DEA-3-6. Please also see the Company’s responses to STF-DEA-1-2 and STF-LA-1-15 for Ratepayer Impact Measure (“RIM”) test results and analyses.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-2", "is_protective_disclosure": "yes", "question": "Refer to page 27 of the Company’s Direct Testimony that was filed on December 4, 2023.  On lines 9-11, the Company states that the Battery Energy Storage Systems (“BESS”) projects approved in the 2019 IRP (Mossy Branch) and in 2022 (McGrau Ford) will provide valuable development and operational experience with this technology.  In addition, on lines 24-27, the Company is proposing to develop, own and operate up to 1,000 MW of BESS and/or BESS plus solar at various sites.\nIs the Company’s proposal to develop, own and operate up to 1,000 MW of BESS in addition to the Mossy Branch and McGrau Ford BESS projects approved in the 2019 and 2022 IRPs, respectively?  Explain fully.\nWhat is the most updated estimated cost and capacity of the Mossy Branch BESS?  Explain fully.\nWhat is the most updated estimated cost capacity of the McGrau Ford BESS?  Explain fully.\nFor each additional BESS identify the estimated cost, capacity, location and in-service date.", "response": "Yes, the 1,000 MW of Battery Energy Storage Systems (“BESS”) and/or BESS plus solar at various sites requested as part of the 2023 IRP Update are in addition to the Mossy Branch and McGrau Ford BESS. The request for Mossy Branch and McGrau Ford were not intended to serve near-term capacity needs because at the time of the request the Company didn’t have a capacity shortfall until 2028/2029. The 1,000 MW will help serve the new peak demand forecast that has increased 5,900 MW for 2031 from the conclusion of the 2022 IRP.\nThe Mossy Branch 65 MW BESS is currently estimated to cost approximately REDACTED REDACTED, which does not include the Investment Tax Credit (“ITC”) benefits.  The nameplate rating is a 65 MW four-hour battery system. With the current system assumptions, a four-hour battery will receive a 95% Equivalent Load Carrying Capability (“ELCC”).\nAn initial cost estimate for the McGrau Ford Battery Facility was provided in the 2022 IRP. Following completion of the active Request for Proposals (“RFP”) evaluations and final bidder selection, the Company will bring the McGrau Ford BESS Supply and Engineering, Procurement, and Construction (“EPC”) Agreements to the Commission for approval and a deemed certified amount for the project will be determined in accordance with the 2022 IRP Order. The project is a 265 MW two-hour BESS, given the current system assumptions a two-hour battery will receive a 95% ELCC.\nAs incremental BESS opportunities arise, the Company will bring specific projects with estimated cost, capacity, location, and in-service date to the Commission for review and certification.", "attachment_filenames": "STF-LA-1-2", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-20", "is_protective_disclosure": "no", "question": "Inflation Reduction Act.  On page 28 (lines 14-16) of the Company’s Direct Testimony, the panel states: “The Company remains optimistic about the future of renewable resources, as well as the prospects of the Inflation Reduction Act “IRA”) and its potential to reduce the cost of new renewables for customers.”\nHas the Company incorporated any benefits from the IRA with its resource requests (including renewables) in its 2023 IRP Update?  If not, explain fully why not.\nIf so, please quantify and explain fully and in detail, all benefits from the IRA that were incorporated by Georgia Power and indicate which resource(s) to which such benefits were applied.", "response": "Yes, the Company incorporated expected benefits from the Inflation Reduction Act (“IRA”) with its battery and solar requests in the 2023 IRP Update. Please refer to the Company’s responses to STF-JKA-2-19, STF-PIA-4-9, STF-PIA-4-10, STF-PIA-4- 11, STF-PIA-4-12, STF-PIA-7-2, and STF-PIA-7-3 for further detail on how the Company considered funding opportunities available from the IRA for this filing. Please see the “TS Economic Analysis of Capacity Resources.xlsx” file in the “9 TS Economic Analysis” folder of the Technical Appendix to the 2023 IRP Update filed on October 27, 2023, for the Company’s analysis of cost-effective solutions to meet projected capacity shortfalls, which includes benefits associated with the IRA for applicable technologies. The Company will continue to assess opportunities to leverage funding opportunities from the IRA and from other similar incentives, if any, for the benefit of customers.\nThe Company included assumptions that solar deployments will qualify to earn PTC benefits while BESS deployments will receive ITC benefits. The quantification of these benefits can be seen in the SAM files provided to the Commission Staff on October 27, 2023. Please refer to the response in part (a) for further references.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-21", "is_protective_disclosure": "no", "question": "Inflation Reduction Act.  Refer to page 28 of the Company’s Direct Testimony which addresses federal income tax benefits.\nHas the Company quantified any benefits from various tax credits, such as the Section 48 Investment Tax Credit related to its resource requests in its 2023 IRP Update?  If not, explain fully why not.\nIf so, please identify, quantify and explain fully and in detail, all such tax credits incorporated by Georgia Power and indicate which resource(s) to which such tax credits were applied.", "response": "Please see the Company’s response to STF-LA-1-20 for further detail and references on how the Company quantified benefits from tax credits for the requested resources.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-22", "is_protective_disclosure": "no", "question": "Has the Company incorporated any benefits from the Infrastructure Investment and Jobs Act with its resource requests in its 2023 IRP Update, including but not limited to federal income tax credits?\nIf not, explain fully why not.\nIf so, please quantify and explain fully and in detail, all benefits from the Infrastructure Investment and Jobs Act that were incorporated by Georgia Power and indicate which resource(s) to which such benefits were applied.", "response": "Please see the Company’s responses to STF-PIA-7-1, STF-PIA-7-2, and STF-PIA-7-3.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-23", "is_protective_disclosure": "no", "question": "New regulatory assets requested by the Company.  Refer to pages 54-56 of the Company’s direct testimony.   To the extent not already provided, please identify, quantify and explain the amounts of regulatory asset build-up in each year, 2024 and 2025, that the Company projects for each of the following requested regulatory asset permission items:\nRegulatory asset to defer capacity and non-fuel energy payments under the Mississippi Power PPA (page 54, lines 24-29)\nRegulatory asset to defer capacity and non-fuel energy payments under the Santa Rosa Mississippi Power PPA (page 55, lines 4-8)\nRegulatory asset for development costs not useful or transferrable for 1000 MW of BESS (page 55, lines 11-13)\nRegulatory asset for development costs not useful or transferrable for 1400 MW from three CTs (page 55, lines 17-19)\nRegulatory asset for development costs for Flex Capacity (page 55, lines 28-30)\nAre there any other regulatory assets (besides those listed in parts a through e above,) or cost deferrals that would result from the Company’s proposals contained in the 2023 IRP Update?  If so, explain fully and provide amounts of expected regulatory asset build-up in each year 2024 and 2025 related to each such additional regulatory asset.", "response": "Please see the Company’s response to STF-LA-1-5 parts (d) and (e).\nPlease see the Company’s response to STF-LA-1-6 part (b). The capacity and non-fuel expenses for 2024 and 2025 identified in that response are the costs requested to be deferred to the regulatory asset.\nPlease see the Company’s response to STF-LA-1-8 parts (a) and (b). In the event the Commission denies approval of the project, the development costs for 2023 and any costs to be spent through March 2024 identified in that response are the costs requested to be deferred to the regulatory asset.\nPlease see the Company’s response to STF-LA-1-9 part (a). In the event the Commission denies approval of the project, the development costs for 2023 and any costs to be spent through March 2024 identified in that response are the costs requested to be deferred to the regulatory asset.\nThe Company currently cannot estimate any development costs for Flex Capacity as it has not met the proposed criteria which would trigger development of the Flex Capacity.\nNo, there are no other regulatory assets or cost deferrals that would result from the Company’s proposals contained in the 2023 IRP Update.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-3", "is_protective_disclosure": "no", "question": "Refer to pages 29-30 of the Company’s Direct Testimony that was filed on December 4, 2023.  Concerning the 70% calculation, provide the following information:\nThe total amount of supply side resources by year, for 2022 and 2023 actual and for 2024 through 2031 projected.\nThe quantity of Georgia Power Company owned supply side resources by year, for 2022 and 2023 actual and for 2024 through 2031 projected.\nThe quantity of affiliate owned supply side resources by year, for 2022 and 2023 actual and for 2024 through 2031 projected.\nThe quantity of third-party, non-affiliate owned supply side resources by year, for 2022 and 2023 actual and for 2024 through 2031 projected.\nAny additional information necessary to reconcile the sum of the quantities provided in the responses to parts b, c and d, with the totals provided in response to part a for each year.", "response": "Please see the “Figure 6,” “2022 IRP – Winter,” “B2023 – Winter,” and “2023 IRP Update – Winter” worksheets in the “Figures 4, 5, 6, & 9 – Capacity Needs Data for B22, B23, and 2023 IRP Update.xlsx” file located in the “Main Document” folder of the “TS 2023 IRP Update Models and Workpapers,” which were previously provided to the Commission Staff on October 27, 2023, with the 2023 IRP Update filing. Please note that these data reflect planning capacities, not nameplate capacities.\nSee response to subpart (a).\nSee response to subpart (a). Affiliate-owned supply-side resources, for which Georgia Power purchases output through power purchase agreements (“PPAs”), include Southern Power Company’s Plant Addison Units 1&3, Plant Dahlberg Units 1-6 and 8-10, Plant Harris Units 1&2, and Plant Wansley Unit 7, as well as Butler Solar, Butler Solar Farm, Decatur County Solar Project, Decatur Parkway Solar Project, and Pawpaw Solar.\nSee response to subpart (a). Any purchased power resources not listed as affiliate-owned in response to subpart (c) are third-party, non-affiliate-owned supply-side resources.\nSee response to subpart (a).", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-4", "is_protective_disclosure": "no", "question": "Certification of the Mississippi Power’s PPA.  Refer to the Company’s Direct Testimony that was filed on December 4, 2023.  As it relates to the 950 MW of capacity that Mississippi Power Company (“MPC”) must retire by 2027 (per the Commission’s Order in Docket No. 2018-AD-145), on page 32 of the panel’s testimony, the Company states that MPC plans to retire some of this capacity (which is available to GPC customers per the reserve sharing agreement with Southern Company) by the end of 2023 and that MPC is actively marketing the other capacity to be sold off-system.\nIdentify and provide all documentation that relates to MPC’s plan to retire some of the 950 MW of capacity by the end of 2023.\nIdentify each generating unit that MPC plans to retire at the end of 2023?\nWhat is the estimated remaining net book value at 12/31/2023 of each generating plant that MPC plans to retire at the end of 2023?\nWhen MPC retires a generating unit that has not been fully depreciated, is the remaining net book value recorded as a regulatory asset by MPC?  If not, explain fully and identify and provide the anticipated journal entries that would be made by MPC for the retirement of MPC’s electric generating units by 12/31/2023.\nFor each year, 2020 through 2023, how much purchased power has Georgia Power obtained from MPC?\nFor each year, 2020 through 2023, were all purchases of power by Georgia Power from MPC at cost?  If not, explain how those energy purchases were priced.\nFor each year, 2020 through 2023, has Georgia Power purchased any capacity from MPC?  If so, how much in each year?\nFor each year, 2020 through 2023, were all purchases of capacity by Georgia Power from MPC at cost?  If not, explain how those capacity purchases were priced.", "response": "Please refer to the Mississippi Power Company (“MPC”) 2021 Integrated Resource Plan filed in Docket No. 2019-UA-231, provided in STF-LA-1-4 Attachment, for more information on MPC’s generating unit retirement plans.\nPlease refer to the MPC 2021 Integrated Resource Plan, provided in STF-LA-1-4 Attachment, for a list of generating unit retirement plans.\nThe Company does not have information on other retail operating company financial information.\nThe Company does not have information on other retail operating company financial information and accounting processes.\ne. - h.   There are no capacity and energy transactions between Georgia Power and Mississippi Power. Instead, Southern Company Services acts as agent on behalf of the retail operating companies for the monthly settlement of the Intercompany Interchange Contract (“IIC”), for both capacity and energy transactions among participants in the Southern Company pool. All payments are settled between Southern Company Services and each operating company.", "attachment_filenames": "STF-LA-1-4; STF-LA-1-4 Attachment.pdf", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-5", "is_protective_disclosure": "no", "question": "Mississippi Power Company PPA.  As it relates to the 750 MW of capacity purchased from MPC through the PPA, on page 33 of the panel’s testimony, the Company states that if it is unable to remarket this capacity during the period January 1, 2024 through September 30, 2025 (and recover all incremental costs), the Company will request regulatory asset treatment to defer the capacity and non-fuel energy payments made under the PPA (including the additional sum) net of the wholesale capacity and non-fuel revenues from any remarketed capacity sales.\nFor each year, 2024 through 2031, how much capacity does Georgia Power expect to purchase from MPC in each year?\nFor each year, 2024 through 2031, how much capacity that Georgia Power proposes to purchase from MPC is expected to be used by Georgia Power to serve Georgia Power’s load?\nFor each year, 2024 through 2031, how much capacity that Georgia Power proposes to purchase from MPC is expected to be remarketed and sold off-system?\nPlease explain fully and in detail the Company’s rationale for requesting regulatory asset treatment and identify the anticipated amounts of regulatory asset build-up that the Company expects could occur in each year.\nIdentify, quantify and explain the maximum amounts of regulatory asset build-up that the Company expects could occur in each year if the Company’s proposed accounting treatment were to be approved.\nExplain fully and in detail why the Annual Surveillance Reporting and earnings sharing provisions that were established in Georgia Power Company’s most recent general rate case, Docket 44280, are not sufficiently robust to handle changes in utility revenues and costs that Georgia Power Company could incur in 2024, 2025 and 2026?\nWhat amounts of “additional sum” does Georgia Power Company expect would occur in each year, 2024 through 2031, related to the capacity purchase from its affiliate, Mississippi Power Company?  Show each “additional sum” amount in each year, and show in detail how each of those “additional sum” amounts would be calculated.", "response": "Through the Mississippi Power power purchase agreement (“PPA”), Georgia Power will purchase 750 MW of capacity and energy from Mississippi Power from January 1, 2024, through December 31, 2028. The Mississippi Power PPA proposed in this 2023 IRP Update does not include calendar years 2029-2031.\nSouthern Wholesale Energy (“SWE”), on behalf of Georgia Power, will attempt to remarket the full 750 MW of capacity for years prior to the winter of 2025/2026, when Georgia Power currently has a capacity need. The Company has already sold 500 MW to a regional electrical service provider for January 1, 2024, through September 30, 2025. Therefore, depending on additional remarketing efforts, 250 MW or less from the Mississippi Power PPA are expected to be available to serve Georgia Power load from January 1, 2024, through September 30, 2025, and 750 MW or less from October 1, 2025, through December 31, 2025. The full 750 MW of capacity will be available to serve Georgia Power load from January 1, 2026, through December 31, 2028. The Mississippi Power PPA proposed in this 2023 IRP Update does not include calendar years 2029-2031.\nSee response to subpart (b).\nPlease see the response to subpart (f) below. The net costs that will be deferred to the regulatory asset are the capacity expenses identified in subpart (a) above for 2024 and 2025 net of the wholesale revenues identified in subpart (c) above for 2024 and 2025. Please note, subpart (c) only includes the wholesale revenues currently contracted for sale related to a portion of the PPA capacity. Any additional wholesale revenues from the sale of remaining capacity will further offset the costs in the regulatory asset. There will be no costs deferred to the regulatory asset after 2025. Please see the “Deferral Calculation” tab in TS STF-DEA-3-6 Attachment A in the Company’s response to STF-DEA-3-6 for the projected capacity expenses and wholesale revenues. The maximum expected regulatory asset amounts for 2024 and 2025 are the net difference of the capacity expenses on rows 7 and 9 and the wholesale revenues on row 8.\nPlease see the response to subpart (d) above.\nThe 2023 IRP Update is the result of an extraordinary and unprecedented circumstance not contemplated or considered in the 2022 base rate case, similar to the impacts of Tax Cuts and Jobs Act and the COVID pandemic within the prior 3-year Alternate Rate Plan periods, which resulted in regulatory deferral treatment approved by the Commission. The costs projected to be incurred in 2024 and 2025 associated with the incremental capacity requested in the 2023 IRP Update to meet capacity needs starting in Winter 2025/2026 are expected to be significant and necessary to meet the extraordinary future load growth and the Company’s obligation of providing reliable electric service to all of its retail customers. Therefore, the regulatory deferral requested in this 2023 IRP Update is appropriate and consistent with past practice. As stated in the Company’s filing, the Company has already secured a sale of a majority of this PPA capacity to a third party and will attempt to remarket the remaining capacity to wholesale in 2024 and 2025 to reduce any costs that need to be deferred to the regulatory asset.\nFor the Mississippi Power PPA, the Company requests an additional sum of $3/kW-yr, consistent with the Commission-approved additional sum amounts applied to the six capacity PPAs certified in the 2022 IRP. Please see the “TS Economic Analysis of Capacity Resources.xlsx” file in the “9 TS Economic Analysis” folder of the “TS Technical Appendix,” which was previously provided to the Commission Staff on October 27, 2023, in the 2023 IRP Update filing. The formulas associated with additional sum are on the “Cost Inputs” worksheet.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-6", "is_protective_disclosure": "no", "question": "Certification of the Santa Rosa Energy Center PPA.  Refer to page 34 (lines 8-12) of the Company’s Direct Testimony.\nPlease describe in detail how the Santa Rosa PPA offers several benefits for Georgia Power and its customers.\nWhat additional costs does the Company expect to occur in each year, 2024 through 2031, related to the Santa Rosa PPA?\nWhat are the existing grandfather rights which result in no additional transmission improvements or transmission service being needed for power to be delivered from the Santa Rosa Energy Center to the Southern Company system?  Explain fully.", "response": "The Santa Rosa PPA will provide reliable energy and capacity to Georgia Power customers. This resource is already interconnected and online today. Therefore, it does not require new construction and is available to meet near-term capacity and energy needs identified in the 2023 IRP Update. Additionally, the Santa Rosa Energy Center has access to cost-effective firm gas transportation without the need for additional pipeline expansion. For additional information and quantification of many of these factors, please see the Technical Appendix Economic Analysis.\nPlease refer to the Santa Rosa SAM file provided to Commission Staff on October 27, 2023.  Also please note the Santa Rosa PPA is not in effect in years 2029-2031.\nPer Attachment V of the Florida Power & Light Company (“FP&L”) Open Access Transmission Tariff (“OATT”), the Santa Rosa Energy Center has grandfathered rights to FP&L transmission service at no cost to deliver output from the facility (minus FP&L transmission losses) to the FP&L / Southern Transmission interface. Santa Rosa Energy Center has no grandfathered rights to transmission service on the Southern Company Transmission system. The Company completed the transmission screening analysis, as described in Technical Appendix Transmission Screening Analyses, which did not identify any required transmission project or improvements necessary to deliver the purchased energy and capacity to load.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-7", "is_protective_disclosure": "no", "question": "Battery Energy Storage Systems (“BESS”) for Ratemaking.  Refer to page 37 (lines 18-25) of the Company’s Direct Testimony.  The Company’s testimony states that it intends to pursue available tax credits through the Inflation Reduction Act (“IRA”) and similar incentives for the proposed BESS projects and to pass those benefits onto customers.\nHas the Company investigated the tax credits for BESS projects that are available through IRA or other federal income tax provisions?  If not, explain fully why not. If so, explain fully and in detail all tax credits that are believed to be available to GPC for BESS.\nOn BESS installed to date, what specific federal income tax credits have been claimed by GPC on federal income tax returns filed to date?  Explain fully and identify each federal income tax credit claimed to date on BESS by GPC thorough the filing of the federal income tax return for tax year 2022.\nOn BESS installed in 2023, what specific federal income tax credits are expected to be claimed by GPC on the 2023 federal income tax return?  Explain fully and identify each federal income tax credit expected to be claimed for BESS by GPC for the 2023 federal income tax return.\nFor BESS expected to be installed by GPC in each year, 2024 through 2031, what amounts of federal income tax credits does GPC expect to claim in each year?  Identify, quantify and explain those federal income tax credits.\nAre there any state income tax credits or special state income tax deductions related to BESS?  If so, please identify, quantify and explain each state income tax credit and special deduction of which the Company is aware.", "response": "Yes, the Company included assumptions for both production tax credits (“PTC”) and investment tax credits (“ITC”) for eligible facilities in its 2023 IRP Update. Please see the Company’s response to STF-JKA-2-19 subpart (f) for more information on these assumptions.\nThe Company has not had any BESS projects placed in-service to-date that qualified for federal income tax credits.\nThe Company has not had any BESS projects placed in-service in 2023.\nThe ITCs expected to be claimed per year between 2024 and 2031 are dependent on the Commercial Operation Date (“COD”) of eligible facilities, final project costs, and the location of each project. Please see the SAM file workpapers for the Economic Analysis provided to Commission Staff on October 27, 2023 for the quantified federal ITC benefits for the proposed projects at Moody, Robins, and the 200 MW BESS co-located with 200 MW solar.\nNo state income tax credits or special state income tax deductions were identified for the proposed BESS projects in the filing.  However, the Company is analyzing state ITC opportunities for the proposed BESS projects, which could provide additional benefits. The Company will pass any identified benefits to customers.", "attachment_filenames": "", "confidentiality_files": ""}, {"filing_api_id": 216986, "filing_description": "DKT 55378 STF-LA-1 Data Request Responses", "filing_date": "1/8/2024", "staff": "LA", "doc_id": "STF-LA-1-8", "is_protective_disclosure": "no", "question": "BESS regulatory asset.\nWhat BESS related development costs are being incurred by the Company in 2023?\nWhat BESS related development costs are expected to be incurred by the Company in each year, 2024 through 2031?\nExplain how and why the Company would be incurring BESS development costs that would not be useful.\nIdentify the maximum potential amounts of BESS-related development costs from the response to part b that are at risk of not being useful.  Explain in detail how the Company quantified the amounts of projected BESS development costs that could end up not being useful.\nExplain fully and in detail why Company management and investors (as opposed to ratepayers) should not be held responsible for BESS development costs that end up not being useful.\nOn what Commission authority is the Company relying for proposing to defer any BESS-related development costs that are not useful or transferable to other projects into a regulatory asset?  Explain fully and cite by relevant docket number(s) and date(s) of the Commission’s Orders.", "response": "The battery energy storage system (“BESS”) development costs that the Company incurred in 2023 include engineering, design, geotechnical investigations, environmental studies, project management, land acquisition, and interconnection studies. Collectively, for 2023 these costs are estimated at approximately $4 million.\nThe specific amounts per year between 2024 and 2031 will depend on the commercial operation date (“COD”) for each project and variable lead times of equipment and associated commitments to reserve the equipment, which are not known at this time.  Each project is unique, and these costs can include items such as engineering, design, environmental studies, geotechnical, land options, and equipment purchase agreements.\nMany project development costs are specific to a project. For example, engineering, design, environmental studies, geotechnical, interconnection upgrades, and land options will not be transferable to another project. Additionally, certain equipment may not be transferable to other projects depending on the timing and specific design requirements. Also, this is only applicable if the BESS projects are not approved by the Commission.\nThe maximum potential amount of BESS-related development costs at risk of not being useful is unknown at this time but is expected to be in the range of approximately 15% of the project cost if the resources are not approved by the Commission. By approving a portfolio of 1,000 MW, it is less likely that there will be significant non-transferable BESS-related development costs because there will be more projects to which equipment may be allocated.\nThe Company initiated the deve
